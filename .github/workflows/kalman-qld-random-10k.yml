name: Kalman QLD Random 10000 Joint Configurations (Research Only)

on:
  push:
    branches: [research/qld-integrated-regime-20261031]
    paths:
      - '.github/workflows/kalman-qld-random-10k.yml'
      - 'research/kalman_integrated_regime/random_10k.py'
      - 'research/kalman_integrated_regime/test_random_10k.py'
  pull_request:
    paths:
      - '.github/workflows/kalman-qld-random-10k.yml'
      - 'research/kalman_integrated_regime/random_10k.py'
      - 'research/kalman_integrated_regime/test_random_10k.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qld-random10k-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check 'pandas>=2.2,<3' 'numpy>=1.26,<3' 'scikit-learn>=1.4,<2' 'pyarrow>=17' 'exchange-calendars>=4.7'
      - name: Verify 10000 random samples and joint engine contracts
        run: |
          python -m unittest \
            research.kalman_integrated_regime.test_random_10k \
            research.kalman_integrated_regime.test_joint_policy \
            research.kalman_integrated_regime.test_joint_report -v
          python -m compileall -q research/kalman_integrated_regime

  random-10k:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated research dependencies
        run: python -m pip install --disable-pip-version-check 'pandas>=2.2,<3' 'numpy>=1.26,<3' 'scikit-learn>=1.4,<2' 'pyarrow>=17' 'exchange-calendars>=4.7' 'requests>=2.31,<3' google-auth google-api-python-client
      - name: Fetch historical QLD and QQQ SIP 15m once; no public bar uploads
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID || secrets.APCA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY || secrets.APCA_API_SECRET_KEY }}
        run: |
          python research/kalman_integrated_regime/sip_backfill.py \
            --start 2024-01-01 --end-exclusive 2026-10-31 \
            --out "$RUNNER_TEMP/qld_random10k"
      - name: Read private daily market regime feature bundle
        env:
          CKD_DRIVE_SA_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
          GDRIVE_SA_JSON_B64: ${{ secrets.GDRIVE_SA_JSON_B64 }}
        run: |
          python research/kalman_triple_barrier/drive_input.py \
            --file-id 1aUhvIAsE2x2-LuKv5nSxmDGX0Uo4mqYd \
            --output "$RUNNER_TEMP/qld_random10k/market.zip"
      - name: Execute 10000 random combinations and baseline over four parallel local processes
        run: |
          mkdir -p "$RUNNER_TEMP/qld_random10k/shards"
          for shard in 0 1 2 3; do
            python -m research.kalman_integrated_regime.random_10k \
              --daily "$RUNNER_TEMP/qld_random10k/qld_qqq_daily_sip_all_private.csv" \
              --intraday "$RUNNER_TEMP/qld_random10k/qld_qqq_15m_sip_all_private.parquet" \
              --market-zip "$RUNNER_TEMP/qld_random10k/market.zip" \
              --configs 10000 --shards 4 --shard "$shard" \
              --seed 20261101 \
              --out "$RUNNER_TEMP/qld_random10k/shards" \
              > "$RUNNER_TEMP/qld_random10k/shard_$shard.log" 2>&1 &
            pids[$shard]=$!
          done
          rc=0
          for shard in 0 1 2 3; do
            if wait "${pids[$shard]}"; then
              echo "RANDOM10K_SHARD_$shard"_"PASS"
              tail -n 1 "$RUNNER_TEMP/qld_random10k/shard_$shard.log"
            else
              echo "RANDOM10K_SHARD_$shard"_"FAIL"
              tail -n 30 "$RUNNER_TEMP/qld_random10k/shard_$shard.log"
              rc=1
            fi
          done
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
      - name: Merge 10001 full strategies and check 40004 model-year portfolios
        run: |
          python -m research.kalman_integrated_regime.joint_report \
            --source "$RUNNER_TEMP/qld_random10k/shards" \
            --configs 10001 \
            --out "$RUNNER_TEMP/qld_random10k/aggregate"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'qld_random10k'
          shards=[json.loads(p.read_text()) for p in sorted((root/'shards').glob('joint_shard_*.json'))]
          result=json.loads((root/'aggregate'/'joint_leaderboard_summary.json').read_text())
          assert len(shards)==4 and all(p['random_configs']==10000 and p['baseline_configs']==1 for p in shards)
          assert all(p['generator']==shards[0]['generator'] for p in shards)
          assert result['configs_evaluated']==10001 and result['total_portfolio_simulations']==40004
          meta={'schema':'qld-40-axis-10000-independent-random-research-v1',
                'status':'EXPLORED_HOLD_LIVE','random_configs':10000,
                'control_configs':1,'full_strategy_model_year_simulations':40004,
                'sampling':shards[0]['generator'],
                'pairwise_coverage':result['pairwise_coverage'],
                'complete_yearly_comparison':True,
                'no_outcome_guided_candidate_selection':True,
                'no_live_modified':True}
          (root/'aggregate'/'random10k_manifest.json').write_text(json.dumps(meta,indent=2)+'\n')
          print('RANDOM10K_VERIFIED '+json.dumps(meta))
          PY
      - name: Store complete configuration scoreboard and summary, never raw SIP bars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qld-40axis-independent-random-10000
          path: ${{ runner.temp }}/qld_random10k/aggregate/
          retention-days: 30
          if-no-files-found: warn
      - name: Delete private market inputs
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/qld_random10k/qld_qqq_daily_sip_all_private.csv"
          rm -f "$RUNNER_TEMP/qld_random10k/qld_qqq_15m_sip_all_private.parquet"
          rm -f "$RUNNER_TEMP/qld_random10k/market.zip"
