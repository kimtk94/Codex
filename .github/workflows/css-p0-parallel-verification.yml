name: CSS P0 Parallel Verification & Status
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/css-p0-parallel-verification.yml'
      - 'automation/ops/css_release_readonly_audit.py'
      - 'automation/ops/publish_css_p0_parallel_status.py'
      - 'automation/ops/test_css_p0_parallel.py'
      - 'automation/ops/css_parallel_audit.py'
      - 'automation/ops/test_css_parallel_audit.py'
      - 'automation/ops/invoice_gap_review.py'
      - 'automation/ops/test_invoice_gap_review.py'
      - 'automation/ops/invoice_owner_payment_evidence.py'
      - 'automation/ops/test_invoice_owner_payment_evidence.py'
      - 'automation/ops/css_evidence_exception_review.py'
      - 'automation/ops/test_css_evidence_exception_review.py'
      - 'automation/ops/css_invoice_legacy_key_bridge.py'
      - 'automation/ops/test_css_invoice_legacy_key_bridge.py'
      - 'automation/ops/css_unissued_contract_lineage_guard.py'
      - 'automation/ops/test_css_unissued_contract_lineage_guard.py'
      - 'automation/ops/css_amea_contract_candidate_crosswalk.py'
      - 'automation/ops/test_css_amea_contract_candidate_crosswalk.py'
      - 'automation/ops/css_unissued_safe_watch.py'
      - 'automation/ops/test_css_unissued_safe_watch.py'
      - 'automation/ops/css_web_source_live_smoke.cjs'
      - 'apps/css-sales-workspace/api/lifecycle.js'
      - 'apps/css-sales-workspace/lib/automation-console.js'
      - 'apps/css-sales-workspace/test/automation-console.test.js'
      - 'apps/css-sales-workspace/test/operational-acceptance.test.js'
  pull_request:
    paths:
      - '.github/workflows/css-p0-parallel-verification.yml'
      - 'automation/ops/css_release_readonly_audit.py'
      - 'automation/ops/publish_css_p0_parallel_status.py'
      - 'automation/ops/test_css_p0_parallel.py'
      - 'automation/ops/css_parallel_audit.py'
      - 'automation/ops/test_css_parallel_audit.py'
      - 'automation/ops/invoice_gap_review.py'
      - 'automation/ops/test_invoice_gap_review.py'
      - 'automation/ops/invoice_owner_payment_evidence.py'
      - 'automation/ops/test_invoice_owner_payment_evidence.py'
      - 'automation/ops/css_evidence_exception_review.py'
      - 'automation/ops/test_css_evidence_exception_review.py'
      - 'automation/ops/css_invoice_legacy_key_bridge.py'
      - 'automation/ops/test_css_invoice_legacy_key_bridge.py'
      - 'automation/ops/css_unissued_contract_lineage_guard.py'
      - 'automation/ops/test_css_unissued_contract_lineage_guard.py'
      - 'automation/ops/css_amea_contract_candidate_crosswalk.py'
      - 'automation/ops/test_css_amea_contract_candidate_crosswalk.py'
      - 'automation/ops/css_unissued_safe_watch.py'
      - 'automation/ops/test_css_unissued_safe_watch.py'
      - 'automation/ops/css_web_source_live_smoke.cjs'
      - 'apps/css-sales-workspace/api/lifecycle.js'
      - 'apps/css-sales-workspace/lib/automation-console.js'
      - 'apps/css-sales-workspace/test/automation-console.test.js'
      - 'apps/css-sales-workspace/test/operational-acceptance.test.js'
  schedule:
    - cron: '20 0,8 * * *' # 09:20, 17:20 KST; read-only cross-checks
permissions:
  contents: read
concurrency:
  group: css-p0-parallel-verification
  cancel-in-progress: false

jobs:
  offline:
    name: 0 - Contract and boundary tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline audit imports
        run: python -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3'
      - name: Test nine-track release, invoice, source-date and acceptance boundaries
        run: |
          python -m unittest discover -s automation/ops -p 'test_css_p0_parallel.py' -v
          python -m unittest discover -s automation/ops -p 'test_css_parallel_audit.py' -v
          python -m unittest discover -s automation/ops -p 'test_invoice_gap_review.py' -v
          python -m unittest discover -s automation/ops -p 'test_invoice_owner_payment_evidence.py' -v
          python -m unittest discover -s automation/ops -p 'test_css_evidence_exception_review.py' -v
          python -m unittest discover -s automation/ops -p 'test_css_invoice_legacy_key_bridge.py' -v
          python -m unittest discover -s automation/ops -p 'test_css_unissued_contract_lineage_guard.py' -v
          python -m unittest discover -s automation/ops -p 'test_css_amea_contract_candidate_crosswalk.py' -v
          python -m unittest discover -s automation/ops -p 'test_css_unissued_safe_watch.py' -v
      - name: Compile isolated release and publisher code
        run: python -m py_compile automation/ops/css_release_readonly_audit.py automation/ops/publish_css_p0_parallel_status.py

  mail:
    name: 1 - QQ mail checkpoint and backfill source
    needs: offline
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 12
    env:
      CKD_DRIVE_SA_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3'
      - name: Check source-key/UTC/VAT policy before live source reads
        run: python automation/css_mail/test_source_vat_integrity.py
      - name: Check QQ staged keys and true source freshness (read only)
        run: python automation/css_mail/mail_checkpoint_health_audit.py

  revenue:
    name: 2 - Revenue invoice, forecast and VAT integrity
    needs: offline
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 13
    env:
      CKD_DRIVE_SA_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3'
      - name: Verify cross-source revenue policy (offline)
        run: python -m unittest discover -s automation/ops -p 'test_revenue_cross_source_audit.py' -v
      - name: Review QQ invoice, legacy 3-way, pending and Feishu proof (read only)
        run: python automation/ops/revenue_cross_source_audit.py
      - name: Validate current monthly FX/Statement billing state (read only)
        run: python automation/ops/css_parallel_audit.py revenue

  invoice_review:
    name: 2b - Publish invoice gaps for manual owner review
    needs: offline
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 12
    env:
      CKD_DRIVE_SA_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3'
      - name: Verify invoice evidence and no-auto-booking protections
        run: python -m unittest discover -s automation/ops -p 'test_invoice_gap_review.py' -v
      - name: Publish only generated CSS Invoice Gap Review with readback
        run: python automation/ops/invoice_gap_review.py
      - name: Preserve source and finance boundaries
        run: echo 'GENERATED_REVIEW_ONLY; NO_REVENUE_ADDITION; NO_INVOICE_MUTATION; OWNER_NOT_VERIFIED' >> "$GITHUB_STEP_SUMMARY"

  owner_payment:
    name: 2c - Exact invoice owner and receipt evidence (unverified)
    needs: [offline, invoice_review]
    if: github.event_name != 'pull_request' && needs.invoice_review.result == 'success'
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 12
    env:
      CKD_DRIVE_SA_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3'
      - name: Verify owner and receipt evidence safeguards
        run: python -m unittest discover -s automation/ops -p 'test_invoice_owner_payment_evidence.py' -v
      - name: Publish independent ownership/payment candidate review with readback
        run: python automation/ops/invoice_owner_payment_evidence.py
      - name: Explicit verification boundary
        run: echo 'FEISHU_SALES_TAG_NOT_OWNER_CERTIFICATION;RECEIPT_CANDIDATE_NOT_BANK_SETTLEMENT;NO_REVENUE_BOOKING' >> "$GITHUB_STEP_SUMMARY"

  evidence:
    name: 2d - Source evidence exceptions (no financial approval)
    needs: [offline, revenue, invoice_review, owner_payment]
    if: ${{ always() && github.event_name != 'pull_request' && needs.offline.result == 'success' }}
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 12
    env:
      CKD_DRIVE_SA_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3'
      - name: Test generated review protection and source timestamp logic
        run: python -m unittest discover -s automation/ops -p 'test_css_evidence_exception_review.py' -v
      - name: Verify exact QQ invoice IDs and generated legacy bridge readback
        run: python automation/ops/css_invoice_legacy_key_bridge.py
      - name: Reconcile legacy scope, source age and manual finance/release gates
        run: python automation/ops/css_evidence_exception_review.py
      - name: Preserve business approval boundary
        run: echo 'REVIEW_FLAGS_CAN_COEXIST_WITH_SUCCESSFUL_ACTION;NO_REVENUE_BOOKING;NO_PRODUCTION_APPROVAL' >> "$GITHUB_STEP_SUMMARY"

  contract_lineage:
    name: 2e - Independent AMEA/X contract lineage audit
    needs: offline
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 12
    env:
      CKD_DRIVE_SA_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3'
      - name: Test X/AMEA collisions and positional formula provenance offline
        run: python -m unittest discover -s automation/ops -p 'test_css_unissued_contract_lineage_guard.py' -v
      - name: Test AMEA Online and finance candidate crosswalk offline
        run: python -m unittest discover -s automation/ops -p 'test_css_amea_contract_candidate_crosswalk.py' -v
      - name: Test generated AMEA-keyed Unissued Safe Watch offline
        run: python -m unittest discover -s automation/ops -p 'test_css_unissued_safe_watch.py' -v
      - name: Publish source-backed AMEA contract candidates (generated-only)
        run: python automation/ops/css_amea_contract_candidate_crosswalk.py
      - name: Quarantine misleading Watch H/X and verify source formulas
        run: python automation/ops/css_unissued_contract_lineage_guard.py
      - name: Publish safe unissued Watch, retaining zero approved H/X values
        run: python automation/ops/css_unissued_safe_watch.py
      - name: Keep original business and finance records read-only
        run: echo 'FORMULA_POSITIONAL_JOIN_UNSAFE;GENERATED_REVIEW_ONLY;NO_REVENUE_OR_SOURCE_MUTATION' >> "$GITHUB_STEP_SUMMARY"

  lead:
    name: 3 - Strict personal Lead/Report parity
    needs: offline
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 12
    env:
      CKD_DRIVE_SA_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3'
      - name: Verify sent/skip/NBA policy (offline)
        run: python -m unittest discover -s automation/ops -p 'test_css_parallel_audit.py' -v
      - name: Compare strict personal outbound and staged Leads (read only)
        run: python automation/ops/css_parallel_audit.py lead

  feishu:
    name: 4 - Feishu payment source + mirror structural audit
    needs: offline
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 14
    env:
      CKD_DRIVE_SA_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3'
      - name: Validate Feishu four-sheet structural rules offline
        run: |
          python -m unittest discover -s automation/feishu -p 'test_latest_four_schema_header.py' -v
          python -m unittest discover -s automation/feishu -p 'test_latest_four_mirror_parity.py' -v
      - name: Verify original four Feishu sheet headers (read only)
        run: python automation/feishu/latest_four_schema_audit.py
      - name: Verify Google mirror source IDs and columns (read only)
        run: python automation/feishu/latest_four_mirror_parity.py

  web:
    name: 5 - Web real Sheets API contract (no SSO bypass)
    needs: offline
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 15
    env:
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check API and owner UID handler syntax
        run: |
          node --check automation/ops/css_web_source_live_smoke.cjs
          node --check apps/css-sales-workspace/api/lifecycle.js
          node --check apps/css-sales-workspace/api/lifecycle/mail-body.js
      - name: Verify live Sheets data through local serverless handlers
        run: node automation/ops/css_web_source_live_smoke.cjs
      - name: Record browser boundary
        run: echo 'LIVE_SHEETS_LOCAL_HANDLER_ONLY; VERCEL_OWNER_AUTH_BROWSER_E2E_NOT_VERIFIED; NO_DEPLOY' >> "$GITHUB_STEP_SUMMARY"

  release:
    name: 6 - Vercel root and Production SHA (API read only)
    needs: offline
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 8
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query Vercel project and Production status without deploy
        run: python automation/ops/css_release_readonly_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: css-release-readonly-evidence
          path: audit-results/css-release-parity.json
          if-no-files-found: ignore
          retention-days: 14

  status:
    name: 7 - Publish independent outcomes, no acceptance promotion
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs: [offline, mail, revenue, invoice_review, owner_payment, evidence, contract_lineage, lead, feishu, web, release]
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 8
    env:
      CKD_DRIVE_SA_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
      TRACK_MAIL: ${{ needs.mail.result }}
      TRACK_REVENUE: ${{ needs.revenue.result }}
      TRACK_INVOICE_REVIEW: ${{ needs.invoice_review.result }}
      TRACK_OWNER_PAYMENT: ${{ needs.owner_payment.result }}
      TRACK_EVIDENCE: ${{ needs.evidence.result }}
      TRACK_CONTRACT: ${{ needs.contract_lineage.result }}
      TRACK_LEAD: ${{ needs.lead.result }}
      TRACK_FEISHU: ${{ needs.feishu.result }}
      TRACK_WEB: ${{ needs.web.result }}
      TRACK_RELEASE: ${{ needs.release.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3'
      - name: Publish status to isolated CSS P0 Parallel Status tab with readback
        run: python automation/ops/publish_css_p0_parallel_status.py
      - name: Summarize all independent job outcomes
        if: always()
        run: |
          {
            echo '## CSS P0 - Nine independent verification tracks'
            echo '| Lane | Execution state |'
            echo '|---|---|'
            echo "| QQ source | $TRACK_MAIL |"
            echo "| Revenue VAT integrity only | $TRACK_REVENUE |"
            echo "| Invoice-only generated review sheet | $TRACK_INVOICE_REVIEW |"
            echo "| Exact owner / payment evidence (not certified) | $TRACK_OWNER_PAYMENT |"
            echo "| Source evidence gaps / aging / release blockers | $TRACK_EVIDENCE |"
            echo "| AMEA/X positional source quarantine (not correction) | $TRACK_CONTRACT |"
            echo "| Personal Lead | $TRACK_LEAD |"
            echo "| Feishu payment structure | $TRACK_FEISHU |"
            echo "| Web live-source API | $TRACK_WEB |"
            echo "| Vercel read-only Production parity | $TRACK_RELEASE |"
            echo
            echo '**Acceptance is NOT VERIFIED.** Green jobs are not evidence of authenticated Preview E2E or paid invoices.'
            echo 'No customer messages sent, no SFDC Save, no Vercel deploy and no original business records modified.'
          } >> "$GITHUB_STEP_SUMMARY"
          for state in "$TRACK_MAIL" "$TRACK_REVENUE" "$TRACK_CONTRACT" "$TRACK_LEAD" "$TRACK_FEISHU" "$TRACK_WEB" "$TRACK_RELEASE"; do
            if [ "$state" != success ]; then
              echo 'CSS_PARALLEL_P0_PARTIAL_FAILURE=true'
              exit 1
            fi
          done
          echo 'CSS_PARALLEL_P0_ALL_EXECUTION_TRACKS_PASS=true'
