name: Grid V3 Real Data Sensitivity (SSH Read Only)

on:
  push:
    branches: [feat/rea-isolated-pilot-20261017]
    paths:
      - '.github/workflows/grid-v3-ssh-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-24.04
    environment: TaehoonServer
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Run 2025 two-model ETH 1m backtest without DB writes
        env:
          SSH_HOST: ${{ secrets.SERVER_SSH_HOST }}
          SSH_USER: ${{ secrets.SERVER_SSH_USER }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
        run: |
          python3 - <<'PY'
          import os,json,shlex,base64,hashlib,subprocess
          from pathlib import Path
          ssh=Path.home()/'.ssh'
          ssh.mkdir(mode=0o700,exist_ok=True)
          key=os.environ['SSH_KEY'].strip().replace('\\n','\n').replace('\r\n','\n').replace('\r','\n')
          if not key.startswith(('-----BEGIN OPENSSH PRIVATE KEY-----','-----BEGIN RSA PRIVATE KEY-----','-----BEGIN EC PRIVATE KEY-----')):
              raise SystemExit('INVALID_SSH_KEY')
          (ssh/'server_key').write_text(key+'\n')
          (ssh/'server_key').chmod(0o600)
          (ssh/'known_hosts').write_text(os.environ['SSH_KNOWN_HOSTS'].strip()+'\n')
          (ssh/'known_hosts').chmod(0o600)
          subprocess.run(['ssh-keygen','-y','-P','','-f',str(ssh/'server_key')],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          src=Path('research/upbit_eth/grid_event_v3.py').read_text()
          worker=Path('experiments/rea/grid_v3_ssh_readonly_worker.py').read_bytes()
          remote='import base64;exec(base64.b64decode('+repr(base64.b64encode(worker).decode())+'))'
          ssh_cmd=['ssh','-o','BatchMode=yes','-o','StrictHostKeyChecking=yes','-o','ConnectTimeout=12','-o','ForwardAgent=no','-o','IdentitiesOnly=yes','-i',str(ssh/'server_key'),os.environ['SSH_USER']+'@'+os.environ['SSH_HOST'],'python3 -c '+shlex.quote(remote)]
          results=[]
          for mode in ('strict','inclusive_touch'):
              payload=dict(db='~/research/upbit_eth/krw_eth_1m.sqlite3',source=src,source_sha=hashlib.sha256(src.encode()).hexdigest(),mode=mode,year=2025,spacing=.01,levels=20,capital=1_000_000,fee=.001)
              p=subprocess.run(ssh_cmd,input=json.dumps(payload),text=True,capture_output=True,timeout=600)
              if p.returncode:
                  print('REMOTE_READONLY_ANALYSIS_FAILED='+mode+':'+p.stderr[-800:])
                  raise SystemExit(p.returncode)
              data=json.loads(p.stdout.strip())
              if not data.get('read_only') or data.get('source_sha')!=payload['source_sha'] or data.get('result') is None:
                  raise SystemExit('INVALID_READONLY_EVIDENCE')
              results.append(data)
          out=Path(os.environ['RUNNER_TEMP'])/'grid_v3_actual_2025_sensitivity.json'
          out.write_text(json.dumps(results,ensure_ascii=False,indent=2))
          for d in results:
              print('GRID_REAL_DATA_MODE='+d['mode']+' RETURN_PCT='+str(d['result']['return_pct'])+' MDD_PCT='+str(d['result']['mdd_pct'])+' FILLS='+str(d['result']['fills'])+' FEES_KRW='+str(d['result']['fees_krw']))
          print('GRID_REAL_DATA_READ_ONLY_PASS=true')
          PY
      - name: Upload read-only aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grid-v3-real-2025-summary
          path: ${{ runner.temp }}/grid_v3_actual_2025_sensitivity.json
          if-no-files-found: warn
          retention-days: 7
