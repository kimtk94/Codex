name: CSS Invoice Workbook Offline Tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - automation/feishu/css_invoice_workbook.py
      - automation/feishu/test_css_invoice_workbook.py
      - .github/workflows/css-invoice-workbook-tests.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Synthetic workbook integration test
        run: python3 automation/feishu/test_css_invoice_workbook.py
