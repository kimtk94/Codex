name: QQ Statement Full Source Recovery Audit
on:
  pull_request:
    paths:
      - 'automation/css_mail/statement_source_coverage.py'
      - 'automation/css_mail/statement_amount_extract.py'
      - 'automation/css_mail/statement_original_recovery_probe.py'
      - 'automation/css_mail/test_statement_source_coverage.py'
      - '.github/workflows/qq-statement-full-source-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || 'qq-statement-full-source-recovery-readonly' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3'
      - run: python3 -m unittest discover -s automation/css_mail -p test_statement_source_coverage.py -v
      - run: python3 -m unittest discover -s automation/css_mail -p test_project_lifecycle_chain.py -v
  original:
    needs: offline
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && needs.offline.result == 'success' }}
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 15
    env:
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
      CSS_QQ_MAIL_ADDRESS: ${{ secrets.CSS_QQ_MAIL_ADDRESS }}
      CSS_QQ_MAIL_AUTH_CODE: ${{ secrets.CSS_QQ_MAIL_AUTH_CODE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3'
      - run: python3 automation/css_mail/statement_original_recovery_probe.py
