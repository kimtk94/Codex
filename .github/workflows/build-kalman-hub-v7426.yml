name: Build Kalman Hub v7.4.26 Freshness Split

on:
  pull_request:
    paths:
      - "kalman-toss-gateway/scripts/build_investment_hub_v7426_freshness_split.py"
      - ".github/workflows/build-kalman-hub-v7426.yml"
  push:
    branches: [main]
    paths:
      - "kalman-toss-gateway/scripts/build_investment_hub_v7426_freshness_split.py"
      - ".github/workflows/build-kalman-hub-v7426.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build v7.4.25 source manifest
        run: python kalman-toss-gateway/scripts/build_investment_hub_v7426_freshness_split.py

      - name: Validate persistent benchmark surface
        shell: bash
        run: |
          set -euo pipefail
          test -s kalman-hub-recovery/v7.4.26/source_manifest.ndjson
          test -s kalman-hub-recovery/v7.4.26/build_report.json
          python - <<'PY'
          from pathlib import Path
          import base64,json,tempfile,subprocess

          manifest=Path("kalman-hub-recovery/v7.4.26/source_manifest.ndjson")
          rows=[json.loads(x) for x in manifest.read_text().splitlines() if x.strip()]
          assert len(rows)==30, len(rows)
          with tempfile.TemporaryDirectory() as td:
              out=Path(td)
              for row in rows:
                  p=out/row["file"]
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_bytes(base64.b64decode(row["data_b64"]))
              app=(out/"app.js").read_text()
              style=(out/"style.css").read_text()
              api=(out/"api/assets.js").read_text()
              health=(out/"api/health.js").read_text()
              index=(out/"index.html").read_text()
              assert "vNext.7.4.26" in index
              assert "vNext.7.4.26" in health
              assert "universeBenchmark" in app
              assert "연구 벤치마크 · TOP-1 vs TOP-6" in app
              assert "if(kalmanCommandState.control)renderBenchmark(kalmanCommandState.control)" in app
              assert "universe-benchmark-card" in style
              assert "Execution Quality:" in app
              assert "tradeSnapshotValidity" in app
              assert "freshnessBadges" in app
              assert "데이터 최신" in app
              assert "거래 만료" in app
              assert "trade_effective_stale" in api
              assert "display_effective_stale" in api
              assert "trade_gate_unchanged:true" in api
              assert "PIPELINE_GENERATED_AT" in api
              assert "net_return" in api
              assert "trade_enabled:false" in health
              assert "account_trade_execution:false" in health
              subprocess.run(["node","--check",str(out/"app.js")],check=True)
              subprocess.run(["node","--check",str(out/"api/assets.js")],check=True)
          print("[PASS] v7.4.26 freshness split source")
          PY
