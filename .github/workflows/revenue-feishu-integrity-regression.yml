name: Revenue + Feishu Read-only Integrity Regression
on:
  pull_request:
    paths:
      - 'automation/ops/revenue_cross_source_audit.py'
      - 'automation/ops/test_revenue_cross_source_audit.py'
      - '.github/workflows/parallel-sales-verification.yml'
      - 'automation/feishu/latest_four_schema_audit.py'
      - 'automation/feishu/test_latest_four_schema_header.py'
      - '.github/workflows/feishu-latest-four-schema.yml'
      - '.github/workflows/revenue-feishu-integrity-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  revenue-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install import-time dependencies (no credentials)
        run: python -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3'
      - name: Run Revenue cross-source policy tests
        run: python -m unittest discover -s automation/ops -p 'test_revenue_cross_source_audit.py' -v
  feishu-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run privacy-preserving header integrity tests
        run: python -m unittest discover -s automation/feishu -p 'test_latest_four_schema_header.py' -v
