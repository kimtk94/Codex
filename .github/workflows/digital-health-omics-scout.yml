name: Digital Health Omics Scout Check

on:
  push:
    branches:
      - feature/digital-health-omics-scout
    paths:
      - 'research/digital_health_omics/**'
      - 'notebooks/Digital_Health_Omics_Research_Scout.ipynb'
      - '.github/workflows/digital-health-omics-scout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r research/digital_health_omics/requirements.txt
      - name: Run Global + SKKU scout
        working-directory: research/digital_health_omics
        run: python scout.py --route both --start-year 2020 --end-year 2026 --max-records 5000
      - name: Rank master's thesis candidates
        working-directory: research/digital_health_omics
        run: |
          latest=$(find outputs -mindepth 1 -maxdepth 1 -type d | sort | tail -1)
          python thesis_ranker.py --input-dir "$latest" --end-year 2026 --top-n 30
      - name: Show outputs
        working-directory: research/digital_health_omics
        run: |
          latest=$(find outputs -mindepth 1 -maxdepth 1 -type d | sort | tail -1)
          echo "LATEST=$latest"
          echo "=== SUMMARY ==="
          cat "$latest/run_summary.json"
          echo
          echo "=== TOP OPPORTUNITIES ==="
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          latest = sorted(Path('outputs').glob('*'))[-1]
          p = pd.read_csv(latest/'global_vs_skku_opportunities.csv')
          print(p.head(30).to_string(index=False))
          print("\n=== YEAR DISTRIBUTION ===")
          for route in ["global", "skku"]:
              d = pd.read_csv(latest/f"{route}_papers.csv")
              print(f"\n{route.upper()}")
              print(d["year"].value_counts(dropna=False).sort_index().to_string())
          print("\n=== TOP SKKU TOPICS ===")
          s = pd.read_csv(latest/'skku_topics.csv')
          print(s.head(30).to_string(index=False))
          print("\n=== SAMPLE SKKU PAPERS ===")
          sp = pd.read_csv(latest/'skku_papers.csv')
          cols = ["year","title","digital_axes","omics_axes","disease_axes","pubmed_url"]
          print(sp[cols].head(25).to_string(index=False))
          print("\n=== MASTER THESIS TOP 10 ===")
          c = pd.read_csv(latest/'master_thesis_candidates.csv')
          show = ["candidate_rank","topic_key","thesis_score","global_recent_3y","skku_recent_3y","non_original_ratio","top_genes_proteins","research_question"]
          print(c[show].head(10).to_string(index=False))
          print("\n=== SKKU RESEARCHER MATCHES ===")
          m = pd.read_csv(latest/'skku_researcher_matches.csv')
          print(m.head(30).to_string(index=False) if len(m) else "No matches")
          PY
      - name: Upload result CSVs
        uses: actions/upload-artifact@v4
        with:
          name: digital-health-omics-results
          path: research/digital_health_omics/outputs/
