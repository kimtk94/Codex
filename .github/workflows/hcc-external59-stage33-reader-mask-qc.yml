name: HCC Stage33 External Index HCC Venous Dual-Reader Source Mask QC

on:
  pull_request:
    paths:
      - "research/hcc/ci/mri_external59_stage33_two_reader_mask_qc.py"
      - ".github/workflows/hcc-external59-stage33-reader-mask-qc.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hcc-stage33-venous-readers
  cancel-in-progress: false

jobs:
  source-3-primary-reader-mask-qc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: "Source MD5/SHA matched 3 frozen index lesions: original venous MRI two-reader QC"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numpy / scipy / NIfTI / image-QC dependencies
        run: |
          python -m pip install "numpy==1.26.4" "scipy==1.13.1" \
            "nibabel==5.3.2" "requests==2.32.3" "matplotlib==3.9.2"
      - name: Offline tests for source-world HD95 / Dice / geometry and zero-shift
        run: python3 research/hcc/ci/mri_external59_stage33_two_reader_mask_qc.py --offline-test
      - name: Verify original external 59-patient results and claims remain S0
        run: python3 research/hcc/ci/mri_external_openswisshcc_v2_59_immutable_result_guard.py
      - name: Fetch three pinned GitHub Actions source artifacts (no whole MRI dataset)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/hcc_stage33_original_sources
          for id in 13049177735 13048738836 13050138178; do
            curl --fail --location --silent --show-error \
              --retry 4 --retry-all-errors --retry-delay 3 \
              --connect-timeout 20 --max-time 160 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/kimtk94/Codex/actions/artifacts/$id/zip" \
              --output "artifacts/hcc_stage33_original_sources/$id.zip"
          done
      - name: Real original-source 3 dual-reader index masks and venous NIfTI
        run: |
          python3 research/hcc/ci/mri_external59_stage33_two_reader_mask_qc.py \
            --primary-source-zip artifacts/hcc_stage33_original_sources/13049177735.zip \
            --source90-zip artifacts/hcc_stage33_original_sources/13048738836.zip \
            --profile-source-zip artifacts/hcc_stage33_original_sources/13050138178.zip \
            --out-dir artifacts/hcc_stage33_reader_qc
      - name: Fail-closed 3/3 source geometries, raw source hashes, MRI-RNA 0/12
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import csv,json,math
          out=Path("artifacts/hcc_stage33_reader_qc")
          j=json.loads((out/"stage33_reader_mask_technical_qc.json").read_text())
          with (out/"stage33_external_primary_3_reader_pairs.csv").open() as f:
              rows=list(csv.DictReader(f))
          assert (j["index_pair_success_n"], j["index_pair_hold_n"]) == (3,0)
          assert len(rows)==3 and len({r["subject"] for r in rows})==3
          assert j["frozen_index_primary_lesions_with_second_reader"]==3
          assert j["original_venous_HCC_lesions_with_second_reader"]==8
          assert j["clinical_anatomic_independent_expert_review"]=="NOT_ASSESSED"
          assert j["MRI_RNA_biological_tests"]==0 and j["claim_ceiling"]=="S0"
          for r in rows:
              assert r["analysis_status"]=="PASS_SOURCE_PAIRED_MASK_TECHNICAL_GEOMETRY_ONLY"
              assert 0<=float(r["dice"])<=1 and 0<=float(r["jaccard"])<=1
              assert math.isfinite(float(r["symmetric_hd95_world_mm"]))
              assert float(r["image_second_affine_corner_mm"])<=0.5
              assert (out/r["overlay_panel"]).is_file()
          print("HCC_STAGE33_SOURCE_3_OF_3_FINITE_MASK_QC_AND_NO_CLINICAL_PROMOTION_PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcc-stage33-original-3-index-venous-two-reader-anatomy-qc
          path: artifacts/hcc_stage33_reader_qc/*
          retention-days: 90
          if-no-files-found: warn
