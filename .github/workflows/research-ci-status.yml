name: Research CI Status Report
on:
  workflow_dispatch:
  schedule:
    - cron: '23 0 * * *'
  pull_request:
    paths:
      - 'automation_policy/research_status.py'
      - '.github/workflows/research-ci-status.yml'
permissions:
  contents: read
jobs:
  verify-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kimtk94/IS_Analysis_V3
          path: research_source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixture test dependency
        run: python3 -m pip install 'openpyxl>=3.1,<4'
      - name: Compile actual research code
        run: python3 -m compileall -q research_source/scripts research_source/workflow
      - name: Run actual research fixture regression
        working-directory: research_source
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Generate verified code status, not biological findings
        env:
          RESEARCH_SHA: ${{ github.sha }}
        run: |
          RESEARCH_SHA="$(git -C research_source rev-parse HEAD)"
          export RESEARCH_SHA
          python3 -m automation_policy.research_status
      - name: Archive report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-ci-status
          path: |
            artifacts/research-ci-status.json
            artifacts/research-ci-status.md
          if-no-files-found: warn
          retention-days: 30
