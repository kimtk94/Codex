name: PO Project-level Gap Reduction Audit
on:
  pull_request:
    paths:
      - 'automation/feishu/po_project_gap_audit.py'
      - 'automation/feishu/test_po_project_gap_audit.py'
      - '.github/workflows/po-project-gap-audit.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/po-project-gap-audit.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 2,11 * * *'
  workflow_run:
    workflows:
      - Contract-triggered PO Required Tracker
      - PO Mail Body and Repeat Analysis
    types: [completed]
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('po-project-gap-tests-{0}', github.event.pull_request.number) || 'po-project-gap-readonly' }}
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test Contract-first project cohort and PO evidence rules
        run: |
          python3 -m unittest discover -s automation/feishu -p 'test_po_project_gap_audit.py' -v
          python3 -m unittest discover -s automation/feishu -p 'test_po_body_multiplicity_audit.py' -v
          python3 -m unittest discover -s automation/feishu -p 'test_po_manual_verification.py' -v
  snapshot:
    needs: tests
    if: ${{ needs.tests.result == 'success' && github.event_name != 'pull_request' && vars.JIIN_CRM_READY == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: TaehoonServer
    env:
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_BASE_APP_TOKEN: ${{ vars.FEISHU_SALES_BASE_APP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit CSS-owned PO_REQUIRED projects by original-mail root cause
        run: python3 automation/feishu/po_project_gap_audit.py
