name: Feishu Latest Four Schema Audit
on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"
permissions:
  contents: read
jobs:
  audit:
    environment: TaehoonServer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Read latest sheet headers only
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: python3 automation/feishu/latest_four_schema_audit.py
