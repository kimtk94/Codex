name: Kalman Daily Market And Macro Refresh (Research Only)

on:
  schedule:
    # Tue-Sat 02:15 UTC, after prior US session close (11:15 KST).
    - cron: '15 2 * * 2-6'
  workflow_dispatch:
    inputs:
      candidate_preflight_only:
        description: 'Read-only diagnostic of provisioned private candidate slot; no writes or refresh'
        type: boolean
        required: false
        default: false
      candidate_target_file_id:
        description: 'Optional one-time owner-provisioned private HOLD archive slot; never the original'
        required: false
        type: string
        default: ''
      candidate_expected_session:
        description: 'Exact completed XNYS session for the one-time slot (YYYY-MM-DD)'
        required: false
        type: string
        default: ''
  pull_request:
    paths:
      - 'research/kalman_market_refresh/**'
      - '.github/workflows/kalman-market-refresh-ci.yml'
  push:
    branches: [main]
    paths:
      - 'research/kalman_market_refresh/**'
      - '.github/workflows/kalman-market-refresh-ci.yml'

permissions:
  contents: read

concurrency:
  group: kalman-daily-market-refresh-ci
  cancel-in-progress: false

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated validation dependencies
        run: python -m pip install --disable-pip-version-check 'pandas>=2.2,<3' 'numpy>=2,<3' 'pyarrow>=17' 'exchange-calendars>=4.7'
      - name: Run offline contracts
        run: python -m unittest discover -s research/kalman_market_refresh -p 'test_*.py' -v
      - name: Validate Python syntax
        run: python -m compileall -q research/kalman_market_refresh

  candidate-preflight:
    needs: offline-tests
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.candidate_preflight_only
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install diagnostic dependencies
        run: python -m pip install --disable-pip-version-check 'pandas>=2.2,<3' 'numpy>=2,<3' 'pyarrow>=17' 'exchange-calendars>=4.7' google-auth google-api-python-client requests
      - name: Inspect exact owner-provisioned candidate slot using read-only scope
        env:
          CKD_DRIVE_SA_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
          GDRIVE_SA_JSON_B64: ${{ secrets.GDRIVE_SA_JSON_B64 }}
          CANDIDATE_TARGET_FILE_ID: ${{ inputs.candidate_target_file_id }}
          CANDIDATE_EXPECTED_SESSION: ${{ inputs.candidate_expected_session }}
        run: |
          test "$CANDIDATE_TARGET_FILE_ID" = '1rptk7B9dJfNp2GgaDF0g27FZUolKEIDn'
          test "$CANDIDATE_EXPECTED_SESSION" = '2026-11-24'
          python research/kalman_market_refresh/archive_candidate_once.py --preflight-only \
            --target-id "$CANDIDATE_TARGET_FILE_ID" \
            --expected-session "$CANDIDATE_EXPECTED_SESSION" \
            --out outputs/kalman_market_refresh/private_preflight_status.json
      - name: Upload read-only diagnostic metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalman-market-private-preflight-metadata
          path: outputs/kalman_market_refresh/private_preflight_status.json
          retention-days: 30
          if-no-files-found: warn

  refresh:
    needs: offline-tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && inputs.candidate_preflight_only)
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reject incomplete manual archive requests before data collection
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_TARGET_FILE_ID: ${{ inputs.candidate_target_file_id }}
          CANDIDATE_EXPECTED_SESSION: ${{ inputs.candidate_expected_session }}
        run: |
          python - <<'PY'
          import os, re
          from datetime import date
          target = os.environ["CANDIDATE_TARGET_FILE_ID"]
          session = os.environ["CANDIDATE_EXPECTED_SESSION"]
          if bool(target) != bool(session):
              raise SystemExit("INCOMPLETE_ONE_TIME_ARCHIVE_REQUEST")
          if target and (not re.fullmatch(r"[A-Za-z0-9_-]{15,100}", target)
                         or date.fromisoformat(session).isoformat() != session):
              raise SystemExit("INVALID_ONE_TIME_ARCHIVE_REQUEST")
          PY
      - name: Install isolated market and Drive dependencies
        run: |
          python -m pip install --disable-pip-version-check -r kalman-toss-gateway/engine/market_data/requirements.txt
          python -m pip install --disable-pip-version-check google-auth google-api-python-client requests 'exchange-calendars>=4.7'
      - name: Research-only universe
        run: |
          python research/kalman_market_refresh/refresh_ci.py universe \
            --source kalman-toss-gateway/config/market-data-v2-universe.json \
            --out "$RUNNER_TEMP/kalman_market_universe.json"
      - name: Refresh market OHLCV snapshots (no LIVE writes)
        working-directory: kalman-toss-gateway
        run: |
          python -m engine.market_data.cli \
            --start-date 2024-01-01 \
            --universe "$RUNNER_TEMP/kalman_market_universe.json" \
            --output-dir "$RUNNER_TEMP/kalman_market"
      - name: Refresh isolated technical features
        working-directory: kalman-toss-gateway
        run: |
          python -m engine.features_v2_002.cli \
            --input-dir "$RUNNER_TEMP/kalman_market/raw/yfinance" \
            --output-dir "$RUNNER_TEMP/kalman_features"
      - name: Refresh 12 official FRED current-revision series
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python research/kalman_market_refresh/refresh_ci.py fred \
            --out "$RUNNER_TEMP/kalman_fred" \
            --start 2017-01-01
      - name: Validate market freshness and build research-only bundle
        run: |
          python research/kalman_market_refresh/refresh_ci.py bundle \
            --market "$RUNNER_TEMP/kalman_market" \
            --features "$RUNNER_TEMP/kalman_features" \
            --fred "$RUNNER_TEMP/kalman_fred" \
            --out "$RUNNER_TEMP/kalman_market_research.zip" \
            --status outputs/kalman_market_refresh/readiness.json
      - name: Report macro update completeness (never claim FRED READY with zero series)
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('outputs/kalman_market_refresh/readiness.json')
          r=json.loads(p.read_text())
          print('MARKET_STATUS',r['status'])
          print('FRED_COMPLETENESS',r['macro_completeness'])
          if r['macro_completeness']!='FRED_READY_CURRENT_REVISED':
              print('::warning::FRED latest revisions not fully updated; market candidate is temporary; macro is not PIT-ready')
          PY
      - name: Verify candidate bundle and record HOLD metadata (no Drive replacement)
        run: |
          python research/kalman_market_refresh/refresh_ci.py candidate \
            --file "$RUNNER_TEMP/kalman_market_research.zip" \
            --status outputs/kalman_market_refresh/candidate_status.json
      - name: Fetch pinned original wide-market archive read-only
        env:
          CKD_DRIVE_SA_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
          GDRIVE_SA_JSON_B64: ${{ secrets.GDRIVE_SA_JSON_B64 }}
        run: |
          python research/kalman_market_missingness/fetch_private_zip.py \
            --file-id 1aUhvIAsE2x2-LuKv5nSxmDGX0Uo4mqYd \
            --out "$RUNNER_TEMP/original_market_research.zip"
      - name: Compare old and candidate prices, emit aggregate HOLD metadata only
        run: |
          python research/kalman_market_refresh/candidate_compare.py \
            --original "$RUNNER_TEMP/original_market_research.zip" \
            --candidate "$RUNNER_TEMP/kalman_market_research.zip" \
            --out outputs/kalman_market_refresh/overlap_audit.json
      - name: Store only explicit one-time private candidate slot, never release data
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.candidate_target_file_id != '' && inputs.candidate_expected_session != ''
        env:
          CKD_DRIVE_SA_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
          GDRIVE_SA_JSON_B64: ${{ secrets.GDRIVE_SA_JSON_B64 }}
          CANDIDATE_TARGET_FILE_ID: ${{ inputs.candidate_target_file_id }}
          CANDIDATE_EXPECTED_SESSION: ${{ inputs.candidate_expected_session }}
        run: |
          python research/kalman_market_refresh/archive_candidate_once.py \
            --original "$RUNNER_TEMP/original_market_research.zip" \
            --candidate "$RUNNER_TEMP/kalman_market_research.zip" \
            --audit outputs/kalman_market_refresh/overlap_audit.json \
            --target-id "$CANDIDATE_TARGET_FILE_ID" \
            --expected-session "$CANDIDATE_EXPECTED_SESSION" \
            --run-id "$GITHUB_RUN_ID" \
            --out outputs/kalman_market_refresh/private_archive_status.json
      - name: Upload metadata only, never publish price snapshots to Actions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalman-market-refresh-metadata
          path: outputs/kalman_market_refresh/*.json
          retention-days: 30
          if-no-files-found: warn