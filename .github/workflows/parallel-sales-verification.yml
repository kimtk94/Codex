name: Parallel Sales Automation Verification (4 tracks)

on:
  workflow_dispatch:
  schedule:
    - cron: '5 2,5,10 * * *' # 11:05 / 14:05 / 19:05 KST
  push:
    branches: [main]
    paths:
      - '.github/workflows/parallel-sales-verification.yml'
      - 'automation/ops/sales_parallel_readonly_audit.py'
      - 'automation/css/lead_my_sent_refresh.py'
      - 'automation/css/nba_refresh_pool.py'
      - 'apps/css-sales-workspace/**'

permissions:
  contents: read

concurrency:
  group: parallel-sales-readonly-verification
  cancel-in-progress: false

jobs:
  report-and-lead:
    name: A - SFDC Report & Personal Lead parity
    environment: TaehoonServer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CKD_DRIVE_SA_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only audit dependencies
        run: python -m pip install 'google-auth>=2.20,<3' 'google-api-python-client>=2,<3' 'requests>=2.31,<3' 'openpyxl>=3.1,<4'
      - name: Test report and individual personal sender guards
        run: |
          python automation/sfdc/test_three_report_email_ingest.py
          python -m unittest discover -s automation/css -p 'test_lead_my_sent_refresh.py' -v
      - name: Check live Report / Lead / NBA parity (read-only)
        run: python automation/ops/sales_parallel_readonly_audit.py lead

  revenue:
    name: B - Invoice / Statement / Forecast integrity
    environment: TaehoonServer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CKD_DRIVE_SA_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only audit dependencies
        run: python -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3'
      - name: Run invoice ownership, lifecycle and duplicate tests
        working-directory: automation/css_mail
        run: python -m unittest -v test_revenue_lifecycle_monthly test_invoice_ownership test_original_invoice_mail
      - name: Check current actual / pending / forecast numbers (read-only)
        run: python automation/ops/sales_parallel_readonly_audit.py revenue

  sfdc-desktop:
    name: C - SFDC desktop Save-disabled regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated desktop prototype (no SFDC credentials)
        uses: actions/checkout@v4
        with:
          ref: feat/sfdc-playwright-desktop-p0
          path: sfdc-worker
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install mock-only UI test dependencies
        run: python -m pip install -r sfdc-worker/automation/sfdc_desktop/requirements.txt
      - name: Run mocked Opportunity / lookup / identity / queue tests
        working-directory: sfdc-worker
        run: python -m unittest discover -s automation/sfdc_desktop -p 'test_*.py' -v
      - name: Record no-live-save boundary
        run: echo 'SFDC_DESKTOP_MOCK_ONLY=true; no browser sign-in; no Save; no CRM writes.'

  web:
    name: D - Web API / personal Lead UI regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check web API and shared UI syntax
        working-directory: apps/css-sales-workspace
        run: |
          node --check api/dashboard.js
          node --check api/lifecycle.js
          node --check lib/personal-leads.js
          node --check lib/auth-common.js
      - name: Test personal sent evidence web projection
        working-directory: apps/css-sales-workspace
        run: node --test test/*.test.js
      - name: Record auth safety boundary
        run: echo 'WEB_TESTS_STATIC_AND_MOCK_ONLY=true; authenticated E2E still separate.'
