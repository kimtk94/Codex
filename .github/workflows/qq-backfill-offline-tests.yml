name: QQ Backfill Cursor Offline Tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'automation/css_mail/qq_historical_invoice_backfill.py'
      - '.github/workflows/qq-backfill-offline-tests.yml'
      - 'automation/css_mail/test_qq_uidvalidity.py'
      - 'automation/css_mail/invoice_fallback.py'
      - 'automation/css_mail/test_invoice_fallback.py'
  push:
    branches: [main]
    paths:
      - 'automation/css_mail/qq_historical_invoice_backfill.py'
      - '.github/workflows/qq-backfill-offline-tests.yml'
permissions:
  contents: read
jobs:
  syntax-and-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile QQ backfill and invoice parser
        run: python3 -m py_compile automation/css_mail/qq_historical_invoice_backfill.py automation/css_mail/tax_invoice_extract.py automation/css_mail/invoice_fallback.py
      - name: Test IMAP UIDVALIDITY fallback
        run: |
          python3 -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3'
          python3 automation/css_mail/test_qq_uidvalidity.py
          python3 automation/css_mail/test_invoice_fallback.py
      - name: Check cursor status and fail-closed safety invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("automation/css_mail/qq_historical_invoice_backfill.py").read_text()
          for text in ("UIDVALIDITY", "PARTIAL_SCAN", "SCAN_COMPLETE", "QQ Backfill Cursor", "QQ Backfill Audit", "BACKFILL_HEADER_MISMATCH"):
              assert text in s, text
          assert s.index('json={"values":values}') < s.index('cursor_values=[cursor_header]')
          assert 'if uidvalidity:last_by_folder[folder]' in s
          assert 'no_uidvalidity_folders+=1' in s
          assert 'unfinished=True' in s
          assert 'QQ_BACKFILL_PARSER_DIAGNOSTIC' in s
          assert 'PATTERN_MISMATCH' in s
          print("QQ_CURSOR_OFFLINE_SAFETY_PASS")
          PY
