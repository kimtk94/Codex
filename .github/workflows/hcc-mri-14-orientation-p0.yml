name: HCC P0 MRI 14-Case Orientation Header Audit

on:
  pull_request:
    paths:
      - "research/hcc/ci/mri_phase_mask_all14_header_orientation_audit.py"
      - "research/hcc/HCC_MRI_14_PREOUTCOME_INDEX_LESION_SELECTION_20261030.csv"
      - ".github/workflows/hcc-mri-14-orientation-p0.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hcc-mri14-orientation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Negative-path synthetic permutation/flip/translation fail-closed tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "numpy==1.26.4" "nibabel>=5.2,<6"
      - name: Check 1/2 axis flips are not mistaken for real anatomical validation
        run: python research/hcc/ci/mri_phase_mask_all14_header_orientation_audit.py --offline-test

  live:
    name: Check all 14 frozen selected lesions against 3 official MRI phase headers
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "numpy==1.26.4" "nibabel>=5.2,<6"
      - name: Read only original public NIfTI headers and report 14x3 geometry
        run: python research/hcc/ci/mri_phase_mask_all14_header_orientation_audit.py --out-dir artifacts/hcc_mri14_orientation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcc-mri14-art-pv-source-header-only-orientation
          path: |
            artifacts/hcc_mri14_orientation/*.json
            artifacts/hcc_mri14_orientation/*.csv
          if-no-files-found: warn
          retention-days: 30

  integrate:
    name: Enforce 14 patients, 42 source phases, and no clinical promotion
    runs-on: ubuntu-latest
    needs: [offline, live]
    timeout-minutes: 7
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hcc-mri14-art-pv-source-header-only-orientation
          path: artifacts
      - run: |
          python3 - <<'PY'
          import csv,json,os
          from pathlib import Path
          with Path("artifacts/hcc_mri14_art_pv_orientation_geometry.csv").open() as f:
              rows=list(csv.DictReader(f))
          j=json.loads(Path("artifacts/hcc_mri14_source_orientation_summary.json").read_text())
          assert j["unique_patients"]==14 and j["patient_phase_rows"]==42
          assert len(rows)==42 and len({(r["patient_id"],r["source_phase"]) for r in rows})==42
          assert all(r["eligible_patient"]=="NOT_ASSESSED" for r in rows)
          assert j["final_eligible_n"]=="NOT_ASSESSED" and j["HCC20"]=="PENDING"
          assert j["MRI_RNA_primary_12_tests"]=="NOT_EXECUTED" and j["claim_ceiling"]=="S0"
          msg=["## HCC P0 all-14 source orientation audit", "",
              "- Scientific verdict: **HEADER ONLY, EXPERT REVIEW STILL REQUIRED**",
              f"- All selected patients: {j['unique_patients']}, patient-phase checks: {j['patient_phase_rows']}",
              f"- Orientation geometry by phase: `{j['orientation_results']}`",
              f"- Axis flip counts by phase: `{j['axis_flip_results']}`",
              "- HCC-12/13/14 PARTIAL, HCC-17/20 PENDING, claim ceiling S0",
              "- Geometry equivalence is NOT anatomical tissue, scan-timing or same-RNA-lesion confirmation"]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
              out.write("\n".join(msg)+"\n")
          print("HCC_MRI14_OFFICIAL_HEADER_42_ROWS_NO_CLINICAL_PROMOTION_PASS")
          PY
