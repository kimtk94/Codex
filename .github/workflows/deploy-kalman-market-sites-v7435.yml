name: Deploy Kalman KR US Dedicated Sites v7.4.35

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "kalman-toss-gateway/web/market-sites/**"
      - "kalman-toss-gateway/scripts/build_investment_hub_v7435_dedicated_sites.py"
      - "kalman-toss-gateway/scripts/deploy_market_sites_v7435_ci.sh"
      - ".github/workflows/deploy-kalman-market-sites-v7435.yml"

permissions:
  contents: read

concurrency:
  group: kalman-market-sites-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_eklxTMfdySLBHexmheTiWGCE
      VERCEL_ORG_ID: team_eklxTMfdySLBHexmheTiWGCE
      VERCEL_TEAM_SLUG: insk1285-9320s-projects

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Vercel credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "VERCEL_TOKEN repository secret is not configured" >&2; exit 2; }

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.16.0

      - name: Build, smoke-test, and promote KR + US
        shell: bash
        run: |
          set -euo pipefail
          chmod +x kalman-toss-gateway/scripts/deploy_market_sites_v7435_ci.sh
          kalman-toss-gateway/scripts/deploy_market_sites_v7435_ci.sh
