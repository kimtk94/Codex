name: QQ Historical Tax Invoice Backfill 2025
on:
  workflow_dispatch:
  schedule:
    - cron: '7 1 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/qq-historical-invoice-backfill.yml'
      - 'automation/css_mail/qq_historical_invoice_backfill.py'
permissions:
  contents: read
concurrency:
  group: qq-historical-invoice-backfill-2025
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 30
    env:
      CSS_QQ_MAIL_ADDRESS: ${{ secrets.CSS_QQ_MAIL_ADDRESS }}
      CSS_QQ_MAIL_AUTH_CODE: ${{ secrets.CSS_QQ_MAIL_AUTH_CODE }}
      CKD_DRIVE_SA_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
      BACKFILL_YEAR: '2025'
      BACKFILL_MAX_MATCHES: '2500'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3'
      - run: python3 -m py_compile automation/css_mail/qq_historical_invoice_backfill.py
      - name: Read-only QQ full-year invoice backfill
        run: python3 automation/css_mail/qq_historical_invoice_backfill.py
