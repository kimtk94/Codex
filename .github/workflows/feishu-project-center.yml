name: Feishu Project Management Center
on:
  pull_request:
    paths:
      - 'automation/feishu/project_center_rules.py'
      - 'automation/feishu/project_data_checks.py'
      - 'automation/feishu/project_progress_board.py'
      - 'automation/feishu/test_project_data_checks.py'
      - 'automation/feishu/test_project_progress_board.py'
      - 'automation/feishu/native_project_center.py'
      - 'automation/feishu/test_project_center.py'
      - 'automation/feishu/sales_metrics_sync.py'
      - 'automation/feishu/test_sales_metrics_sync.py'
      - 'automation/feishu/test_sales_metrics_scope.py'
      - 'automation/feishu/native_overview_dashboard.py'
      - 'automation/feishu/native_dashboard_cli.py'
      - 'automation/feishu/native_payment_dashboard_cli.py'
      - 'automation/feishu/weekly_quote_live_chart.py'
      - '.github/workflows/feishu-project-center.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan/verify read only; apply creates missing page components only'
        required: true
        default: plan
        type: choice
        options: [plan, verify, apply]
      expected_dashboard_id:
        description: 'Reviewed page ID from plan (required for apply to an existing page)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || 'feishu-project-center' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing source test dependencies
        run: python3 -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3'
      - name: Test project center, source-owned writes and metadata boundaries
        run: |
          python3 -m unittest discover -s automation/feishu -p 'test_project_center.py' -v
          python3 -m unittest discover -s automation/feishu -p 'test_project_data_checks.py' -v
          python3 -m unittest discover -s automation/feishu -p 'test_project_progress_board.py' -v
          python3 -m unittest discover -s automation/feishu -p 'test_sales_metrics_sync.py' -v
          python3 -m unittest discover -s automation/feishu -p 'test_sales_metrics_scope.py' -v
          python3 -m unittest discover -s automation/feishu -p 'test_project_management_setup.py' -v
          python3 -m unittest discover -s automation/feishu -p 'test_native_overview_dashboard.py' -v
          python3 -m unittest discover -s automation/feishu -p 'test_native_payment_dashboard.py' -v
  setup:
    needs: offline
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && needs.offline.result == 'success' }}
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 20
    env:
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_BASE_APP_TOKEN: ${{ vars.FEISHU_SALES_BASE_APP_TOKEN }}
      CENTER_MODE: ${{ inputs.mode }}
      EXPECTED_DASHBOARD_ID: ${{ inputs.expected_dashboard_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official Lark CLI
        run: npm install --global '@larksuite/cli@1.0.99'
      - name: Configure ephemeral Feishu app identity
        run: |
          printf '%s' "$FEISHU_APP_SECRET" | lark-cli profile add --name project-center --app-id "$FEISHU_APP_ID" --brand feishu --app-secret-stdin
          lark-cli profile use project-center
      - name: Inspect or provision the separate native page
        run: python3 automation/feishu/native_project_center.py --mode "$CENTER_MODE" --expected-dashboard-id "$EXPECTED_DASHBOARD_ID"
