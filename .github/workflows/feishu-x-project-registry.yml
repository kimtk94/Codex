name: Feishu X Project SAM Lineage Registry
on:
  pull_request:
    paths:
      - 'automation/feishu/x_project_lineage.py'
      - 'automation/feishu/sync_x_project_registry.py'
      - 'automation/feishu/native_x_dashboard.py'
      - 'automation/feishu/test_x_project_lineage.py'
      - 'automation/feishu/sales_native_home.py'
      - '.github/workflows/feishu-x-project-registry.yml'
  push:
    branches:
      - main
      - 'feat/feishu-x-sam-lineage-registry-*'
    paths:
      - 'automation/feishu/x_project_lineage.py'
      - 'automation/feishu/sync_x_project_registry.py'
      - 'automation/feishu/native_x_dashboard.py'
      - 'automation/feishu/test_x_project_lineage.py'
      - 'automation/feishu/sales_native_home.py'
      - '.github/workflows/feishu-x-project-registry.yml'
  schedule:
    - cron: '9 2,8,14,20 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Read-only plan or apply X tables/dashboard'
        type: choice
        options: [plan, apply]
        default: plan
permissions:
  contents: read
concurrency:
  group: feishu-x-sam-lineage
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check schema and source identity regressions
        run: |
          python3 -m py_compile automation/feishu/x_project_lineage.py
          python3 -m py_compile automation/feishu/sync_x_project_registry.py
          python3 -m py_compile automation/feishu/native_x_dashboard.py
          python3 -m unittest discover -s automation/feishu -p 'test_x_project_lineage.py' -v
  sync:
    needs: offline
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 42
    env:
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_BASE_APP_TOKEN: ${{ vars.FEISHU_SALES_BASE_APP_TOKEN }}
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
      FEISHU_X_BRIDGE_MODE: ${{ (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && 'apply' || (github.event_name == 'workflow_dispatch' && inputs.mode || 'plan') }}
      FEISHU_X_DASHBOARD_MODE: ${{ (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && 'apply' || (github.event_name == 'workflow_dispatch' && inputs.mode || 'plan') }}
      FEISHU_PORTAL_MODE: ${{ (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && 'apply' || (github.event_name == 'workflow_dispatch' && inputs.mode || 'plan') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only Google Sheets dependencies
        run: python3 -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3'
      - name: Reconcile source lineage and sync only dedicated X Base tables
        run: python3 automation/feishu/sync_x_project_registry.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
        if: env.FEISHU_X_BRIDGE_MODE == 'apply'
      - name: Install official Lark CLI
        if: env.FEISHU_X_BRIDGE_MODE == 'apply'
        run: npm install --global '@larksuite/cli@1.0.98'
      - name: Configure ephemeral Feishu bot identity
        if: env.FEISHU_X_BRIDGE_MODE == 'apply'
        run: |
          printf '%s' "$FEISHU_APP_SECRET" | lark-cli profile add --name x-sam-registry --app-id "$FEISHU_APP_ID" --brand feishu --app-secret-stdin
          lark-cli profile use x-sam-registry
      - name: Create/update X-specific native dashboard
        if: env.FEISHU_X_BRIDGE_MODE == 'apply'
        run: python3 automation/feishu/native_x_dashboard.py
      - name: Add native Feishu Sales Home navigation routes
        if: env.FEISHU_X_BRIDGE_MODE == 'apply'
        run: python3 automation/feishu/sales_native_home.py
