name: Kalman Market Daily Time Indicator Missingness Audit

on:
  schedule:
    # Following research market refresh; Tue-Sat 03:20 UTC (12:20 KST).
    - cron: '20 3 * * 2-6'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/kalman_market_missingness/**'
      - '.github/workflows/kalman-market-missingness-audit.yml'
  pull_request:
    paths:
      - 'research/kalman_market_missingness/**'
      - '.github/workflows/kalman-market-missingness-audit.yml'

permissions:
  contents: read
concurrency:
  group: kalman-market-missingness-audit
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q 'pandas>=2.2,<3' 'numpy>=2,<3' 'exchange-calendars>=4.7'
      - run: python -m unittest discover -s research/kalman_market_missingness -p 'test_*.py' -v
      - run: python -m compileall -q research/kalman_market_missingness
  audit:
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned audit dependencies
        run: |
          python -m pip install -q 'pandas>=2.2,<3' 'numpy>=2,<3' 'pyarrow>=17' 'exchange-calendars>=4.7' google-auth google-api-python-client
      - name: Fetch private research ZIP read-only
        env:
          CKD_DRIVE_SA_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
          GDRIVE_SA_JSON_B64: ${{ secrets.GDRIVE_SA_JSON_B64 }}
        run: |
          python research/kalman_market_missingness/fetch_private_zip.py \
            --file-id 1aUhvIAsE2x2-LuKv5nSxmDGX0Uo4mqYd \
            --out "$RUNNER_TEMP/research_source.zip"
      - name: Audit market and FRED time-series missingness (dynamic as-of)
        run: |
          python research/kalman_market_missingness/audit_missingness.py \
            --zip "$RUNNER_TEMP/research_source.zip" \
            --out outputs/kalman_market_missingness \
            --asof auto
      - name: Diagnose USDKRW OHLC and FRED FX gaps (research only)
        run: |
          python research/kalman_market_missingness/diagnose_quality.py \
            --zip "$RUNNER_TEMP/research_source.zip" \
            --out outputs/kalman_market_missingness
      - name: Publish metadata only; never licensed price values
        uses: actions/upload-artifact@v4
        with:
          name: kalman-market-indicator-gap-audit
          path: outputs/kalman_market_missingness/*
          retention-days: 45
          if-no-files-found: error