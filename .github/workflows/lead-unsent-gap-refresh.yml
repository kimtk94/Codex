name: Lead Personal Sent Audit (SFDC + QQ)

on:
  workflow_dispatch:
    inputs:
      apply_snapshot:
        description: 'Refresh exact personal sent-mail evidence (never send mail or write SFDC)'
        type: boolean
        default: false
  workflow_run:
    workflows: ['SFDC Three Report Mail Digestion']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'automation/css/lead_unsent_gap_refresh.py'
      - 'automation/css/test_lead_unsent_gap_refresh.py'
      - 'automation/css/lead_my_sent_refresh.py'
      - 'automation/css/test_lead_my_sent_refresh.py'
      - '.github/workflows/lead-unsent-gap-refresh.yml'

permissions:
  contents: read

concurrency:
  group: personal-lead-sent-qq-review
  cancel-in-progress: false

jobs:
  audit-and-review:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 18
    env:
      NBA_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
      LEAD_PERSONAL_APPLY: "${{ ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') || (github.event_name == 'push' && github.event.head_commit.message == 'deploy(leads): apply validated personal-only audit snapshot') || (github.event_name == 'workflow_dispatch' && inputs.apply_snapshot == true)) && 'true' || 'false' }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google Sheets dependencies
        run: python -m pip install 'google-api-python-client>=2.0,<3' 'google-auth>=2.20,<3'
      - name: Verify personal-only Lead sent audit safety
        run: |
          python -m py_compile automation/css/lead_my_sent_refresh.py
          python -m unittest discover -s automation/css -p 'test_lead_my_sent_refresh.py' -v
      - name: Refresh personal-only sent evidence (no CRM or email writes)
        run: python automation/css/lead_my_sent_refresh.py
      - name: Refresh verified QQ reply evidence after successful Report
        if: github.event_name == 'workflow_run'
        env:
          NBA_REPLY_DASHBOARD_WRITE: 'true'
        run: python automation/css/nba_mail_evidence_audit.py
      - name: Refresh NBA Pool from just-verified personal sent evidence
        if: github.event_name == 'workflow_run'
        env:
          NBA_DRY_RUN: 'false'
        run: |
          python automation/css/nba_refresh_pool.py
      - name: Append stable checkbox identities after NBA readback
        if: github.event_name == 'workflow_run'
        env:
          NBA_DRY_RUN: 'false'
        run: |
          python automation/css/nba_sync_checkbox_ids.py
      - name: Publish review status
        if: always()
        shell: bash
        env:
          JOB_RESULT: ${{ job.status }}
        run: |
          {
            echo '## Lead Personal Sent Audit'
            echo "- Result: ${JOB_RESULT}"
            echo "- Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo '- Output tab: Lead My Sent Audit (personal sender only); First Contact/Prior Contact/Qualified views use formulas.'
            echo '- NO_PERSONAL_OUTBOUND_EVIDENCE is not proof of no phone, BCC or in-person contact.'
            echo '- No outbound email, SFDC write, or Lead decision edits.'
          } >> "${GITHUB_STEP_SUMMARY}"
