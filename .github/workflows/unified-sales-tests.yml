name: Unified Sales Automation Smoke Tests
on:
  pull_request:
    paths:
      - 'automation/css_mail/**'
      - 'automation/feishu/**'
      - '.github/workflows/unified-sales-tests.yml'
  push:
    branches: [main]
    paths:
      - 'automation/css_mail/**'
      - 'automation/feishu/**'
      - '.github/workflows/unified-sales-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile all new automation modules
        run: |
          python3 -m py_compile automation/css_mail/unified_followup_sync.py automation/css_mail/followup_priority.py automation/css_mail/sfdc_quote_validation.py automation/feishu/project_status_sync.py
      - name: Offline regression test
        run: python3 automation/css_mail/test_unified_followup.py
