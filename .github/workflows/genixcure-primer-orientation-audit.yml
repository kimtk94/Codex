name: Genixcure Primer Orientation Audit CI
on:
  push:
    paths:
      - 'analysis/genixcure/Genixcure_Primer_Orientation_Audit.py'
      - '.github/workflows/genixcure-primer-orientation-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  orientation-audit-self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify weighted reverse-complement grouping
        run: python analysis/genixcure/Genixcure_Primer_Orientation_Audit.py --self-test
