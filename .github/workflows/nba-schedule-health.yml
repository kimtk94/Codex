name: NBA Schedule Health Check
on:
  schedule:
    - cron: '35 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/css/nba_schedule_health.py'
      - 'automation/css/test_nba_schedule_health.py'
      - '.github/workflows/nba-schedule-health.yml'

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: nba-schedule-health
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s automation/css -p test_nba_schedule_health.py
      - name: Check scheduled run and verified sheet write
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python automation/css/nba_schedule_health.py
