name: QQ MIME Shape Probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/css_mail/imap_mime_shape_probe.py'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 10
    env:
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
      CSS_QQ_MAIL_ADDRESS: ${{ secrets.CSS_QQ_MAIL_ADDRESS }}
      CSS_QQ_MAIL_AUTH_CODE: ${{ secrets.CSS_QQ_MAIL_AUTH_CODE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-auth requests
      - run: python automation/css_mail/imap_mime_shape_probe.py
