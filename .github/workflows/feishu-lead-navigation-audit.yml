name: Feishu Lead Navigation Read-Only Audit
on:
  pull_request:
    paths:
      - 'automation/feishu/lead_navigation_audit.py'
      - '.github/workflows/feishu-lead-navigation-audit.yml'
  push:
    branches: [main]
    paths:
      - 'automation/feishu/lead_navigation_audit.py'
      - '.github/workflows/feishu-lead-navigation-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 15
    env:
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'google-api-python-client>=2,<3' 'google-auth>=2,<3' 'python-dateutil>=2.9,<3'
      - run: python -m py_compile automation/feishu/lead_navigation_audit.py
      - name: Verify all protected view identities, recent year filter, and hidden fields
        run: python automation/feishu/lead_navigation_audit.py
