name: Novogene CSS Real Google Sheet Read Edit Race Canary

on:
  push:
    branches:
      - 'audit/novogene-css-sif-staging-20261014'
    paths:
      - '.github/workflows/novogene-css-real-sheet-edit-race.yml'
      - 'css-upgrade/staging-20261014/real_sheet_edit_race_canary.py'
      - 'css-upgrade/staging-20261014/manual_mail_overlap_regression.py'
      - 'css-upgrade/staging-20261014/novogene_sif_atomic_auto_skip.patch'
      - 'css-upgrade/staging-20261014/novogene_css_hold_replay_guard.patch'
      - 'css-upgrade/staging-20261014/novogene_css_one_shot_receipts.patch'
      - 'css-upgrade/staging-20261014/novogene_css_snapshot_conflict_guard.patch'
      - 'css-upgrade/staging-20261014/novogene_sif_portfolio_visibility.patch'
      - 'css-upgrade/staging-20261014/novogene_sif_independent_actions.patch'
      - 'css-upgrade/staging-20261014/novogene_sif_manual_override_collision.patch'

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify SSH configuration
        env:
          SSH_HOST: ${{ secrets.SERVER_SSH_HOST }}
          SSH_USER: ${{ secrets.SERVER_SSH_USER }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ] || [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::Missing SSH config"; exit 1
          fi
          install -m 700 -d "$HOME/.ssh"
          python3 - <<'PY'
          import os
          from pathlib import Path
          raw = os.environ["SSH_KEY"].strip()
          if "\\n" in raw and "\n" not in raw:
              raw = raw.replace("\\n","\n")
          raw=raw.replace("\r\n","\n").replace("\r","\n")
          if not raw.startswith(("-----BEGIN OPENSSH PRIVATE KEY-----","-----BEGIN RSA PRIVATE KEY-----","-----BEGIN EC PRIVATE KEY-----")):
              raise SystemExit("SSH_KEY_FORMAT_INVALID")
          Path.home().joinpath(".ssh/server_key").write_text(raw+"\n")
          PY
          chmod 600 "$HOME/.ssh/server_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -P "" -f "$HOME/.ssh/server_key" > /dev/null 2>&1 || exit 1
      - name: Test real synthetic Google Sheet edits after first/second snapshot, never production
        env:
          SSH_HOST: ${{ secrets.SERVER_SSH_HOST }}
          SSH_USER: ${{ secrets.SERVER_SSH_USER }}
        run: |
          PREFIX="/tmp/css-real-gsheet-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -i "$HOME/.ssh/server_key" "$SSH_USER@$SSH_HOST" "rm -f ${PREFIX}.py ${PREFIX}.helper.py ${PREFIX}.p1 ${PREFIX}.p2 ${PREFIX}.p3 ${PREFIX}.p4 ${PREFIX}.p5 ${PREFIX}.p6 ${PREFIX}.p7 ${PREFIX}.p8" >/dev/null 2>&1 || true' EXIT
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -o IdentitiesOnly=yes -i "$HOME/.ssh/server_key" \
            "css-upgrade/staging-20261014/novogene_sif_history_candidate.patch" "$SSH_USER@$SSH_HOST:${PREFIX}.p1"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -o IdentitiesOnly=yes -i "$HOME/.ssh/server_key" \
            "css-upgrade/staging-20261014/novogene_sif_manual_override_collision.patch" "$SSH_USER@$SSH_HOST:${PREFIX}.p2"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -o IdentitiesOnly=yes -i "$HOME/.ssh/server_key" \
            "css-upgrade/staging-20261014/novogene_sif_portfolio_visibility.patch" "$SSH_USER@$SSH_HOST:${PREFIX}.p3"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -o IdentitiesOnly=yes -i "$HOME/.ssh/server_key" \
            "css-upgrade/staging-20261014/novogene_sif_independent_actions.patch" "$SSH_USER@$SSH_HOST:${PREFIX}.p4"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -o IdentitiesOnly=yes -i "$HOME/.ssh/server_key" \
            "css-upgrade/staging-20261014/novogene_sif_atomic_auto_skip.patch" "$SSH_USER@$SSH_HOST:${PREFIX}.p5"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -o IdentitiesOnly=yes -i "$HOME/.ssh/server_key" \
            "css-upgrade/staging-20261014/novogene_css_hold_replay_guard.patch" "$SSH_USER@$SSH_HOST:${PREFIX}.p6"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -o IdentitiesOnly=yes -i "$HOME/.ssh/server_key" \
            "css-upgrade/staging-20261014/novogene_css_one_shot_receipts.patch" "$SSH_USER@$SSH_HOST:${PREFIX}.p7"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -o IdentitiesOnly=yes -i "$HOME/.ssh/server_key" \
            "css-upgrade/staging-20261014/novogene_css_snapshot_conflict_guard.patch" "$SSH_USER@$SSH_HOST:${PREFIX}.p8"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -o IdentitiesOnly=yes -i "$HOME/.ssh/server_key" \
            "css-upgrade/staging-20261014/real_sheet_edit_race_canary.py" "$SSH_USER@$SSH_HOST:${PREFIX}.py"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -o IdentitiesOnly=yes -i "$HOME/.ssh/server_key" \
            "css-upgrade/staging-20261014/manual_mail_overlap_regression.py" "$SSH_USER@$SSH_HOST:${PREFIX}.helper.py"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 \
            -o IdentitiesOnly=yes -i "$HOME/.ssh/server_key" "$SSH_USER@$SSH_HOST" \
            "/home/taehoon/services/novogene-css/.venv/bin/python ${PREFIX}.py --source /home/taehoon/services/novogene-css/app/Novogene_Mail_CSS_DashBoard_server.py --fixture-script ${PREFIX}.helper.py --patch ${PREFIX}.p1 --patch ${PREFIX}.p2 --patch ${PREFIX}.p3 --patch ${PREFIX}.p4 --patch ${PREFIX}.p5 --patch ${PREFIX}.p6 --patch ${PREFIX}.p7 --patch ${PREFIX}.p8"
