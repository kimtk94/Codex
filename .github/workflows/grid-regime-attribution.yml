name: Grid Regime Four-Arm Attribution (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    if: github.ref == 'refs/heads/feat/rea-isolated-pilot-20261017'
    runs-on: ubuntu-24.04
    environment: TaehoonServer
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Compare 2025 four causal regime policies on server read-only data
        env:
          SSH_HOST: ${{ secrets.SERVER_SSH_HOST }}
          SSH_USER: ${{ secrets.SERVER_SSH_USER }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
        run: |
          python3 - <<'PY'
          import os,json,shlex,base64,hashlib,subprocess
          from pathlib import Path
          ssh=Path.home()/'.ssh'
          ssh.mkdir(mode=0o700,exist_ok=True)
          key=os.environ['SSH_KEY'].strip().replace('\\n','\n').replace('\r\n','\n').replace('\r','\n')
          if not key.startswith(('-----BEGIN OPENSSH PRIVATE KEY-----','-----BEGIN RSA PRIVATE KEY-----','-----BEGIN EC PRIVATE KEY-----')):
              raise SystemExit('INVALID_SSH_KEY')
          (ssh/'server_key').write_text(key+'\n')
          (ssh/'server_key').chmod(0o600)
          (ssh/'known_hosts').write_text(os.environ['SSH_KNOWN_HOSTS'].strip()+'\n')
          (ssh/'known_hosts').chmod(0o600)
          subprocess.run(['ssh-keygen','-y','-P','','-f',str(ssh/'server_key')],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          src=Path('research/upbit_eth/grid_event_v3.py').read_text()
          worker=Path('experiments/rea/grid_regime_attribution_ssh_worker.py').read_bytes()
          remote='import base64;exec(base64.b64decode('+repr(base64.b64encode(worker).decode())+'))'
          ssh_cmd=['ssh','-o','BatchMode=yes','-o','StrictHostKeyChecking=yes','-o','ConnectTimeout=12','-o','ServerAliveInterval=15','-o','ServerAliveCountMax=8','-o','ForwardAgent=no','-o','IdentitiesOnly=yes','-i',str(ssh/'server_key'),os.environ['SSH_USER']+'@'+os.environ['SSH_HOST'],'python3 -c '+shlex.quote(remote)]
          module=Path('experiments/rea/grid_regime_attribution.py').read_text()
          results=[]
          for spacing in (.01,.015):
              entry={'spacing':spacing,'results':{}}
              for policy in ('baseline','inhibit_new_buys','cancel_resting_buys','reseed_on_up'):
                  payload=dict(db='~/research/upbit_eth/krw_eth_1m.sqlite3',source=src,module=module,policy=policy,year=2025,spacing=spacing,levels=100,capital=1_000_000,fee=.001)
                  p=subprocess.run(ssh_cmd,input=json.dumps(payload),text=True,capture_output=True,timeout=240)
                  if p.returncode:
                      print('REGIME_ATTRIBUTION_FAILED='+str(spacing)+'/'+policy+':'+p.stderr[-1000:])
                      raise SystemExit(p.returncode)
                  data=json.loads(p.stdout.strip())
                  if not data.get('read_only') or policy not in data.get('results',{}):
                      raise SystemExit('REGIME_RESULT_INVALID')
                  entry['results'][policy]=data['results'][policy]
                  print('ATTRIBUTION_ARM='+json.dumps({'spacing':spacing,'policy':policy,'return_pct':data['results'][policy]['return_pct'],'mdd_pct':data['results'][policy]['mdd_pct']},sort_keys=True),flush=True)
              results.append(entry)
          out=Path(os.environ['RUNNER_TEMP'])/'grid_regime_attribution_2025.json'
          out.write_text(json.dumps(results,ensure_ascii=False,indent=2))
          print('REGIME_ATTRIBUTION_READ_ONLY_PASS=true')
          PY
      - name: Upload read-only aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grid-regime-attribution-2025
          path: ${{ runner.temp }}/grid_regime_attribution_2025.json
          if-no-files-found: error
          retention-days: 7
