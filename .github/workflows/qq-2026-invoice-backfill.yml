name: QQ Historical Tax Invoice Backfill 2026
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/qq-2026-invoice-backfill.yml'
      - 'automation/css_mail/qq_historical_invoice_backfill_2026_safe.py'
      - 'automation/css_mail/qq_safe_backfill_ingest.py'
      - 'automation/css_mail/qq_cursor_checkpoint_policy.py'
      - 'automation/css_mail/test_qq_safe_backfill_ingest.py'
      - 'automation/css_mail/test_qq_writer_integration.py'
  schedule:
    - cron: '31 1 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/qq-2026-invoice-backfill.yml'
      - 'automation/css_mail/qq_historical_invoice_backfill_2026_safe.py'
      - 'automation/css_mail/qq_safe_backfill_ingest.py'
      - 'automation/css_mail/qq_cursor_checkpoint_policy.py'
      - 'automation/css_mail/test_qq_safe_backfill_ingest.py'
permissions:
  contents: read
concurrency:
  group: qq-historical-invoice-backfill-shared-2026
  cancel-in-progress: false
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated fake-client test requirements
        run: python3 -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3'
      - name: Prove safe cursor and no writes in synthetic PREVIEW
        run: |
          python3 -m unittest automation.css_mail.test_qq_cursor_checkpoint_policy -v
          python3 -m unittest automation.css_mail.test_qq_safe_backfill_ingest -v
          python3 automation/css_mail/test_qq_writer_integration.py

  safe-preview:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 35
    env:
      CSS_QQ_MAIL_ADDRESS: ${{ secrets.CSS_QQ_MAIL_ADDRESS }}
      CSS_QQ_MAIL_AUTH_CODE: ${{ secrets.CSS_QQ_MAIL_AUTH_CODE }}
      CKD_DRIVE_SA_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
      BACKFILL_YEAR: '2026'
      BACKFILL_TAB: 'QQ 2026 Invoice Backfill'
      BACKFILL_MAX_MATCHES: '4500'
      BACKFILL_WRITE_MODE: 'PREVIEW'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only preflight dependencies
        run: python3 -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3'
      - name: Validate source gate with synthetic tests
        run: |
          python3 -m unittest automation.css_mail.test_qq_cursor_checkpoint_policy -v
          python3 -m unittest automation.css_mail.test_qq_safe_backfill_ingest -v
          python3 automation/css_mail/test_qq_writer_integration.py
      - name: Check actual QQ source and fail closed before stage writes
        run: |
          python3 - <<'PY'
          import json,re,subprocess,sys
          cmd=[sys.executable,"automation/css_mail/qq_historical_invoice_backfill_2026_safe.py"]
          completed=subprocess.run(cmd,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
          allowed={"KNOWN_UID_WITH_VALID_EVIDENCE",
                   "ORIGINAL_ISSUED_PROOF_PERSISTED",
                   "ORIGINAL_NONOFFICIAL_HEADER_VERIFIED",
                   "FETCH_FAILED","ORIGINAL_HEADER_UNAVAILABLE",
                   "MIME_PARSER_UNRESOLVED","AMOUNT_CONFLICT",
                   "ARRIVAL_VALID_ARRIVAL_DATE","ARRIVAL_UNSUPPORTED_FORMAT",
                   "ARRIVAL_TOKEN_ABSENT","ARRIVAL_FETCH_ERROR"}
          for line in completed.stdout.splitlines():
              if line.startswith("QQ_BACKFILL_PARSER_DIAGNOSTIC "):
                  raw=line.split(" fallback_verified=",1)[0].split(
                      "QQ_BACKFILL_PARSER_DIAGNOSTIC ",1)[1]
                  try:
                      counters=json.loads(raw)
                      safe={k:int(v) for k,v in counters.items()
                            if k in allowed and isinstance(v,int)}
                      print("QQ_SAFE_PREVIEW_REASON_COUNTS="+
                            json.dumps(safe,sort_keys=True))
                  except (ValueError,TypeError):
                      print("QQ_SAFE_PREVIEW_REASON_REPORT_UNAVAILABLE")
          previews=[line for line in completed.stdout.splitlines()
                    if line.startswith("QQ_BACKFILL_PROOF_FIRST_PREVIEW ")]
          if len(previews)==1:
              values={}
              for name in ("scanned","new_in_memory",
                           "would_update_cursor_folders","blocked",
                           "sheet_writes","cursor_writes"):
                  matched=re.search(r"\b"+name+r"=(\d+)\b",previews[0])
                  if matched:values[name]=int(matched.group(1))
              print("QQ_SAFE_PREVIEW_AGGREGATES="+json.dumps(values,sort_keys=True))
          if (completed.returncode!=2 or len(previews)!=1 or
              "sheet_writes=0 cursor_writes=0" not in previews[0] or
              not re.search(r"\bblocked=0\b",previews[0])):
              print("QQ_SAFE_PREVIEW_HOLD: source, cursor or original MIME requires review")
              sys.exit(1)
          print("QQ_SAFE_PREVIEW_PASS: verified source is eligible for independently gated writer")
          PY

