name: Novogene CSS P0 Runtime Audit (Read Only)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/audit-triggers/css-runtime-p0-*'

permissions:
  contents: read

jobs:
  runtime-audit:
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Configure existing SSH credential without logging secrets
        env:
          SSH_HOST: ${{ secrets.SERVER_SSH_HOST }}
          SSH_USER: ${{ secrets.SERVER_SSH_USER }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          if not all(os.environ.get(k) for k in ('SSH_HOST','SSH_USER','SSH_KEY','SSH_KNOWN_HOSTS')):
              raise SystemExit('REQUIRED_SSH_SECRETS_MISSING')
          base = Path.home() / '.ssh'
          base.mkdir(mode=0o700, exist_ok=True)
          key = os.environ['SSH_KEY'].strip().replace('\\n', '\n').replace('\r\n','\n').replace('\r','\n')
          if not key.startswith(('-----BEGIN OPENSSH PRIVATE KEY-----','-----BEGIN RSA PRIVATE KEY-----','-----BEGIN EC PRIVATE KEY-----')):
              raise SystemExit('INVALID_SSH_KEY_FORMAT')
          path = base / 'server_key'
          path.write_text(key+'\n')
          path.chmod(0o600)
          hosts = base / 'known_hosts'
          hosts.write_text(os.environ['SSH_KNOWN_HOSTS'].strip()+'\n')
          hosts.chmod(0o600)
          subprocess.run(['ssh-keygen','-y','-P','','-f',str(path)],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,check=True)
          print('EXISTING_SSH_KEY_VALIDATED')
          PY

      - name: Aggregate-only read-only runtime status
        env:
          SSH_HOST: ${{ secrets.SERVER_SSH_HOST }}
          SSH_USER: ${{ secrets.SERVER_SSH_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 \
            -o ForwardAgent=no -o IdentitiesOnly=yes -i "$HOME/.ssh/server_key" \
            "$SSH_USER@$SSH_HOST" 'python3 -' < scripts/css_readonly_runtime_health.py
