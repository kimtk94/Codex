name: Kalman US Cross-Ticker Volume and Aggressor Pilot (Research Only)

on:
  push:
    branches: [research/qld-integrated-regime-20261031]
    paths:
      - '.github/workflows/kalman-us-multisymbol-microstructure.yml'
      - 'research/kalman_integrated_regime/us_multisymbol_microstructure.py'
      - 'research/kalman_integrated_regime/test_us_multisymbol_microstructure.py'
  pull_request:
    paths:
      - '.github/workflows/kalman-us-multisymbol-microstructure.yml'
      - 'research/kalman_integrated_regime/us_multisymbol_microstructure.py'
      - 'research/kalman_integrated_regime/test_us_multisymbol_microstructure.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kalman-us-multi-symbol-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated research-only requirements
        run: python -m pip install --disable-pip-version-check 'pandas>=2.2,<3' 'numpy>=1.26,<3' 'exchange-calendars>=4.7' 'requests>=2.31,<3'
      - name: Validate allowlist, multi-symbol RTH and 20-session volume isolation
        run: |
          python -m unittest research.kalman_integrated_regime.test_us_multisymbol_microstructure -v
          python -m py_compile research/kalman_integrated_regime/us_multisymbol_microstructure.py

  historical-probe:
    needs: tests
    if: github.event_name != 'pull_request'
    environment: TaehoonServer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal isolated research dependencies
        run: python -m pip install --disable-pip-version-check 'pandas>=2.2,<3' 'numpy>=1.26,<3' 'exchange-calendars>=4.7' 'requests>=2.31,<3'
      - name: Probe SPY IWM SMH MU COIN historical SIP for 10 seconds only
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID || secrets.APCA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY || secrets.APCA_API_SECRET_KEY }}
        run: |
          python -m research.kalman_integrated_regime.us_multisymbol_microstructure \
            --symbols SPY,IWM,SMH,MU,COIN \
            --max-symbols 5 --max-pages 12 --stale-ms 1000 --mode probe \
            --out "$RUNNER_TEMP/us_microstructure_pilot.json"
      - name: Archive derived aggregates only; no raw licensed SIP prints or quotes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalman-us-multi-ticker-10s-microstructure
          path: ${{ runner.temp }}/us_microstructure_pilot.json
          retention-days: 21
          if-no-files-found: warn
