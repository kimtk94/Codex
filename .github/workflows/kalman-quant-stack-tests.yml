name: Kalman Quant Stack Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "kalman-toss-gateway/research/quant_stack/**"
      - "kalman-toss-gateway/tests/test_quant_stack.py"
      - "kalman-toss-gateway/tests/test_historical_backfill.py"
      - "kalman-toss-gateway/tests/test_quant_artifact_validation.py"
      - "kalman-toss-gateway/tests/test_qlib_recorder.py"
      - "kalman-toss-gateway/tests/test_pypfopt_portfolio_targets.py"
      - "kalman-toss-gateway/tests/test_riskfolio_benchmarks.py"
      - "kalman-toss-gateway/tests/test_lean_execution_contract.py"
      - "kalman-toss-gateway/tests/test_resume_postprocess.py"
      - "kalman-toss-gateway/scripts/colab_resume_historical.py"
      - "notebooks/Kalman_Historical_Resume_20260913_042850.ipynb"
      - ".github/workflows/kalman-quant-stack-tests.yml"
  push:
    branches:
      - feature/quant-stack-v1-20260912
      - feature/pypfopt-portfolio-target-v1-20260912
      - feature/riskfolio-benchmark-v1-20260912
      - feature/lean-execution-contract-v1-20260912
    paths:
      - "kalman-toss-gateway/research/quant_stack/**"
      - "kalman-toss-gateway/tests/test_quant_stack.py"
      - "kalman-toss-gateway/tests/test_historical_backfill.py"
      - "kalman-toss-gateway/tests/test_quant_artifact_validation.py"
      - "kalman-toss-gateway/tests/test_qlib_recorder.py"
      - "kalman-toss-gateway/tests/test_pypfopt_portfolio_targets.py"
      - "kalman-toss-gateway/tests/test_lean_execution_contract.py"
      - ".github/workflows/kalman-quant-stack-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kalman-toss-gateway

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn pyarrow pytest

      - name: Compile quant stack
        run: |
          python -m compileall -q research/quant_stack

      - name: Run quant stack tests
        run: |
          pytest -q \
            tests/test_quant_stack.py \
            tests/test_historical_backfill.py \
            tests/test_quant_artifact_validation.py \
            tests/test_resume_postprocess.py


  qlib-recorder-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kalman-toss-gateway

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Qlib recorder dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest -r research/quant_stack/requirements-qlib.txt

      - name: Qlib recorder round-trip
        run: |
          pytest -q tests/test_qlib_recorder.py


  pypfopt-portfolio-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kalman-toss-gateway

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyPortfolioOpt dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyarrow -r research/quant_stack/requirements-pypfopt.txt

      - name: PyPortfolioOpt HRP portfolio target round-trip
        run: |
          python -m compileall -q research/quant_stack
          pytest -q tests/test_pypfopt_portfolio_targets.py


  riskfolio-benchmark-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kalman-toss-gateway

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Riskfolio benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r research/quant_stack/requirements-riskfolio.txt

      - name: Riskfolio CVaR / RP / CDaR smoke
        run: |
          python -m compileall -q research/quant_stack
          pytest -q tests/test_riskfolio_benchmarks.py


  lean-execution-contract-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kalman-toss-gateway

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install execution contract test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow pytest

      - name: LEAN-inspired execution contract smoke
        run: |
          python -m compileall -q research/quant_stack
          pytest -q tests/test_lean_execution_contract.py


  resume-colab-basic-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kalman-toss-gateway

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install resume dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas numpy scikit-learn pyarrow python-dotenv -r research/quant_stack/requirements-pypfopt.txt

      - name: Compile resume runner
        run: |
          python -m py_compile scripts/colab_resume_historical.py
          python -m py_compile research/quant_stack/resume_postprocess.py

      - name: Compile Colab notebook cell
        working-directory: ..
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("notebooks/Kalman_Historical_Resume_20260913_042850.ipynb")
          nb = json.loads(path.read_text(encoding="utf-8"))
          assert nb["nbformat"] == 4
          assert len(nb["cells"]) == 1
          cell = nb["cells"][0]
          assert cell["cell_type"] == "code"
          source = "".join(cell["source"])
          assert "\\n" not in source, "literal backslash-n found in notebook source"
          compile(source, str(path), "exec")
          assert "--branch', 'main'" in source
          assert "colab_resume_historical.py" in source
          print("NOTEBOOK_COMPILE_OK")
          PY

      - name: Resume preflight regression tests
        run: |
          pytest -q tests/test_resume_postprocess.py
