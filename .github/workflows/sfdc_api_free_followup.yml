name: SFDC API-free Followup Stage 1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sfdc_api_free_followup.yml'
      - 'automation/sfdc/**'
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sales-weekly-writer
  cancel-in-progress: false
jobs:
  followup:
    environment: TaehoonServer
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SFDC_SOURCE_SHEET_ID: '1753nq7_zX-6ae7srmJryHrFECEG5L9Mjf7JvjrbFxVY'
      SFDC_OUTPUT_SHEET_ID: '1Fo0Tc6PQ3Ek0-33lmegScM_z8ST-ShUYQ0K3kD4PqnI'
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
    steps:
      - uses: actions/checkout@v4
      - name: Check credentials
        id: credentials
        shell: bash
        run: |
          if [ -z "$GCP_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::CKD_DRIVE_SA_JSON is empty or unavailable to this workflow. Configure repository Actions secret and check environment/org access restrictions."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Python
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        if: steps.credentials.outputs.ready == 'true'
        run: python -m pip install 'google-auth>=2.35,<3' 'requests>=2.31,<3'
      - name: Consolidate SFDC Followups
        if: steps.credentials.outputs.ready == 'true'
        run: python automation/sfdc/followup_stage1.py
      - name: Mirror Opportunity and Quotation
        if: steps.credentials.outputs.ready == 'true'
        run: python automation/sfdc/opportunity_quote_mirror.py
      - name: Validate Active Quote Relations
        if: steps.credentials.outputs.ready == 'true'
        run: python automation/sfdc/active_quote_links.py
      - name: Reconcile Opportunity and CSS projects
        if: steps.credentials.outputs.ready == 'true'
        run: python automation/sfdc/project_bridge.py
      - name: Build Weekly SFDC Overview
        if: steps.credentials.outputs.ready == 'true'
        run: python automation/sfdc/weekly_overview.py
      - name: Build SFDC Sales Overview
        if: steps.credentials.outputs.ready == 'true'
        run: python automation/sfdc/sales_overview.py
      - name: Enrich Customer 360 Relations
        if: steps.credentials.outputs.ready == 'true'
        run: python automation/sfdc/customer_360_relations.py
      - name: Build Unified Action Dashboard
        if: steps.credentials.outputs.ready == 'true'
        run: python automation/sfdc/action_dashboard.py
