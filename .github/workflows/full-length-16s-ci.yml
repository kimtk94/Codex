name: Full-Length 16S Pipeline CI

on:
  workflow_dispatch:
  push:
    paths:
      - "full_length_16s/**"
      - ".github/workflows/full-length-16s-ci.yml"
  pull_request:
    paths:
      - "full_length_16s/**"
      - ".github/workflows/full-length-16s-ci.yml"

permissions:
  contents: read

jobs:
  unit-test:
    name: Sample filters and report smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r full_length_16s/requirements.txt pytest
      - name: Validate code compiles
        run: python -m compileall -q full_length_16s/src
      - name: Validate notebook JSON and Python cells
        run: |
          python - <<'PY'
          import json, ast
          from pathlib import Path
          notebooks = sorted(Path("full_length_16s/notebooks").glob("*.ipynb"))
          assert len(notebooks) == 3, f"Only three PC/NC-free Colab notebooks may remain, found {len(notebooks)}"
          required = {("P92","no_controls"),("P92","no_controls_no_three"),("P18","no_controls")}
          observed = set()
          for p in notebooks:
              nb = json.loads(p.read_text(encoding="utf-8"))
              assert nb["nbformat"] == 4 and nb["cells"]
              code_cells = ["".join(cell["source"]) for cell in nb["cells"] if cell["cell_type"] == "code"]
              for index, code in enumerate(code_cells):
                  ast.parse(code, filename=f"{p.name}:cell-{index}")
              if p.name.startswith(("KIST_P92_", "KIST_P18_")):
                  config = code_cells[0]
                  pair = next(((project,variant) for project,variant in required
                               if f'PROJECT = "{project}"' in config and
                               f'RUN_SCENARIO = "{variant}"' in config), None)
                  assert pair is not None, f"Unrecognized project/scenario in {p.name}"
                  expected_count = {'P92':{'no_controls':90,'no_controls_no_three':87}, 'P18':{'no_controls':16}}[pair[0]][pair[1]]
                  assert f'EXPECTED_SAMPLES = {expected_count}' in config, f'{p.name}: wrong expected count'
                  observed.add(pair)
              print(f"PASS: {p.name} ({len(nb['cells'])} cells)")
          assert observed == required, f"Missing variants: {required - observed}"
          for p in notebooks:
              nb = json.loads(p.read_text(encoding="utf-8"))
              cells = ["".join(c["source"]) for c in nb["cells"] if c["cell_type"] == "code"]
              setup = cells[1]
              input_cell = cells[5]
              assert "pageSize=1000,pageToken=token" in setup, f"{p.name}: invalid Drive API pagination"
              assert "page_size=" not in setup and "page_token=" not in setup
              assert "FASTQ_SCRIPT" in setup
              assert "--scenario" in input_cell and "--zip" in input_cell and "--directory" in input_cell
              assert "RUN_NEW_DADA2 = True" in cells[0], f"{p.name}: FASTQ inference must be enabled"
              assert "INSTALL_QIIME = True" in cells[0], f"{p.name}: QIIME install missing"
              assert "FORWARD_PRIMER_5TO3" in cells[0]
              assert 'FORWARD_PRIMER_5TO3 = "AGRGTTYGATYMTGGCTCAG"' in cells[0], f"{p.name}: incorrect 27F"
              assert 'REVERSE_PRIMER_5TO3 = "GYTACCTTGTTACGACTT"' in cells[0], f"{p.name}: incorrect 1492R"
              assert 'REVERSE_PRIMER_5TO3' in cells[6], f"{p.name}: missing reverse primer in DADA2"
          print("PASS: all three notebooks use FASTQ-only input and corrected Drive API")
          PY
      - name: Test exclusion scenarios
        run: python -m pytest -q full_length_16s/tests
      - name: Validate 27F/1492R runner and shell syntax
        run: |
          bash -n full_length_16s/scripts/run_qiime2.sh
          python - <<'PY'
          from pathlib import Path
          s=Path("full_length_16s/scripts/run_qiime2.sh").read_text()
          for flag in ("--p-front", "--p-adapter", "--o-base-transition-stats", "--p-n-reads-learn 100000"):
              assert flag in s, f"Missing QIIME2 CCS option {flag}"
          assert 'AGRGTTYGATYMTGGCTCAG' in s
          assert 'GYTACCTTGTTACGACTT' in s
          print("PASS: lab primers and QIIME 2 2026.10 required outputs")
          PY
