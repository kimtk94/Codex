name: Feishu Sales SIF Invoice Weekly KPI
on:
  pull_request:
    paths:
      - 'automation/feishu/sales_metrics_sync.py'
      - 'automation/feishu/approval_mail_weekly_bridge.py'
      - 'automation/feishu/test_approval_mail_weekly_bridge.py'
      - 'automation/feishu/project_progress_board.py'
      - 'automation/feishu/project_settlement.py'
      - 'automation/feishu/latest_payment_bridge.py'
      - 'automation/feishu/test_latest_payment_bridge.py'
      - 'automation/feishu/test_project_progress_board.py'
      - 'automation/feishu/test_sales_metrics_sync.py'
      - 'automation/feishu/quote_process_amount.py'
      - 'automation/feishu/weekly_quote_review.py'
      - 'automation/feishu/test_weekly_quote_review.py'
      - 'automation/feishu/weekly_quote_review_layout.py'
      - 'automation/feishu/test_weekly_quote_review_layout.py'
      - 'automation/sfdc/source_freshness_guard.py'
      - 'automation/sfdc/test_source_freshness_guard.py'
      - 'automation/feishu/test_quote_process_amount.py'
      - '.github/workflows/feishu-sales-metrics.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan read-only or apply KPI pages and source-backed rows'
        type: choice
        options: [plan, apply]
        default: plan
      scope:
        description: 'Select KPI domain; Quote does not call Monthly Revenue authority'
        type: choice
        options: [all, quote, operations]
        default: all
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('feishu-sales-metrics-pr-{0}', github.event.pull_request.number) || 'feishu-sales-metrics-sync' }}
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source read client
        run: python3 -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3'
      - name: Test SIF evidence, invoice VAT and weekly quotes
        run: |
          python3 -m unittest discover -s automation/sfdc -p 'test_source_freshness_guard.py' -v
          python3 -m unittest discover -s automation/feishu -p 'test_quote_process_amount.py' -v
          python3 -m unittest discover -s automation/feishu -p 'test_approval_mail_weekly_bridge.py' -v
          python3 -m unittest discover -s automation/feishu -p 'test_weekly_quote_review.py' -v
          python3 -m unittest discover -s automation/feishu -p 'test_weekly_quote_review_layout.py' -v
          python3 -m unittest discover -s automation/feishu -p 'test_sales_metrics_sync.py' -v
          python3 -m unittest discover -s automation/feishu -p 'test_project_progress_board.py' -v
          python3 -m unittest discover -s automation/feishu -p 'test_latest_payment_bridge.py' -v
      - name: Validate sync syntax
        run: python3 -m py_compile automation/feishu/sales_metrics_sync.py automation/feishu/quote_process_amount.py automation/feishu/weekly_quote_review.py automation/feishu/weekly_quote_review_layout.py automation/feishu/project_progress_board.py automation/feishu/project_settlement.py automation/feishu/latest_payment_bridge.py
  sync:
    needs: tests
    if: ${{ github.event_name != 'pull_request' && needs.tests.result == 'success' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')) }}
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 28
    env:
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_BASE_APP_TOKEN: ${{ vars.FEISHU_SALES_BASE_APP_TOKEN }}
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
      FEISHU_METRIC_MODE: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && 'apply' || (github.event_name == 'workflow_dispatch' && inputs.mode || 'plan') }}
      FEISHU_METRIC_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'all' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Google Sheets read dependencies
        run: python3 -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3'
      - name: Gate all Feishu KPI writes on current 09/12/17 SFDC source
        run: python3 automation/sfdc/source_freshness_guard.py
      - name: Sync source-verified KPIs to new Feishu Sales Base
        run: python3 automation/feishu/sales_metrics_sync.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Feishu native view layout CLI
        run: npm install --global '@larksuite/cli@1.0.99'
      - name: Authenticate Feishu CLI for Quote list layout
        run: |
          printf '%s' "$FEISHU_APP_SECRET" | lark-cli profile add --name quote-review-layout --app-id "$FEISHU_APP_ID" --brand feishu --app-secret-stdin
          lark-cli profile use quote-review-layout
      - name: Save and verify Quote list filters groups and sorting
        run: python3 automation/feishu/weekly_quote_review_layout.py
