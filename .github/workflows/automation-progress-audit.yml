name: Automation Progress Audit (read-only)
on:
  workflow_dispatch:
  schedule:
    - cron: '15 0 * * *'
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  progress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s automation/progress -p 'test_*.py'
      - name: Optional read-only Sheets client
        run: python -m pip install google-auth requests
      - name: Generate read-only audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CKD_DRIVE_SA_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
        run: python automation/progress/tracker.py --out-dir progress-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automation-progress-audit
          path: progress-audit/
          retention-days: 30
