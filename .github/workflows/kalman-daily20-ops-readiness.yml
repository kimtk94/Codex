name: Kalman Daily20 Operations and Research HOLD Scorecard (Read Only)

on:
  workflow_run:
    workflows:
      - Kalman Daily 20 Research (No Server / No Live)
    types: [completed]
  schedule:
    - cron: '15 4 * * 2-6'
  workflow_dispatch:
  pull_request:
    paths:
      - automation/kalman_ops_scorecard/ops_readiness.py
      - automation/kalman_ops_scorecard/test_ops_readiness.py
      - .github/workflows/kalman-daily20-ops-readiness.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: kalman-daily20-ops-readiness-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  audit:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only offline contracts (no token used)
        run: |
          cd automation/kalman_ops_scorecard
          python -m unittest -v test_ops_readiness.py
          python -m py_compile ops_readiness.py
      - name: PR integration check of a real main-run GitHub job-log download
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python automation/kalman_ops_scorecard/ops_readiness.py \
            --out output/daily20/ops_readiness_pr_smoke.json
      - name: Summarize latest main Daily20 research run (never promote strategy)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ -n "$SOURCE_RUN_ID" ]; then
            python automation/kalman_ops_scorecard/ops_readiness.py \
              --run-id "$SOURCE_RUN_ID" \
              --out output/daily20/ops_readiness.json
          else
            python automation/kalman_ops_scorecard/ops_readiness.py \
              --out output/daily20/ops_readiness.json
          fi
      - name: Persist audit-only status to GitHub artifacts
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: kalman-daily20-ops-readiness
          path: output/daily20/ops_readiness.json
          if-no-files-found: warn
          retention-days: 90
