name: SFDC Contact Lookup Source Readiness

on:
  workflow_dispatch:
  schedule:
    - cron: '15 0,3,8 * * 1-5' # 09:15, 12:15, 17:15 KST on weekdays

permissions:
  contents: read

concurrency:
  group: sfdc-contact-lookup-readiness
  cancel-in-progress: false

jobs:
  read-only-source-gate:
    if: github.ref == 'refs/heads/main'
    environment: TaehoonServer
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source-gate decisions on synthetic data
        run: python -m unittest discover -s automation/sfdc -p 'test_contact_lookup_source_gate.py' -v
      - name: Install read-only Google Sheets dependencies
        run: python -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3'
      - name: Audit source identity and freshness (no CRM or Sheet writes)
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
        run: python automation/sfdc/contact_lookup_source_gate.py
