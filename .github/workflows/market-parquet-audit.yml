name: Kalman Parquet History QA
on:
  pull_request:
    paths:
      - 'research/market_tool_lab/parquet_history_audit.py'
      - 'research/market_tool_lab/test_parquet_history_audit.py'
      - '.github/workflows/market-parquet-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pandas>=2,<3' 'pyarrow>=17,<24'
      - run: python -m unittest discover -s research/market_tool_lab -p test_parquet_history_audit.py -v
