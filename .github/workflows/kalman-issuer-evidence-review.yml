name: Kalman Issuer Evidence Review (PR Only)
on:
  pull_request:
    paths:
      - 'automation/kalman_issuer_evidence_review/**'
      - '.github/workflows/kalman-issuer-evidence-review.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline evidence contracts
        run: |
          cd automation/kalman_issuer_evidence_review
          python -m unittest -v test_evidence_review.py test_independent_review.py test_cache_rehearsal.py test_drive_backup_reader.py
          python -m py_compile evidence_review.py independent_review.py cache_rehearsal.py drive_backup_reader.py
  incident-metadata:
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: contracts
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read pinned failed-run artifact; print metadata only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/kimtk94/Codex/actions/artifacts/15260102752/zip > "$RUNNER_TEMP/issuer-incident.zip"
          python automation/kalman_issuer_evidence_review/evidence_review.py "$RUNNER_TEMP/issuer-incident.zip" --sha256 ca733ef791d264dcf8f194d00af48d17993d49f02061426ec6fec1eeebe3f60f
      - name: Independently re-extract prior and current issuer evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install 'pypdf==6.21.4'
          gh api repos/kimtk94/Codex/actions/artifacts/15204783619/zip > "$RUNNER_TEMP/issuer-prior.zip"
          python automation/kalman_issuer_evidence_review/independent_review.py "$RUNNER_TEMP/issuer-incident.zip" "$RUNNER_TEMP/issuer-prior.zip" --current-sha256 ca733ef791d264dcf8f194d00af48d17993d49f02061426ec6fec1eeebe3f60f --prior-sha256 956a7a17c124e98277588c333386634ac66119952f18fcc0a2454b9cdbdd4fe6
      - name: Rehearse exact prior evidence in memory (no writer)
        run: |
          python automation/kalman_issuer_evidence_review/cache_rehearsal.py "$RUNNER_TEMP/issuer-incident.zip" "$RUNNER_TEMP/issuer-prior.zip"
