name: R9 News Research

on:
  push:
    branches:
      - research/r9-news-pit-20260922
    paths:
      - "kalman-toss-gateway/research/r9_news_ngram_bq.py"
      - "kalman-toss-gateway/research/r9_news_neon_store.py"
      - "kalman-toss-gateway/research/r9_news_neon_schema.sql"
      - "kalman-toss-gateway/research/R9_NEWS_NGRAM_SPEC.md"
      - "kalman-toss-gateway/research/R9_1_NGRAM_ABLATION_SPEC.md"
      - "kalman-toss-gateway/research/r9_news_features.py"
      - "kalman-toss-gateway/research/r9_1_ngram_ablation.py"
      - "kalman-toss-gateway/scripts/run_r9_news_backfill_to_neon.sh"
      - "kalman-toss-gateway/scripts/recover_r9_news_existing_job_to_neon.sh"
      - "kalman-toss-gateway/scripts/run_r9_1_ngram_ablation.sh"
      - "kalman-toss-gateway/scripts/apply_r9_news_neon_schema.sh"
      - "kalman-toss-gateway/tests/test_r9_news_ngram_bq.py"
      - "kalman-toss-gateway/tests/test_r9_news_neon_store.py"
      - "kalman-toss-gateway/tests/test_r9_news_features.py"
      - ".github/workflows/r9-news-research.yml"
  pull_request:
    paths:
      - "kalman-toss-gateway/research/r9_news_ngram_bq.py"
      - "kalman-toss-gateway/research/r9_news_neon_store.py"
      - "kalman-toss-gateway/research/r9_news_neon_schema.sql"
      - "kalman-toss-gateway/scripts/run_r9_news_backfill_to_neon.sh"
      - "kalman-toss-gateway/scripts/recover_r9_news_existing_job_to_neon.sh"
      - "kalman-toss-gateway/tests/test_r9_news_ngram_bq.py"
      - "kalman-toss-gateway/tests/test_r9_news_neon_store.py"

jobs:
  r9-news-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kalman-toss-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pandas pytest python-dotenv scikit-learn==1.6.1 joblib
      - name: Compile R9 modules
        run: |
          python -m py_compile research/r9_news_ngram_bq.py research/r9_news_neon_store.py research/r9_news_features.py research/r9_1_ngram_ablation.py
          bash -n scripts/run_r9_news_backfill_to_neon.sh
          bash -n scripts/recover_r9_news_existing_job_to_neon.sh
          bash -n scripts/run_r9_1_ngram_ablation.sh
          bash -n scripts/apply_r9_news_neon_schema.sh
      - name: Import R9.1 runner
        run: PYTHONPATH=research python -c "import r9_1_ngram_ablation"
      - name: Run R9 tests
        run: |
          pytest -q tests/test_r9_news_ngram_bq.py tests/test_r9_news_neon_store.py tests/test_r9_news_features.py
