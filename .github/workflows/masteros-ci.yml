name: MasterOS CI

on:
  pull_request:
    paths:
      - "masteros/**"
      - ".github/workflows/masteros-ci.yml"
  push:
    branches: [main]
    paths:
      - "masteros/**"
      - ".github/workflows/masteros-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: |
          python -m py_compile             masteros/scripts/css_to_vault.py             masteros/scripts/research_to_vault.py             masteros/scripts/drive_research_to_vault.py             masteros/scripts/fetch_css_sheet_snapshot.py
      - name: Unit tests
        run: python -m unittest discover -s masteros/tests -v