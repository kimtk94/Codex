name: Kalman Market Data V2

on:
  pull_request:
    paths:
      - "kalman-toss-gateway/engine/market_data/**"
      - "kalman-toss-gateway/scripts/*market*_v2.sh"
      - "kalman-toss-gateway/tests/test_market_data_v2.py"
      - ".github/workflows/kalman-market-data-v2.yml"
  push:
    paths:
      - "kalman-toss-gateway/engine/market_data/**"
      - "kalman-toss-gateway/scripts/*market*_v2.sh"
      - "kalman-toss-gateway/tests/test_market_data_v2.py"
      - ".github/workflows/kalman-market-data-v2.yml"

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kalman-toss-gateway

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: kalman-toss-gateway/engine/market_data/requirements.txt

      - name: Install isolated V2 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r engine/market_data/requirements.txt

      - name: Compile Python
        run: python -m compileall engine/market_data tests/test_market_data_v2.py

      - name: Check shell syntax
        run: |
          bash -n scripts/install_market_tools_v2.sh
          bash -n scripts/run_market_data_v2.sh

      - name: Run offline unit tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p "test_market_data_v2.py" -v
