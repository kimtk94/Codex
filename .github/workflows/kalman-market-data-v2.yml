name: Kalman Market Tools V2

on:
  pull_request:
    paths:
      - "kalman-toss-gateway/engine/market_data/**"
      - "kalman-toss-gateway/config/market-data-v2-universe.json"
      - "kalman-toss-gateway/engine/screeners/**"
      - "kalman-toss-gateway/engine/features_v2/**"
      - "kalman-toss-gateway/engine/model_v2_neon_writer.py"
      - "kalman-toss-gateway/research/market_tools/**"
      - "kalman-toss-gateway/research/model_v2/**"
      - "kalman-toss-gateway/research/shadow_bakeoff/**"
      - "kalman-toss-gateway/config/model-v2-spec.json"
      - "kalman-toss-gateway/config/historical-source-refresh-v1.json"
      - "kalman-toss-gateway/scripts/*v2.sh"
      - "kalman-toss-gateway/scripts/run_historical_source_refresh_rclone.sh"
      - "kalman-toss-gateway/scripts/run_shadow_bakeoff_daily.sh"
      - "kalman-toss-gateway/scripts/run_shadow_bakeoff_v1.sh"
      - "kalman-toss-gateway/scripts/install_market_research_v2.sh"
      - "kalman-toss-gateway/scripts/install_shadow_bakeoff_systemd.sh"
      - "kalman-toss-gateway/config/kalman-shadow-bakeoff-daily.service"
      - "kalman-toss-gateway/config/kalman-shadow-bakeoff-daily.timer"
      - "kalman-toss-gateway/tests/test_market*_v2*.py"
      - "kalman-toss-gateway/tests/test_model_v2*.py"
      - "kalman-toss-gateway/tests/test_historical_source_refresh.py"
      - "kalman-toss-gateway/tests/test_shadow_bakeoff_source_freshness.py"
      - ".github/workflows/kalman-market-data-v2.yml"
  push:
    paths:
      - "kalman-toss-gateway/engine/market_data/**"
      - "kalman-toss-gateway/config/market-data-v2-universe.json"
      - "kalman-toss-gateway/engine/screeners/**"
      - "kalman-toss-gateway/engine/features_v2/**"
      - "kalman-toss-gateway/engine/model_v2_neon_writer.py"
      - "kalman-toss-gateway/research/market_tools/**"
      - "kalman-toss-gateway/research/model_v2/**"
      - "kalman-toss-gateway/research/shadow_bakeoff/**"
      - "kalman-toss-gateway/config/model-v2-spec.json"
      - "kalman-toss-gateway/config/historical-source-refresh-v1.json"
      - "kalman-toss-gateway/scripts/*v2.sh"
      - "kalman-toss-gateway/scripts/run_historical_source_refresh_rclone.sh"
      - "kalman-toss-gateway/scripts/run_shadow_bakeoff_daily.sh"
      - "kalman-toss-gateway/scripts/run_shadow_bakeoff_v1.sh"
      - "kalman-toss-gateway/scripts/install_market_research_v2.sh"
      - "kalman-toss-gateway/scripts/install_shadow_bakeoff_systemd.sh"
      - "kalman-toss-gateway/config/kalman-shadow-bakeoff-daily.service"
      - "kalman-toss-gateway/config/kalman-shadow-bakeoff-daily.timer"
      - "kalman-toss-gateway/tests/test_market*_v2*.py"
      - "kalman-toss-gateway/tests/test_model_v2*.py"
      - "kalman-toss-gateway/tests/test_historical_source_refresh.py"
      - "kalman-toss-gateway/tests/test_shadow_bakeoff_source_freshness.py"
      - ".github/workflows/kalman-market-data-v2.yml"

jobs:
  market-v2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kalman-toss-gateway

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: kalman-toss-gateway/engine/market_data/requirements.txt

      - name: Install isolated Market V2 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest -r engine/market_data/requirements.txt

      - name: Verify yfinance repair dependencies
        run: |
          python - <<'PY'
          import scipy
          import sklearn
          import yfinance
          print("scipy", scipy.__version__)
          print("sklearn", sklearn.__version__)
          print("yfinance", yfinance.__version__)
          PY

      - name: Compile Market V2 Python
        run: |
          python -m compileall engine/market_data
          python -m compileall engine/screeners
          python -m compileall engine/features_v2
          python -m compileall engine/model_v2_neon_writer.py
          python -m compileall research/shadow_bakeoff
          python -m compileall tests/test_market_data_v2.py tests/test_market_tools_v2_extended.py
          python -m compileall tests/test_historical_source_refresh.py tests/test_shadow_bakeoff_source_freshness.py

      - name: Check V2 shell syntax
        run: |
          bash -n scripts/install_market_tools_v2.sh
          bash -n scripts/run_market_data_v2.sh
          bash -n scripts/run_finviz_v2.sh
          bash -n scripts/run_features_v2.sh
          bash -n scripts/run_market_tools_v2.sh
          bash -n scripts/install_market_research_v2.sh
          bash -n scripts/run_research_v2.sh
          bash -n scripts/run_model_v2_research.sh
          bash -n scripts/run_shadow_v2.sh
          bash -n scripts/run_neon_shadow_v2.sh
          bash -n scripts/run_v2_shadow_stack.sh
          bash -n scripts/run_v2_shadow_refresh.sh
          bash -n scripts/run_historical_source_refresh.sh
          bash -n scripts/run_historical_source_refresh_rclone.sh
          bash -n scripts/run_shadow_bakeoff_daily.sh
          bash -n scripts/run_shadow_bakeoff_v1.sh
          bash -n scripts/install_market_research_v2.sh
          bash -n scripts/install_shadow_bakeoff_systemd.sh
          systemd-analyze verify config/kalman-shadow-bakeoff-daily.service config/kalman-shadow-bakeoff-daily.timer

      - name: Run offline Market V2 unit tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p "test_market*_v2*.py" -v

      - name: Run historical refresh safety tests
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_historical_source_refresh.py \
            tests/test_shadow_bakeoff_source_freshness.py

  research-v2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kalman-toss-gateway

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            kalman-toss-gateway/research/market_tools/requirements.txt
            kalman-toss-gateway/research/quant_stack/requirements-pypfopt.txt

      - name: Install isolated research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r research/market_tools/requirements.txt
          python -m pip install -r research/quant_stack/requirements-pypfopt.txt
          python - <<'PY'
          from importlib.metadata import version
          from packaging.version import Version
          import scipy
          from pypfopt import EfficientFrontier
          assert Version(version("PyPortfolioOpt")) == Version("1.6.0")
          assert Version(scipy.__version__) < Version("1.18")
          print("PYPFOPT_CI_PREFLIGHT=PASS")
          PY

      - name: Compile research tools
        run: |
          python -m compileall research/market_tools
          python -m compileall research/model_v2
          python -m compileall tests/test_model_v2.py tests/test_model_v2_neon_writer.py

      - name: Run V2 model contract tests
        env:
          PYTHONPATH: .
        run: python -m unittest tests.test_model_v2 tests.test_model_v2_neon_writer tests.test_v2_shadow_schedule -v

      - name: vectorbt API smoke test
        run: |
          python - <<'PY'
          import pandas as pd
          import vectorbt as vbt

          idx = pd.date_range("2026-01-01", periods=30, freq="D")
          price = pd.Series(range(100, 130), index=idx, dtype=float)
          entries = pd.Series([False] * 30, index=idx)
          exits = pd.Series([False] * 30, index=idx)
          entries.iloc[1] = True
          exits.iloc[20] = True
          pf = vbt.Portfolio.from_signals(price, entries, exits, init_cash=1000, freq="1D")
          assert pf.total_return() is not None
          print("vectorbt smoke: OK")
          PY
