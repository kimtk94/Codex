name: Novogene CSS Server Fingerprint (Read Only)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/audit-triggers/css-fingerprint-*'

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 5
    steps:
      - name: Validate SSH key and known hosts
        env:
          SSH_HOST: ${{ secrets.SERVER_SSH_HOST }}
          SSH_USER: ${{ secrets.SERVER_SSH_USER }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ] || [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::Missing SSH secret"; exit 1
          fi
          install -m 700 -d "$HOME/.ssh"
          python3 - <<'PY'
          import os
          from pathlib import Path
          raw = os.environ["SSH_KEY"].strip().replace("\\n", "\n").replace("\r\n","\n").replace("\r","\n")
          if not raw.startswith(("-----BEGIN OPENSSH PRIVATE KEY-----","-----BEGIN RSA PRIVATE KEY-----","-----BEGIN EC PRIVATE KEY-----")):
              raise SystemExit("SSH_KEY_FORMAT_INVALID")
          Path.home().joinpath(".ssh/server_key").write_text(raw+"\n")
          PY
          chmod 600 "$HOME/.ssh/server_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -P "" -f "$HOME/.ssh/server_key" >/dev/null 2>&1 || exit 1

      - name: Read-only CSS source fingerprints
        env:
          SSH_HOST: ${{ secrets.SERVER_SSH_HOST }}
          SSH_USER: ${{ secrets.SERVER_SSH_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 \
            -o IdentitiesOnly=yes -i "$HOME/.ssh/server_key" \
            "$SSH_USER@$SSH_HOST" 'python3 -' <<'PY'
          from pathlib import Path
          import hashlib
          import os
          from datetime import datetime, timezone

          targets = {"Novogene_Mail_CSS_DashBoard.py", "Novogene_Mail_CSS_DashBoard_server.py", "Novogene_Mail_Collector.py", "Novogene_Mail_Collector_server.py"}
          roots = [Path("/home/taehoon"), Path("/srv"), Path("/opt")]
          skips = {".git", ".venv", "venv", "node_modules", "__pycache__", ".cache"}
          matches = []
          for root in roots:
              if not root.is_dir():
                  continue
              for current, dirs, files in os.walk(root):
                  dirs[:] = [d for d in dirs if d not in skips]
                  for target in sorted(set(files) & targets):
                      matches.append(Path(current) / target)
                  if len(matches) >= 15:
                      break
              if len(matches) >= 15:
                  break
          print("CSS_FINGERPRINT_AUDIT_UTC", datetime.now(timezone.utc).isoformat())
          print("SOURCE_MATCH_COUNT", len(matches))
          for path in matches:
              try:
                  data = path.read_bytes()
                  digest = hashlib.sha256(data).hexdigest()
                  version = next((line.strip()[:180] for line in data.decode("utf-8", errors="replace").splitlines() if line.lstrip().startswith("CODE_VERSION =")), "UNKNOWN")
                  print("SOURCE", str(path), "BYTES", len(data), "SHA256", digest, "VERSION", version)
              except (OSError, PermissionError) as exc:
                  print("SOURCE_READ_FAILURE", str(path), type(exc).__name__)
          print("NO_FILES_MODIFIED")
          PY

      - name: Read-only CSS runtime and backup schedule inventory
        env:
          SSH_HOST: ${{ secrets.SERVER_SSH_HOST }}
          SSH_USER: ${{ secrets.SERVER_SSH_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 \
            -o IdentitiesOnly=yes -i "$HOME/.ssh/server_key" \
            "$SSH_USER@$SSH_HOST" 'python3 -' <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import os
          import subprocess
          root = Path("/home/taehoon/services/novogene-css")
          print("CSS_SCHEDULER_AUDIT", datetime.now(timezone.utc).isoformat())
          print("CSS_SERVICE_DIR_EXISTS", root.is_dir())
          if root.is_dir():
              for part in [root, root / "app"]:
                  print("DIRECTORY", str(part), "FILES", ",".join(sorted(p.name for p in part.iterdir() if p.is_file() and p.suffix in (".py",".sh",".service",".timer"))[:60]))
              backup_dirs=[]
              for current, dirs, files in os.walk(root):
                  depth=len(Path(current).relative_to(root).parts)
                  if depth>=5:
                      dirs[:]=[]
                  else:
                      dirs[:]=[x for x in dirs if x not in {".git",".venv","venv","node_modules","__pycache__"}]
                  if "backup" in Path(current).name.lower():
                      snaps=[f for f in files if f.endswith(".sqlite3")]
                      backup_dirs.append((current,len(snaps)))
              for name, count in backup_dirs[:20]:
                  print("BACKUP_DIRECTORY",name,"SQLITE_SNAPSHOTS",count)
          for label,cmd in [
              ("USER_CRONTAB",["crontab","-l"]),
              ("TIMER_LIST",["systemctl","list-timers","--all","--no-pager","--plain"]),
              ("SERVICE_LIST",["systemctl","list-units","--all","--no-pager","--plain","--type=service"])
          ]:
              try:
                  out=subprocess.run(cmd,capture_output=True,text=True,timeout=15)
                  rows=[line for line in out.stdout.splitlines() if any(k in line.lower() for k in ("novogene","css","mail_sync","css_project_manager","db-backup","db_backup"))]
                  if label=="USER_CRONTAB":
                      print("CRON_MATCH_COUNT",len(rows))
                  else:
                      print(label+"_MATCH_COUNT",len(rows))
                      for line in rows[:20]:
                          print(label+"_MATCH",line[:240])
              except Exception as e:
                  print(label+"_UNAVAILABLE",type(e).__name__)
          print("NO_FILES_MODIFIED")
          PY

      - name: Read-only compatibility check against actual server code
        env:
          SSH_HOST: ${{ secrets.SERVER_SSH_HOST }}
          SSH_USER: ${{ secrets.SERVER_SSH_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 \
            -o IdentitiesOnly=yes -i "$HOME/.ssh/server_key" \
            "$SSH_USER@$SSH_HOST" 'python3 -' <<'PY'
          from pathlib import Path
          import subprocess
          src=Path("/home/taehoon/services/novogene-css/app/Novogene_Mail_CSS_DashBoard_server.py")
          print("SERVER_PATCH_COMPATIBILITY_AUDIT",src.is_file())
          if not src.is_file():
              raise SystemExit(1)
          txt=src.read_text(encoding="utf-8")
          tokens=[
              "SAMPLE_INTAKE_SKIPPED_SHEET_NAME =",
              "SAMPLE_INTAKE_SKIPPED_COLUMNS = [",
              "def load_active_contract_sif_skips(",
              "def split_contract_sif_active_and_skipped(",
              "def sync_overview_prepayment_snoozes(",
              "prepayment_project_ids = set()",
              "if not df_sample_intake_skipped.empty:",
              "SAMPLE_INTAKE_RETENTION_DAYS = 30",
              "sample_intake_skipped_ws = worksheets[SAMPLE_INTAKE_SKIPPED_SHEET_NAME]",
              "counts[\"contract_sif_skipped_count\"] = len(df_sample_intake_skipped)",
              "def build_contract_sif_skip_history(",
          ]
          for marker in tokens:
              print("TOKEN_COUNT",marker.split("(")[0][:55],txt.count(marker))
          cron=subprocess.run(["crontab","-l"],capture_output=True,text=True,timeout=15)
          for line in cron.stdout.splitlines():
              line=line.strip()
              if not line or line.startswith("#"):
                  continue
              if not any(k in line.lower() for k in ("novogene","css","mail_sync","backup")):
                  continue
              parts=line.split()
              schedule=" ".join(parts[:5]) if len(parts)>=6 else "@special"
              cmd=" ".join(parts[5:]) if len(parts)>=6 else ""
              tags=[tag for tag in ("backup","collector","css","mail","sync") if tag in cmd.lower()]
              print("CRON_CSS_SCHEDULE",schedule,"TAGS",",".join(tags))
          print("NO_FILES_MODIFIED")
          PY
