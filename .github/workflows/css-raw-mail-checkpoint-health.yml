name: CSS Raw Mail Checkpoint Health
on:
  workflow_dispatch:
  schedule:
    - cron: '12 * * * *'
  pull_request:
    paths:
      - 'automation/css_mail/mail_checkpoint_health_audit.py'
      - 'automation/css_mail/test_mail_checkpoint_health_audit.py'
      - '.github/workflows/css-raw-mail-checkpoint-health.yml'
  push:
    branches: [main]
    paths:
      - 'automation/css_mail/mail_checkpoint_health_audit.py'
      - 'automation/css_mail/test_mail_checkpoint_health_audit.py'
      - '.github/workflows/css-raw-mail-checkpoint-health.yml'
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3'
      - run: python -m unittest discover -s automation/css_mail -p 'test_mail_checkpoint_health_audit.py' -v
  audit:
    needs: offline-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 15
    env:
      CKD_DRIVE_SA_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
      MAIL_FRESHNESS_THRESHOLD_HOURS: '24'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3'
      - run: python -m py_compile automation/css_mail/mail_checkpoint_health_audit.py
      - run: python automation/css_mail/mail_checkpoint_health_audit.py
