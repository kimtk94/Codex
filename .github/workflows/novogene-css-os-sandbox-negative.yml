name: Novogene CSS OS Isolation Negative Controls

on:
  push:
    branches:
      - 'audit/novogene-css-sif-staging-20261014'
    paths:
      - '.github/workflows/novogene-css-os-sandbox-negative.yml'
      - 'css-upgrade/staging-20261014/os_sandbox_negative_controls.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Enforce disposable no-network/read-only container, no secret mounts
        shell: bash
        run: |
          set -euo pipefail
          test -f css-upgrade/staging-20261014/os_sandbox_negative_controls.py
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 64 \
            --tmpfs /tmp:rw,nosuid,size=32m \
            --mount type=bind,src="$PWD/css-upgrade/staging-20261014/os_sandbox_negative_controls.py",dst=/app/negative.py,readonly \
            -e PYTHONDONTWRITEBYTECODE=1 \
            python:3.12-slim python /app/negative.py
      - name: Assert no production integration attempted
        run: echo 'ONLY_SYNTHETIC_OS_SANDBOX_CHECKS_RAN'
