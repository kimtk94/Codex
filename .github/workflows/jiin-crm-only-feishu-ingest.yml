name: Jiin CRM Sender-Only Feishu Import
on:
  pull_request:
    paths:
      - 'automation/feishu/jiin_crm_filtered_ingest.py'
      - 'automation/feishu/test_jiin_crm_filtered_ingest.py'
      - '.github/workflows/jiin-crm-only-feishu-ingest.yml'
  push:
    branches: [main, feat/jiin-crm-only-email-ingest-20261106]
    paths:
      - 'automation/feishu/jiin_crm_filtered_ingest.py'
      - 'automation/feishu/test_jiin_crm_filtered_ingest.py'
      - '.github/workflows/jiin-crm-only-feishu-ingest.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe checks authorized mailbox login; apply reads only exact crm sender'
        type: choice
        options: [probe, apply]
        default: probe
        required: true
  schedule:
    - cron: '29 1,7,13,19 * * *'
permissions:
  contents: read
concurrency:
  group: jiin-crm-filtered-feishu
  cancel-in-progress: false
jobs:
  offline_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enforce exact sender, no credential leaks and read-only probe
        run: |
          python3 -m unittest discover -s automation/feishu -p 'test_jiin_crm_filtered_ingest.py' -v
          python3 -m py_compile automation/feishu/jiin_crm_filtered_ingest.py
  import:
    needs: offline_tests
    if: ${{ needs.offline_tests.result == 'success' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.JIIN_CRM_READY == 'true')) }}
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 35
    env:
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_BASE_APP_TOKEN: ${{ vars.FEISHU_SALES_BASE_APP_TOKEN }}
      JIIN_CRM_IMAP_HOST: ${{ vars.JIIN_CRM_IMAP_HOST }}
      JIIN_CRM_IMAP_PORT: ${{ vars.JIIN_CRM_IMAP_PORT || '993' }}
      JIIN_CRM_AUTH_METHOD: ${{ vars.JIIN_CRM_AUTH_METHOD || 'oauth2' }}
      JIIN_CRM_OAUTH_ACCESS_TOKEN: ${{ secrets.JIIN_CRM_OAUTH_ACCESS_TOKEN }}
      JIIN_CRM_APP_PASSWORD: ${{ secrets.JIIN_CRM_APP_PASSWORD }}
      JIIN_CRM_MODE: ${{ github.event_name == 'schedule' && 'apply' || inputs.mode }}
      JIIN_CRM_MAIL_LIMIT: '300'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify configured authorized jiin mailbox without logging password
        run: python3 automation/feishu/jiin_crm_filtered_ingest.py
