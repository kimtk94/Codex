name: Novogene CSS SIF Staging Preflight

on:
  push:
    branches:
      - 'audit/novogene-css-sif-staging-20261014'
    paths:
      - '.github/workflows/novogene-css-sif-stage-preflight.yml'
      - 'css-upgrade/staging-20261014/**'

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify SSH configuration
        env:
          SSH_HOST: ${{ secrets.SERVER_SSH_HOST }}
          SSH_USER: ${{ secrets.SERVER_SSH_USER }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ] || [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::Missing SSH config"; exit 1
          fi
          install -m 700 -d "$HOME/.ssh"
          python3 - <<'PY'
          import os
          from pathlib import Path
          raw = os.environ["SSH_KEY"].strip()
          if "\\n" in raw and "\n" not in raw:
              raw = raw.replace("\\n","\n")
          raw=raw.replace("\r\n","\n").replace("\r","\n")
          if not raw.startswith(("-----BEGIN OPENSSH PRIVATE KEY-----","-----BEGIN RSA PRIVATE KEY-----","-----BEGIN EC PRIVATE KEY-----")):
              raise SystemExit("SSH_KEY_FORMAT_INVALID")
          Path.home().joinpath(".ssh/server_key").write_text(raw+"\n")
          PY
          chmod 600 "$HOME/.ssh/server_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -P "" -f "$HOME/.ssh/server_key" > /dev/null 2>&1 || exit 1
      - name: Apply diff to isolated temporary server copy, syntax and rollback checks
        env:
          SSH_HOST: ${{ secrets.SERVER_SSH_HOST }}
          SSH_USER: ${{ secrets.SERVER_SSH_USER }}
        run: |
          REMOTE_PATCH="/tmp/novogene-css-sif-stage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.patch"
          # Remove only this run's temporary patch and two artifacts from earlier failed attempts.
          trap 'ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -o IdentitiesOnly=yes -i "$HOME/.ssh/server_key" "$SSH_USER@$SSH_HOST" "rm -f $REMOTE_PATCH /tmp/novogene-css-sif-stage-38583895224-1.patch /tmp/novogene-css-sif-stage-38584026980-1.patch" >/dev/null 2>&1 || true' EXIT
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 \
            -o IdentitiesOnly=yes -i "$HOME/.ssh/server_key" \
            "css-upgrade/staging-20261014/novogene_sif_history_candidate.patch" \
            "$SSH_USER@$SSH_HOST:$REMOTE_PATCH" || exit 1
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 \
            -o IdentitiesOnly=yes -i "$HOME/.ssh/server_key" \
            "$SSH_USER@$SSH_HOST" "PATCH_FILE='$REMOTE_PATCH' python3 -" <<'PY'
          from pathlib import Path
          import ast
          import hashlib
          import os
          import subprocess
          import tempfile
          import sys
          source=Path('/home/taehoon/services/novogene-css/app/Novogene_Mail_CSS_DashBoard_server.py')
          patch=Path(os.environ['PATCH_FILE'])
          expected='a7c395be330bc1128f8164cdac1d75a7c27fd35398e46ff5589271ebf0bae840'
          sha=lambda b:hashlib.sha256(b).hexdigest()
          if not source.is_file() or not patch.is_file():
              raise SystemExit('PRECHECK_SOURCE_OR_PATCH_MISSING')
          original=source.read_bytes()
          if sha(original)!=expected:
              raise SystemExit('PRECHECK_SHA_MISMATCH: source changed; no patch applied')
          if b'v8.92.1-server-local-adc' not in original:
              raise SystemExit('PRECHECK_VERSION_MISMATCH')
          with tempfile.TemporaryDirectory(prefix='css-sif-stage-') as path:
              stage=Path(path)
              staged=stage/'Novogene_Mail_CSS_DashBoard.py'
              staged.write_bytes(original)
              def apply(*args):
                  return subprocess.run(['git','apply',*args,str(patch)],cwd=stage,text=True,
                                        capture_output=True,timeout=90)
              check=apply('--check','--whitespace=error')
              if check.returncode:
                  for line in check.stderr.splitlines():
                      if ('patch failed' in line or 'patch does not apply' in line or 'error:' in line):
                          print('PATCH_CONTEXT_DIAGNOSTIC', line[:180])
                  raise SystemExit('PATCH_CONTEXT_CONFLICT: patch not applicable to current server file')
              if apply('--whitespace=error').returncode:
                  raise SystemExit('PATCH_APPLY_FAILED')
              candidate=staged.read_bytes()
              new=ast.parse(candidate)
              old=ast.parse(original)
              compile(new,'staged-css.py','exec')
              functions=lambda t:{n.name for n in ast.walk(t) if isinstance(n,ast.FunctionDef)}
              if not functions(old).issubset(functions(new)):
                  raise SystemExit('EXISTING_FUNCTION_REGRESSION')
              needed={'collect_active_prepayment_project_ids','build_contract_sif_skip_history'}
              if not needed.issubset(functions(new)):
                  raise SystemExit('NEW_FUNCTION_CHECK_FAILED')
              if candidate.count(b'prepayment_project_ids = collect_active_prepayment_project_ids(conn)')!=1:
                  raise SystemExit('DURABLE_PREPAYMENT_CHECK_FAILED')
              if b'v8.92.1-server-local-adc' not in candidate:
                  raise SystemExit('SERVER_RUNTIME_VERSION_NOT_PRESERVED')
              # Extract only the newly added helper; never execute the module's top-level code.
              helper=next(n for n in new.body if isinstance(n,ast.FunctionDef)
                          and n.name=='collect_active_prepayment_project_ids')
              namespace={
                  'load_active_contract_sif_skips':lambda conn: {
                      'one': {'skip_reason':'Prepayment - manual', 'snapshot':{'project_id':'AMEA2026100001'}},
                      'two': {'skip_reason':'', 'snapshot':{'project_id':'AMEA2026100002','Prepayment':True}},
                      'three': {'skip_reason':'Other','snapshot':{'project_id':'AMEA2026100003','Prepayment':False}},
                  },
                  'normalize_text': lambda value:str(value or '').strip().lower(),
                  'checkbox_is_checked':lambda value: str(value).strip().lower() in ('true','yes','1'),
                  'canonical_sif_project_id':lambda value:str(value or '').strip().upper(),
                  'SAMPLE_INTAKE_PREPAYMENT_COLUMN':'Prepayment',
              }
              exec(compile(ast.Module(body=[helper],type_ignores=[]),'helper','exec'),namespace)
              observed=namespace['collect_active_prepayment_project_ids'](None)
              if observed != {'AMEA2026100001','AMEA2026100002'}:
                  raise SystemExit('PREPAYMENT_FUNCTIONAL_TEST_FAILED')
              print('PREPAYMENT_FUNCTIONAL_TEST_PASS')
              # Read the CURRENT operating database through a query-only SQLite connection.
              import sqlite3
              import json
              import re
              import importlib.util
              base = source.parent.parent
              db_candidates=[
                  base/'state'/'css_project_manager.sqlite3',
                  base/'data'/'css_project_manager.sqlite3',
                  base/'app'/'state'/'css_project_manager.sqlite3',
                  base/'css_project_manager.sqlite3',
              ]
              db=next((p for p in db_candidates if p.is_file() and p.stat().st_size>4096),None)
              if db is None:
                  for top in (base/'state',base/'data'):
                      if top.is_dir():
                          db=next((p for p in top.glob('**/css_project_manager.sqlite3')
                                   if p.is_file() and 'backup' not in str(p).lower()),None)
                          if db is not None:
                              break
              if db is None:
                  raise SystemExit('LIVE_DB_LOCATION_NOT_FOUND')
              live=sqlite3.connect('file:'+str(db.resolve())+'?mode=ro',uri=True,timeout=20)
              try:
                  live.execute('PRAGMA query_only=ON')
                  live.execute('BEGIN')
                  active=live.execute('SELECT record_id, skip_reason, snapshot_json FROM contract_sif_skips WHERE is_active=1').fetchall()
                  total=live.execute('SELECT COUNT(*) FROM contract_sif_skips').fetchone()[0]
                  def is_true(value):
                      return str(value or '').strip().lower() in ('true','1','yes','y','checked')
                  independent=set()
                  for record_id,reason,snapshot_raw in active:
                      try:
                          snapshot=json.loads(snapshot_raw or '{}')
                      except (ValueError,TypeError):
                          snapshot={}
                      if not isinstance(snapshot,dict):
                          snapshot={}
                      if str(reason or '').strip().lower().startswith('prepayment') or is_true(snapshot.get('Prepayment')):
                          match=re.search(r'\bAMEA\d{10}\b',str(snapshot.get('project_id') or snapshot.get('AMEA No.') or '').upper())
                          if match:
                              independent.add(match.group())
                  load_fn=next(n for n in new.body if isinstance(n,ast.FunctionDef)
                               and n.name=='load_active_contract_sif_skips')
                  live_namespace={
                      'json':json,
                      'clean_text':lambda value: '' if value is None else str(value).strip(),
                      'normalize_text':lambda value:str(value or '').strip().lower(),
                      'checkbox_is_checked':is_true,
                      'canonical_sif_project_id':lambda value:(re.search(r'\bAMEA\d{10}\b',str(value or '').upper()).group()
                         if re.search(r'\bAMEA\d{10}\b',str(value or '').upper()) else ''),
                      'SAMPLE_INTAKE_PREPAYMENT_COLUMN':'Prepayment',
                  }
                  exec(compile(ast.Module(body=[load_fn,helper],type_ignores=[]),'live-helpers','exec'),live_namespace)
                  actual=live_namespace['collect_active_prepayment_project_ids'](live)
                  print('LIVE_SQL_ACTIVE_SKIP_COUNT',len(active))
                  print('LIVE_SQL_PREPAYMENT_COUNT',len(independent))
                  print('LIVE_HELPER_PREPAYMENT_COUNT',len(actual))
                  print('LIVE_SQL_HELPER_SET_EQUAL',actual==independent)
                  if actual!=independent or len(actual)<3 or len(active)<5:
                      raise SystemExit('LIVE_DURABLE_PREPAYMENT_REGRESSION')
                  print('LIVE_ACTIVE_SKIP_COUNT',len(active))
                  print('LIVE_SKIP_HISTORY_ROW_COUNT',total)
                  print('LIVE_PREPAYMENT_COUNT',len(actual))
                  print('LIVE_DURABLE_PREPAYMENT_PASS')
                  if importlib.util.find_spec('pandas') is None:
                      print('HISTORY_PANDAS_IMPORT_NOT_AVAILABLE_IN_SYSTEM_PYTHON')
                  else:
                      import pandas as pd
                      from datetime import datetime
                      from zoneinfo import ZoneInfo
                      columns=['record_id','is_active','Contract No.','AMEA No.','Institution','Customer Name',
                           'skip_reason','Prepayment','skipped_at','restored_at','reference_date','age_days',
                           'workflow_status','tracker_visibility','history_note']
                      live_namespace.update({
                          'pd':pd,'datetime':datetime,'KST':ZoneInfo('Asia/Seoul'),
                          'SAMPLE_INTAKE_TERMINAL_STATUSES':{'SIF approved'},
                          'SAMPLE_INTAKE_RETENTION_DAYS':30,
                          'SAMPLE_INTAKE_SKIP_HISTORY_COLUMNS':columns,
                      })
                      history_fn=next(n for n in new.body if isinstance(n,ast.FunctionDef)
                                      and n.name=='build_contract_sif_skip_history')
                      exec(compile(ast.Module(body=[history_fn],type_ignores=[]),'history-helper','exec'),live_namespace)
                      history=live_namespace['build_contract_sif_skip_history'](live)
                      if len(history)!=total or int(history['is_active'].sum())!=len(active) or int(history['Prepayment'].sum())!=len(actual):
                          raise SystemExit('LIVE_HISTORY_RENDER_REGRESSION')
                      print('LIVE_HISTORY_RENDER_PASS')
                      # Exercise actual snooze writer ONLY against an in-memory SQLite fixture.
                      frame=pd.DataFrame([{'project_id':pid,'current_stage':'SIF requested'} for pid in actual])
                      memory=sqlite3.connect(':memory:')
                      try:
                          memory.execute("""CREATE TABLE overview_project_snoozes(
                              project_id TEXT PRIMARY KEY, mode TEXT NOT NULL,
                              hold_until TEXT, baseline_mail_marker TEXT,
                              created_at TEXT NOT NULL, updated_at TEXT NOT NULL)""")
                          memory.executemany(
                              'INSERT INTO overview_project_snoozes VALUES(?,?,?,?,?,?)',
                              [('FIXTURE_MANUAL_HOLD','Hold','','','2026-01-01','2026-01-01'),
                               ('FIXTURE_MANUAL_SKIP','Skip','','','2026-01-01','2026-01-01')])
                          names={'_upsert_overview_snooze','sync_overview_prepayment_snoozes'}
                          writer_nodes=[n for n in new.body if isinstance(n,ast.FunctionDef) and n.name in names]
                          if len(writer_nodes)!=2:
                              raise SystemExit('SHADOW_SNOOZE_WRITER_MISSING')
                          shadow_env={
                              'pd':pd,'KST':ZoneInfo('Asia/Seoul'),
                              'clean_text':lambda value: '' if value is None else str(value).strip(),
                              'iter_dataframe_records':lambda df:df.to_dict(orient='records'),
                              'dataframe_row_text':lambda row,key:str(row.get(key,'') or '').strip(),
                              'overview_mail_marker':lambda row:'isolation-marker',
                          }
                          exec(compile(ast.Module(body=writer_nodes,type_ignores=[]),'shadow-helpers','exec'),shadow_env)
                          writer=shadow_env['sync_overview_prepayment_snoozes']
                          first=writer(memory,frame,actual)
                          if first.get('overview_prepayment_skip_active')!=len(actual):
                              raise SystemExit('SHADOW_SNOOZE_INSERT_REGRESSION')
                          if len(frame)<3:
                              raise SystemExit('SHADOW_FIXTURE_TOO_SMALL')
                          frame.loc[frame.index[0],'current_stage']='Sample QC review'
                          second=writer(memory,frame,actual)
                          if second.get('overview_prepayment_skip_released')!=1 or second.get('overview_prepayment_skip_active')!=len(actual)-1:
                              raise SystemExit('SHADOW_SNOOZE_RELEASE_REGRESSION')
                          held=set(memory.execute("SELECT mode FROM overview_project_snoozes WHERE project_id LIKE 'FIXTURE_MANUAL_%'").fetchall())
                          if held!={('Hold',),('Skip',)}:
                              raise SystemExit('SHADOW_MANUAL_STATE_OVERWRITTEN')
                          print('SHADOW_PREPAYMENT_SNOOZE_LIFECYCLE_PASS')
                          print('SHADOW_MANUAL_HOLD_SKIP_PRESERVATION_PASS')
                      finally:
                          memory.close()
                  live.rollback()
              finally:
                  live.close()
              if apply('-R','--check').returncode or apply('-R').returncode:
                  raise SystemExit('PATCH_REVERSE_FAILED')
              if sha(staged.read_bytes())!=expected:
                  raise SystemExit('BYTE_EXACT_ROLLBACK_FAILED')
              if sha(source.read_bytes())!=expected:
                  raise SystemExit('LIVE_SOURCE_CHANGED_UNEXPECTEDLY')
              print('STAGING_PATCH_PASS')
              print('AST_COMPILE_PASS')
              print('FUNCTION_PRESERVATION_PASS')
              print('ROLLBACK_BYTE_EXACT_PASS')
              print('LIVE_SOURCE_UNCHANGED_PASS')
              print('STAGED_SHA256',sha(candidate))
              print('STAGED_BYTES',len(candidate))
              print('EXISTING_FUNCTIONS_PRESERVED',len(functions(old)))
          PY
          RESULT=$?
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 \
            -o IdentitiesOnly=yes -i "$HOME/.ssh/server_key" \
            "$SSH_USER@$SSH_HOST" "rm -f '$REMOTE_PATCH'" || true
          exit "$RESULT"
