name: Novogene CSS SIF Staging Preflight

on:
  push:
    branches:
      - 'audit/novogene-css-sif-staging-20261014'
    paths:
      - '.github/workflows/novogene-css-sif-stage-preflight.yml'
      - 'css-upgrade/staging-20261014/**'

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify SSH configuration
        env:
          SSH_HOST: ${{ secrets.SERVER_SSH_HOST }}
          SSH_USER: ${{ secrets.SERVER_SSH_USER }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ] || [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::Missing SSH config"; exit 1
          fi
          install -m 700 -d "$HOME/.ssh"
          python3 - <<'PY'
          import os
          from pathlib import Path
          raw = os.environ["SSH_KEY"].strip()
          if "\\n" in raw and "\n" not in raw:
              raw = raw.replace("\\n","\n")
          raw=raw.replace("\r\n","\n").replace("\r","\n")
          if not raw.startswith(("-----BEGIN OPENSSH PRIVATE KEY-----","-----BEGIN RSA PRIVATE KEY-----","-----BEGIN EC PRIVATE KEY-----")):
              raise SystemExit("SSH_KEY_FORMAT_INVALID")
          Path.home().joinpath(".ssh/server_key").write_text(raw+"\n")
          PY
          chmod 600 "$HOME/.ssh/server_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -P "" -f "$HOME/.ssh/server_key" > /dev/null 2>&1 || exit 1
      - name: Apply diff to isolated temporary server copy, syntax and rollback checks
        env:
          SSH_HOST: ${{ secrets.SERVER_SSH_HOST }}
          SSH_USER: ${{ secrets.SERVER_SSH_USER }}
        run: |
          REMOTE_PATCH="/tmp/novogene-css-sif-stage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.patch"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 \
            -o IdentitiesOnly=yes -i "$HOME/.ssh/server_key" \
            "css-upgrade/staging-20261014/novogene_sif_history_candidate.patch" \
            "$SSH_USER@$SSH_HOST:$REMOTE_PATCH" || exit 1
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 \
            -o IdentitiesOnly=yes -i "$HOME/.ssh/server_key" \
            "$SSH_USER@$SSH_HOST" "PATCH_FILE='$REMOTE_PATCH' python3 -" <<'PY'
          from pathlib import Path
          import ast
          import hashlib
          import os
          import subprocess
          import tempfile
          import sys
          source=Path('/home/taehoon/services/novogene-css/app/Novogene_Mail_CSS_DashBoard_server.py')
          patch=Path(os.environ['PATCH_FILE'])
          expected='a7c395be330bc1128f8164cdac1d75a7c27fd35398e46ff5589271ebf0bae840'
          sha=lambda b:hashlib.sha256(b).hexdigest()
          if not source.is_file() or not patch.is_file():
              raise SystemExit('PRECHECK_SOURCE_OR_PATCH_MISSING')
          original=source.read_bytes()
          if sha(original)!=expected:
              raise SystemExit('PRECHECK_SHA_MISMATCH: source changed; no patch applied')
          if b'v8.92.1-server-local-adc' not in original:
              raise SystemExit('PRECHECK_VERSION_MISMATCH')
          with tempfile.TemporaryDirectory(prefix='css-sif-stage-') as path:
              stage=Path(path)
              staged=stage/'Novogene_Mail_CSS_DashBoard.py'
              staged.write_bytes(original)
              def apply(*args):
                  return subprocess.run(['git','apply',*args,str(patch)],cwd=stage,text=True,
                                        capture_output=True,timeout=90)
              check=apply('--check','--whitespace=error')
              if check.returncode:
                  for line in check.stderr.splitlines():
                      if ('patch failed' in line or 'patch does not apply' in line or 'error:' in line):
                          print('PATCH_CONTEXT_DIAGNOSTIC', line[:180])
                  raise SystemExit('PATCH_CONTEXT_CONFLICT: patch not applicable to current server file')
              if apply('--whitespace=error').returncode:
                  raise SystemExit('PATCH_APPLY_FAILED')
              candidate=staged.read_bytes()
              new=ast.parse(candidate)
              old=ast.parse(original)
              compile(new,'staged-css.py','exec')
              functions=lambda t:{n.name for n in ast.walk(t) if isinstance(n,ast.FunctionDef)}
              if not functions(old).issubset(functions(new)):
                  raise SystemExit('EXISTING_FUNCTION_REGRESSION')
              needed={'collect_active_prepayment_project_ids','build_contract_sif_skip_history'}
              if not needed.issubset(functions(new)):
                  raise SystemExit('NEW_FUNCTION_CHECK_FAILED')
              if candidate.count(b'prepayment_project_ids = collect_active_prepayment_project_ids(conn)')!=1:
                  raise SystemExit('DURABLE_PREPAYMENT_CHECK_FAILED')
              if b'v8.92.1-server-local-adc' not in candidate:
                  raise SystemExit('SERVER_RUNTIME_VERSION_NOT_PRESERVED')
              if apply('-R','--check').returncode or apply('-R').returncode:
                  raise SystemExit('PATCH_REVERSE_FAILED')
              if sha(staged.read_bytes())!=expected:
                  raise SystemExit('BYTE_EXACT_ROLLBACK_FAILED')
              if sha(source.read_bytes())!=expected:
                  raise SystemExit('LIVE_SOURCE_CHANGED_UNEXPECTEDLY')
              print('STAGING_PATCH_PASS')
              print('AST_COMPILE_PASS')
              print('FUNCTION_PRESERVATION_PASS')
              print('ROLLBACK_BYTE_EXACT_PASS')
              print('LIVE_SOURCE_UNCHANGED_PASS')
              print('STAGED_SHA256',sha(candidate))
              print('STAGED_BYTES',len(candidate))
              print('EXISTING_FUNCTIONS_PRESERVED',len(functions(old)))
          PY
          RESULT=$?
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 \
            -o IdentitiesOnly=yes -i "$HOME/.ssh/server_key" \
            "$SSH_USER@$SSH_HOST" "rm -f '$REMOTE_PATCH'" || true
          exit "$RESULT"
