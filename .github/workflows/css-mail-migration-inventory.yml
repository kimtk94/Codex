name: CSS Mail Migration Inventory
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/css_mail/mail_migration_inventory.py'
      - '.github/workflows/css-mail-migration-inventory.yml'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 15
    env:
      CKD_DRIVE_SA_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3'
      - run: python -m py_compile automation/css_mail/mail_migration_inventory.py
      - run: python automation/css_mail/mail_migration_inventory.py
