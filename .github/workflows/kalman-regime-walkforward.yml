name: Kalman QQQ QLD 15m Regime Walkforward (Research Only)

on:
  pull_request:
    paths:
      - 'research/kalman_regime_walkforward/**'
      - '.github/workflows/kalman-regime-walkforward.yml'
      - 'research/kalman_data_backfill/build_snapshot.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scikit-learn exchange-calendars pyarrow requests
      - name: Test no-lookahead, purged walkforward, stop-first, missing sessions
        run: python -m unittest discover -s research/kalman_regime_walkforward -p 'test_*.py' -v

  out-of-sample:
    needs: unit-tests
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'feat/kalman-raw-gap-audit-staging-20261030' || github.head_ref == 'feat/kalman-regime-market-ablation-20261031'))
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only research dependencies and Drive reader
        run: python -m pip install --disable-pip-version-check pandas numpy scikit-learn exchange-calendars pyarrow requests google-api-python-client google-auth
      - name: Download immutable private research source and staged SIP records
        env:
          CKD_DRIVE_SA_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
          GDRIVE_SA_JSON_B64: ${{ secrets.GDRIVE_SA_JSON_B64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/kalman_sources" "$RUNNER_TEMP/kalman_stages" "$RUNNER_TEMP/kalman_evidence"
          python research/kalman_triple_barrier/drive_input.py --file-id 13biLe0-QIv3wYUbCJFeHZnW2EuHQhnil --output "$RUNNER_TEMP/kalman_sources/QQQ_15m.parquet"
          python research/kalman_triple_barrier/drive_input.py --file-id 14tFlcG3-TmdtlzLyWOeHY5K-4EIHQCiE --output "$RUNNER_TEMP/kalman_sources/QLD_15m.parquet"
          python research/kalman_triple_barrier/drive_input.py --file-id 1BVYrKDsKl50Q9Aw1438w4T1W267-Zgn- --output "$RUNNER_TEMP/kalman_sources/QQQ_1d.parquet"
          python research/kalman_triple_barrier/drive_input.py --file-id 1HM6nbAmYI_DCLVJk8TQph21gsva2xjw4 --output "$RUNNER_TEMP/kalman_sources/QLD_1d.parquet"
          python research/kalman_triple_barrier/drive_input.py --file-id 1cZvbxcBjBv5WpUirq83PaBpyRumKFOa2 --output "$RUNNER_TEMP/kalman_stages/QQQ_15m_202609.parquet"
          python research/kalman_triple_barrier/drive_input.py --file-id 1ePizOJpc4xC-6x0XaOTvuiyEodlcEOlg --output "$RUNNER_TEMP/kalman_stages/QQQ_15m_202610.parquet"
          python research/kalman_triple_barrier/drive_input.py --file-id 1BE041jcv05RrwUfBu6qW2LokroYPh4zr --output "$RUNNER_TEMP/kalman_stages/QLD_15m_202609.parquet"
          python research/kalman_triple_barrier/drive_input.py --file-id 1taXn9co-8yDaQox3dfB1hdn4LdNOthvm --output "$RUNNER_TEMP/kalman_stages/QLD_15m_202610.parquet"
          python research/kalman_triple_barrier/drive_input.py --file-id 1Eq9ePgRMZ155uW1RwZM-oHTvyvXTZS5t --output "$RUNNER_TEMP/kalman_stages/QQQ_1d_202609.parquet"
          python research/kalman_triple_barrier/drive_input.py --file-id 1d7_2nh5DGGC-qcDQaXyj_ChEgRxj1ZDq --output "$RUNNER_TEMP/kalman_stages/QQQ_1d_202610.parquet"
          python research/kalman_triple_barrier/drive_input.py --file-id 1je0tLEGQ96FA9XEq8bpwkCT8H9NrEBza --output "$RUNNER_TEMP/kalman_stages/QLD_1d_202609.parquet"
          python research/kalman_triple_barrier/drive_input.py --file-id 1wdnlwEVQgNSsYVEQlfvTvB2YAYYapkjO --output "$RUNNER_TEMP/kalman_stages/QLD_1d_202610.parquet"
          python research/kalman_triple_barrier/drive_input.py --file-id 1gI9VzJDTRRayJrctE9o4fpLx6p1TDVNn --output "$RUNNER_TEMP/kalman_evidence/historical_qqq_50.zip"
          python research/kalman_triple_barrier/drive_input.py --file-id 1eEEJSEkAPX_cUfQ3kocVZ4ciaTHamTH8 --output "$RUNNER_TEMP/kalman_evidence/validation.zip"
          unzip -p "$RUNNER_TEMP/kalman_evidence/validation.zip" validation.json > "$RUNNER_TEMP/kalman_evidence/validation.json"
      - name: Rebuild exact validated research PIT snapshot locally (do not upload prices)
        run: |
          python research/kalman_data_backfill/build_snapshot.py \
            --source-dir "$RUNNER_TEMP/kalman_sources" \
            --stage-dir "$RUNNER_TEMP/kalman_stages" \
            --historical-zip "$RUNNER_TEMP/kalman_evidence/historical_qqq_50.zip" \
            --validation-json "$RUNNER_TEMP/kalman_evidence/validation.json" \
            --as-of 2026-10-29 \
            --out-dir "$RUNNER_TEMP/kalman_pit"
          cd "$RUNNER_TEMP/kalman_pit"
          zip -q -0 "$RUNNER_TEMP/kalman_pit_v1.zip" QQQ_15m_research_pit_v1.parquet QLD_15m_research_pit_v1.parquet QQQ_1d_research_pit_v1.parquet QLD_1d_research_pit_v1.parquet manifest.json unresolved_gap_mask.csv
      - name: Train purged 2022-2026 walk-forward model and conservatively simulate 15m triple barriers
        run: |
          python research/kalman_regime_walkforward/engine.py \
            --snapshot-zip "$RUNNER_TEMP/kalman_pit_v1.zip" \
            --out outputs/kalman_regime_walkforward \
            --start-year 2022
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('outputs/kalman_regime_walkforward/walkforward_metrics.json')
          v=json.loads(p.read_text())
          assert v['status']=='RESEARCH_OOS_ONLY'
          assert v['no_live_changes'] and v['no_1min_execution']
          assert v['unresolved_gap_count']==3
          assert len([x for x in v['folds'] if x['status']=='OOS'])>=4
          print('OOS_VALIDATED metrics_only=True')
          PY
      - name: Download isolated private market research ZIP for matched ablation
        env:
          CKD_DRIVE_SA_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
          GDRIVE_SA_JSON_B64: ${{ secrets.GDRIVE_SA_JSON_B64 }}
        run: |
          python research/kalman_triple_barrier/drive_input.py \
            --file-id 1aUhvIAsE2x2-LuKv5nSxmDGX0Uo4mqYd \
            --output "$RUNNER_TEMP/kalman_market_research_latest.zip"
      - name: Run matched 2025-2026 price and market ablation (PIT-gated)
        run: |
          python research/kalman_regime_walkforward/market_ablation.py \
            --price-zip "$RUNNER_TEMP/kalman_pit_v1.zip" \
            --market-zip "$RUNNER_TEMP/kalman_market_research_latest.zip" \
            --out outputs/kalman_regime_market_ablation
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('outputs/kalman_regime_market_ablation/market_ablation_metrics.json').read_text())
          assert d['status']=='RESEARCH_MATCHED_OOS_ONLY'
          assert d['usdkrw_and_derived_excluded'] and d['fred_not_pit_no_macro_training']
          assert d['single_position_global_nonoverlap'] and not d['live_modified']
          assert {x['year'] for x in d['folds'] if x['status']=='OOS'}=={2025,2026}
          assert d['coverage']['matched_complete_days']>=400
          assert d['coverage']['excluded_incomplete_market_days']>=0
          print('MATCHED_OOS_VALIDATED',json.dumps({'coverage':d['coverage'],'trades':{k:v['trades'] for k,v in d['strategies'].items()}}))
          PY
      - name: Upload aggregated outcomes only (no licensed price files)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalman-regime-15m-oos-2022-2026
          path: |
            outputs/kalman_regime_walkforward/walkforward_metrics.json
            outputs/kalman_regime_walkforward/walkforward_by_year.csv
            outputs/kalman_regime_walkforward/walkforward_by_regime.csv
            outputs/kalman_regime_market_ablation/market_ablation_metrics.json
            outputs/kalman_regime_market_ablation/market_ablation_by_year.csv
            outputs/kalman_regime_market_ablation/market_ablation_by_regime.csv
          retention-days: 14
          if-no-files-found: warn