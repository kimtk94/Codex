name: CSS QQ Mail Read-only Probe

on:
  push:
    branches: [main]
    paths:
      - 'automation/css_mail/**'
      - '.github/workflows/css-mail-readonly.yml'
  workflow_dispatch:
  schedule:
    # Manual re-sync checkpoint 2026-10-23; keep normal 30-minute schedule.
    - cron: "7,37 * * * *"

permissions:
  contents: read

concurrency:
  group: css-qq-mail-readonly
  cancel-in-progress: false

jobs:
  css-mail:
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 24
    env:
      CSS_QQ_MAIL_ADDRESS: ${{ secrets.CSS_QQ_MAIL_ADDRESS }}
      CSS_QQ_MAIL_AUTH_CODE: ${{ secrets.CSS_QQ_MAIL_AUTH_CODE }}
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
      CSS_MAIL_LOOKBACK_HOURS: "48"
      CSS_IMAP_SCAN_DAYS: "60"
      CSS_IMAP_BATCH_PER_FOLDER: "120"
      CSS_MAIL_REPORT_PATH: css_mail_probe.json
    steps:
      - uses: actions/checkout@v4
      - name: Validate QQ Mail configuration
        run: |
          python3 - <<'PY'
          import os, sys
          keys = ["CSS_QQ_MAIL_ADDRESS", "CSS_QQ_MAIL_AUTH_CODE"]
          ok = all(os.getenv(key) for key in keys)
          print("CSS QQ IMAP configuration:", "READY" if ok else "MISSING")
          sys.exit(0 if ok else 1)
          PY
      - name: Read-only QQ IMAP probe
        run: python3 automation/css_mail/readonly_probe.py
      - name: Install Google Sheets client
        run: python3 -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3'
      - name: Compile CSS mail Python scripts
        run: python3 -m py_compile automation/css_mail/readonly_probe.py automation/css_mail/incremental_sync.py automation/css_mail/mail_operations.py automation/css_mail/unanswered_auto.py automation/css_mail/tax_invoice_extract.py automation/css_mail/quotation_approval_extract.py automation/css_mail/thread_header_backfill.py automation/css_mail/mail_shadow_load.py automation/css_mail/project_lifecycle_refresh.py automation/css_mail/statement_amount_extract.py automation/css_mail/test_project_lifecycle_chain.py automation/css_mail/revenue_lifecycle_monthly.py automation/css_mail/test_revenue_lifecycle_monthly.py
      - name: Sync inbound and sent mail metadata to CSS staging
        run: python3 automation/css_mail/incremental_sync.py
      - name: Backfill verified mail thread headers (Q:R only)
        env:
          DRY_RUN: 'false'
          CSS_THREAD_BACKFILL_WRITE: 'true'
          CSS_THREAD_BACKFILL_BATCH: '20'
        run: python3 automation/css_mail/thread_header_backfill.py
      - name: Mirror new QQ mail into canonical ledger (append only)
        env:
          CKD_DRIVE_SA_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
          CANONICAL_SHADOW_WRITE: 'true'
        run: python3 automation/css_mail/mail_shadow_load.py
      - name: Verify mail ingestion heartbeat in Google Sheets
        run: python3 automation/css_mail/mail_health.py
      - name: Build mail-only operations review (no SFDC updates)
        run: python3 automation/css_mail/mail_operations.py
      - name: Build unanswered email review using existing exclusions
        run: python3 automation/css_mail/unanswered_auto.py
      - name: Collect quotation approval evidence without amounts
        run: python3 automation/css_mail/quotation_approval_extract.py
      - name: Extract TAX INVOICE amounts from attachment filenames
        run: python3 automation/css_mail/tax_invoice_extract.py
      - name: Verify pending Statement totals from original QQ emails
        env:
          CSS_STATEMENT_AMOUNT_BATCH: '40'
        run: python3 automation/css_mail/statement_amount_extract.py
      - name: Verify project and billing lifecycle invariants (offline)
        run: python3 -m unittest discover -s automation/css_mail -p 'test_project_lifecycle_chain.py' -v
      - name: Refresh linked project progress and billing overview
        run: python3 automation/css_mail/project_lifecycle_refresh.py
      - name: Validate revenue stage transitions and deduplication (offline)
        run: python3 -m unittest discover -s automation/css_mail -p 'test_revenue_lifecycle_monthly.py' -v
      - name: Publish Actual Pending Forecast revenue by month
        run: python3 automation/css_mail/revenue_lifecycle_monthly.py
      - name: Upload sanitized counts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: css-qq-mail-counts
          path: css_mail_probe.json
          retention-days: 7
