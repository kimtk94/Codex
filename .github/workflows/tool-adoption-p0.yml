name: Kalman Tool Adoption P0 Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'automation/tool_adoption/**'
      - '.github/workflows/tool-adoption-p0.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python3 -m unittest discover -s automation/tool_adoption -p 'test_*.py' -v
      - name: Inspect repository (read only)
        run: python3 automation/tool_adoption/audit_p0.py --root . --output /tmp/kalman-tool-adoption-audit.json
      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: kalman-tool-adoption-audit
          path: /tmp/kalman-tool-adoption-audit.json
          retention-days: 14
