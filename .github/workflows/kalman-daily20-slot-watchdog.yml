name: Kalman Daily20 Scheduled First-Seal / Replay Heartbeat (Read Only)

on:
  # Both independent Daily20 scheduled runs should already finish by then.
  # The second check tolerates a delayed first watchdog event.
  schedule:
    - cron: '25 6 * * 2-6'
    - cron: '25 7 * * 2-6'
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/kalman_daily20/scheduled_slot_watchdog.py'
      - 'research/kalman_daily20/test_scheduled_slot_watchdog.py'
      - '.github/workflows/kalman-daily20-slot-watchdog.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: daily20-slot-watchdog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exchange calendar used by actual Daily20 research
        run: |
          python -m pip install --disable-pip-version-check \
            'exchange-calendars==4.13.3'
      - name: Offline fail-closed first/replay heartbeat falsification
        run: |
          cd research/kalman_daily20
          python -m unittest -v test_scheduled_slot_watchdog.py
          python -m py_compile scheduled_slot_watchdog.py
      - name: PR smoke of exact GitHub schedule-filter API (read-only; not prospective proof)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          import sys
          sys.path.insert(0, "research/kalman_daily20")
          from ops_readiness import api
          url = (
              "https://api.github.com/repos/kimtk94/Codex/actions/workflows/"
              "kalman-daily20.yml/runs"
              "?branch=main&event=schedule&created=2026-11-21&per_page=100"
          )
          data = api(url, os.environ["GH_TOKEN"])
          assert isinstance(data, dict) and isinstance(data.get("workflow_runs"), list)
          print("DAILY20_SCHEDULE_FILTER_API_ROUTE_PASS",
                "entries", len(data["workflow_runs"]),
                "PR_SMOKE_NOT_PROSPECTIVE_EVIDENCE")
          PY
      - name: Audit today's two ORIGINAL GitHub scheduled runs and remote evidence
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python research/kalman_daily20/scheduled_slot_watchdog.py \
            --out output/daily20/scheduled_slot_watchdog/report.json
      - name: Preserve failure OR success evidence without modifying Drive
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: kalman-daily20-two-slot-heartbeat
          path: output/daily20/scheduled_slot_watchdog/report.json
          if-no-files-found: warn
          retention-days: 90
