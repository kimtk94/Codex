name: SFDC Quote Contact Candidate Audit
on:
  workflow_dispatch:
  schedule:
    - cron: "27,57 * * * *"
  push:
    branches: [main]
    paths:
      - automation/feishu/.trigger-quote-contact-audit
permissions:
  contents: read
jobs:
  audit:
    environment: TaehoonServer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m pip install google-auth requests
      - name: Offline synthetic regression
        run: python3 automation/feishu/test_sfdc_quote_contact_candidate_audit.py
      - name: Compare Quote candidates and Opportunity names read-only
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: python3 automation/feishu/sfdc_quote_contact_candidate_audit.py
