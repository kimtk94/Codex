name: QQ Confirmation Statement Amount Probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/css_mail/confirmation_statement_amount_probe.py'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 10
    env:
      CSS_QQ_MAIL_ADDRESS: ${{ secrets.CSS_QQ_MAIL_ADDRESS }}
      CSS_QQ_MAIL_AUTH_CODE: ${{ secrets.CSS_QQ_MAIL_AUTH_CODE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install beautifulsoup4
      - run: python automation/css_mail/confirmation_statement_amount_probe.py
