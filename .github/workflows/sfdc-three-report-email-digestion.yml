name: SFDC Three Report Mail Digestion
on:
  workflow_dispatch:
    inputs:
      apply_staging:
        description: 'Write validated raw reports into isolated SFDC Email staging tabs'
        type: boolean
        default: false
  schedule:
    - cron: '40 0,3,8 * * *' # 09:40, 12:40, 17:40 KST; mail delivery may lag
  push:
    branches: [main]
    paths:
      - 'automation/sfdc/three_report_email_ingest.py'
      - 'automation/sfdc/three_report_relationship_qc.py'
      - 'automation/sfdc/three_report_verified_views.py'
      - 'automation/sfdc/three_report_mail_evidence.py'
      - 'automation/sfdc/three_report_thread_evidence.py'
      - 'automation/sfdc/test_three_report_thread_evidence.py'
      - 'automation/sfdc/test_three_report_mail_evidence.py'
      - 'automation/sfdc/test_three_report_verified_views.py'
      - '.github/workflows/sfdc-three-report-email-digestion.yml'
  pull_request:
    paths:
      - 'automation/sfdc/three_report_mail_evidence.py'
      - 'automation/sfdc/test_three_report_mail_evidence.py'
      - 'automation/sfdc/three_report_verified_views.py'
      - 'automation/sfdc/test_three_report_verified_views.py'
      - 'automation/sfdc/three_report_email_ingest.py'
      - 'automation/sfdc/test_three_report_email_ingest.py'
      - 'automation/sfdc/three_report_relationship_qc.py'
      - '.github/workflows/sfdc-three-report-email-digestion.yml'
permissions:
  contents: read
concurrency:
  group: sales-weekly-writer
  cancel-in-progress: false
jobs:
  validate-and-stage:
    environment: TaehoonServer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CSS_QQ_MAIL_ADDRESS: ${{ secrets.CSS_QQ_MAIL_ADDRESS }}
      CSS_QQ_MAIL_AUTH_CODE: ${{ secrets.CSS_QQ_MAIL_AUTH_CODE }}
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
      SFDC_REQUIRE_ALL_REPORTS: 'false'
      SFDC_REPORT_DRY_RUN: ${{ github.event_name == 'pull_request' && 'true' || (github.event_name == 'workflow_dispatch' && inputs.apply_staging != true) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'openpyxl>=3.1,<4' 'google-auth>=2.20,<3' 'requests>=2.31,<3'
      - name: Run offline parser regression tests
        run: python automation/sfdc/test_three_report_email_ingest.py
      - name: Test verified relation views
        run: python automation/sfdc/test_three_report_verified_views.py
      - name: Test directional QQ mail evidence offline
        run: python automation/sfdc/test_three_report_mail_evidence.py
      - name: Test exact subject identifier audit offline
        run: python automation/sfdc/test_three_report_thread_evidence.py
      - name: Read authorized subscription mail and conditionally stage
        if: ${{ github.event_name != 'pull_request' }}
        run: python automation/sfdc/three_report_email_ingest.py
      - name: Audit staged Lead-Opportunity-Quote relationships (read only)
        if: ${{ github.event_name != 'pull_request' }}
        run: python automation/sfdc/three_report_relationship_qc.py
      - name: Refresh generated SFDC relationship views
        if: github.event_name != 'pull_request'
        env:
          SFDC_RELATIONS_APPLY: 'true'
        run: python automation/sfdc/three_report_verified_views.py
      - name: Assess QQ mail contact evidence (read only)
        if: github.event_name != 'pull_request'
        env:
          SFDC_MAIL_EVIDENCE_APPLY: 'true'
        run: python automation/sfdc/three_report_mail_evidence.py
      - name: Check QQ exact ID thread evidence (read only)
        if: github.event_name != 'pull_request'
        env:
          SFDC_THREAD_EVIDENCE_APPLY: 'true'
        run: python automation/sfdc/three_report_thread_evidence.py
