name: Kalman Parquet QA
on:
  pull_request:
    paths:
      - 'research/market_tool_lab/parquet_history_audit.py'
      - 'research/market_tool_lab/test_parquet_history_audit.py'
      - '.github/workflows/market-parquet-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parquet-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install 'pandas>=2,<3' 'pyarrow>=16,<23'
      - run: python3 -m unittest discover -s research/market_tool_lab -p 'test_parquet_history_audit.py' -v
