name: multi-organ-aging-ci

on:
  push:
    paths:
      - "master_degree/multi_organ_aging/**"
      - ".github/workflows/multi-organ-aging-ci.yml"
  pull_request:
    paths:
      - "master_degree/multi_organ_aging/**"
      - ".github/workflows/multi-organ-aging-ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r master_degree/multi_organ_aging/requirements.txt

      - name: Compile Python
        run: |
          python -m compileall master_degree/multi_organ_aging/src

      - name: Run unit tests
        run: |
          pytest -q master_degree/multi_organ_aging/tests

      - name: Validate shell scripts
        run: |
          bash -n master_degree/multi_organ_aging/scripts/run_pipeline.sh
          bash -n master_degree/multi_organ_aging/scripts/sync_gdrive.sh
