name: multi-organ-aging-ci

on:
  push:
    branches:
      - main
      - "research/multi-organ-aging-*"
    paths:
      - "research/multi_organ_aging/**"
      - ".github/workflows/multi-organ-aging-ci.yml"
  pull_request:
    paths:
      - "research/multi_organ_aging/**"
      - ".github/workflows/multi-organ-aging-ci.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python syntax
        run: |
          python -m compileall -q research/multi_organ_aging/src research/multi_organ_aging/scripts
      - name: Shell syntax
        run: |
          bash -n research/multi_organ_aging/scripts/00_init_project.sh
          bash -n research/multi_organ_aging/scripts/run_all.sh
          bash -n research/multi_organ_aging/scripts/run_pipeline.sh
          bash -n research/multi_organ_aging/scripts/update_from_git.sh
          bash -n research/multi_organ_aging/scripts/90_sync_drive.sh
