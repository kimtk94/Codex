name: SFDC Oppo-Quote web preview (no CRM writes)
on:
  push:
    branches:
      - feat/sfdc-web-preview-mainline-20261106
    paths:
      - 'masteros/web/**'
      - 'automation/sfdc/contact_lookup_source_gate.py'
      - 'automation/sfdc/test_contact_lookup_source_gate.py'
      - 'automation/sfdc_desktop/contact_preview_export.py'
      - 'automation/sfdc_desktop/test_contact_preview_export.py'
      - 'automation/sfdc_desktop/quote_custom_fee_guard.py'
      - 'automation/sfdc_desktop/test_quote_custom_fee_guard.py'
      - 'automation/sfdc_desktop/quote_fee_source_guard.py'
      - 'automation/sfdc_desktop/test_quote_fee_source_guard.py'
      - 'automation/sfdc_desktop/quote_native_process_guard.py'
      - 'automation/sfdc_desktop/test_quote_native_process_guard.py'
      - 'automation/sfdc_desktop/quote_native_reference_resolution.py'
      - 'automation/sfdc_desktop/test_quote_native_reference_resolution.py'
      - 'automation/sfdc_desktop/oppo_quote_save_preflight.py'
      - 'automation/sfdc_desktop/test_oppo_quote_save_preflight.py'
      - 'automation/sfdc_desktop/native_save_transaction.py'
      - 'automation/sfdc_desktop/test_native_save_transaction.py'
      - 'automation/sfdc_desktop/SFDC_OPERATOR_RULES.md'
      - 'automation/sfdc_desktop/test_sfdc_operator_contract.py'
      - 'automation/sfdc_desktop/quote_native_save_source_audit.py'
      - 'automation/sfdc_desktop/quote_native_save_source_audit_cli.py'
      - 'automation/sfdc_desktop/test_quote_native_save_source_audit.py'
      - '.github/workflows/sfdc-oppo-quote-web-preview.yml'
  pull_request:
    paths:
      - 'masteros/web/**'
      - 'automation/sfdc/contact_lookup_source_gate.py'
      - 'automation/sfdc/test_contact_lookup_source_gate.py'
      - 'automation/sfdc_desktop/contact_preview_export.py'
      - 'automation/sfdc_desktop/test_contact_preview_export.py'
      - 'automation/sfdc_desktop/quote_custom_fee_guard.py'
      - 'automation/sfdc_desktop/test_quote_custom_fee_guard.py'
      - 'automation/sfdc_desktop/quote_fee_source_guard.py'
      - 'automation/sfdc_desktop/test_quote_fee_source_guard.py'
      - 'automation/sfdc_desktop/quote_native_process_guard.py'
      - 'automation/sfdc_desktop/test_quote_native_process_guard.py'
      - 'automation/sfdc_desktop/quote_native_reference_resolution.py'
      - 'automation/sfdc_desktop/test_quote_native_reference_resolution.py'
      - 'automation/sfdc_desktop/oppo_quote_save_preflight.py'
      - 'automation/sfdc_desktop/test_oppo_quote_save_preflight.py'
      - 'automation/sfdc_desktop/native_save_transaction.py'
      - 'automation/sfdc_desktop/test_native_save_transaction.py'
      - 'automation/sfdc_desktop/SFDC_OPERATOR_RULES.md'
      - 'automation/sfdc_desktop/test_sfdc_operator_contract.py'
      - 'automation/sfdc_desktop/quote_native_save_source_audit.py'
      - 'automation/sfdc_desktop/quote_native_save_source_audit_cli.py'
      - 'automation/sfdc_desktop/test_quote_native_save_source_audit.py'
      - '.github/workflows/sfdc-oppo-quote-web-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-web-draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: masteros/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify SFDC source gate with synthetic evidence
        run: |
          python3 -m unittest discover -s ../../automation/sfdc -p 'test_contact_lookup_source_gate.py' -v
          python3 -m py_compile ../../automation/sfdc/contact_lookup_source_gate.py
          python3 -m unittest discover -s ../../automation/sfdc_desktop -p 'test_contact_preview_export.py' -v
          python3 -m py_compile ../../automation/sfdc_desktop/contact_preview_export.py
          python3 -m unittest discover -s ../../automation/sfdc_desktop -p 'test_quote_custom_fee_guard.py' -v
          python3 -m py_compile ../../automation/sfdc_desktop/quote_custom_fee_guard.py
          python3 -m unittest discover -s ../../automation/sfdc_desktop -p 'test_quote_fee_source_guard.py' -v
          python3 -m py_compile ../../automation/sfdc_desktop/quote_fee_source_guard.py
          python3 -m unittest discover -s ../../automation/sfdc_desktop -p 'test_quote_native_process_guard.py' -v
          python3 -m py_compile ../../automation/sfdc_desktop/quote_native_process_guard.py
          python3 -m unittest discover -s ../../automation/sfdc_desktop -p 'test_quote_native_reference_resolution.py' -v
          python3 -m py_compile ../../automation/sfdc_desktop/quote_native_reference_resolution.py scripts/sfdc_held_quote_process_reference_audit.py
          python3 -m unittest discover -s ../../automation/sfdc_desktop -p 'test_oppo_quote_save_preflight.py' -v
          python3 -m py_compile ../../automation/sfdc_desktop/oppo_quote_save_preflight.py
          python3 -m unittest discover -s ../../automation/sfdc_desktop -p 'test_native_save_transaction.py' -v
          python3 -m unittest discover -s ../../automation/sfdc_desktop -p 'test_sfdc_operator_contract.py' -v
          python3 -m py_compile ../../automation/sfdc_desktop/native_save_transaction.py scripts/sfdc_native_approved_save.py
          python3 -m unittest discover -s ../../automation/sfdc_desktop -p 'test_quote_native_save_source_audit.py' -v
          python3 -m py_compile ../../automation/sfdc_desktop/quote_native_save_source_audit.py ../../automation/sfdc_desktop/quote_native_save_source_audit_cli.py
          python3 -m unittest discover -s scripts -p 'test_sfdc_quote_fee_source.py' -v
          python3 -m py_compile scripts/sfdc_quote_fee_source.py
      - name: Install isolated web dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit, local readback privacy and no-Save checks
        run: |
          npm run test:sfdc
          node --test tests/sfdc-queue-issued-supersession.test.mjs
          node --check scripts/sfdc_supersede_queue_quote_issued.mjs
          node --test tests/sfdc-pair-auto-krw-request.test.mjs
          node --test tests/sfdc-pair-native-create-local.test.mjs
          node --test tests/sfdc-quote-fees.test.mjs
          python3 -m unittest discover -s scripts -p test_sfdc_parallel_ui_check.py -v
          python3 -m py_compile scripts/sfdc_parallel_ui_check.py
          python3 -m unittest discover -s scripts -p test_sfdc_paired_native_create.py -v
          python3 -m unittest discover -s scripts -p test_sfdc_prepare_unsaved_opportunity.py -v
          python3 -m py_compile scripts/sfdc_native_process_writer.py scripts/sfdc_paired_native_create.py scripts/sfdc_action_executor.py
      - name: Compile Next.js draft workspace
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
      - name: Check production output route exists
        run: |
          node -e "const fs=require('fs'); if (!fs.existsSync('.next/server/app/sales/oppo-quote')) { throw new Error('Oppo-Quote compiled route missing') } if (!fs.existsSync('.next/server/app/sales/oppo-quote/new')) { throw new Error('General Oppo-Quote intake compiled route missing') }"
      - name: Install isolated synthetic-browser test tooling
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Install Chromium for synthetic-browser smoke test
        run: npx playwright install --with-deps chromium
      - name: Verify local Contact evidence browser flow, PE250 units and zero CRM writes
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          node --test tests/sfdc-oppo-quote.e2e.mjs
          node --test tests/sfdc-approval-console.e2e.mjs
