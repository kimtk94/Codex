name: Kalman Regime Countertrend Research
on:
  push:
    branches: [main, research/regime-countertrend-ci-20261102]
    paths:
      - 'research/regime_countertrend/**'
      - '.github/workflows/regime-countertrend-research.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research/regime_countertrend/**'
      - '.github/workflows/regime-countertrend-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas scipy gdown
      - name: Unit and leakage tests
        run: python -m unittest discover -s research/regime_countertrend -p 'test_*.py' -v
      - name: Retrieve Google Drive research CSV (read-only)
        env:
          DRIVE_FILE_ID: 1v9mM0l0-jLpXu81v6wfwJXHK3kSREsL-
        shell: bash
        run: |
          mkdir -p research/regime_countertrend/data results/regime_countertrend
          python - <<'PY'
          import os
          from pathlib import Path
          try:
              import gdown
              import pandas as pd
              path=Path("research/regime_countertrend/data/QLD_QQQ_daily_alignment.csv")
              gdown.download(id=os.environ["DRIVE_FILE_ID"],output=str(path),quiet=True)
              if not path.exists(): raise ValueError("CSV absent")
              df=pd.read_csv(path)
              if not {"date_ny","close_qld","close_qqq"}.issubset(df.columns) or len(df)<200:
                  raise ValueError("invalid CSV schema/row count")
              print("DATA_OK",len(df),str(path))
          except Exception as exc:
              print("DATA_HOLD",type(exc).__name__,str(exc)[:250])
              Path("research/regime_countertrend/data/QLD_QQQ_daily_alignment.csv").unlink(missing_ok=True)
              Path("results/regime_countertrend/summary.json").write_text('{"status":"HOLD","reason":"Google Drive research CSV unavailable or invalid"}')
          PY
      - name: Compute research output only if data validated
        shell: bash
        run: |
          if [ -f "research/regime_countertrend/data/QLD_QQQ_daily_alignment.csv" ]; then
            python -m research.regime_countertrend.analyze --csv research/regime_countertrend/data/QLD_QQQ_daily_alignment.csv --out results/regime_countertrend
            python -m research.regime_countertrend.failure_diagnostics --csv research/regime_countertrend/data/QLD_QQQ_daily_alignment.csv --out results/regime_countertrend/failures
            python -m research.regime_countertrend.failure_stats --csv results/regime_countertrend/failures/trades.csv --out results/regime_countertrend/stats
            python -m research.regime_countertrend.gate_audit --csv results/regime_countertrend/failures/trades.csv --out results/regime_countertrend/gate
          else
            echo 'HOLD: source inaccessible'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: regime-countertrend-results
          path: results/regime_countertrend/
