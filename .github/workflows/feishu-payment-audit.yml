name: Feishu Payment Table Audit
on:
  workflow_dispatch:
  schedule:
    - cron: '13 0 * * *' # approx 09:13 KST daily; GitHub scheduling may be delayed
  push:
    branches: [main]
    paths:
      - automation/feishu/.trigger-payment-audit
permissions:
  contents: read
concurrency:
  group: feishu-payment-audit
  cancel-in-progress: false
jobs:
  inspect:
    # GitHub Environment stores Feishu credentials; no access to a physical server.
    environment: TaehoonServer
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Inspect existing Payment Outstanding table
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BASE_APP_TOKEN: ${{ secrets.FEISHU_BASE_APP_TOKEN }}
          FEISHU_AUDIT_FIELD_NAMES: '1'
        run: python3 automation/feishu/payment_table_audit.py
      - name: Discover current monthly eTAX unissued invoice table
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BASE_APP_TOKEN: ${{ secrets.FEISHU_BASE_APP_TOKEN }}
        run: python3 automation/feishu/etax_monthly_audit.py
