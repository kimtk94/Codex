name: Feishu Payment Table Audit
on:
  workflow_dispatch:
  schedule:
    - cron: '13 0 * * *' # 09:13 KST; source names can be undated
  push:
    branches: [main]
    paths:
      - 'automation/feishu/etax_monthly_audit.py'
      - 'automation/feishu/test_etax_monthly_audit.py'
      - 'automation/feishu/etax_dated_sheet_audit.py'
      - 'automation/feishu/test_etax_dated_sheet_audit.py'
      - 'automation/feishu/etax_base_sheet_crosswalk.py'
      - 'automation/feishu/test_etax_base_sheet_crosswalk.py'
      - 'automation/ops/feishu_etax_personal_qq_coverage.py'
      - 'automation/ops/test_feishu_etax_personal_qq_coverage.py'
      - 'automation/feishu/payment_table_audit.py'
      - '.github/workflows/feishu-payment-audit.yml'
  pull_request:
    paths:
      - 'automation/feishu/etax_monthly_audit.py'
      - 'automation/feishu/test_etax_monthly_audit.py'
      - 'automation/feishu/etax_dated_sheet_audit.py'
      - 'automation/feishu/test_etax_dated_sheet_audit.py'
      - 'automation/feishu/etax_base_sheet_crosswalk.py'
      - 'automation/feishu/test_etax_base_sheet_crosswalk.py'
      - 'automation/ops/feishu_etax_personal_qq_coverage.py'
      - 'automation/ops/test_feishu_etax_personal_qq_coverage.py'
      - 'automation/feishu/payment_table_audit.py'
      - '.github/workflows/feishu-payment-audit.yml'
permissions:
  contents: read
concurrency:
  group: feishu-payment-audit
  cancel-in-progress: false
jobs:
  offline:
    name: Offline monthly-name and undated-source safeguards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Google client for offline invoice-parser imports
        run: python -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3'
      - name: Exact month vs undated candidate tests
        run: |
          python automation/feishu/test_etax_monthly_audit.py
          python automation/feishu/test_etax_dated_sheet_audit.py
          python -m unittest discover -s automation/feishu -p 'test_etax_base_sheet_crosswalk.py' -v
          python -m unittest discover -s automation/ops -p 'test_feishu_etax_personal_qq_coverage.py' -v
  payment:
    name: Payment Outstanding source schema only (not paid)
    needs: offline
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 9
    env:
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_BASE_APP_TOKEN: ${{ secrets.FEISHU_BASE_APP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read Payment Outstanding ID/amount/status field presence
        run: python automation/feishu/payment_table_audit.py
      - name: Never convert status into bank paid
        if: always()
        run: echo 'PAYMENT_SCHEMA_ONLY;BANK_RECEIPT_NOT_CERTIFIED;NO_SOURCE_WRITE' >> "$GITHUB_STEP_SUMMARY"
  dated_etax:
    name: eTax dated monthly worksheet - schema and freshness evidence
    needs: offline
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 9
    env:
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read original dated eTax worksheet structure and source age only
        run: python automation/feishu/etax_dated_sheet_audit.py
      - name: Do not certify issued month from a dated snapshot
        if: always()
        run: echo 'DATED_SHEET_IS_SNAPSHOT_ONLY;STALE_DATE_REVIEW;NO_PAYMENT_SETTLEMENT_CERTIFIED' >> "$GITHUB_STEP_SUMMARY"
  crosswalk:
    name: Original Feishu Base vs dated eTax ID and amount crosswalk
    needs: offline
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 12
    env:
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_BASE_APP_TOKEN: ${{ secrets.FEISHU_BASE_APP_TOKEN }}
      CKD_DRIVE_SA_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Google read-only-source and dedicated generated-audit writer
        run: python -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3'
      - name: Assert safe exact-key and stale-snapshot join regression tests
        run: python -m unittest discover -s automation/feishu -p 'test_etax_base_sheet_crosswalk.py' -v
      - name: Compare two live Feishu originals and publish generated exception evidence only
        run: python automation/feishu/etax_base_sheet_crosswalk.py
      - name: Compare dated-only eTax with verified personal QQ originals
        run: python automation/ops/feishu_etax_personal_qq_coverage.py
      - name: No bank paid, monthly issuance or Revenue Actual implication
        if: always()
        run: echo 'MATCHED_SNAPSHOT_IS_NOT_CURRENT_MONTH_ISSUANCE;NOT_BANK_SETTLEMENT;NO_REVENUE_ACTUAL_CHANGE' >> "$GITHUB_STEP_SUMMARY"
  etax:
    name: Current month eTax proof - fail closed if undated
    needs: offline
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 9
    env:
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_BASE_APP_TOKEN: ${{ secrets.FEISHU_BASE_APP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read exact current-month eTax source or reject undated generic
        run: python automation/feishu/etax_monthly_audit.py
      - name: Preserve clear source boundary even on blocked proof
        if: always()
        run: echo 'UNDATED_BASE_CANDIDATE_IS_NOT_ISSUANCE;NO_SILENT_FALLBACK;NO_PRODUCTION_OR_REVENUE_APPROVAL' >> "$GITHUB_STEP_SUMMARY"
