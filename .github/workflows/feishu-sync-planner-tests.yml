name: Feishu Sync Planner Offline Tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - automation/feishu/sync_planner.py
      - automation/feishu/test_sync_planner.py
      - .github/workflows/feishu-sync-planner-tests.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test no-write reconciliation planner
        run: python3 automation/feishu/test_sync_planner.py
