name: Kalman Market Tool Lab - Offline Data Audit
on:
  pull_request:
    paths:
      - 'research/market_tool_lab/**'
      - '.github/workflows/market-tool-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests (no external APIs)
        run: python3 -m unittest discover -s research/market_tool_lab -p 'test_*.py' -v
      - name: Compile
        run: python3 -m py_compile research/market_tool_lab/ohlcv_audit.py
