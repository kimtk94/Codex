name: Kalman Hub Ledger Semantics Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "kalman-toss-gateway/scripts/deploy_investment_hub_ledger_semantics_ci.sh"
      - "kalman-toss-gateway/scripts/ledger_semantics_patch.js"
      - ".github/workflows/kalman-hub-ledger-deploy.yml"

permissions:
  contents: read

concurrency:
  group: kalman-hub-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_eklxTMfdySLBHexmheTiWGCE
      VERCEL_TEAM_SLUG: insk1285-9320s-projects
      VERCEL_PROJECT_ID: prj_KCDIl7qLqtBloI7pjRFQk2Itq7V1
      KALMAN_HUB_BASE_DEPLOYMENT: dpl_99ZABqst9m2kpnphkYkLJ5gJ1RQs
      KALMAN_HUB_VERSION_TAG: vNext.7.4.16

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Vercel credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "VERCEL_TOKEN repository secret is not configured" >&2; exit 2; }

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.16.0

      - name: Deploy candidate, smoke-test, and promote
        shell: bash
        run: |
          set -euo pipefail
          chmod +x kalman-toss-gateway/scripts/deploy_investment_hub_ledger_semantics_ci.sh
          kalman-toss-gateway/scripts/deploy_investment_hub_ledger_semantics_ci.sh
