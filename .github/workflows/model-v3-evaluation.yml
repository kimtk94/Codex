name: Kalman Model V3 Evaluation Contract

on:
  pull_request:
    paths:
      - "kalman-toss-gateway/config/model-v3-evaluation-spec.json"
      - "kalman-toss-gateway/research/model_v3/**"
      - "kalman-toss-gateway/tests/test_model_v3_evaluation.py"
      - ".github/workflows/model-v3-evaluation.yml"
  push:
    branches: [main]
    paths:
      - "kalman-toss-gateway/config/model-v3-evaluation-spec.json"
      - "kalman-toss-gateway/research/model_v3/**"
      - "kalman-toss-gateway/tests/test_model_v3_evaluation.py"
      - ".github/workflows/model-v3-evaluation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: kalman-toss-gateway

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy pyarrow

      - name: Compile V3 evaluation modules
        run: |
          python -m compileall research/model_v3
          python -m py_compile tests/test_model_v3_evaluation.py

      - name: Validate evaluation spec
        run: python -m json.tool config/model-v3-evaluation-spec.json >/dev/null

      - name: Run V3 evaluation tests
        env:
          PYTHONPATH: .
        run: python -m unittest tests.test_model_v3_evaluation -v

      - name: Validate research isolation
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path("research/model_v3/evaluation.py"),
              Path("research/model_v3/evaluate_score_file.py"),
          ]
          text = "\n".join(p.read_text() for p in files)
          forbidden = [
              "run_auto_trade",
              "toss_execution",
              "DATABASE_URL_WRITER",
              "strategy_signal_write",
              "dashboard_snapshot_write",
          ]
          for marker in forbidden:
              assert marker not in text, marker

          spec = Path("config/model-v3-evaluation-spec.json").read_text()
          assert '"research_only": true' in spec
          assert '"2026-09-23T00:00:00"' in spec
          print("[PASS] V3 evaluation contract remains research-only and forward-locked")
          PY
