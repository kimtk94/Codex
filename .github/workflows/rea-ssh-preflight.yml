name: REA SSH Preflight (Read Only)

on:
  workflow_dispatch:
  push:
    branches:
      - feat/rea-isolated-pilot-20261017
    paths:
      - '.github/workflows/rea-ssh-preflight.yml'
      - 'experiments/rea/rea_preflight.sh'

permissions:
  contents: read

jobs:
  rea-preflight:
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Configure existing SSH credentials
        env:
          SSH_HOST: ${{ secrets.SERVER_SSH_HOST }}
          SSH_USER: ${{ secrets.SERVER_SSH_USER }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          names=('SSH_HOST','SSH_USER','SSH_KEY','SSH_KNOWN_HOSTS')
          if not all(os.environ.get(k) for k in names):
              raise SystemExit('REQUIRED_SSH_SECRETS_MISSING')
          base=Path.home()/'.ssh'
          base.mkdir(mode=0o700,exist_ok=True)
          key=os.environ['SSH_KEY'].strip().replace(chr(92)+'n',chr(10)).replace(chr(13)+chr(10),chr(10)).replace(chr(13),chr(10))
          if not key.startswith(('-----BEGIN OPENSSH PRIVATE KEY-----','-----BEGIN RSA PRIVATE KEY-----','-----BEGIN EC PRIVATE KEY-----')):
              raise SystemExit('INVALID_SSH_KEY_FORMAT')
          path=base/'server_key'
          path.write_text(key+chr(10))
          path.chmod(0o600)
          hosts=base/'known_hosts'
          hosts.write_text(os.environ['SSH_KNOWN_HOSTS'].strip()+chr(10))
          hosts.chmod(0o600)
          subprocess.run(['ssh-keygen','-y','-P','','-f',str(path)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          print('SSH_KEY_VALIDATED')
          PY
      - name: Run repository preflight over SSH (no server writes)
        env:
          SSH_HOST: ${{ secrets.SERVER_SSH_HOST }}
          SSH_USER: ${{ secrets.SERVER_SSH_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 \
            -o ForwardAgent=no -o IdentitiesOnly=yes \
            -i "$HOME/.ssh/server_key" "$SSH_USER@$SSH_HOST" \
            'bash -s' < experiments/rea/rea_preflight.sh
