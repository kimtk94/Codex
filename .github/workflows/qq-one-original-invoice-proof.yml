name: QQ One Original Invoice Proof
# Single historical source-mail evidence gate after MIME tuple restore
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qq-one-original-invoice-proof.yml'
permissions:
  contents: read
jobs:
  verify-one:
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 10
    env:
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
      CSS_QQ_MAIL_ADDRESS: ${{ secrets.CSS_QQ_MAIL_ADDRESS }}
      CSS_QQ_MAIL_AUTH_CODE: ${{ secrets.CSS_QQ_MAIL_AUTH_CODE }}
      CSS_INVOICE_PROOF_BATCH: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install google-auth requests
      - run: python -m py_compile automation/css_mail/test_qq_mime_literal.py
      - run: python -m unittest discover -s automation/css_mail -p test_qq_mime_literal.py
      - run: python automation/css_mail/original_invoice_imap_proof.py
