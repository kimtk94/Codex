name: Kalman P1 Tool Experiments

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'automation/tool_adoption/p1_smoke.py'
      - '.github/workflows/tool-adoption-p1-experiments.yml'

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated document dependencies
        run: python -m pip install 'markitdown[docx]' python-docx
      - name: Run P1 experiments
        run: python3 automation/tool_adoption/p1_smoke.py --test all --output /tmp/kalman-p1-results.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalman-p1-tool-results
          path: /tmp/kalman-p1-results.json
          if-no-files-found: warn
          retention-days: 14
