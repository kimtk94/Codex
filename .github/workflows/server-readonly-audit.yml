name: Server Read-Only Audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/audit-triggers/server-readonly-*'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 5
    steps:
      - name: Validate SSH configuration
        env:
          SSH_HOST: ${{ secrets.SERVER_SSH_HOST }}
          SSH_USER: ${{ secrets.SERVER_SSH_USER }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
        run: |
          for var in SSH_HOST SSH_USER SSH_KEY SSH_KNOWN_HOSTS; do
            if [ -z "${!var}" ]; then
              echo "::error::Required SSH secret is missing"
              exit 1
            fi
          done
          install -m 700 -d "$HOME/.ssh"
          python3 - <<'PY'
          import os
          from pathlib import Path
          raw = os.environ["SSH_KEY"].strip()
          if "\\n" in raw and "\n" not in raw:
              raw = raw.replace("\\n", "\n")
          raw = raw.replace("\r\n", "\n").replace("\r", "\n")
          if not (raw.startswith("-----BEGIN OPENSSH PRIVATE KEY-----") or
                  raw.startswith("-----BEGIN RSA PRIVATE KEY-----") or
                  raw.startswith("-----BEGIN EC PRIVATE KEY-----")):
              raise SystemExit("SSH_KEY_FORMAT_INVALID: SERVER_SSH_KEY must contain the full private key, not a filename or public key")
          Path.home().joinpath(".ssh/server_key").write_text(raw + "\n")
          print("SSH_KEY_STRUCTURE_OK")
          PY
          chmod 600 "$HOME/.ssh/server_key"
          if ! ssh-keygen -y -P "" -f "$HOME/.ssh/server_key" > /dev/null 2>&1; then
            echo "::error::SSH_KEY_UNUSABLE: malformed, incomplete, or passphrase-protected private key"
            exit 1
          fi
          echo "SSH_KEY_VALIDATED"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -o IdentitiesOnly=yes -i "$HOME/.ssh/server_key" \
            "$SSH_USER@$SSH_HOST" \
            'printf "HOST: "; hostname; printf "TIME: "; date -u; printf "DISK:\n"; df -h /; printf "MEMORY:\n"; free -h; printf "UPTIME:\n"; uptime'
