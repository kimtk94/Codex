name: Novogene CSS Portfolio Visibility Regression

on:
  push:
    branches:
      - 'audit/novogene-css-sif-staging-20261014'
    paths:
      - '.github/workflows/novogene-css-portfolio-policy-regression.yml'
      - 'css-upgrade/staging-20261014/portfolio_policy_regression.py'
      - 'css-upgrade/staging-20261014/novogene_sif_portfolio_visibility.patch'
      - 'css-upgrade/staging-20261014/novogene_sif_manual_override_collision.patch'

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify SSH configuration
        env:
          SSH_HOST: ${{ secrets.SERVER_SSH_HOST }}
          SSH_USER: ${{ secrets.SERVER_SSH_USER }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ] || [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::Missing SSH config"; exit 1
          fi
          install -m 700 -d "$HOME/.ssh"
          python3 - <<'PY'
          import os
          from pathlib import Path
          raw = os.environ["SSH_KEY"].strip()
          if "\\n" in raw and "\n" not in raw:
              raw = raw.replace("\\n","\n")
          raw=raw.replace("\r\n","\n").replace("\r","\n")
          if not raw.startswith(("-----BEGIN OPENSSH PRIVATE KEY-----","-----BEGIN RSA PRIVATE KEY-----","-----BEGIN EC PRIVATE KEY-----")):
              raise SystemExit("SSH_KEY_FORMAT_INVALID")
          Path.home().joinpath(".ssh/server_key").write_text(raw+"\n")
          PY
          chmod 600 "$HOME/.ssh/server_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -P "" -f "$HOME/.ssh/server_key" > /dev/null 2>&1 || exit 1
      - name: Test triple-patch portfolio/action split, temp source only
        env:
          SSH_HOST: ${{ secrets.SERVER_SSH_HOST }}
          SSH_USER: ${{ secrets.SERVER_SSH_USER }}
        run: |
          PREFIX="/tmp/css-portfolio-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -i "$HOME/.ssh/server_key" "$SSH_USER@$SSH_HOST" "rm -f ${PREFIX}.py ${PREFIX}.history.patch ${PREFIX}.manual.patch ${PREFIX}.portfolio.patch" >/dev/null 2>&1 || true' EXIT
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -o IdentitiesOnly=yes -i "$HOME/.ssh/server_key" \
            css-upgrade/staging-20261014/portfolio_policy_regression.py "$SSH_USER@$SSH_HOST:${PREFIX}.py"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -o IdentitiesOnly=yes -i "$HOME/.ssh/server_key" \
            css-upgrade/staging-20261014/novogene_sif_history_candidate.patch "$SSH_USER@$SSH_HOST:${PREFIX}.history.patch"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -o IdentitiesOnly=yes -i "$HOME/.ssh/server_key" \
            css-upgrade/staging-20261014/novogene_sif_manual_override_collision.patch "$SSH_USER@$SSH_HOST:${PREFIX}.manual.patch"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -o IdentitiesOnly=yes -i "$HOME/.ssh/server_key" \
            css-upgrade/staging-20261014/novogene_sif_portfolio_visibility.patch "$SSH_USER@$SSH_HOST:${PREFIX}.portfolio.patch"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 \
            -o IdentitiesOnly=yes -i "$HOME/.ssh/server_key" "$SSH_USER@$SSH_HOST" \
            "/home/taehoon/services/novogene-css/.venv/bin/python '${PREFIX}.py' --source /home/taehoon/services/novogene-css/app/Novogene_Mail_CSS_DashBoard_server.py --history '${PREFIX}.history.patch' --manual '${PREFIX}.manual.patch' --portfolio '${PREFIX}.portfolio.patch'"
