name: Apply Kalman Runtime Decision Console Hotfix

on:
  workflow_dispatch:
    inputs:
      propose_pr:
        description: "Create a draft PR instead of preview only (manual approval required)"
        type: boolean
        required: false
        default: false
      approval_text:
        description: "For PR creation type APPROVE_RUNTIME_HOTFIX_PR"
        type: string
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "kalman-toss-gateway/scripts/runtime_hotfix_v7420_decision_console.js"
      - "kalman-toss-gateway/scripts/apply_runtime_hotfix_v7420.py"
      - "automation/kalman/prepare_runtime_hotfix_pr.py"
      - ".github/workflows/apply-kalman-runtime-hotfix.yml"
  pull_request:
    paths:
      - "kalman-toss-gateway/scripts/runtime_hotfix_v7420_decision_console.js"
      - "kalman-toss-gateway/scripts/apply_runtime_hotfix_v7420.py"
      - "automation/kalman/prepare_runtime_hotfix_pr.py"
      - ".github/workflows/apply-kalman-runtime-hotfix.yml"

# Preview is read-only. Proposal writes are granted only in a separate manual job.
permissions:
  contents: read

concurrency:
  group: kalman-runtime-manifest-hotfix
  cancel-in-progress: false

jobs:
  preview:
    name: Validate hotfix and publish proposed diff (no writes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate patch and verify JavaScript syntax
        run: python automation/kalman/prepare_runtime_hotfix_pr.py --repo . --out-dir "$RUNNER_TEMP/kalman-hotfix-preview"
      - name: Upload review-only patch and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalman-hotfix-preview-${{ github.run_id }}
          path: ${{ runner.temp }}/kalman-hotfix-preview/
          if-no-files-found: warn
          retention-days: 7

  proposal:
    name: Explicitly approved proposal branch and draft PR (no main push)
    needs: preview
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.propose_pr == true && inputs.approval_text == 'APPROVE_RUNTIME_HOTFIX_PR' && github.actor == 'kimtk94' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rebuild/verify approved proposal and open DRAFT PR only
        env:
          GH_TOKEN: ${{ github.token }}
          HOTFIX_PR_APPROVAL: ${{ inputs.approval_text }}
        run: python automation/kalman/prepare_runtime_hotfix_pr.py --repo . --out-dir "$RUNNER_TEMP/kalman-hotfix-proposal" --propose-pr
