name: Feishu offline preflight
on:
  push:
    paths:
      - 'integrations/feishu/**'
      - '.github/workflows/feishu-offline-preflight.yml'
  pull_request:
    paths:
      - 'integrations/feishu/**'
      - '.github/workflows/feishu-offline-preflight.yml'
      - '.github/workflows/feishu-*.yml'
      - '.github/workflows/qq-mail-feishu-sync.yml'
      - '.github/workflows/lead-outreach-chain.yml'
      - '.github/workflows/sif-evidence-tracker.yml'
      - 'automation/feishu/test_workflow_pr_concurrency.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile Feishu Python files
        run: python3 -m compileall -q integrations/feishu
      - name: Run isolated tests without credentials or network
        env:
          FEISHU_APP_ID: ""
          FEISHU_APP_SECRET: ""
        run: python3 -m unittest discover -s integrations/feishu -p 'test_*.py' -v
      - name: Verify PR isolation and unchanged production concurrency
        run: python3 -m unittest discover -s automation/feishu -p 'test_workflow_pr_concurrency.py' -v
