name: CSS Protected Preview Release Evidence (Read Only)
on:
  pull_request:
    paths:
      - 'automation/ops/css_preview_release_readonly_monitor.py'
      - 'automation/ops/test_css_preview_release_readonly_monitor.py'
      - '.github/workflows/css-preview-release-readonly.yml'
  push:
    branches: [main]
    paths:
      - 'automation/ops/css_preview_release_readonly_monitor.py'
      - 'automation/ops/test_css_preview_release_readonly_monitor.py'
      - '.github/workflows/css-preview-release-readonly.yml'
  schedule:
    - cron: '30 0 * * *' # 09:30 KST, Preview/head drift and SSO status
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  offline-contract:
    name: Fail-closed release-readiness unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s automation/ops -p 'test_css_preview_release_readonly_monitor.py' -v
  live-preview-evidence:
    name: Vercel Preview SHA + SSO + Sheet release gate (no approval)
    needs: offline-contract
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 8
    env:
      GH_READ_TOKEN: ${{ github.token }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CKD_DRIVE_SA_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install readonly OAuth client
        run: python -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3'
      - name: Retrieve protected Preview evidence without browser bypass or production deploy
        run: python automation/ops/css_preview_release_readonly_monitor.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: css-protected-preview-release-evidence
          path: audit-results/css-preview-release-evidence.json
          if-no-files-found: ignore
          retention-days: 14
