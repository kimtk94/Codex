name: SFDC Opportunity Catalog Read-only Smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog-smoke:
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install google-auth requests
      - name: Check existing secret mapping (no secret output)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Required TaehoonServer environment secret CKD_DRIVE_SA_JSON is unavailable."
            exit 1
          fi
      - name: Read catalog and validate counts without printing records
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "automation/sfdc_desktop")
          from catalog_reuse import load_sheet, dedupe
          rows = load_sheet()
          unique = dedupe(rows)
          if not unique:
              raise SystemExit("Catalog returned zero rows; check the Sheet share permission and formula")
          print("Catalog read-only PASS; source rows:", len(rows), "unique Opportunity IDs:", len(unique))
          PY
