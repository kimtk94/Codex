name: Kalman Calibration Offline Contracts (Research Only)
on:
  pull_request:
    paths:
      - 'research/kalman_calibration/**'
      - '.github/workflows/kalman-calibration-contracts.yml'
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 pandas==2.3.3 scikit-learn==1.8.0
      - name: Execute exact module and synthetic tests
        run: python -m unittest discover -s research/kalman_calibration -p 'test_*.py' -v
      - name: Verify source syntax
        run: python -m compileall -q research/kalman_calibration
