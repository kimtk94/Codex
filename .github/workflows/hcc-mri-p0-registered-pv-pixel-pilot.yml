name: HCC P0 MRI Registered PV Pixel and Locked-Feature Pilot

on:
  pull_request:
    paths:
      - "research/hcc/ci/mri_p0_raw_vs_registered_pv_radiomics_pilot.py"
      - ".github/workflows/hcc-mri-p0-registered-pv-pixel-pilot.yml"
      - "research/hcc/HCC_MRI_P0_2CASE_ACTUAL_SOURCE_SPACE_20261031.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hcc-mri-p0-registered-pv-pixels-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic:
    name: Pure voxel flips preserve exact intensity and do not mask true translation
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install orientation reader
        run: python -m pip install "numpy==1.26.4" "nibabel>=5.2,<6" requests
      - name: Offline negative path source transform and mutual information fixtures
        run: python research/hcc/ci/mri_p0_raw_vs_registered_pv_radiomics_pilot.py --offline-test

  real-source:
    name: Two public cases x 2 expert ROI readers x source raw/registered PV locked three features
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pin PyRadiomics benchmark extraction dependencies
        run: python -m pip install "numpy==1.26.4" "nibabel>=5.2,<6" "pyradiomics==3.1.0" requests
      - name: Reorient official registered PV voxels, compute native-vs-registered ROI values without MRI-RNA
        run: python research/hcc/ci/mri_p0_raw_vs_registered_pv_radiomics_pilot.py --radiomics --out-dir artifacts/hcc_p0_pv_comparison
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcc-mri-p0-native-versus-registered-pv-frozen-features
          path: |
            artifacts/hcc_p0_pv_comparison/*.csv
            artifacts/hcc_p0_pv_comparison/*.json
          if-no-files-found: warn
          retention-days: 30

  evidence:
    name: Prevent clinical promotion and confirm 8 real phase x reader source rows
    runs-on: ubuntu-latest
    needs: [synthetic, real-source]
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hcc-mri-p0-native-versus-registered-pv-frozen-features
          path: artifacts/p0
      - name: Confirm 3 prelocked features, no RNA inference, no raw pixels in artifacts
        run: |
          python3 - <<'PY'
          import csv, json, math, os
          from pathlib import Path
          folder=Path("artifacts/p0")
          with (folder/"hcc_mri_p0_raw_vs_registered_pv_features.csv").open() as f:
              rows=list(csv.DictReader(f))
          result=json.loads((folder/"hcc_mri_p0_raw_vs_registered_pv_summary.json").read_text())
          expected={"original_firstorder_Entropy","original_firstorder_InterquartileRange","original_glcm_Contrast"}
          assert len(rows)==8 and len({(r["patient_id"],r["reader"],r["phase"]) for r in rows})==8
          assert {r["patient_id"] for r in rows}=={"TCGA-BC-A10Y","TCGA-DD-A4NH"}
          assert {r["reader"] for r in rows}=={"rater1","rater2"}
          assert {r["phase"] for r in rows}=={"raw_pv","reoriented_art_pv"}
          assert set(result["feature_panel"])==expected
          assert result["three_locked_features_extracted"] is True
          assert all(r["MRI_RNA_eligible"]=="NOT_ASSESSED" for r in rows)
          assert all(float(r["corner_offset_mm"])<=0.5 for r in rows)
          assert all(math.isfinite(float(r[k])) for r in rows for k in expected)
          assert result["qualified_clinical_n"]=="NOT_ASSESSED"
          assert result["MRI_RNA_12_tests"]=="NOT_EXECUTED"
          assert result["source_nifti_exported"] is False
          assert result["claim_ceiling"]=="S0"
          lines=["## HCC P0 registered-phase actual pixel and three locked feature pilot",
                 "",f"- Source patients: {len(result['patients'])}; phase/rater rows: {len(rows)}",
                 "- ART-space orientation-only correction; no interpolation or raw NIfTI export",
                 "- Feature values descriptive; compare before any 14-case registered-PV re-extraction",
                 "- Biological eligibility/pretreatment/same-lesion: **HOLD**; MRI-RNA 0/12; S0",
                 "", "| Patient | NMI ART to raw PV | NMI ART to registered PV | NMI delta |",
                 "|---|---:|---:|---:|"]
          for x in result["patients"]:
              lines.append(f"| {x['patient_id']} | {x['nmi_native_pv_vs_art']} | {x['nmi_registered_pv_vs_art']} | {x['nmi_registered_minus_raw']} |")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("\n".join(lines)+"\n")
          print("HCC_MRI_REGISTERED_PV_REAL_VOXELS_3_LOCKED_FEATURES_DESCRIPTIVE_ONLY_PASS")
          PY
