name: Feishu Lead Action Queue Delta Refresh
# Low-impact Feishu-only polling. Checks manual Lead flags and changes ONLY
# the computed queue label when necessary. No QQ, CSS, SFDC or Google API reads.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply changed Lead priority labels after source and view safety checks'
        type: boolean
        default: false
  schedule:
    # 09:05-18:35 KST every 30 minutes on weekdays. Full checks retain
    # their existing schedule. GitHub schedule may occasionally be delayed.
    - cron: '5,35 0-9 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'automation/feishu/lead_action_delta_sync.py'
      - 'automation/feishu/lead_eligibility.py'
      - 'automation/feishu/test_lead_action_delta_sync.py'
      - 'automation/feishu/lead_delta_evidence.py'
      - 'automation/feishu/test_lead_delta_evidence.py'
      - '.github/workflows/feishu-lead-action-delta.yml'
  pull_request:
    paths:
      - 'automation/feishu/lead_action_delta_sync.py'
      - 'automation/feishu/lead_eligibility.py'
      - 'automation/feishu/test_lead_action_delta_sync.py'
      - 'automation/feishu/lead_delta_evidence.py'
      - 'automation/feishu/test_lead_delta_evidence.py'
      - '.github/workflows/feishu-lead-action-delta.yml'
permissions:
  contents: read
concurrency:
  group: isolated-lead-feishu-mail-description
  cancel-in-progress: false
jobs:
  safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test import dependencies
        run: python -m pip install 'google-api-python-client>=2,<3' 'google-auth>=2,<3' 'python-dateutil>=2.9,<3'
      - name: Validate fast delta safety tests
        run: |
          python -m py_compile automation/feishu/lead_action_delta_sync.py
          python -m unittest discover -s automation/feishu -p 'test_lead_action_delta_sync.py' -v
          python -m unittest discover -s automation/feishu -p 'test_lead_action_queue_views.py' -v
          python -m unittest discover -s automation/feishu -p 'test_lead_delta_evidence.py' -v
  feishu-delta:
    needs: safety-tests
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.head_commit.message == 'deploy-feishu-lead-delta') }}
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 15
    env:
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Feishu helper imports
        run: python -m pip install 'google-api-python-client>=2,<3' 'google-auth>=2,<3' 'python-dateutil>=2.9,<3'
      - name: Read-only check of Lead flags, source freshness, and derived changes
        run: |
          python automation/feishu/lead_action_delta_sync.py 2>&1 | tee lead-delta-preview.log
      - name: Apply only changed computed Lead queue labels and verify view IDs
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.apply == true) || (github.event_name == 'push' && github.event.head_commit.message == 'deploy-feishu-lead-delta') }}
        run: |
          python automation/feishu/lead_action_delta_sync.py --apply 2>&1 | tee lead-delta-apply.log
      - name: Write redacted audit evidence and job summary
        if: always()
        run: |
          python automation/feishu/lead_delta_evidence.py --preview lead-delta-preview.log --apply lead-delta-apply.log --out lead-delta-evidence.json
      - name: Retain Lead sync evidence for 30 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lead-delta-evidence-${{ github.run_id }}
          path: lead-delta-evidence.json
          if-no-files-found: error
          retention-days: 30
