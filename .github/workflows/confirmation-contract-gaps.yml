name: Confirmation Contract Gaps Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/css_mail/confirmation_contract_gaps.py'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 15
    env:
      CKD_DRIVE_SA_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install google-auth requests
      - run: python automation/css_mail/confirmation_contract_gaps.py
