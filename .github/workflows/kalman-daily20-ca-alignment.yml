name: Daily20 QLD-QQQ Historical CA Alignment Evidence (Read Only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/kalman_daily20/historical_ca_alignment_audit.py'
      - 'research/kalman_daily20/test_historical_ca_alignment_audit.py'
      - '.github/workflows/kalman-daily20-ca-alignment.yml'
  pull_request:
    paths:
      - 'research/kalman_daily20/historical_ca_alignment_audit.py'
      - 'research/kalman_daily20/test_historical_ca_alignment_audit.py'
      - '.github/workflows/kalman-daily20-ca-alignment.yml'
permissions:
  contents: read
concurrency:
  group: daily20-ca-historical-archive-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    # Repository secrets are scoped to this existing protected GitHub
    # environment. This label DOES NOT start or use an external server.
    environment: TaehoonServer
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline falsification and provenance contracts (never read Drive on PR)
        run: |
          cd research/kalman_daily20
          python -m unittest -v test_historical_ca_alignment_audit.py
          python -m py_compile historical_ca_alignment_audit.py
      - name: Install minimal Google Drive READ-ONLY dependencies
        if: github.event_name != 'pull_request'
        run: |
          python -m pip install --disable-pip-version-check \
            'google-api-python-client>=2,<3' \
            'google-auth>=2,<3'
      - name: Re-download original Drive historical archive and audit issuer-event residuals
        if: github.event_name != 'pull_request'
        env:
          CKD_DRIVE_SA_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
          GDRIVE_SA_JSON_B64: ${{ secrets.GDRIVE_SA_JSON_B64 }}
        run: |
          python research/kalman_daily20/historical_ca_alignment_audit.py \
            --out output/daily20/historical_ca_alignment/report.json
      - name: Preserve source/issuer HOLD proof, even on inaccessible Drive
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: daily20-historical-ca-alignment-hold
          path: output/daily20/historical_ca_alignment/report.json
          retention-days: 90
          if-no-files-found: warn
