name: QQ Pending Confirmation Amount Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['automation/css_mail/pending_confirmation_amount_audit.py']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 15
    env:
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
      CSS_QQ_MAIL_ADDRESS: ${{ secrets.CSS_QQ_MAIL_ADDRESS }}
      CSS_QQ_MAIL_AUTH_CODE: ${{ secrets.CSS_QQ_MAIL_AUTH_CODE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-auth requests
      - run: python -m py_compile automation/css_mail/pending_confirmation_amount_audit.py
      - run: python automation/css_mail/pending_confirmation_amount_audit.py
