name: Kalman Public Provider Cutoff Probe (Research Only)
on:
  pull_request:
    paths:
      - 'research/kalman_market_refresh/provider_cutoff_probe.py'
      - 'research/kalman_market_refresh/completed_session_policy.py'
      - '.github/workflows/kalman-public-cutoff-probe.yml'
permissions:
  contents: read
jobs:
  public-provider-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated public market tools
        run: >-
          python -m pip install --disable-pip-version-check
          'numpy==2.3.5' 'pandas==2.3.3' 'pyarrow==24.0.0'
          'exchange-calendars==4.13.3' 'yfinance[repair]==1.7.0' 'TA-Lib==0.7.1'
      - name: Compile read-only probe
        run: python -m py_compile research/kalman_market_refresh/provider_cutoff_probe.py
      - name: Actual public provider and TA-Lib probe
        run: >-
          python research/kalman_market_refresh/provider_cutoff_probe.py
          --out "${{ runner.temp }}/kalman-cutoff-probe/report.json"
      - name: Publish aggregate diagnostic metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalman-public-cutoff-probe-metadata
          path: ${{ runner.temp }}/kalman-cutoff-probe/report.json
          if-no-files-found: warn
          retention-days: 7
