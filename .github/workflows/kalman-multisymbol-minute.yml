name: Kalman Multi-Symbol Minute Research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kalman-multisymbol-minute.yml'
permissions:
  contents: read
jobs:
  research:
    name: "${{ matrix.symbol }} 1m diagnostic"
    environment: TaehoonServer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - symbol: TSLA
            file_id: 1TQaaCu0x96CcqF0wKoHHLLnZttRjgDbL
          - symbol: NVDA
            file_id: 1cUlmmpHw_yX3E7s1koQ_ZxizkiHKEb07
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas numpy pyarrow google-api-python-client google-auth pytest
      - name: Read-only cash sizing regression
        run: pytest -q research/kalman_triple_barrier/test_staggered_sweep.py research/kalman_triple_barrier/test_cash_ledger.py
      - name: Download raw bars privately
        env:
          CKD_DRIVE_SA_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
          GDRIVE_SA_JSON_B64: ${{ secrets.GDRIVE_SA_JSON_B64 }}
          INPUT_ID: ${{ matrix.file_id }}
        run: python research/kalman_triple_barrier/drive_input.py --file-id "$INPUT_ID" --output /tmp/minute_input.parquet
      - name: Validate exact minute bars
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python research/kalman_triple_barrier/minute_adapter.py --input /tmp/minute_input.parquet --symbol "$SYMBOL" --out /tmp/minute_input.csv
          mkdir -p outputs/multisymbol
          cp /tmp/minute_input.profile.json outputs/multisymbol/profile.json
      - name: Non-overlap and cash exposure audit
        run: |
          python research/kalman_triple_barrier/nonoverlap_diagnostic.py --bars /tmp/minute_input.csv --out outputs/multisymbol
          python research/kalman_triple_barrier/cash_ledger.py --bars /tmp/minute_input.csv --out outputs/multisymbol
      - name: Remove raw data
        if: always()
        run: rm -f /tmp/minute_input.csv /tmp/minute_input.parquet /tmp/minute_input.profile.json
      - name: Upload aggregate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minute-research-${{ matrix.symbol }}
          path: outputs/multisymbol/
          if-no-files-found: warn
          retention-days: 30
