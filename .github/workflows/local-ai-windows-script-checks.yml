name: Local AI - Windows launcher syntax checks

on:
  pull_request:
    paths:
      - "local_ai/**"
      - ".github/workflows/local-ai-windows-script-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-script-check:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows PowerShell launcher without executing installs
        shell: pwsh
        run: |
          $scripts = @(
            "local_ai\local-codex.ps1",
            "local_ai\bootstrap.ps1",
            "local_ai\connect-workspaces.ps1",
            "local_ai\drive-staging.ps1",
            "local_ai\set-ollama-context.ps1",
            "local_ai\verify-ollama-context.ps1",
            "local_ai\create-codex16k.ps1",
            "local_ai\diagnose-local-ollama-speed.ps1"
          )
          foreach ($file in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path, [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if (@($parseErrors).Count -gt 0) {
              $parseErrors | Format-List | Out-String | Write-Error
              throw "PowerShell parse failed: $file"
            }
            Write-Host "PowerShell parse PASS: $file"
          }
      - name: Validate one-click launchers and local-only defaults
        shell: pwsh
        run: |
          $required = @(
            "local_ai\Setup-Local-Codex.cmd",
            "local_ai\Start-Local-Codex.cmd",
            "local_ai\Check-Local-Codex.cmd",
            "local_ai\Setup-Git-Drive.cmd",
            "local_ai\Check-Git-Drive.cmd",
            "local_ai\Set-Ollama-Context-16K.cmd",
            "local_ai\Verify-Local-Codex-16K.cmd",
            "local_ai\Fix-Codex-4096.cmd",
            "local_ai\Diagnose-Local-Codex-Speed.cmd"
          )
          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "Missing launcher: $file" }
            $cmd = Get-Content $file -Raw
            $expected = if ($file -like "*Git-Drive.cmd") { "connect-workspaces.ps1" } elseif ($file -like "*Set-Ollama-Context-16K.cmd") { "set-ollama-context.ps1" } elseif ($file -like "*Verify-Local-Codex-16K.cmd") { "verify-ollama-context.ps1" } elseif ($file -like "*Fix-Codex-4096.cmd") { "create-codex16k.ps1" } elseif ($file -like "*Diagnose-Local-Codex-Speed.cmd") { "diagnose-local-ollama-speed.ps1" } else { "local-codex.ps1" }
            if ($cmd -notmatch [regex]::Escape($expected)) { throw "Launcher not wired: $file -> $expected" }
            if ($cmd -match "(?i)executionpolicy\s+bypass") { throw "Unexpected bypass: $file" }
          }
          $src = Get-Content "local_ai\local-codex.ps1" -Raw
          foreach ($requiredString in @("npm.cmd", "codex.cmd", "--oss", "127.0.0.1:11434", "qwen3:4b")) {
            if (!$src.Contains($requiredString)) { throw "Missing required safety/config setting: $requiredString" }
          }
          Write-Host "Windows launchers and local-only checks PASS."
          $bridge = Get-Content "local_ai\connect-workspaces.ps1" -Raw
          foreach ($requiredString in @("Git.Git", "GitHub.cli", "gh.exe auth login", "gh.exe repo clone", "LocalAI_Workspace", "info\exclude")) {
            if (!$bridge.Contains($requiredString)) { throw "Workspace setup missing: $requiredString" }
          }
          $transfer = Get-Content "local_ai\drive-staging.ps1" -Raw
          foreach ($requiredString in @("Import", "Export", "FileName", ".local_ai_data", "Destination already exists")) {
            if (!$transfer.Contains($requiredString)) { throw "Drive transfer missing: $requiredString" }
          }
          Write-Host "GitHub + Drive bridge static checks PASS."
          $ctx = Get-Content "local_ai\set-ollama-context.ps1" -Raw
          foreach ($requiredString in @("OLLAMA_CONTEXT_LENGTH", "16384", "User", "ollama.exe ps")) {
            if (!$ctx.Contains($requiredString)) { throw "Context setup missing: $requiredString" }
          }
          if (!$src.Contains("model_context_window=16384")) {
            throw "Codex context setting is not aligned to Ollama 16K"
          }
          Write-Host "Ollama 16K Windows context configuration static checks PASS."
          $verification = Get-Content "local_ai\verify-ollama-context.ps1" -Raw
          foreach ($check in @("/api/generate", "/api/ps", "context_length", "16384", "localhost", "num_predict")) {
            if ($check -eq "localhost") {
              if (!$verification.Contains("127.0.0.1")) { throw "Verifier must only call localhost" }
            } elseif (!$verification.Contains($check)) {
              throw "Ollama verification is missing: $check"
            }
          }
          if ($verification -match '(?s)options\s*=\s*@\{[^}]*num_ctx') {
            throw "Real context smoke must not override num_ctx, so it can check server allocation"
          }
          Write-Host "Ollama context smoke static checks PASS."
          $customModel = Get-Content "local_ai\create-codex16k.ps1" -Raw
          foreach ($term in @("FROM", "PARAMETER num_ctx", "16384", "ollama.exe create", "ollama.exe show", "/api/generate", "/api/ps", "context_length")) {
            if (!$customModel.Contains($term)) { throw "16K custom model setup missing: $term" }
          }
          $start = Get-Content "local_ai\Start-Local-Codex.cmd" -Raw
          $verify = Get-Content "local_ai\Verify-Local-Codex-16K.cmd" -Raw
          if (!$start.Contains("qwen3-codex16k") -or !$verify.Contains("qwen3-codex16k")) {
            throw "Start/Verify must use persistent custom model, not base qwen3:4b."
          }
          Write-Host "Custom Ollama model static checks PASS."
          $launcher = Get-Content "local_ai\local-codex.ps1" -Raw
          foreach ($part in @("create-codex16k.ps1", "Local qwen3-codex16k not found", "Require-Ollama", 'if (-not $modelAvailable)')) {
            if (!$launcher.Contains($part)) { throw "Automatic local model bootstrap missing: $part" }
          }
          Write-Host "Automatic missing-model bootstrap static checks PASS."
          $speed = Get-Content "local_ai\diagnose-local-ollama-speed.ps1" -Raw
          foreach ($keyword in @("/api/ps", "/api/generate", "prompt_eval_count", "eval_duration", "eval_count", "127.0.0.1", 'think = $false')) {
            if (!$speed.Contains($keyword)) { throw "Synthetic speed diagnostic missing: $keyword" }
          }
          Write-Host "Synthetic local speed diagnostic static checks PASS."


