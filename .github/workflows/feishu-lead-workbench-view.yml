name: Feishu Lead Workbench Overview
on:
  pull_request:
    paths:
      - 'automation/feishu/lead_workbench_view.py'
      - 'automation/feishu/test_lead_workbench_view.py'
      - '.github/workflows/feishu-lead-workbench-view.yml'
  push:
    branches: [main]
    paths:
      - 'automation/feishu/lead_workbench_view.py'
      - 'automation/feishu/test_lead_workbench_view.py'
      - '.github/workflows/feishu-lead-workbench-view.yml'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Create/update only the eligible-only Lead overview view'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: isolated-lead-feishu-mail-description
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'google-api-python-client>=2,<3' 'google-auth>=2,<3' 'python-dateutil>=2.9,<3'
      - run: python -m unittest discover -s automation/feishu -p 'test_lead_workbench_view.py' -v
      - run: python -m py_compile automation/feishu/lead_workbench_view.py
  live:
    needs: tests
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'deploy-feishu-lead-workbench-view')) }}
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 20
    env:
      NBA_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'google-api-python-client>=2,<3' 'google-auth>=2,<3' 'python-dateutil>=2.9,<3'
      - name: Read-only source and Feishu state verification
        run: python automation/feishu/lead_workbench_view.py
      - name: Create or verify overview without touching existing views
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.apply == true) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'deploy-feishu-lead-workbench-view')) }}
        run: python automation/feishu/lead_workbench_view.py --apply
