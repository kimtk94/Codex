name: Novogene CSS Isolation Boundary AST Audit

on:
  push:
    branches:
      - 'audit/css-g16-boundary-20261016'
    paths:
      - '.github/workflows/novogene-css-isolation-inventory.yml'

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 5
    steps:
      - name: Validate SSH credentials
        env:
          SSH_HOST: ${{ secrets.SERVER_SSH_HOST }}
          SSH_USER: ${{ secrets.SERVER_SSH_USER }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ] || [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::SSH configuration missing"; exit 1
          fi
          install -m 700 -d "$HOME/.ssh"
          python3 - <<'PY'
          import os
          from pathlib import Path
          raw=os.environ["SSH_KEY"].strip().replace("\\n","\n").replace("\r\n","\n").replace("\r","\n")
          if not raw.startswith(("-----BEGIN OPENSSH PRIVATE KEY-----","-----BEGIN RSA PRIVATE KEY-----","-----BEGIN EC PRIVATE KEY-----")):
              raise SystemExit("SSH_KEY_FORMAT_INVALID")
          (Path.home()/'.ssh/server_key').write_text(raw+"\n")
          PY
          chmod 600 "$HOME/.ssh/server_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -P "" -f "$HOME/.ssh/server_key" > /dev/null 2>&1 || exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run aggregate-only AST sink audit over existing SSH
        env:
          SSH_HOST: ${{ secrets.SERVER_SSH_HOST }}
          SSH_USER: ${{ secrets.SERVER_SSH_USER }}
        run: |
          python3 -m py_compile css-upgrade/staging-20261014/g16_static_sink_inventory.py
          python3 -m unittest discover \
            -s css-upgrade/staging-20261014 \
            -p test_g16_static_sink_inventory.py -v
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 \
            -o IdentitiesOnly=yes -i "$HOME/.ssh/server_key" \
            "$SSH_USER@$SSH_HOST" 'G16_AST_AUDIT_READONLY=1 python3 -' \
            < css-upgrade/staging-20261014/g16_static_sink_inventory.py
          echo "G16_PRODUCTION_AST_ONLY_NO_IMPORT_NO_MAIL_OR_DB_WRITES"

      - name: Check private server container prerequisites (read-only)
        env:
          SSH_HOST: ${{ secrets.SERVER_SSH_HOST }}
          SSH_USER: ${{ secrets.SERVER_SSH_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 \
            -o IdentitiesOnly=yes -i "$HOME/.ssh/server_key" \
            "$SSH_USER@$SSH_HOST" 'python3 -' <<'PY'
          import shutil,subprocess
          binary=shutil.which('docker')
          print('PRIVATE_DOCKER_BINARY_PRESENT',bool(binary))
          if binary:
              test=subprocess.run([binary,'info','--format','{{.ServerVersion}}'],capture_output=True,text=True,timeout=10)
              print('PRIVATE_DOCKER_DAEMON_READABLE',test.returncode==0)
              if test.returncode==0:
                  for image in ('python:3.11-slim','python:3.12-slim'):
                      inspect=subprocess.run([binary,'image','inspect',image,'--format','{{.Id}}'],capture_output=True,text=True,timeout=10)
                      print('PRIVATE_DOCKER_LOCAL_IMAGE_'+image.replace(':','_').replace('.','_').replace('-','_'),inspect.returncode==0)
          print('NO_IMAGES_PULL_NO_CONTAINER_RUN_NO_SOURCE_EXECUTION')
          PY
