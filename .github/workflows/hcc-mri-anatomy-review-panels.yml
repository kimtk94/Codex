name: HCC P0 ART and Registered PV Anatomy Reviewer Panels

on:
  pull_request:
    paths:
      - "research/hcc/ci/mri_p0_art_registered_pv_anatomy_review_panels.py"
      - ".github/workflows/hcc-mri-anatomy-review-panels.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hcc-mri-anatomy-contact-sheets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic:
    runs-on: ubuntu-latest
    name: Frozen tumor selection and three-plane indexing fixture
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "numpy==1.26.4" "nibabel>=5.2,<6" requests "matplotlib>=3.8,<4"
      - run: python research/hcc/ci/mri_p0_art_registered_pv_anatomy_review_panels.py --offline-test

  two-case-shards:
    needs: synthetic
    name: "Review image panels for frozen pair ${{ matrix.pair }}/7"
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pair: [0, 1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "numpy==1.26.4" "nibabel>=5.2,<6" requests "matplotlib>=3.8,<4"
      - name: Read source ART and exactly axis-corrected registered portal venous images
        run: python research/hcc/ci/mri_p0_art_registered_pv_anatomy_review_panels.py --shard-index ${{ matrix.pair }} --out-dir artifacts/hcc_anatomy_panels
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcc-mri-review-panels-pair-${{ matrix.pair }}
          path: artifacts/hcc_anatomy_panels/*
          retention-days: 30
          if-no-files-found: warn

  compile:
    name: Package all 14 case contact sheets and prevent clinical auto-approval
    needs: two-case-shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: hcc-mri-review-panels-pair-*
          path: artifacts/hcc_mri14_contact_sheets
          merge-multiple: true
      - name: Audit 14 case PNGs / 14 case metadata / 0 clinically approved
        run: |
          python3 - <<'PY'
          import csv,glob,os
          from pathlib import Path
          root=Path("artifacts/hcc_mri14_contact_sheets")
          images=sorted(root.glob("TCGA-*_tumor*_ART_vs_registeredPV_rater_masks.png"))
          files=sorted(root.glob("hcc_mri_anatomy_review_shard_*.csv"))
          assert len(images)==14 and len(files)==7
          rows=[]
          for p in files:
              with p.open(newline="",encoding="utf-8") as f:
                  rows+=list(csv.DictReader(f))
          assert len(rows)==14 and len({r["patient_id"] for r in rows})==14
          assert {r["patient_id"] for r in rows}=={p.name.split("_")[0] for p in images}
          assert all(r["qualified_anatomy_review"]=="NOT_ASSESSED" and
                     r["clinical_eligibility"]=="NOT_ASSESSED" and
                     r["RNA_same_index_lesion"]=="NOT_ASSESSED" and
                     r["MRI_before_therapy"]=="NOT_ASSESSED" for r in rows)
          assert all(float(r["registered_pv_affine_max_corner_mm"])<=0.5 and
                     float(r["mask_dice"])>=0.5 for r in rows)
          assert len({r["phase_art_pv_sha256"] for r in rows})==14
          assert all(p.stat().st_size>50000 for p in images)
          with (root/"HCC_MRI14_ANATOMY_REVIEW_PENDING_INDEX.csv").open("w",newline="",encoding="utf-8") as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0]))
              w.writeheader();w.writerows(sorted(rows,key=lambda r:r["patient_id"]))
          lines=["# HCC MRI14 — ART and registered-PV anatomical review queue",
                 "", "**All images require qualified abdominal radiology review.**",
                 "These 14 public-source panels are visualization aids, not clinical segmentation PASS.",
                 "No MRI-RNA test was run; n clinically eligible remains NOT_ASSESSED; manuscript ceiling S0.",
                 "", "| Case | Fixed lesion | R1/R2 tumor Dice | Max source affine offset (mm) | Contact sheet |",
                 "|---|---:|---:|---:|---|"]
          for r in sorted(rows,key=lambda r:r["patient_id"]):
              lines.append(f"| {r['patient_id']} | tumor{r['tumor_index']} | {r['mask_dice']} | {r['registered_pv_affine_max_corner_mm']} | {r['review_png']} |")
          (root/"HCC_MRI14_ANATOMICAL_REVIEW_INDEX.md").write_text("\n".join(lines)+"\n",encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("\n".join(lines[:6])+"\n")
          print("HCC_MRI14_ANATOMICAL_CONTACT_SHEETS_14_PNG_REVIEW_NOT_APPROVED_PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hcc-mri14-art-registered-pv-qualified-review-contact-sheets
          path: artifacts/hcc_mri14_contact_sheets/
          retention-days: 90
          if-no-files-found: error
