name: Novogene CSS Backup Credential Path Inventory

on:
  push:
    branches:
      - 'audit/novogene-css-sif-staging-20261014'
    paths:
      - '.github/workflows/novogene-css-backup-credential-inventory.yml'

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 5
    steps:
      - name: Validate SSH credentials
        env:
          SSH_HOST: ${{ secrets.SERVER_SSH_HOST }}
          SSH_USER: ${{ secrets.SERVER_SSH_USER }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ] || [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::SSH configuration missing"; exit 1
          fi
          install -m 700 -d "$HOME/.ssh"
          python3 - <<'PY'
          import os
          from pathlib import Path
          raw=os.environ["SSH_KEY"].strip().replace("\\n","\n").replace("\r\n","\n").replace("\r","\n")
          if not raw.startswith(("-----BEGIN OPENSSH PRIVATE KEY-----","-----BEGIN RSA PRIVATE KEY-----","-----BEGIN EC PRIVATE KEY-----")):
              raise SystemExit("SSH_KEY_FORMAT_INVALID")
          (Path.home()/'.ssh/server_key').write_text(raw+"\n")
          PY
          chmod 600 "$HOME/.ssh/server_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -P "" -f "$HOME/.ssh/server_key" > /dev/null 2>&1 || exit 1
      - name: Find backup upload mechanism without reading credential values
        env:
          SSH_HOST: ${{ secrets.SERVER_SSH_HOST }}
          SSH_USER: ${{ secrets.SERVER_SSH_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 \
            -o IdentitiesOnly=yes -i "$HOME/.ssh/server_key" \
            "$SSH_USER@$SSH_HOST" 'python3 -' <<'PY'
          from pathlib import Path
          import os, ast
          roots=[Path('/home/taehoon/services/novogene-css'),Path('/home/taehoon/scripts'),Path('/home/taehoon/bin'),Path('/home/taehoon/.config/systemd/user'),Path('/etc/systemd/system')]
          probes=("server_backup","css_project_manager_","mail_sync_fast_","MediaFileUpload","drive_service","googleapiclient.discovery","rclone","backup_folder","DRIVE_FOLDER","files().create")
          classes={"oauth":("InstalledAppFlow","Credentials.from_authorized_user_file","oauth2client","refresh_token","token.json"),
                   "service_account":("service_account.Credentials","from_service_account_file","GOOGLE_APPLICATION_CREDENTIALS"),
                   "cli":("rclone","gdrive files","gcloud storage"),
                   "google_api":("googleapiclient.discovery","MediaFileUpload","MediaIoBaseUpload")}
          matches=[]
          scanned=0
          for root in roots:
              if not root.is_dir():continue
              for cur,dirs,files in os.walk(root):
                  dirs[:]=[d for d in dirs if d not in (".git",".venv","venv","node_modules","__pycache__",".cache","archive","archives","old","backup_history")]
                  if len(matches)>=120:break
                  for name in files:
                      if not name.endswith((".py",".sh",".service",".timer",".conf",".env.example",".yaml",".yml")):continue
                      path=Path(cur)/name
                      try:
                          if path.stat().st_size>900000:continue
                          body=path.read_text(errors="replace")
                      except OSError:continue
                      scanned+=1
                      found=[x for x in probes if x in body]
                      if not found:continue
                      kind=sorted(k for k,values in classes.items() if any(v in body for v in values))
                      functions=[]
                      if name.endswith(".py"):
                          try:
                              tree=ast.parse(body)
                              functions=[x.name for x in ast.walk(tree) if isinstance(x,(ast.FunctionDef,ast.AsyncFunctionDef))
                                         and any(y in x.name.lower() for y in ("backup","drive","upload","publish"))]
                          except (SyntaxError,ValueError):pass
                      matches.append((str(path),sorted(found),kind,functions[:12]))
          print("BACKUP_AUTH_AUDIT_READ_ONLY")
          print("SCRIPTS_SCANNED",scanned)
          print("CANDIDATE_FILES",len(matches))
          for path,found,kind,functions in matches:
              print("CANDIDATE",path)
              print("MATCH_TYPES",",".join(found))
              print("AUTH_STRATEGIES",",".join(kind) or "unclassified")
              print("RELATED_FUNCTIONS",",".join(functions))
          print("NO_CREDENTIAL_VALUES_EMITTED")
          print("NO_SERVER_SOURCE_OR_DB_CHANGED")
          PY
