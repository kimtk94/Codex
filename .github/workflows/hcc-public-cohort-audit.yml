name: HCC Public Cohort Audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/hcc/**"
      - ".github/workflows/hcc-public-cohort-audit.yml"
  schedule:
    - cron: "17 2 * * 1"
permissions:
  contents: read
  actions: read
concurrency:
  group: hcc-audit-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify HCC research checkpoint ledger and manuscript claim guards
        run: python research/hcc/ci/validate_research_ledger.py
      - name: Offline checkpoint ledger regression tests
        run: python research/hcc/ci/validate_research_ledger.py --offline-test
      - name: Offline TCIA fixture test
        run: python research/hcc/ci/tcia_cohort_audit.py --offline-test
      - name: Offline CT-RNA overlap tests (normal sample and workflow exclusions)
        run: python research/hcc/ci/tcga_rna_overlap_audit.py --offline-test
      - name: Compile metadata auditors
        run: python -m compileall -q research/hcc/ci
      - name: Offline CT phase metadata prescreen fixture
        run: python research/hcc/ci/ct_phase_prescreen.py --offline-test
      - name: Offline RNA file-to-tumor barcode lineage fixture
        run: python research/hcc/ci/gdc_tumor_lineage_audit.py --offline-test
      - name: Offline IDC tumor-vs-organ SEG metadata fixture
        run: python research/hcc/ci/idc_segmentation_prescreen.py --offline-test
      - name: Offline priority review queue fixture
        run: python research/hcc/ci/build_review_queue.py --offline-test
      - name: Offline exact CT source-series review fixture
        run: python research/hcc/ci/build_same_series_review.py --offline-test
      - name: Offline LiverHccSeg MRI x RNA fixture
        run: python research/hcc/ci/liverhccseg_mri_rna_audit.py --offline-test
      - name: Offline MRI NIfTI ZIP central directory parser fixture
        run: python research/hcc/ci/zenodo_nifti_zip_inventory.py --offline-test
      - name: Install NumPy for NIfTI voxel smoke test
        run: python -m pip install "numpy>=1.26,<3"
      - name: Offline NIfTI nonempty-mask voxel fixture
        run: python research/hcc/ci/mri_mask_voxel_audit.py --offline-test
      - name: Offline MRI source-mask NIfTI header alignment tests
        run: python research/hcc/ci/mri_image_mask_alignment_audit.py --offline-test
      - name: Install NIfTI viewer dependencies for pixel overlay regression fixtures
        run: python -m pip install "nibabel>=5.2,<6" "matplotlib>=3.8,<4"
      - name: Offline PV MRI source-pixel and reviewer overlay regression tests
        run: python research/hcc/ci/mri_pv_pixel_overlay_audit.py --offline-test
      - name: Offline GDC STAR-Counts MRI tumor RNA manifest fixture
        run: python research/hcc/ci/mri_gdc_file_manifest.py --offline-test
      - name: Offline GDC STAR unstranded count and TPM numerical QC fixtures
        run: python research/hcc/ci/mri_gdc_star_numeric_qc.py --offline-test
      - name: Offline MSigDB single-sample Hallmark rank-score and gene mapping tests
        run: python research/hcc/ci/mri_gdc_hallmark_rank_score_qc.py --offline-test
      - name: Offline RNA-only Hallmark collinearity and TSS QC tests
        run: python research/hcc/ci/mri_hallmark_rna_only_redundancy_qc.py --offline-test
      - name: Offline GDC clinical treatment and sample temporal prescreen regression
        run: python research/hcc/ci/mri_gdc_clinical_eligibility_prescreen.py --offline-test
      - name: Offline clinical adjudication queue prevents unsupported eligibility upgrades
        run: python research/hcc/ci/mri_clinical_gate_review_queue.py --offline-test
      - name: Offline PanCancer ABSOLUTE purity specimen-versus-aliquot crosswalk tests
        run: python research/hcc/ci/mri_pancan_absolute_purity_audit.py --offline-test
      - name: Offline independent historical CPE specimen matching tests
        run: python research/hcc/ci/mri_aran2015_consensus_purity_audit.py --offline-test
      - name: Offline ABSOLUTE vs CPE specimen and discordance review guards
        run: python research/hcc/ci/mri_purity_crossmethod_discrepancy_qc.py --offline-test
      - name: Offline original treatment record and ABSOLUTE call-status provenance guards
        run: python research/hcc/ci/mri_treatment_and_absolute_source_detail_audit.py --offline-test
      - name: Offline HCC-versus-nonliver treatment site source adjudication
        run: python research/hcc/ci/mri_treatment_anatomic_context_review.py --offline-test
      - name: Publish no-network 14-case treatment-anatomic context HOLD queue
        run: python research/hcc/ci/mri_treatment_anatomic_context_review.py --output artifacts/hcc_refined_treatment
      - name: Recheck saved 14-case ABSOLUTE vs CPE derived-source discrepancies without downloads
        run: python research/hcc/ci/mri_purity_crossmethod_discrepancy_qc.py --out-dir artifacts/hcc_purity_comparison
      - name: Generate 14-case clinical reviewer queue (no remote GDC repeat)
        run: python research/hcc/ci/mri_clinical_gate_review_queue.py --output artifacts/hcc_clinical_gate_queue
      - name: Audit saved 14-patient Hallmark QC for pathway redundancy and center effects
        run: python research/hcc/ci/mri_hallmark_rna_only_redundancy_qc.py --output artifacts/hcc_rna_hallmark_descriptive
      - name: Offline multi-lesion and liver mask inter-rater Dice regression fixtures
        run: python research/hcc/ci/mri_liver_tumor_rater_qc.py --offline-test
      - name: Offline ICC(A,1) absolute agreement and patient-bootstrap regression
        run: python research/hcc/ci/mri_pv_pyradiomics_rater_icc.py --offline-test
      - name: Offline patient leave-one-out ICC stability regression
        run: python research/hcc/ci/mri_icc_patient_leave_one_out.py --offline-test
      - name: Offline independent parallel batch source and fail-closed reviewer gates
        run: python research/hcc/ci/mri_parallel_batch_gate.py --offline-test
      - name: Offline published MRI expert-reader and pretreatment interpretation guards
        run: python research/hcc/ci/mri_official_publication_source_evidence.py --offline-test
      - name: Offline CT x MRI x RNA patient crosswalk fixture
        run: python research/hcc/ci/crossmodal_case_audit.py --offline-test
  metadata-audit:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit public CT series
        run: python research/hcc/ci/tcia_cohort_audit.py
      - name: Audit matched TCGA-LIHC CT and primary tumor GDC STAR-counts metadata
        run: python research/hcc/ci/tcga_rna_overlap_audit.py
      - name: Prescreen matched CT phase labels (metadata only)
        run: python research/hcc/ci/ct_phase_prescreen.py
      - name: Audit GDC RNA-file associated tumor barcode lineage
        run: python research/hcc/ci/gdc_tumor_lineage_audit.py
      - name: Prescreen IDC segmentation code meanings and reference CT (metadata only)
        run: python research/hcc/ci/idc_segmentation_prescreen.py
      - name: Build manual CT phase and tumor ROI review queue
        run: python research/hcc/ci/build_review_queue.py
      - name: Build exact PV CT to liver SEG same-series review queue
        run: python research/hcc/ci/build_same_series_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcc-tcia-cohort-audit
          path: artifacts/hcc_tcia/
          if-no-files-found: warn
          retention-days: 30

  mri-metadata-audit:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install XLSX reader for metadata only
        run: python -m pip install "openpyxl>=3.1,<4" "numpy>=1.26,<3"
      - name: Match LiverHccSeg MRI metadata with GDC primary-tumor RNA
        run: python research/hcc/ci/liverhccseg_mri_rna_audit.py --output artifacts/hcc_mri
      - name: Verify published MRI tumor-mask archive member names (bounded HTTP ranges)
        run: python research/hcc/ci/zenodo_nifti_zip_inventory.py --output artifacts/hcc_mri
      - name: Audit one nonempty tumor NIfTI mask per patient via bounded ZIP ranges
        run: python research/hcc/ci/mri_mask_voxel_audit.py --output artifacts/hcc_mri
      - name: Build exact primary-tumor GDC RNA file and checksum manifest
        run: python research/hcc/ci/mri_gdc_file_manifest.py --input-dir artifacts/hcc_mri
      - name: Audit original MRI phase to tumor mask shape and spatial affine (header-only)
        run: python research/hcc/ci/mri_image_mask_alignment_audit.py --output artifacts/hcc_mri
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcc-mri-rna-metadata-audit
          path: artifacts/hcc_mri/
          if-no-files-found: warn
          retention-days: 30

  crossmodal-audit:
    needs: [metadata-audit, mri-metadata-audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: hcc-tcia-cohort-audit
          path: artifacts/hcc_tcia
      - uses: actions/download-artifact@v4
        with:
          name: hcc-mri-rna-metadata-audit
          path: artifacts/hcc_mri
      - name: CT x MRI x tumor RNA patient overlap (metadata only)
        run: python research/hcc/ci/crossmodal_case_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcc-ct-mri-rna-crossmodal-audit
          path: artifacts/hcc_crossmodal/
          if-no-files-found: warn
          retention-days: 30
  
  hcc-batch-clinical:
    name: HCC gate 1/4 – Clinical treatment anatomy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Confirm four HCC-context therapies and non-HCC appendiceal record
        run: python research/hcc/ci/mri_treatment_anatomic_context_review.py --output artifacts/hcc_batch_clinical
      - name: Validate source-clinical patient chronology remains HOLD
        run: python research/hcc/ci/mri_clinical_gate_review_queue.py --offline-test
      - uses: actions/upload-artifact@v4
        with:
          name: hcc-batch-clinical
          path: artifacts/hcc_batch_clinical/
          if-no-files-found: error
          retention-days: 30

  hcc-batch-purity:
    name: HCC gate 2/4 – ABSOLUTE and CPE specimen purity
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit independent DNA ABSOLUTE versus historic CPE and source barcode
        run: python research/hcc/ci/mri_purity_crossmethod_discrepancy_qc.py --out-dir artifacts/hcc_batch_purity
      - name: Reject specimen mismatch and proxy-based clinical inclusion
        run: python research/hcc/ci/mri_purity_crossmethod_discrepancy_qc.py --offline-test
      - uses: actions/upload-artifact@v4
        with:
          name: hcc-batch-purity
          path: artifacts/hcc_batch_purity/
          if-no-files-found: error
          retention-days: 30

  hcc-batch-source-identity:
    name: HCC gate 3/4 – Frozen MRI/ROI/RNA pathway source identities
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify patient-level largest tumor, source RNA UUID and pinned 12 hypotheses
        run: python research/hcc/ci/mri_parallel_batch_gate.py --mode source --out-dir artifacts/hcc_batch_source
      - name: Run negative-path regression tests without imaging downloads
        run: python research/hcc/ci/mri_parallel_batch_gate.py --offline-test
      - uses: actions/upload-artifact@v4
        with:
          name: hcc-batch-source
          path: artifacts/hcc_batch_source/
          if-no-files-found: error
          retention-days: 30


  hcc-batch-publication:
    name: HCC published imaging source expert-read provenance
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install read-only MRI workbook reader
        run: python -m pip install "openpyxl>=3.1,<4"
      - name: Verify 14 cases in original Zenodo MRI and radiologist ROI metric workbooks
        run: python research/hcc/ci/mri_official_publication_source_evidence.py --out-dir artifacts/hcc_batch_publication
      - name: Prevent published cohort preference from being misclassified as patient pretreatment proof
        run: python research/hcc/ci/mri_official_publication_source_evidence.py --offline-test
      - uses: actions/upload-artifact@v4
        with:
          name: hcc-batch-publication
          path: artifacts/hcc_batch_publication/
          if-no-files-found: error
          retention-days: 30

  hcc-batch-readiness:
    name: HCC gate 4/4 – Combine 3 independent sources and issue GO/HOLD/STOP
    needs: [hcc-batch-clinical, hcc-batch-purity, hcc-batch-source-identity]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: hcc-batch-clinical
          path: artifacts/hcc_batch_clinical
      - uses: actions/download-artifact@v4
        with:
          name: hcc-batch-purity
          path: artifacts/hcc_batch_purity
      - uses: actions/download-artifact@v4
        with:
          name: hcc-batch-source
          path: artifacts/hcc_batch_source
      - name: Fail closed on missing patients, treatment misclassification, proxy purity or premature MRI-RNA inference
        run: python research/hcc/ci/mri_parallel_batch_gate.py --mode assemble --out-dir artifacts/hcc_batch_final
      - name: Write concise reviewable gate summary in GitHub Actions
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          v=json.loads(Path("artifacts/hcc_batch_final/hcc_batch_multi_job_readiness_summary.json").read_text())
          text=[
            "## HCC public study – parallel batch evidence gates",
            "",
            f"- Technical 14-person cross-source integrity: **{v['status']}**",
            f"- Clinical review: **{v['clinical_review_priority_counts']}**",
            f"- DNA ABSOLUTE available: **{v['n_absolute_dna_proxy_present']}/14**",
            f"- Historical CPE available: **{v['n_historical_cpe_present']}/14**",
            f"- Verified clinical paired sample count: **{v['final_eligible_n']}**",
            f"- HCC-14/16/17/20: **{v['hcc14_temporal_gate']} / {v['hcc16_rna_purity_gate']} / {v['hcc17_final_paired_n_gate']} / {v['hcc20_mri_rna_association_gate']}**",
            f"- Publication claim ceiling: **{v['maximum_claim']}**",
            "",
            "No image–RNA association tests were executed; the technical PASS does not establish clinical eligibility.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("\n".join(text)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hcc-batch-joint-readiness
          path: artifacts/hcc_batch_final/
          if-no-files-found: error
          retention-days: 30

