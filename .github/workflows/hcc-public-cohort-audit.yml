name: HCC Public Cohort Audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/hcc/**"
      - ".github/workflows/hcc-public-cohort-audit.yml"
  schedule:
    - cron: "17 2 * * 1"
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline fixture test
        run: python research/hcc/ci/tcia_cohort_audit.py --offline-test
  metadata-audit:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit public CT series
        run: python research/hcc/ci/tcia_cohort_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcc-tcia-cohort-audit
          path: artifacts/hcc_tcia/
          if-no-files-found: warn
          retention-days: 30
