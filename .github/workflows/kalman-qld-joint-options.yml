name: Kalman QLD Joint 40 Option Interactions (Research Only)

on:
  pull_request:
    paths:
      - 'research/kalman_integrated_regime/joint_*'
      - 'research/kalman_integrated_regime/test_joint_*'
      - '.github/workflows/kalman-qld-joint-options.yml'
  push:
    branches: [research/qld-integrated-regime-20261031]
    paths:
      - 'research/kalman_integrated_regime/joint_*'
      - 'research/kalman_integrated_regime/test_joint_*'
      - '.github/workflows/kalman-qld-joint-options.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qld-joint40-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Isolated dependencies
        run: python -m pip install --disable-pip-version-check 'pandas>=2.2,<3' 'numpy>=1.26,<3' 'scikit-learn>=1.4,<2' 'pyarrow>=17' 'exchange-calendars>=4.7'
      - name: All joint execution and aggregation contracts
        run: |
          python -m unittest research.kalman_integrated_regime.test_joint_policy research.kalman_integrated_regime.test_joint_report -v
          python -m compileall -q research/kalman_integrated_regime

  joint-sweep:
    if: github.event_name != 'pull_request'
    needs: contracts
    environment: TaehoonServer
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated private research environment
        run: python -m pip install --disable-pip-version-check 'pandas>=2.2,<3' 'numpy>=1.26,<3' 'scikit-learn>=1.4,<2' 'pyarrow>=17' 'exchange-calendars>=4.7' 'requests>=2.31,<3' google-auth google-api-python-client
      - name: Fetch unmodified Alpaca SIP QLD & QQQ history
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID || secrets.APCA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY || secrets.APCA_API_SECRET_KEY }}
        run: |
          python research/kalman_integrated_regime/sip_backfill.py \
            --start 2024-01-01 --end-exclusive 2026-10-31 \
            --out "$RUNNER_TEMP/ql40"
      - name: Fetch daily market features for regime classification
        env:
          CKD_DRIVE_SA_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
          GDRIVE_SA_JSON_B64: ${{ secrets.GDRIVE_SA_JSON_B64 }}
        run: |
          python research/kalman_triple_barrier/drive_input.py \
            --file-id 1aUhvIAsE2x2-LuKv5nSxmDGX0Uo4mqYd \
            --output "$RUNNER_TEMP/ql40/market.zip"
      - name: Simulate full 40-dimensional strategy combinations within assigned shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python -m research.kalman_integrated_regime.joint_policy \
            --daily "$RUNNER_TEMP/ql40/qld_qqq_daily_sip_all_private.csv" \
            --intraday "$RUNNER_TEMP/ql40/qld_qqq_15m_sip_all_private.parquet" \
            --market-zip "$RUNNER_TEMP/ql40/market.zip" \
            --configs 800 --shard "$SHARD" --shards 4 \
            --out "$RUNNER_TEMP/ql40/results"
      - name: Upload only configuration-level aggregate metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qld40-joint-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/ql40/results/joint_shard_*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Remove private SIP price data
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/ql40/qld_qqq_daily_sip_all_private.csv"
          rm -f "$RUNNER_TEMP/ql40/qld_qqq_15m_sip_all_private.parquet"
          rm -f "$RUNNER_TEMP/ql40/market.zip"

  aggregate:
    if: github.event_name != 'pull_request'
    needs: joint-sweep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install aggregate dependencies
        run: python -m pip install --disable-pip-version-check 'pandas>=2.2,<3' 'numpy>=1.26,<3' 'scikit-learn>=1.4,<2'
      - uses: actions/download-artifact@v4
        with:
          pattern: qld40-joint-shard-*
          path: outputs/qld40/shards
          merge-multiple: false
      - name: Verify every paired configuration and compute combination interactions
        run: |
          python -m research.kalman_integrated_regime.joint_report \
            --source outputs/qld40/shards \
            --configs 800 --out outputs/qld40/final
      - name: Upload full scenario scoreboard without raw market prices
        uses: actions/upload-artifact@v4
        with:
          name: qld40-joint-all-800-combinations
          path: outputs/qld40/final/
          if-no-files-found: error
          retention-days: 30
