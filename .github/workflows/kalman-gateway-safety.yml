name: Kalman Gateway Safety

on:
  pull_request:
    paths:
      - "kalman-toss-gateway/app/**"
      - "kalman-toss-gateway/engine/auto_trade.py"
      - "kalman-toss-gateway/engine/pipeline_entry.py"
      - "kalman-toss-gateway/engine/r5_shadow_ledger.py"
      - "kalman-toss-gateway/engine/crypto_sheet_file_compat.py"
      - "kalman-toss-gateway/scripts/configure_auto_trade_env.sh"
      - "kalman-toss-gateway/scripts/configure_manual_live_trading_env.sh"
      - "kalman-toss-gateway/scripts/trading_status.sh"
      - "kalman-toss-gateway/scripts/run_pipeline.sh"
      - "kalman-toss-gateway/scripts/repair_investment_hub_sync.sh"
      - "kalman-toss-gateway/scripts/deploy_investment_hub_account_krw.sh"
      - "kalman-toss-gateway/scripts/promote_main_v7411_safe.sh"
      - "kalman-toss-gateway/tests/test_gateway_risk.py"
      - "kalman-toss-gateway/tests/test_no_symbol_allowlist.py"
      - "kalman-toss-gateway/tests/test_crypto_sheet_file_compat.py"
      - "kalman-toss-gateway/tests/test_auto_trade_sizing.py"
      - "kalman-toss-gateway/tests/test_drive_copy_compat.py"
      - "kalman-toss-gateway/tests/test_drive_copy_compat.py"
      - "kalman-toss-gateway/tests/test_auto_trade_sizing.py"
      - ".github/workflows/kalman-gateway-safety.yml"
  push:
    branches:
      - main
      - feature/shadow-bakeoff-v1-20260913
    paths:
      - "kalman-toss-gateway/app/**"
      - "kalman-toss-gateway/engine/auto_trade.py"
      - "kalman-toss-gateway/engine/pipeline_entry.py"
      - "kalman-toss-gateway/engine/r5_shadow_ledger.py"
      - "kalman-toss-gateway/engine/crypto_sheet_file_compat.py"
      - "kalman-toss-gateway/scripts/configure_auto_trade_env.sh"
      - "kalman-toss-gateway/scripts/configure_manual_live_trading_env.sh"
      - "kalman-toss-gateway/scripts/trading_status.sh"
      - "kalman-toss-gateway/scripts/run_pipeline.sh"
      - "kalman-toss-gateway/scripts/repair_investment_hub_sync.sh"
      - "kalman-toss-gateway/scripts/deploy_investment_hub_account_krw.sh"
      - "kalman-toss-gateway/scripts/promote_main_v7411_safe.sh"
      - "kalman-toss-gateway/tests/test_gateway_risk.py"
      - "kalman-toss-gateway/tests/test_no_symbol_allowlist.py"
      - "kalman-toss-gateway/tests/test_crypto_sheet_file_compat.py"
      - "kalman-toss-gateway/tests/test_r5_shadow_ledger.py"
      - ".github/workflows/kalman-gateway-safety.yml"

permissions:
  contents: read

jobs:
  gateway-safety:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kalman-toss-gateway

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: kalman-toss-gateway/requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile gateway code
        run: |
          python -m compileall app engine/auto_trade.py engine/pipeline_entry.py engine/crypto_sheet_file_compat.py engine/r5_shadow_ledger.py tests/test_gateway_risk.py tests/test_no_symbol_allowlist.py tests/test_crypto_sheet_file_compat.py tests/test_auto_trade_sizing.py tests/test_drive_copy_compat.py tests/test_r5_shadow_ledger.py
          bash -n scripts/configure_auto_trade_env.sh
          bash -n scripts/configure_manual_live_trading_env.sh
          bash -n scripts/trading_status.sh
          bash -n scripts/run_pipeline.sh
          bash -n scripts/repair_investment_hub_sync.sh
          bash -n scripts/deploy_investment_hub_account_krw.sh
          bash -n scripts/promote_main_v7411_safe.sh
          if grep -q 'CFG_AUTO_TRADE_ENABLED=true' scripts/configure_auto_trade_env.sh; then
            echo "configure_auto_trade_env.sh must never enable automated trading" >&2
            exit 1
          fi

      - name: Run gateway safety tests
        env:
          PYTHONPATH: .
        run: python -m unittest tests.test_gateway_risk tests.test_no_symbol_allowlist tests.test_crypto_sheet_file_compat tests.test_auto_trade_sizing tests.test_drive_copy_compat tests.test_r5_shadow_ledger -v
