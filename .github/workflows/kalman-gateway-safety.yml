name: Kalman Gateway Safety

on:
  pull_request:
    paths:
      - "kalman-toss-gateway/app/**"
      - "kalman-toss-gateway/engine/auto_trade.py"
      - "kalman-toss-gateway/scripts/configure_auto_trade_env.sh"
      - "kalman-toss-gateway/scripts/configure_manual_live_trading_env.sh"
      - "kalman-toss-gateway/scripts/trading_status.sh"
      - "kalman-toss-gateway/scripts/deploy_investment_hub_account_krw.sh"
      - "kalman-toss-gateway/scripts/promote_main_v7411_safe.sh"
      - "kalman-toss-gateway/tests/test_gateway_risk.py"
      - "kalman-toss-gateway/tests/test_no_symbol_allowlist.py"
      - ".github/workflows/kalman-gateway-safety.yml"
  push:
    branches:
      - main
      - feature/shadow-bakeoff-v1-20260913
    paths:
      - "kalman-toss-gateway/app/**"
      - "kalman-toss-gateway/engine/auto_trade.py"
      - "kalman-toss-gateway/scripts/configure_auto_trade_env.sh"
      - "kalman-toss-gateway/scripts/configure_manual_live_trading_env.sh"
      - "kalman-toss-gateway/scripts/trading_status.sh"
      - "kalman-toss-gateway/scripts/deploy_investment_hub_account_krw.sh"
      - "kalman-toss-gateway/scripts/promote_main_v7411_safe.sh"
      - "kalman-toss-gateway/tests/test_gateway_risk.py"
      - "kalman-toss-gateway/tests/test_no_symbol_allowlist.py"
      - ".github/workflows/kalman-gateway-safety.yml"

permissions:
  contents: read

jobs:
  gateway-safety:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kalman-toss-gateway

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: kalman-toss-gateway/requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile gateway code
        run: |
          python -m compileall app engine/auto_trade.py tests/test_gateway_risk.py tests/test_no_symbol_allowlist.py
          bash -n scripts/configure_auto_trade_env.sh
          bash -n scripts/configure_manual_live_trading_env.sh
          bash -n scripts/trading_status.sh
          bash -n scripts/deploy_investment_hub_account_krw.sh
          bash -n scripts/promote_main_v7411_safe.sh

      - name: Inspect unified Google compatibility bridge
        run: |
          python - <<'PY'
          import base64, lzma, re
          from pathlib import Path

          parts=sorted(Path("engine").glob("_unified_payload_*.b64"))
          enc="".join("".join(p.read_text(encoding="ascii").split()) for p in parts)
          text=lzma.decompress(base64.b64decode(enc)).decode("utf-8")

          pats=("Drive compatibility","google.auth","GOOGLE_APPLICATION_CREDENTIALS","gspread","Google Sheets","spreadsheet")
          lines=text.splitlines()
          hits=[]
          for i,line in enumerate(lines):
              if any(p.lower() in line.lower() for p in pats):
                  hits.append(i)

          seen=set()
          for i in hits:
              a=max(0,i-8); b=min(len(lines),i+18)
              key=(a,b)
              if key in seen:
                  continue
              seen.add(key)
              print(f"--- unified payload lines {a+1}-{b} ---")
              for j in range(a,b):
                  print(f"{j+1:05d}: {lines[j]}")
          PY

      - name: Run gateway safety tests
        env:
          PYTHONPATH: .
        run: python -m unittest tests.test_gateway_risk tests.test_no_symbol_allowlist -v
