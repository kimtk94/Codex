  pull_request:
    paths:
      - "kalman-toss-gateway/app/**"
      - "kalman-toss-gateway/engine/auto_trade.py"
      - "kalman-toss-gateway/engine/position_manager.py"
      - "kalman-toss-gateway/engine/benchmark_ledger.py"
      - "kalman-toss-gateway/engine/r5_strategy_ledger_sync.py"
      - "kalman-toss-gateway/engine/trade_mirror.py"
      - "kalman-toss-gateway/engine/execution_telemetry_sync.py"
      - "kalman-toss-gateway/engine/news_ingest_v1.py"
      - "kalman-toss-gateway/config/news-ingest-v1.json"
      - "kalman-toss-gateway/config/news-entity-aliases-v2.json"
      - "kalman-toss-gateway/scripts/run_news_ingest_v1.sh"
      - "kalman-toss-gateway/scripts/install_news_ingest_v1.sh"
      - "kalman-toss-gateway/tests/test_news_ingest_v1.py"
      - "kalman-toss-gateway/engine/macro_event_features_v1.py"
      - "kalman-toss-gateway/engine/macro_consensus_provider_v1.py"
      - "kalman-toss-gateway/config/macro-event-features-v1.json"
      - "kalman-toss-gateway/research/quant_stack/macro_event_features_v1.sql"
      - "kalman-toss-gateway/scripts/run_macro_event_features_v1.sh"
      - "kalman-toss-gateway/scripts/install_macro_event_features_v1.sh"
      - "kalman-toss-gateway/tests/test_macro_event_features_v1.py"
      - "kalman-toss-gateway/tests/test_macro_shadow_eval_v1.py"
      - "kalman-toss-gateway/scripts/install_macro_shadow_eval_v1.sh"
      - "kalman-toss-gateway/scripts/run_macro_shadow_eval_v1.sh"
      - "kalman-toss-gateway/research/quant_stack/macro_shadow_eval_v1.sql"
      - "kalman-toss-gateway/config/macro-shadow-eval-v1.json"
      - "kalman-toss-gateway/engine/macro_shadow_eval_v1.py"
      - "kalman-toss-gateway/scripts/configure_auto_trade_env.sh"
      - "kalman-toss-gateway/scripts/trading_status.sh"
      - "kalman-toss-gateway/scripts/run_auto_trade.sh"
      - "kalman-toss-gateway/scripts/run_us_cycle.sh"
      - "kalman-toss-gateway/scripts/apply_live_canary_5000.sh"
      - "kalman-toss-gateway/scripts/install_cron.sh"
      - "kalman-toss-gateway/config/kalman.cron.d"
      - "kalman-toss-gateway/config/kalman.cron"
      - "kalman-toss-gateway/tests/test_gateway_risk.py"
      - "kalman-toss-gateway/tests/test_no_symbol_allowlist.py"
      - "kalman-toss-gateway/tests/test_same_cycle_rebalance.py"
      - "kalman-toss-gateway/tests/test_trade_mirror_status.py"
      - "kalman-toss-gateway/tests/test_execution_telemetry.py"
      - "kalman-toss-gateway/tests/test_r5_strategy_ledger_sync.py"
      - ".github/workflows/kalman-gateway-safety.yml"
  push:
    branches: [main]
    paths:
      - "kalman-toss-gateway/app/**"
      - "kalman-toss-gateway/engine/auto_trade.py"
      - "kalman-toss-gateway/engine/position_manager.py"
      - "kalman-toss-gateway/engine/benchmark_ledger.py"
      - "kalman-toss-gateway/engine/r5_strategy_ledger_sync.py"
      - "kalman-toss-gateway/engine/trade_mirror.py"
      - "kalman-toss-gateway/engine/execution_telemetry_sync.py"
      - "kalman-toss-gateway/engine/news_ingest_v1.py"
      - "kalman-toss-gateway/config/news-ingest-v1.json"
      - "kalman-toss-gateway/scripts/run_news_ingest_v1.sh"
      - "kalman-toss-gateway/scripts/install_news_ingest_v1.sh"
      - "kalman-toss-gateway/tests/test_news_ingest_v1.py"
      - "kalman-toss-gateway/engine/macro_event_features_v1.py"
      - "kalman-toss-gateway/engine/macro_consensus_provider_v1.py"
      - "kalman-toss-gateway/config/macro-event-features-v1.json"
      - "kalman-toss-gateway/research/quant_stack/macro_event_features_v1.sql"
      - "kalman-toss-gateway/scripts/run_macro_event_features_v1.sh"
      - "kalman-toss-gateway/scripts/install_macro_event_features_v1.sh"
      - "kalman-toss-gateway/tests/test_macro_event_features_v1.py"
      - "kalman-toss-gateway/engine/macro_shadow_eval_v1.py"
      - "kalman-toss-gateway/config/macro-shadow-eval-v1.json"
      - "kalman-toss-gateway/research/quant_stack/macro_shadow_eval_v1.sql"
      - "kalman-toss-gateway/scripts/run_macro_shadow_eval_v1.sh"
      - "kalman-toss-gateway/scripts/install_macro_shadow_eval_v1.sh"
      - "kalman-toss-gateway/tests/test_macro_shadow_eval_v1.py"
      - "kalman-toss-gateway/scripts/configure_auto_trade_env.sh"
      - "kalman-toss-gateway/scripts/trading_status.sh"
      - "kalman-toss-gateway/scripts/run_auto_trade.sh"
      - "kalman-toss-gateway/scripts/run_us_cycle.sh"
      - "kalman-toss-gateway/scripts/apply_live_canary_5000.sh"
      - "kalman-toss-gateway/scripts/install_cron.sh"
      - "kalman-toss-gateway/config/kalman.cron.d"
      - "kalman-toss-gateway/config/kalman.cron"
      - "kalman-toss-gateway/tests/test_gateway_risk.py"
      - "kalman-toss-gateway/tests/test_no_symbol_allowlist.py"
      - "kalman-toss-gateway/tests/test_same_cycle_rebalance.py"
      - "kalman-toss-gateway/tests/test_trade_mirror_status.py"
      - "kalman-toss-gateway/tests/test_execution_telemetry.py"
      - "kalman-toss-gateway/tests/test_r5_strategy_ledger_sync.py"
      - ".github/workflows/kalman-gateway-safety.yml"

permissions:
  contents: read

jobs:
  gateway-safety:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kalman-toss-gateway

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: kalman-toss-gateway/requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile gateway code
        run: |
          python -m compileall app engine/auto_trade.py engine/position_manager.py engine/benchmark_ledger.py engine/r5_strategy_ledger_sync.py engine/trade_mirror.py engine/execution_telemetry_sync.py engine/news_ingest_v1.py engine/macro_event_features_v1.py engine/macro_consensus_provider_v1.py engine/macro_shadow_eval_v1.py tests/test_gateway_risk.py tests/test_no_symbol_allowlist.py tests/test_same_cycle_rebalance.py tests/test_trade_mirror_status.py tests/test_execution_telemetry.py tests/test_r5_strategy_ledger_sync.py tests/test_news_ingest_v1.py tests/test_macro_event_features_v1.py

      - name: Shell syntax checks
        run: |
          bash -n scripts/configure_auto_trade_env.sh
          bash -n scripts/run_auto_trade.sh
          bash -n scripts/run_us_cycle.sh
          bash -n scripts/apply_live_canary_5000.sh
          bash -n scripts/install_cron.sh
          bash -n scripts/run_news_ingest_v1.sh
          bash -n scripts/install_news_ingest_v1.sh
          bash -n scripts/run_macro_event_features_v1.sh
          bash -n scripts/install_macro_event_features_v1.sh
          bash -n scripts/run_macro_shadow_eval_v1.sh
          bash -n scripts/install_macro_shadow_eval_v1.sh

      - name: Validate US auto-trade cron contract
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path("config/kalman.cron.d").read_text(encoding="utf-8")
          required = [
              "35 23 * * 1-5 root /opt/kalman/app/scripts/run_us_cycle.sh",
              "35 0-4 * * 2-6 root /opt/kalman/app/scripts/run_us_cycle.sh",
          ]
          for line in required:
              assert line in text, line

          assert "run_pipeline.sh US" not in text
          assert "run_auto_trade.sh" not in text
          print("[PASS] US cron uses one serialized pipeline->trade cycle")
          PY

      - name: Validate US cycle ordering
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path("scripts/run_us_cycle.sh").read_text(encoding="utf-8")
          pipeline = text.index('run_pipeline.sh" US')
          trade = text.index('run_auto_trade.sh"')
          assert pipeline < trade
          assert 'us-cycle.lock' in text
          print("[PASS] US cycle = pipeline commit -> auto-trade under one cycle lock")
          PY

      - name: Validate live canary cash-driven policy
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path("scripts/configure_auto_trade_env.sh").read_text(encoding="utf-8")
          live = text.split("  live-canary-5000)", 1)[1].split("  off)", 1)[0]
          required = [
              "CFG_AUTO_TRADE_SIGNAL_POLICY=R5_LIVE_TOP1",
              "CFG_AUTO_TRADE_OVERLAP_CONFIRM=CONFIRM_R5_LIVE_TOP1",
              "CFG_AUTO_TRADE_REQUIRE_ACCOUNT_FLAT=false",
              "CFG_AUTO_TRADE_MAX_ACTIVE_POSITIONS=3",
              "CFG_AUTO_TRADE_MODEL_ROTATION_ENABLED=false",
              "CFG_AUTO_TRADE_ORDER_KRW=5000",
              "CFG_AUTO_TRADE_SIGNAL_BAR_MINUTES=60",
              "CFG_LIVE_MICRO_TOTAL_LIMIT_KRW=0",
              "CFG_MAX_SINGLE_ORDER_KRW=5000",
          ]
          for token in required:
              assert token in live, token
          print("[PASS] live = R5_LIVE_TOP1, max 3 positions, 4-bar holds, KRW 5,000/order")
          PY

      - name: Run gateway safety tests
        env:
          PYTHONPATH: .
        run: |
          python -m unittest tests.test_gateway_risk tests.test_no_symbol_allowlist tests.test_same_cycle_rebalance -v
          pytest -q tests/test_trade_mirror_status.py tests/test_execution_telemetry.py tests/test_news_ingest_v1.py tests/test_macro_event_features_v1.py tests/test_macro_shadow_eval_v1.py
