name: Kalman Gateway Safety

on:
  pull_request:
    paths:
      - "kalman-toss-gateway/app/**"
      - "kalman-toss-gateway/engine/auto_trade.py"
      - "kalman-toss-gateway/engine/position_manager.py"
      - "kalman-toss-gateway/engine/benchmark_ledger.py"
      - "kalman-toss-gateway/engine/trade_mirror.py"
      - "kalman-toss-gateway/engine/news_ingest_v1.py"
      - "kalman-toss-gateway/config/news-ingest-v1.json"
      - "kalman-toss-gateway/config/news-entity-aliases-v2.json"
      - "kalman-toss-gateway/scripts/run_news_ingest_v1.sh"
      - "kalman-toss-gateway/scripts/install_news_ingest_v1.sh"
      - "kalman-toss-gateway/tests/test_news_ingest_v1.py"
      - "kalman-toss-gateway/engine/macro_event_features_v1.py"
      - "kalman-toss-gateway/engine/macro_consensus_provider_v1.py"
      - "kalman-toss-gateway/config/macro-event-features-v1.json"
      - "kalman-toss-gateway/research/quant_stack/macro_event_features_v1.sql"
      - "kalman-toss-gateway/scripts/run_macro_event_features_v1.sh"
      - "kalman-toss-gateway/scripts/install_macro_event_features_v1.sh"
      - "kalman-toss-gateway/tests/test_macro_event_features_v1.py"
      - "kalman-toss-gateway/scripts/configure_auto_trade_env.sh"
      - "kalman-toss-gateway/scripts/trading_status.sh"
      - "kalman-toss-gateway/scripts/run_auto_trade.sh"
      - "kalman-toss-gateway/scripts/apply_live_canary_5000.sh"
      - "kalman-toss-gateway/tests/test_gateway_risk.py"
      - "kalman-toss-gateway/tests/test_no_symbol_allowlist.py"
      - "kalman-toss-gateway/tests/test_same_cycle_rebalance.py"
      - ".github/workflows/kalman-gateway-safety.yml"
  push:
    branches: [main]
    paths:
      - "kalman-toss-gateway/app/**"
      - "kalman-toss-gateway/engine/auto_trade.py"
      - "kalman-toss-gateway/engine/position_manager.py"
      - "kalman-toss-gateway/engine/benchmark_ledger.py"
      - "kalman-toss-gateway/engine/trade_mirror.py"
      - "kalman-toss-gateway/engine/news_ingest_v1.py"
      - "kalman-toss-gateway/config/news-ingest-v1.json"
      - "kalman-toss-gateway/scripts/run_news_ingest_v1.sh"
      - "kalman-toss-gateway/scripts/install_news_ingest_v1.sh"
      - "kalman-toss-gateway/tests/test_news_ingest_v1.py"
      - "kalman-toss-gateway/engine/macro_event_features_v1.py"
      - "kalman-toss-gateway/engine/macro_consensus_provider_v1.py"
      - "kalman-toss-gateway/config/macro-event-features-v1.json"
      - "kalman-toss-gateway/research/quant_stack/macro_event_features_v1.sql"
      - "kalman-toss-gateway/scripts/run_macro_event_features_v1.sh"
      - "kalman-toss-gateway/scripts/install_macro_event_features_v1.sh"
      - "kalman-toss-gateway/tests/test_macro_event_features_v1.py"
      - "kalman-toss-gateway/scripts/configure_auto_trade_env.sh"
      - "kalman-toss-gateway/scripts/trading_status.sh"
      - "kalman-toss-gateway/scripts/run_auto_trade.sh"
      - "kalman-toss-gateway/scripts/apply_live_canary_5000.sh"
      - "kalman-toss-gateway/tests/test_gateway_risk.py"
      - "kalman-toss-gateway/tests/test_no_symbol_allowlist.py"
      - "kalman-toss-gateway/tests/test_same_cycle_rebalance.py"
      - ".github/workflows/kalman-gateway-safety.yml"

permissions:
  contents: read

jobs:
  gateway-safety:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kalman-toss-gateway

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: kalman-toss-gateway/requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile gateway code
        run: |
          python -m compileall app engine/auto_trade.py engine/position_manager.py engine/benchmark_ledger.py engine/trade_mirror.py engine/news_ingest_v1.py engine/macro_event_features_v1.py engine/macro_consensus_provider_v1.py tests/test_gateway_risk.py tests/test_no_symbol_allowlist.py tests/test_same_cycle_rebalance.py tests/test_news_ingest_v1.py tests/test_macro_event_features_v1.py

      - name: Shell syntax checks
        run: |
          bash -n scripts/configure_auto_trade_env.sh
          bash -n scripts/run_auto_trade.sh
          bash -n scripts/apply_live_canary_5000.sh
          bash -n scripts/run_news_ingest_v1.sh
          bash -n scripts/install_news_ingest_v1.sh
          bash -n scripts/run_macro_event_features_v1.sh
          bash -n scripts/install_macro_event_features_v1.sh

      - name: Run gateway safety tests
        env:
          PYTHONPATH: .
        run: |
          python -m unittest tests.test_gateway_risk tests.test_no_symbol_allowlist tests.test_same_cycle_rebalance -v
          pytest -q tests/test_news_ingest_v1.py tests/test_macro_event_features_v1.py
