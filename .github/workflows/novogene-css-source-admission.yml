name: Novogene CSS Source Admission (Synthetic Only)
on:
  push:
    branches:
      - audit/novogene-css-sif-staging-20261014
    paths:
      - .github/workflows/novogene-css-source-admission.yml
      - css-upgrade/staging-20261014/css_source_admission.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source-admission negative tests inside disposable sandbox
        shell: bash
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 \
            --tmpfs /tmp:rw,nosuid,noexec,size=32m \
            --mount type=bind,src="$PWD/css-upgrade/staging-20261014/css_source_admission.py",dst=/app/admission.py,readonly \
            -e PYTHONDONTWRITEBYTECODE=1 \
            python:3.12-slim python /app/admission.py --selftest
      - name: Assert production source not admitted or executed
        run: echo "SYNTHETIC_ONLY_NO_CSS_IMPORT_NO_CSS_MAIN"
