name: SFDC Opportunity Similarity Search
on:
  workflow_dispatch:
    inputs:
      opportunity_id:
        description: "Exact Salesforce Opportunity record ID (15/18 characters, optional)"
        required: false
        type: string
      account:
        description: "Account keyword (optional)"
        required: false
        type: string
      service:
        description: "Service keyword (optional)"
        required: false
        type: string
      contact:
        description: "Contact keyword (optional)"
        required: false
        type: string
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sfdc-playwright-desktop-p0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install google-auth requests
      - name: Search existing Opportunity catalog (no record data in logs)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
          OPPORTUNITY_ID_QUERY: ${{ inputs.opportunity_id }}
          ACCOUNT_QUERY: ${{ inputs.account }}
          SERVICE_QUERY: ${{ inputs.service }}
          CONTACT_QUERY: ${{ inputs.contact }}
        run: |
          mkdir -p "$RUNNER_TEMP/sfdc-search"
          python - <<'PY'
          import json, os, sys, re
          sys.path.insert(0, 'automation/sfdc_desktop')
          from catalog_reuse import load_sheet, dedupe, search, make_draft
          account = os.getenv('ACCOUNT_QUERY','').strip()
          service = os.getenv('SERVICE_QUERY','').strip()
          contact = os.getenv('CONTACT_QUERY','').strip()
          opportunity_id=os.getenv('OPPORTUNITY_ID_QUERY','').strip()
          if not any((account,service,contact,opportunity_id)):
              raise SystemExit('Enter at least one search keyword.')
          if not os.getenv('GOOGLE_SERVICE_ACCOUNT_JSON'):
              raise SystemExit('TaehoonServer CKD_DRIVE_SA_JSON is not configured.')
          rows = load_sheet()
          if opportunity_id:
              if not re.fullmatch(r'[A-Za-z0-9]{15}(?:[A-Za-z0-9]{3})?',opportunity_id):
                  raise SystemExit('Invalid Salesforce Opportunity ID format.')
              found=[row for row in rows if str(row.get('Opportunity ID','')).strip()[:15]==opportunity_id[:15]]
              distinct={str(row.get('Opportunity ID','')).strip()[:15] for row in found}
              print('EXACT_ID_LOOKUP_COUNT:',len(found))
              print('EXACT_ID_DISTINCT_COUNT:',len(distinct))
              if len(distinct)!=1:
                  matches=[]
                  print('EXACT_ID_LOOKUP_STATUS: NOT_FOUND')
              else:
                  row=found[0]
                  print('EXACT_ID_LOOKUP_STATUS:', 'FOUND_WITH_DUPLICATE_ROWS' if len(found)>1 else 'FOUND_UNIQUE')
                  matches=[{'score':1.0,'opportunity_id':row.get('Opportunity ID'),
                            'account':row.get('Account Name'),'account_id':row.get('Account ID'),
                            'contact':row.get('Main Contact'),'contact_cms_id':row.get('Main Contact CMS ID'),
                            'opportunity_name':row.get('Opportunity Name'),
                            'historical_stage':row.get('Stage'),'historical_currency':row.get('Amount Currency'),
                            'historical_amount':row.get('Amount'),'historical_close_date':row.get('Close Date'),
                            'match_type':'EXACT_OPPORTUNITY_ID'}]
          else:
              matches = search(rows, account=account, contact=contact, service=service, top=10)
          report = {'source_rows':len(rows),'unique_opportunities':len(dedupe(rows)),
                    'matches':matches,'draft':make_draft(matches[0]) if matches else None,
                    'salesforce_save_performed':False,'lookup_status':('NOT_FOUND' if opportunity_id and not matches else 'MATCHED')}
          path=os.path.join(os.environ['RUNNER_TEMP'],'sfdc-search','matches.json')
          with open(path,'w',encoding='utf-8') as f:
              json.dump(report,f,ensure_ascii=False,indent=2)
          print('SFDC catalog search completed. Candidate count:', len(matches))
          print('Download the restricted-run artifact to review the candidates; record details are not printed.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sfdc-catalog-matches
          path: ${{ runner.temp }}/sfdc-search/matches.json
          retention-days: 1
          if-no-files-found: error
