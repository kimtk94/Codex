name: CSS Web Mail Body Sync
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CSS QQ Mail Read-only Probe"]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - 'automation/css_mail/web_body_sync.py'
      - 'automation/css_mail/test_web_body_sync.py'
      - 'automation/css_mail/web_body_serial_runner.py'
      - 'automation/css_mail/test_web_body_serial_runner.py'
      - 'automation/css_mail/web_body_health.py'
      - 'automation/css_mail/test_web_body_health.py'
      - '.github/workflows/css-web-body-sync.yml'
  push:
    branches: [main]
    paths:
      - 'automation/css_mail/web_body_sync.py'
      - 'automation/css_mail/test_web_body_sync.py'
      - 'automation/css_mail/web_body_serial_runner.py'
      - 'automation/css_mail/test_web_body_serial_runner.py'
      - '.github/workflows/css-web-body-sync.yml'
  schedule:
    # Fallback in case the upstream QQ mail schedule is delayed or dropped.
    # Primary trigger is upstream CSS QQ Mail success, not an independent race.
    - cron: '47 0,6,12,18 * * *'
permissions:
  contents: read
# Share the QQ ingest lock with CSS QQ Mail Read-only Probe.
# This protects the same UID-based staging from competing append operations.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('css-qq-ci-{0}', github.head_ref) || 'css-qq-mail-readonly' }}
  cancel-in-progress: false
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3'
      - run: python -m unittest discover -s automation/css_mail -p 'test_web_body_sync.py' -v
      - run: python -m unittest discover -s automation/css_mail -p 'test_web_body_health.py' -v
      - run: python -m unittest discover -s automation/css_mail -p 'test_web_body_serial_runner.py' -v
      - run: python -m unittest discover -s automation/css_mail -p 'test_web_body_workflow_trigger.py' -v
  sync:
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')) }}
    needs: offline-tests
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 25
    env:
      CSS_QQ_MAIL_ADDRESS: ${{ secrets.CSS_QQ_MAIL_ADDRESS }}
      CSS_QQ_MAIL_AUTH_CODE: ${{ secrets.CSS_QQ_MAIL_AUTH_CODE }}
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
      CSS_WEB_BODY_BATCH: '160'
      # Up to three serial, verified 160-item batches under a 19-minute guard.
      CSS_WEB_BODY_SERIAL_CYCLES: '3'
      CSS_WEB_BODY_LOOKBACK_DAYS: '60'
      CSS_IMAP_BATCH_PER_FOLDER: '120'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3'
      - name: Sync latest QQ Inbox and Sent metadata first
        run: python automation/css_mail/incremental_sync.py
      - name: Fetch verified owner Inbox and Sent bodies into web cache
        id: body
        run: python automation/css_mail/web_body_serial_runner.py
      - name: Publish distinct web body backfill health to central sheet
        if: always()
        env:
          CSS_BODY_STEP_OUTCOME: ${{ steps.body.outcome }}
        run: python automation/css_mail/web_body_health.py
