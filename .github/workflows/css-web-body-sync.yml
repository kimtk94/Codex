name: CSS Web Mail Body Sync
on:
  workflow_dispatch:
  push:
    branches: [main, fix/css-mail-usability-20261027]
    paths: ['automation/css_mail/web_body_sync.py', '.github/workflows/css-web-body-sync.yml']
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
concurrency:
  group: css-web-body-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 12
    env:
      CSS_QQ_MAIL_ADDRESS: ${{ secrets.CSS_QQ_MAIL_ADDRESS }}
      CSS_QQ_MAIL_AUTH_CODE: ${{ secrets.CSS_QQ_MAIL_AUTH_CODE }}
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3'
      - run: python automation/css_mail/test_web_body_sync.py
      - run: node --test apps/css-sales-workspace/test-data.cjs
      - run: python automation/css_mail/web_body_sync.py
