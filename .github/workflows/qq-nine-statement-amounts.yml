name: QQ Nine Pending Statement Amounts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/css_mail/statement_nine_amounts.py'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 15
    env:
      CSS_QQ_MAIL_ADDRESS: ${{ secrets.CSS_QQ_MAIL_ADDRESS }}
      CSS_QQ_MAIL_AUTH_CODE: ${{ secrets.CSS_QQ_MAIL_AUTH_CODE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile automation/css_mail/statement_nine_amounts.py
      - run: python automation/css_mail/statement_nine_amounts.py
