name: Feishu Lead Single Select Migration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/feishu-lead-single-select.yml'
  pull_request:
    paths:
      - 'automation/feishu/lead_*'
      - 'automation/feishu/test_lead_*'
      - '.github/workflows/feishu-lead-single-select.yml'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Explicitly convert three verified Lead fields (false = audit only)'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: feishu-lead-single-select-schema
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'google-api-python-client>=2,<3' 'google-auth>=2,<3' 'python-dateutil>=2.9,<3'
      - run: python -m unittest discover -s automation/feishu -p 'test_lead_single_select_migration.py' -v
      - run: python -m unittest discover -s automation/feishu -p 'test_lead_mail_description_sync.py' -v
      - run: python -m py_compile automation/feishu/lead_mail_description_sync.py automation/feishu/lead_mail_views_sync.py automation/feishu/lead_action_delta_sync.py automation/feishu/lead_single_select_migration.py
  audit_or_apply:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: tests
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 15
    env:
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'google-api-python-client>=2,<3' 'google-auth>=2,<3' 'python-dateutil>=2.9,<3'
      - name: Audit current Lead schema and option distributions
        run: python automation/feishu/lead_single_select_migration.py
      - name: Apply schema update with row-by-row readback
        if: inputs.apply == true || (github.event_name == 'push' && github.event.head_commit.message == 'deploy-feishu-lead-single-select')
        run: python automation/feishu/lead_single_select_migration.py --apply
