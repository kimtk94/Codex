name: Feishu Native Sales Home
on:
  push:
    branches: [main, feat/feishu-native-sales-home-20261106]
    paths:
      - 'automation/feishu/sales_native_home.py'
      - 'automation/feishu/test_sales_native_home.py'
      - '.github/workflows/feishu-native-sales-home.yml'
  pull_request:
    paths:
      - 'automation/feishu/sales_native_home.py'
      - 'automation/feishu/test_sales_native_home.py'
      - '.github/workflows/feishu-native-sales-home.yml'
  workflow_run:
    workflows: ['Feishu Sales SIF Invoice Weekly KPI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan checks links read-only; apply builds Feishu native Home'
        type: choice
        required: true
        options: [plan, apply]
        default: plan
  schedule:
    - cron: '41 0,6,12,18 * * *'
permissions:
  contents: read
concurrency:
  group: feishu-native-sales-home
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Native home offline tests
        run: |
          python3 -m unittest discover -s automation/feishu -p 'test_sales_native_home.py' -v
          python3 -m py_compile automation/feishu/sales_native_home.py
  home:
    needs: test
    if: ${{ github.event_name != 'pull_request' && needs.test.result == 'success' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 25
    env:
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_BASE_APP_TOKEN: ${{ vars.FEISHU_SALES_BASE_APP_TOKEN }}
      FEISHU_PORTAL_MODE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_run') && 'apply' || (github.event_name == 'workflow_dispatch' && inputs.mode || 'plan') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build Feishu native internal sales portal
        run: python3 automation/feishu/sales_native_home.py
