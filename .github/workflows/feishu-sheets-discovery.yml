name: Feishu Sheets Tab Discovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - automation/feishu/.trigger-sheets-discovery
  schedule:
    - cron: "7,37 * * * *"
permissions:
  contents: read
jobs:
  discover:
    environment: TaehoonServer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Detect new sheet tabs without writes
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: python3 automation/feishu/sheets_tab_discovery.py
