name: Feishu Native Project Dashboard No Vercel
on:
  pull_request:
    paths:
      - 'automation/feishu/native_dashboard_cli.py'
      - 'automation/feishu/weekly_quote_live_chart.py'
      - 'automation/feishu/test_weekly_quote_live_chart.py'
      - 'automation/feishu/test_native_quote_combo.py'
      - 'automation/feishu/test_native_cli_rate_limit.py'
      - 'automation/feishu/test_native_source_status.py'
      - 'automation/feishu/test_native_dashboard_layout.py'
      - 'automation/feishu/quote_chart_label_sync.py'
      - 'automation/feishu/test_quote_chart_label_sync.py'
      - 'automation/feishu/test_native_progress_dashboard.py'
      - '.github/workflows/feishu-native-dashboard.yml'
  push:
    branches:
      - main
      - 'feat/feishu-dashboard-no-vercel-*'
      - 'feat/feishu-project-progress-no-ranking-*'
    paths:
      - 'automation/feishu/native_dashboard_cli.py'
      - 'automation/feishu/quote_chart_label_sync.py'
      - '.github/workflows/feishu-native-dashboard.yml'
  workflow_run:
    workflows: ['Feishu Sales SIF Invoice Weekly KPI', 'Feishu Canonical Monthly Revenue Actual']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '15 1,7,13,19 * * *' # 10:15, 16:15, 22:15, 04:15 KST, even when SFDC Report is delayed
  workflow_dispatch:
    inputs:
      mode:
        description: Create/update Feishu dashboard or read-only plan
        type: choice
        options: [plan, apply]
        default: plan
permissions:
  contents: read
concurrency:
  group: feishu-native-dashboard
  cancel-in-progress: false
jobs:
  offline:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate native dashboard scripts
        run: |
          python3 -m py_compile automation/feishu/native_dashboard_cli.py
          python3 -m unittest discover -s automation/feishu -p 'test_native_quote_combo.py' -v
          python3 -m unittest discover -s automation/feishu -p 'test_native_cli_rate_limit.py' -v
          python3 -m unittest discover -s automation/feishu -p 'test_weekly_quote_live_chart.py' -v
          python3 -m unittest discover -s automation/feishu -p 'test_native_source_status.py' -v
          python3 -m unittest discover -s automation/feishu -p 'test_native_dashboard_layout.py' -v
          python3 -m unittest discover -s automation/feishu -p 'test_quote_chart_label_sync.py' -v
          python3 -m unittest discover -s automation/feishu -p 'test_native_progress_dashboard.py' -v
          python3 - <<'PY'
          import ast
          p=ast.parse(open('automation/feishu/native_dashboard_cli.py').read())
          assert p and len(p.body)>5
          print('FEISHU_NATIVE_DASHBOARD_SYNTAX_PASS')
          PY
  native:
    needs: offline
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 14
    env:
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_BASE_APP_TOKEN: ${{ vars.FEISHU_SALES_BASE_APP_TOKEN }}
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
      FEISHU_DASHBOARD_MODE: ${{ (github.event_name == 'workflow_run' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && 'apply' || (github.event_name == 'workflow_dispatch' && inputs.mode || 'plan') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official Lark CLI
        run: npm install --global '@larksuite/cli@1.0.98'
      - name: Install read-only SFDC source provenance client
        run: python3 -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3'
      - name: Configure ephemeral Feishu app identity
        run: |
          printf '%s' "$FEISHU_APP_SECRET" | lark-cli profile add --name css-sales-native --app-id "$FEISHU_APP_ID" --brand feishu --app-secret-stdin
          lark-cli profile use css-sales-native
      - name: Correct stored Quote x-axis labels only (no SFDC/amount reads)
        run: python3 automation/feishu/quote_chart_label_sync.py
      - name: Create Feishu-hosted native dashboard (source tables unchanged)
        run: python3 automation/feishu/native_dashboard_cli.py
