name: NBA Pool Source Validation
on:
  pull_request:
    paths:
      - 'automation/css/nba_refresh_pool.py'
      - 'automation/css/test_nba_refresh_pool.py'
      - 'automation/css/test_nba_refresh_pool_safety.py'
      - '.github/workflows/nba-pool-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    environment: TaehoonServer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install google-api-python-client google-auth
      - name: Run tests
        run: |
          cd automation/css
          python -m unittest -v test_nba_refresh_pool test_nba_refresh_pool_safety test_nba_register_new_ids test_nba_preserve_decisions
  sheets-dry-run:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    environment: TaehoonServer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install google-api-python-client google-auth
      - name: Validate live source data without writes
        env:
          NBA_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
          NBA_DRY_RUN: 'true'
        run: |
          python automation/css/nba_refresh_pool.py
