permissions:
  contents: read

jobs:
  local-command-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    defaults:
      run:
        working-directory: masteros/web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile local-only Salesforce executor (no browser connection)
        run: python3 -m py_compile scripts/sfdc_action_executor.py
      - name: Test Feishu local queue without any live CRM writes
        run: |
          python3 -m py_compile scripts/feishu_sfdc_local_worker.py
          python3 -m unittest discover -s scripts -p test_feishu_sfdc_local_worker.py -v
          python3 -m unittest discover -s scripts -p test_sfdc_quote_price_fields.py -v
      - name: Test existing-record selector without CRM access
        run: |
          python3 -m py_compile scripts/sfdc_record_catalog.py
          python3 -m unittest discover -s scripts -p test_sfdc_record_catalog.py -v
          python3 -m unittest discover -s scripts -p test_sfdc_pair_readback.py -v
          python3 -m unittest discover -s scripts -p test_sfdc_pair_web_preview.py -v
          python3 -m py_compile scripts/sfdc_product_line_registry.py scripts/sfdc_pair_cache.py
          python3 -m unittest discover -s scripts -p test_sfdc_pair_cache.py -v
          python3 -m unittest discover -s scripts -p test_sfdc_quote_report_sheet.py -v
          python3 -m py_compile scripts/sfdc_feishu_report_local.py
          python3 -m unittest discover -s scripts -p test_sfdc_feishu_report_local.py -v
          python3 -m unittest discover -s scripts -p test_sfdc_feishu_preclassified_local.py -v
      - name: Validate single-service per-process Cloud 100 Gb rules
        run: python3 -m unittest discover -s scripts -p test_sfdc_single_service_cloud.py -v
      - name: Unit-test live health classifier without Salesforce access
        run: |
          python3 -m py_compile scripts/sfdc_live_ui_health.py
          python3 -m unittest discover -s scripts -p test_sfdc_live_ui_health.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install local Next.js dependencies
        run: npm install --no-audit --no-fund
      - name: Test request validation, progress text and loopback security
        run: node --test tests/sfdc-commands.test.mjs
      - name: Test record picker and immutable Progress Description source
        run: node --test tests/sfdc-record-picker.test.mjs
      - name: Validate linked Quote price and Cloud quantity projection
        run: node --test tests/sfdc-paired-clone.test.mjs
      - name: Validate combined Opportunity Quote web pricing and readback
        run: node --test tests/sfdc-pair-workspace.test.mjs
      - name: Validate private cache endpoint scope and save rejection
        run: node --test tests/sfdc-pair-cache-route.test.mjs
      - name: Test fast Quote Report indexing endpoint and no Salesforce write paths
        run: node --test tests/sfdc-quote-report-route.test.mjs
      - name: Test Feishu direct-source route enforces local read-only access
        run: node --test tests/sfdc-feishu-report-local.test.mjs
      - name: Test Gb Product Line identity and reference-only Oppo-Quote draft
        run: node --test tests/sfdc-report-quote-draft.test.mjs
      - name: Verify live Salesforce Quote-Opportunity customer identity guard
        run: node --test tests/sfdc-source-identity.test.mjs
      - name: Build local command center
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
      - name: Verify compiled UI and API routes
        run: |
          node -e "const fs=require('fs');for(const p of ['.next/server/app/sales/commands','.next/server/app/api/sfdc/commands-local','.next/server/app/sales/commands/pair','.next/server/app/api/sfdc/pair-check-local','.next/server/app/api/sfdc/cache-local','.next/server/app/api/sfdc/report-local','.next/server/app/api/sfdc/feishu-report-local'])if(!fs.existsSync(p))process.exit(1)"
      - name: Ensure historical views stay hidden but preserved
        run: |
          node -e "const fs=require('fs');const p=fs.readFileSync('app/page.jsx','utf8');if(!p.includes('redirect(\"/sales/commands\")'))process.exit(1);if(!fs.existsSync('app/legacy/page.jsx'))process.exit(1);const q=fs.readFileSync('app/sales/commands/page.jsx','utf8');if(q.includes('href=\"/sales/oppo-quote\"'))process.exit(1);"
      - name: Publish business verification boundary
        run: |
          echo 'CODE_TEST_PASS_ONLY;LIVE_SFDC_WRITE_NOT_EXECUTED_BY_CI;CONTACT_AND_QUOTE_READBACK_REQUIRED;NO_VERCEL' >> "$GITHUB_STEP_SUMMARY"
