name: HCC Stage49 Original 14 Reader1 Native PV Spearman Source Rank Audit
on:
  pull_request:
    paths:
      - "research/hcc/ci/mri14_stage49_native_rater1_spearman.py"
      - ".github/workflows/hcc-stage49-original-native-reader1-spearman.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: hcc-stage49-locked-original-14-rater1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  original14-paired-two-reader-math:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fixed patient, synthetic tied ranks and clinical negative control
        run: python3 research/hcc/ci/mri14_stage49_native_rater1_spearman.py --offline-test
      - name: Restore exact original original-PV 28-row native and resampled feature artifact
        uses: actions/download-artifact@v4
        with:
          name: hcc-pv-3mm-native-vs-resampled-14x2
          run-id: 41161863748
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/stage49_original_source_14x2
      - name: Independently validate original 14x2 source feature rows against committed 14-case frozen selections
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path
          root=Path("artifacts/stage49_original_source_14x2")
          files=list(root.rglob("hcc_pv_14x2_native_3mm_feature_pairs.csv"))
          assert len(files)==1,str(files)
          with files[0].open(newline="",encoding="utf8") as f:
              r=list(csv.DictReader(f))
          assert len(r)==28 and len({x["patient_id"] for x in r})==14
          assert set(x["rater"] for x in r)=={"rater1","rater2"}
          assert len({(x["patient_id"],x["rater"]) for x in r})==28
          assert all(x["clinical_eligibility"]=="HOLD_UNRESOLVED_NOT_EXCLUDED" for x in r)
          assert all(float(x["isotropic_spacing_mm"])==3.0 for x in r)
          assert all(x["image_mask_affine_qc"]=="PASS_NATIVE_SOURCE_MATCH" for x in r)
          print("HCC_STAGE49_ORIGINAL_FULL28_READER_SOURCE_FEATURE_ROWS_FROZEN_PASS")
          PY
      - name: Recompute genuine internal rater1 native PV patient rank and external original 59 patient comparison
        run: |
          python3 research/hcc/ci/mri14_stage49_native_rater1_spearman.py \
            --source-artifact-root artifacts/stage49_original_source_14x2 \
            --out-dir artifacts/hcc_stage49_rank_results
      - name: Verify all ten frozen two-reader means and patient-level reader1 rank are distinct source estimands
        run: |
          python3 - <<'PY'
          import csv,json,math
          from pathlib import Path
          p=Path("artifacts/hcc_stage49_rank_results")
          j=json.loads((p/"stage49_original14_reader1_59_original_rank_summary.json").read_text())
          with (p/"stage49_rater1_14_native3mm_patient_rank_evidence.csv").open() as f:
              rows=list(csv.DictReader(f))
          with (p/"stage49_all10_native3mm_reader1_reader2_mean_spearman.csv").open() as f:
              features=list(csv.DictReader(f))
          assert len(rows)==14 and len({r["patient_id"] for r in rows})==14
          assert len(features)==10 and all(x["reader_mean_frozen_agreement"]=="PASS" for x in features)
          assert j["original_full_feature_pairs"]==28
          assert j["frozen_original_selected_tumor_patient_n"]==14
          assert j["original_feature_families"]==10
          assert j["original_artifact_source_run_id"]==41161863748
          assert j["original_artifact_id"]==13027382220
          assert math.isfinite(j["internal_original_rater1_rank_rho"])
          assert math.isfinite(j["internal_original_rater2_rank_rho"])
          assert abs(j["internal_original_two_reader_mean_rank_rho"]-.850549)<.000002
          assert j["internal_rater1_bootstrap_valid_draws"]>=3800
          assert j["external_bootstrap_valid_draws"]>=3800
          assert abs(j["external_original_primary_mask_rank_rho"]-.940795)<.000003
          assert j["external_original_venous_patient_n"]==59
          assert not j["cross_cohort_difference_formal_significance_test_performed"]
          assert not j["exact_scanner_or_acquisition_protocol_equivalence"]
          assert j["new_MRI_image_download_or_feature_extraction_performed"]==False
          assert j["clinical_eligible_n"]=="NOT_ASSESSED"
          assert j["MRI_RNA_biology_tests"]==0 and j["claim_ceiling"]=="S0"
          print("HCC_STAGE49_ORIGINAL_14_RATER1_ONLY_RANK_INDEPENDENT_SOURCE_CI_PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hcc-stage49-original14-rater1-native3mm-rank-vs-external59-source-HOLD
          path: artifacts/hcc_stage49_rank_results/*
          retention-days: 90
          if-no-files-found: error
