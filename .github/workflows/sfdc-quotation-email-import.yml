name: SFDC Quotation Report Email Import
on:
  pull_request:
    paths:
      - 'automation/sfdc/quotation_email_ingest.py'
      - 'automation/sfdc/test_quotation_email_ingest.py'
      - '.github/workflows/sfdc-quotation-email-import.yml'
      - 'automation/sfdc/quotation_process_mail_audit.py'
      - 'automation/sfdc/test_quotation_process_mail_audit.py'
  workflow_dispatch:
    inputs:
      process_audit:
        description: Only audit the 25-column Quotation process attachment (no writes)
        required: false
        type: boolean
        default: false
  schedule:
    # Check each hour, including 16:25 KST after a 16:00 report subscription.
    - cron: '25 * * * *'
  push:
    branches: [main]
    paths:
      - 'automation/sfdc/quotation_email_ingest.py'
      - 'automation/sfdc/test_quotation_email_ingest.py'
      - '.github/workflows/sfdc-quotation-email-import.yml'
      - 'automation/sfdc/quotation_process_mail_audit.py'
      - 'automation/sfdc/test_quotation_process_mail_audit.py'
permissions:
  contents: read
concurrency:
  group: sales-weekly-writer
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser dependencies
        run: python3 -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3' 'openpyxl>=3.1,<4'
      - name: Test attachment parser, rejection diagnostics and action output
        run: python3 automation/sfdc/test_quotation_email_ingest.py
  import:
    needs: offline
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || !inputs.process_audit)
    environment: TaehoonServer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CSS_QQ_MAIL_ADDRESS: ${{ secrets.CSS_QQ_MAIL_ADDRESS }}
      CSS_QQ_MAIL_AUTH_CODE: ${{ secrets.CSS_QQ_MAIL_AUTH_CODE }}
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
      SFDC_UNIFIED_SHEET_ID: 1Fo0Tc6PQ3Ek0-33lmegScM_z8ST-ShUYQ0K3kD4PqnI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Google Sheets API client
        run: python3 -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3' 'openpyxl>=3.1,<4'
      - name: Syntax check
        run: python3 -m py_compile automation/sfdc/quotation_email_ingest.py
      - name: Test EUC-KR Quotation export parser
        run: python3 automation/sfdc/test_quotation_email_ingest.py
      - name: Read subscription email and import valid quotation attachment
        id: quote_import
        run: python3 automation/sfdc/quotation_email_ingest.py
      - name: Reconcile approved Quote IDs, Active amounts, weekly totals and master
        if: steps.quote_import.outputs.imported == 'true'
        run: python3 automation/css_mail/sfdc_quote_validation.py

  process_audit:
    name: Schema-only detailed Quote Report mail audit (no writes)
    if: github.event_name == 'workflow_dispatch' && inputs.process_audit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: TaehoonServer
    env:
      CSS_QQ_MAIL_ADDRESS: ${{ secrets.CSS_QQ_MAIL_ADDRESS }}
      CSS_QQ_MAIL_AUTH_CODE: ${{ secrets.CSS_QQ_MAIL_AUTH_CODE }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser
        run: python3 -m pip install 'openpyxl>=3.1,<4'
      - name: Validate schema parser before inbox access
        run: python3 -m unittest discover -s automation/sfdc -p test_quotation_process_mail_audit.py -v
      - name: Inspect QQ 25-column process Report attachments without writes
        run: python3 automation/sfdc/quotation_process_mail_audit.py
