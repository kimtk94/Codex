name: Feishu Native Payment Dashboard (No Vercel)
on:
  pull_request:
    paths:
      - 'automation/feishu/native_payment_dashboard_cli.py'
      - 'automation/feishu/latest_payment_bridge.py'
      - 'automation/feishu/test_native_payment_dashboard.py'
      - 'automation/feishu/test_native_progress_dashboard.py'
      - '.github/workflows/feishu-native-payment-dashboard.yml'
  push:
    branches:
      - main
      - 'feat/feishu-payment-dashboard-*'
    paths:
      - 'automation/feishu/native_payment_dashboard_cli.py'
      - 'automation/feishu/test_native_payment_dashboard.py'
      - '.github/workflows/feishu-native-payment-dashboard.yml'
  workflow_run:
    workflows: ['Feishu Sales SIF Invoice Weekly KPI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect or apply Payment dashboard
        type: choice
        options: [plan, apply]
        default: plan
permissions:
  contents: read
concurrency:
  group: feishu-native-payment-dashboard
  cancel-in-progress: false
jobs:
  offline:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate dashboard and archive separation
        run: |
          python3 -m py_compile automation/feishu/native_payment_dashboard_cli.py
          python3 -m unittest discover -s automation/feishu -p 'test_native_payment_dashboard.py' -v
          python3 -m unittest discover -s automation/feishu -p 'test_native_progress_dashboard.py' -v
  native:
    needs: offline
    if: github.event_name != 'pull_request'
    environment: TaehoonServer
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_BASE_APP_TOKEN: ${{ vars.FEISHU_SALES_BASE_APP_TOKEN }}
      FEISHU_PAYMENT_DASHBOARD_MODE: ${{ (github.event_name == 'workflow_run') && 'apply' || (github.event_name == 'workflow_dispatch' && inputs.mode || 'plan') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official Lark CLI
        run: npm install --global '@larksuite/cli@1.0.98'
      - name: Configure ephemeral Feishu bot identity
        run: |
          printf '%s' "$FEISHU_APP_SECRET" | lark-cli profile add --name css-sales-payment --app-id "$FEISHU_APP_ID" --brand feishu --app-secret-stdin
          lark-cli profile use css-sales-payment
      - name: Create native Payment Dashboard and filter active projects
        run: python3 automation/feishu/native_payment_dashboard_cli.py
