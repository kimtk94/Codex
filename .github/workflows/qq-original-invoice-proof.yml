name: QQ Original Invoice IMAP Proof
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/css_mail/original_invoice_imap_proof.py'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 20
    env:
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
      CSS_QQ_MAIL_ADDRESS: ${{ secrets.CSS_QQ_MAIL_ADDRESS }}
      CSS_QQ_MAIL_AUTH_CODE: ${{ secrets.CSS_QQ_MAIL_AUTH_CODE }}
      CSS_INVOICE_PROOF_BATCH: '400'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install google-auth requests
      - run: python -m py_compile automation/css_mail/original_invoice_imap_proof.py
      - run: python automation/css_mail/original_invoice_imap_proof.py
