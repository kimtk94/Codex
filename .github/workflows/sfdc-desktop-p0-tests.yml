name: Salesforce Desktop RPA P0 tests

on:
  pull_request:
    paths:
      - 'automation/sfdc_desktop/**'
      - '.github/workflows/sfdc-desktop-p0-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test dependency
        run: python -m pip install -r automation/sfdc_desktop/requirements.txt
      - name: Compile worker and tests
        run: python -m compileall -q automation/sfdc_desktop
      - name: Test safety contracts without Salesforce access
        run: python -m unittest discover -s automation/sfdc_desktop -p 'test_*.py' -v
