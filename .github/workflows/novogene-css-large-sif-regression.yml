name: Novogene CSS 1200-Record Large SIF Regression

on:
  push:
    branches:
      - 'audit/css-g16-boundary-20261016'
    paths:
      - '.github/workflows/novogene-css-large-sif-regression.yml'
      - 'css-upgrade/staging-20261014/large_sif_workflow_regression.py'
      - 'css-upgrade/staging-20261014/g16_private_sif_bwrap.sh'
      - 'css-upgrade/staging-20261014/novogene_sif_manual_override_collision.patch'
      - 'css-upgrade/staging-20261014/novogene_sif_atomic_auto_skip.patch'
      - 'css-upgrade/staging-20261014/novogene_css_hold_replay_guard.patch'
      - 'css-upgrade/staging-20261014/novogene_css_one_shot_receipts.patch'
      - 'css-upgrade/staging-20261014/novogene_css_snapshot_conflict_guard.patch'

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify SSH configuration
        env:
          SSH_HOST: ${{ secrets.SERVER_SSH_HOST }}
          SSH_USER: ${{ secrets.SERVER_SSH_USER }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ] || [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::Missing SSH config"; exit 1
          fi
          install -m 700 -d "$HOME/.ssh"
          python3 - <<'PY'
          import os
          from pathlib import Path
          raw = os.environ["SSH_KEY"].strip()
          if "\\n" in raw and "\n" not in raw:
              raw = raw.replace("\\n","\n")
          raw=raw.replace("\r\n","\n").replace("\r","\n")
          if not raw.startswith(("-----BEGIN OPENSSH PRIVATE KEY-----","-----BEGIN RSA PRIVATE KEY-----","-----BEGIN EC PRIVATE KEY-----")):
              raise SystemExit("SSH_KEY_FORMAT_INVALID")
          Path.home().joinpath(".ssh/server_key").write_text(raw+"\n")
          PY
          chmod 600 "$HOME/.ssh/server_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -P "" -f "$HOME/.ssh/server_key" > /dev/null 2>&1 || exit 1
      - name: Run staged SIF real functions in private rootless Bubblewrap
        env:
          SSH_HOST: ${{ secrets.SERVER_SSH_HOST }}
          SSH_USER: ${{ secrets.SERVER_SSH_USER }}
        run: |
          set -euo pipefail
          REMOTE_DIR="/tmp/css-sif-bwrap-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          SSH_ARGS=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -o IdentitiesOnly=yes -i "$HOME/.ssh/server_key")
          cleanup() {
            ssh "${SSH_ARGS[@]}" "$SSH_USER@$SSH_HOST" \
              "rm -f '$REMOTE_DIR/large_sif_workflow_regression.py' '$REMOTE_DIR/g16_private_sif_bwrap.sh' '$REMOTE_DIR/'*.patch; rmdir '$REMOTE_DIR' 2>/dev/null || true" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          ssh "${SSH_ARGS[@]}" "$SSH_USER@$SSH_HOST" "mkdir -m 700 -p '$REMOTE_DIR'"
          scp -q "${SSH_ARGS[@]}" \
            css-upgrade/staging-20261014/large_sif_workflow_regression.py \
            css-upgrade/staging-20261014/g16_private_sif_bwrap.sh \
            css-upgrade/staging-20261014/novogene_sif_history_candidate.patch \
            css-upgrade/staging-20261014/novogene_sif_manual_override_collision.patch \
            css-upgrade/staging-20261014/novogene_sif_portfolio_visibility.patch \
            css-upgrade/staging-20261014/novogene_sif_independent_actions.patch \
            css-upgrade/staging-20261014/novogene_sif_atomic_auto_skip.patch \
            css-upgrade/staging-20261014/novogene_css_hold_replay_guard.patch \
            css-upgrade/staging-20261014/novogene_css_one_shot_receipts.patch \
            css-upgrade/staging-20261014/novogene_css_snapshot_conflict_guard.patch \
            "$SSH_USER@$SSH_HOST:$REMOTE_DIR/"
          ssh "${SSH_ARGS[@]}" "$SSH_USER@$SSH_HOST" \
            "bash '$REMOTE_DIR/g16_private_sif_bwrap.sh' '$REMOTE_DIR' large_sif_workflow_regression.py"
          echo "G16_STAGED_SIF_BWRAP_JOB_COMPLETE"
