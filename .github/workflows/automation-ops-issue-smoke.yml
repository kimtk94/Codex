name: Automation OPS Issue E2E Smoke
on:
  push:
    branches: [main]
    paths:
      - 'automation/progress/incident_issue_smoke.py'
      - '.github/workflows/automation-ops-issue-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create, re-read, and close isolated test Issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python automation/progress/incident_issue_smoke.py
