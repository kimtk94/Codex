name: SFDC 2026 KRW Process Price Candidates (read-only)
on:
  workflow_dispatch:
  schedule:
    - cron: '25 12 * * *'  # 21:25 KST after QQ SFDC ingestion
  push:
    branches: [main]
    paths:
      - 'automation/sfdc/quote_2026_krw_price_reuse.py'
      - 'automation/sfdc/test_quote_2026_krw_price_reuse.py'
      - 'automation/sfdc/quote_2026_historical_coverage.py'
      - 'automation/sfdc/test_quote_2026_historical_coverage.py'
      - 'automation/sfdc/quote_2026_historical_batch_selection.py'
      - 'automation/sfdc/test_quote_2026_historical_batch_selection.py'
      - 'automation/sfdc_desktop/quote_2026_krw_browser_export.py'
      - 'automation/sfdc_desktop/test_quote_2026_krw_browser_export.py'
      - 'automation/sfdc_desktop/quote_2026_krw_multi_product_export.py'
      - 'automation/sfdc_desktop/test_quote_2026_krw_multi_product_export.py'
      - 'masteros/web/scripts/sfdc_krw_native_contact_lookup.py'
      - 'masteros/web/scripts/test_sfdc_krw_native_contact_lookup.py'
      - 'masteros/web/lib/sfdc-krw-native-contact-lookup.mjs'
      - 'masteros/web/app/api/sfdc/krw-contact-local/route.js'
      - '.github/workflows/sfdc-2026-krw-price-candidates.yml'
  pull_request:
    paths:
      - 'automation/sfdc/quote_2026_krw_price_reuse.py'
      - 'automation/sfdc/test_quote_2026_krw_price_reuse.py'
      - 'automation/sfdc/quote_2026_historical_coverage.py'
      - 'automation/sfdc/test_quote_2026_historical_coverage.py'
      - 'automation/sfdc/quote_2026_historical_batch_selection.py'
      - 'automation/sfdc/test_quote_2026_historical_batch_selection.py'
      - 'automation/sfdc_desktop/quote_2026_krw_browser_export.py'
      - 'automation/sfdc_desktop/test_quote_2026_krw_browser_export.py'
      - 'automation/sfdc_desktop/quote_2026_krw_multi_product_export.py'
      - 'automation/sfdc_desktop/test_quote_2026_krw_multi_product_export.py'
      - 'masteros/web/scripts/sfdc_krw_native_contact_lookup.py'
      - 'masteros/web/scripts/test_sfdc_krw_native_contact_lookup.py'
      - 'masteros/web/lib/sfdc-krw-native-contact-lookup.mjs'
      - 'masteros/web/app/api/sfdc/krw-contact-local/route.js'
      - '.github/workflows/sfdc-2026-krw-price-candidates.yml'
permissions:
  contents: read
concurrency:
  group: sfdc-2026-krw-price-candidates-${{ github.ref }}
  cancel-in-progress: false
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test 2026 KRW only, same-customer priority, no CRM writes
        run: |
          python3 -m unittest discover -s automation/sfdc -p 'test_quote_2026_krw_price_reuse.py' -v
          python3 -m py_compile automation/sfdc/quote_2026_krw_price_reuse.py
          python3 -m unittest discover -s automation/sfdc -p 'test_quote_2026_historical_coverage.py' -v
          python3 -m py_compile automation/sfdc/quote_2026_historical_coverage.py
          python3 -m unittest discover -s automation/sfdc -p 'test_quote_2026_historical_batch_selection.py' -v
          python3 -m py_compile automation/sfdc/quote_2026_historical_batch_selection.py
      - name: Check local Salesforce browser exporter with synthetic evidence only
        run: |
          python3 -m pip install 'playwright>=1.56,<2'
          python3 -m unittest discover -s automation/sfdc_desktop -p 'test_quote_2026_krw_browser_export.py' -v
          python3 -m unittest discover -s automation/sfdc_desktop -p 'test_quote_2026_krw_multi_product_export.py' -v
          python3 -m py_compile automation/sfdc_desktop/quote_2026_krw_browser_export.py automation/sfdc_desktop/quote_2026_krw_multi_product_export.py
      - name: Test native Contact 001/003/006 local lookup with no Salesforce access
        run: |
          python3 -m unittest discover -s masteros/web/scripts -p 'test_sfdc_krw_native_contact_lookup.py' -v
          python3 -m py_compile masteros/web/scripts/sfdc_krw_native_contact_lookup.py
  private-source-availability:
    needs: synthetic
    if: github.event_name != 'pull_request'
    environment: TaehoonServer
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only source verifier
        run: python3 -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3'
      - name: Verify source hashes and explicitly HOLD without 2026 KRW unit prices
        run: |
          python3 automation/sfdc/quote_2026_krw_price_reuse.py --audit-live --out /tmp/sfdc-2026-krw-source-status.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path('/tmp/sfdc-2026-krw-source-status.json').read_text())
          assert r['source_integrity']=='PASS_HASH_VERIFIED', 'SOURCE_UNAVAILABLE_OR_TAMPERED'
          assert r['crm_writes']==0, 'UNEXPECTED_CRM_WRITE'
          assert r['price_status'].startswith('HOLD_'), 'PRICE_GATE_MUST_NOT_AUTOPROMOTE'
          assert r['verified_krw_price_rows']==0, 'PRICE_GATE_UNEXPECTED_DATA'
          print('SFDC_QQ_REPORT_SOURCE_AUDIT=PASS QQ_NATIVE_KRW_PRICE_FIELD=ABSENT PRIVATE_DESKTOP_KRW_INDEX=SEPARATE NO_SAVE=TRUE')
          PY
      - name: Audit 2026 historical approvals against QQ report SHA256 (aggregate only)
        run: |
          python3 automation/sfdc/quote_2026_historical_coverage.py --audit-live --out /tmp/sfdc-2026-historical-source-coverage.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path('/tmp/sfdc-2026-historical-source-coverage.json').read_text())
          assert r['status']=='PASS'
          assert r['source_integrity']=='PASS_HASH_VERIFIED'
          assert r['approval_rows_2026']>0
          assert r['crm_writes']==0 and r['price_auto_apply'] is False
          assert r['native_krw_process_price_available_in_qq'] is False
          print('SFDC_2026_APPROVAL_SOURCE_AUDIT=PASS APPROVALS',r['approval_rows_2026'],
                'SINGLE_ELIGIBLE',r['eligibility_counts'].get('SINGLE_PRODUCT_ELIGIBLE',0),
                'MULTI',r['eligibility_counts'].get('MULTI_PRODUCT',0),
                'INACTIVE',r['eligibility_counts'].get('INACTIVE',0),
                'DATE_HOLD',r['eligibility_counts'].get('CREATED_DATE_MISMATCH',0),
                'QQ_NATIVE_KRW_PRICES=ABSENT CRM_WRITES=0')
          PY
      - name: Delete temporary source availability summary
        if: always()
        run: rm -f /tmp/sfdc-2026-krw-source-status.json /tmp/sfdc-2026-historical-source-coverage.json
