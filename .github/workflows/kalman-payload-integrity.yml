name: Kalman Payload Integrity

on:
  push:
    branches: [main]
    paths:
      - 'kalman-toss-gateway/engine/**'
      - 'kalman-toss-gateway/scripts/preflight.sh'
      - '.github/workflows/kalman-payload-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Unified payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, binascii, hashlib, lzma, re

          root = Path('kalman-toss-gateway/engine')
          names = [f'_unified_payload_{i:02d}.b64' for i in range(15)]
          parts = [root / name for name in names]
          if not all(p.is_file() for p in parts):
              actual = sorted(p.name for p in root.glob('_unified_payload_*.b64'))
              raise SystemExit(f'payload file set mismatch: {actual!r}')

          expected_lengths = [5000] * 14 + [688]
          encoded_parts = []
          for i, p in enumerate(parts):
              try:
                  text = p.read_text(encoding='ascii')
              except UnicodeDecodeError as exc:
                  raise SystemExit(f'{p.name}: payload is not ASCII') from exc
              compact = ''.join(text.split())
              bad = sorted(set(re.sub(r'[A-Za-z0-9+/=]', '', compact)))
              if bad:
                  raise SystemExit(f'{p.name}: invalid Base64 characters: {bad!r}')
              if len(compact) != expected_lengths[i]:
                  raise SystemExit(
                      f'{p.name}: compact length {len(compact)} != {expected_lengths[i]}'
                  )
              encoded_parts.append(compact)
              print(f'{p.name}: {len(compact)} chars OK')

          encoded = ''.join(encoded_parts)
          if len(encoded) != 70688:
              raise SystemExit(f'encoded length mismatch: {len(encoded)} != 70688')

          try:
              packed = base64.b64decode(encoded, validate=True)
          except binascii.Error as exc:
              raise SystemExit(f'Base64 decode failed: {exc}') from exc
          try:
              source = lzma.decompress(packed)
          except lzma.LZMAError as exc:
              raise SystemExit(f'LZMA decompression failed: {exc}') from exc

          sha = hashlib.sha256(source).hexdigest()
          expected_sha = 'e1d68ef0744b1083be8c4ba32908f090e0f0b70742cb224df75c9596d06540f8'
          if sha != expected_sha:
              raise SystemExit(f'Unified payload SHA mismatch: {sha} != {expected_sha}')
          if len(source) != 252111:
              raise SystemExit(f'Unified source size mismatch: {len(source)} != 252111')

          compile(
              source.decode('utf-8'),
              'Investment_Hub_Unified_Colab_v1.server.py',
              'exec',
          )
          print(f'OK payload bytes={len(source)} sha256={sha}')
          PY
