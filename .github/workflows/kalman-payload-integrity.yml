name: Kalman Payload Integrity

on:
  push:
    branches: [main]
    paths:
      - 'kalman-toss-gateway/engine/**'
      - 'kalman-toss-gateway/scripts/preflight.sh'
      - '.github/workflows/kalman-payload-integrity.yml'
  workflow_dispatch:

jobs:
  verify-payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify or recover Unified payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma, string

          root = Path('kalman-toss-gateway/engine')
          names = [f'_unified_payload_{i:02d}.b64' for i in range(15)]
          parts = [root / name for name in names]
          if not all(p.is_file() for p in parts):
              raise SystemExit('payload file set mismatch')

          expected_lengths = [5000] * 14 + [688]
          compact = [''.join(p.read_text(encoding='ascii').split()) for p in parts]
          deficits = [(i, expected_lengths[i] - len(compact[i])) for i in range(15) if len(compact[i]) != expected_lengths[i]]
          for i, s in enumerate(compact):
              print(f'{names[i]} compact={len(s)} expected={expected_lengths[i]}')

          expected_sha = 'e1d68ef0744b1083be8c4ba32908f090e0f0b70742cb224df75c9596d06540f8'

          def verify(strings):
              encoded = ''.join(strings)
              packed = base64.b64decode(encoded, validate=True)
              source = lzma.decompress(packed)
              sha = hashlib.sha256(source).hexdigest()
              if sha != expected_sha:
                  return None
              compile(source.decode('utf-8'), 'Investment_Hub_Unified_Colab_v1.server.py', 'exec')
              return len(source)

          if not deficits:
              size = verify(compact)
              if size is None:
                  raise SystemExit('payload decodes but source SHA does not match')
              print(f'OK payload bytes={size} sha256={expected_sha}')
              raise SystemExit(0)

          if deficits != [(2, 1)]:
              raise SystemExit(f'unexpected payload deficits: {deficits!r}')

          broken = compact[2]
          alphabet = string.ascii_uppercase + string.ascii_lowercase + string.digits + '+/'

          # Every intended chunk boundary is Base64 aligned (5000 % 4 == 0), so
          # decode all known-good chunks once. Only chunk 02 needs brute-force repair.
          prefix_packed = b''.join(base64.b64decode(s, validate=True) for s in compact[:2])
          suffix_packed = b''.join(base64.b64decode(s, validate=True) for s in compact[3:])

          for pos in range(len(broken) + 1):
              if pos % 500 == 0:
                  print(f'search position {pos}/{len(broken)}')
              left, right = broken[:pos], broken[pos:]
              for ch in alphabet:
                  candidate = left + ch + right
                  try:
                      mid = base64.b64decode(candidate, validate=True)
                      source = lzma.decompress(prefix_packed + mid + suffix_packed)
                  except Exception:
                      continue
                  if hashlib.sha256(source).hexdigest() == expected_sha:
                      compile(source.decode('utf-8'), 'Investment_Hub_Unified_Colab_v1.server.py', 'exec')
                      print(f'RECOVERY_FOUND file={names[2]} compact_index={pos} char={ch!r} bytes={len(source)} sha256={expected_sha}')
                      raise SystemExit(3)

          raise SystemExit('recovery search exhausted without matching source SHA')
          PY
