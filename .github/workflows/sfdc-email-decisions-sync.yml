name: SFDC Email Decision Sync
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: read
concurrency:
  group: sfdc-email-decision-sync
  cancel-in-progress: false
jobs:
  sync:
    environment: TaehoonServer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
      SFDC_SHEET_ID: 1Fo0Tc6PQ3Ek0-33lmegScM_z8ST-ShUYQ0K3kD4PqnI
      CSS_SHEET_ID: 1753nq7_zX-6ae7srmJryHrFECEG5L9Mjf7JvjrbFxVY
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install google-api-python-client google-auth
      - name: Verify sales Sheets credential is configured
        shell: bash
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo 'Missing CKD_DRIVE_SA_JSON secret in TaehoonServer environment' >&2
            exit 1
          fi
      - name: Verify Python syntax
        run: python -m py_compile automation/css/sfdc_email_decision_sync.py automation/css/bi_mail_review_sync.py automation/css/sfdc_email_decision_ack.py automation/css/sfdc_email_snapshot_refresh.py automation/css/sfdc_email_consistency_check.py automation/css/lead_sent_audit_refresh.py
      - name: Offline safety and explicit-decision parity regression checks
        run: |
          python -m unittest discover -s automation/css -p 'test_sfdc_email_decision_safety.py' -v
          python -m unittest discover -s automation/css -p 'test_sfdc_email_consistency.py' -v
      - name: Verify access to SFDC and QQ Sheets
        run: python automation/css/sfdc_sheets_preflight.py
      - name: Validate decisions without writes
        run: |
          python automation/css/sfdc_email_decision_sync.py
          python automation/css/bi_mail_review_sync.py
          python automation/css/sfdc_email_snapshot_refresh.py
      - name: Send SFDC decisions to QQ
        env:
          DRY_RUN: 'false'
        run: python automation/css/sfdc_email_decision_sync.py
      - name: Apply QQ exclusions
        env:
          DRY_RUN: 'false'
        run: python automation/css/bi_mail_review_sync.py
      - name: Acknowledge synchronized decisions in SFDC
        run: python automation/css/sfdc_email_decision_ack.py
      - name: Refresh SFDC email snapshot without changing decisions
        env:
          DRY_RUN: 'false'
        run: python automation/css/sfdc_email_snapshot_refresh.py
      - name: Verify outstanding SFDC decisions
        run: python automation/css/sfdc_email_decision_sync.py
      - name: Verify QQ and SFDC mail and decision parity
        run: python automation/css/sfdc_email_consistency_check.py
      - name: Record successful sync health
        if: success()
        env:
          SYNC_JOB_STATUS: PASS
        run: python automation/css/sfdc_email_sync_health.py
      - name: Record failed sync health
        if: failure()
        continue-on-error: true
        env:
          SYNC_JOB_STATUS: FAILURE
        run: python automation/css/sfdc_email_sync_health.py
      - name: Publish execution diagnostics
        if: always()
        shell: bash
        env:
          JOB_RESULT: ${{ job.status }}
        run: |
          {
            echo '## SFDC Email Decision Sync'
            echo "- Workflow result: ${JOB_RESULT}"
            echo "- Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Attempt: ${GITHUB_RUN_ATTEMPT}"
            echo '- Validation order: credentials → dry run → QQ apply → SFDC acknowledgement → snapshot → parity → health'
            echo '- A PASS requires all preceding steps, including QQ/SFDC parity, to succeed.'
            echo '- Check the first failed step in this run if health remains UNVERIFIED.'
          } >> "$GITHUB_STEP_SUMMARY"
