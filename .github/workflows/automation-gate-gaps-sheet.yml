name: Automation Gate Gaps Sheet Sync
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/automation-gate-gaps-sheet.yml'
  pull_request:
    paths:
      - 'automation/progress/**'
      - '.github/workflows/automation-gate-gaps-sheet.yml'
  workflow_dispatch:
    inputs:
      apply:
        type: boolean
        required: true
        default: false
  schedule:
    - cron: '40 0 * * *'
permissions:
  contents: read
concurrency:
  group: automation-gate-gaps-sheet
  cancel-in-progress: false
jobs:
  gate-gap-sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install google-auth requests
      - name: Tests
        run: python -m unittest discover -s automation/progress -p 'test_*.py'
      - name: Read-only preview
        if: github.event_name != 'pull_request'
        env:
          CKD_DRIVE_SA_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
        run: python automation/progress/publish_gate_gaps.py
      - name: Publish approved gap metadata only
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.apply)
        env:
          CKD_DRIVE_SA_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
          GATE_GAP_APPLY: 'true'
        run: python automation/progress/publish_gate_gaps.py --apply
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-gap-preview
          path: progress-audit/gate-sheet-preview.json
