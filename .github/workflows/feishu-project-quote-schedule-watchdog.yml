name: Feishu Quote-first Schedule Watchdog (Read Only)

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"
  pull_request:
    paths:
      - "automation/feishu/project_quote_schedule_watchdog.py"
      - "automation/feishu/test_project_quote_schedule_watchdog.py"
      - ".github/workflows/feishu-project-quote-schedule-watchdog.yml"

permissions:
  actions: read
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline scheduler regression (no credentials)
        run: |
          python3 -m py_compile automation/feishu/project_quote_schedule_watchdog.py
          python3 -m unittest discover -s automation/feishu -p 'test_project_quote_schedule_watchdog.py' -v
  heartbeat:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check missing GitHub schedule independently (read only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 automation/feishu/project_quote_schedule_watchdog.py
