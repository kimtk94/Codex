name: CSS Canonical Mail Shadow Load
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: canonical-mail-shadow-load
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 20
    env:
      CKD_DRIVE_SA_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
      CANONICAL_SHADOW_WRITE: 'true'
      CANONICAL_BATCH_LIMIT: '500'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3'
      - run: python -m py_compile automation/css_mail/mail_shadow_load.py
      - run: python automation/css_mail/mail_shadow_load.py
