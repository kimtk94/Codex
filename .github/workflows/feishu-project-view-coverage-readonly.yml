name: Feishu Project View Coverage (Read Only)

on:
  pull_request:
    paths:
      - 'automation/feishu/project_view_coverage_readonly.py'
      - 'automation/feishu/test_project_view_coverage_readonly.py'
      - '.github/workflows/feishu-project-view-coverage-readonly.yml'
  push:
    branches: [audit/feishu-project-view-coverage-20261117]
    paths:
      - 'automation/feishu/project_view_coverage_readonly.py'
      - 'automation/feishu/test_project_view_coverage_readonly.py'
      - '.github/workflows/feishu-project-view-coverage-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify no-write safety and project view partition test cases
        run: |
          python3 -m unittest discover -s automation/feishu -p 'test_project_view_coverage_readonly.py' -v
          python3 -m py_compile automation/feishu/project_view_coverage_readonly.py

  production-metadata-read:
    needs: offline-tests
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.offline-tests.result == 'success' }}
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 18
    env:
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_PROJECT_VIEW_AUDIT_MODE: plan
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read-only count of ALL/Active/Billing/Archived and outside records
        run: |
          python3 automation/feishu/project_view_coverage_readonly.py
          {
            echo '## Feishu view coverage is not payment or quote certification'
            echo 'Only view membership, aggregate project states and view filter metadata were read.'
            echo 'No customer details, Invoice amounts, Feishu business writes or SFDC saves.'
            echo 'Any unclassified count is an unassigned view membership, NOT a deleted project.'
          } >> "$GITHUB_STEP_SUMMARY"
