name: Feishu SFDC Command Queue Bridge
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Mode
        type: choice
        options: [bootstrap, pull, push, smoke_seed, smoke_verify, smoke_cleanup]
        default: pull
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - 'automation/feishu/sfdc_command_queue.py'
      - 'masteros/web/scripts/sfdc_quote_price_fields.py'
      - 'masteros/web/scripts/feishu_sfdc_local_worker.py'
      - 'masteros/web/scripts/test_sfdc_quote_price_fields.py'
      - 'masteros/web/scripts/test_sfdc_multi_product_price_fields.py'
      - 'masteros/web/scripts/test_feishu_sfdc_local_worker.py'
      - 'automation/feishu/test_sfdc_command_queue.py'
      - 'automation/feishu/sfdc_price_smoke.py'
      - 'automation/feishu/test_sfdc_price_smoke.py'
      - '.github/workflows/feishu-sfdc-command-queue.yml'
  pull_request:
    paths:
      - 'automation/feishu/sfdc_command_queue.py'
      - 'masteros/web/scripts/sfdc_quote_price_fields.py'
      - 'masteros/web/scripts/feishu_sfdc_local_worker.py'
      - 'masteros/web/scripts/test_sfdc_quote_price_fields.py'
      - 'masteros/web/scripts/test_sfdc_multi_product_price_fields.py'
      - 'masteros/web/scripts/test_feishu_sfdc_local_worker.py'
      - 'automation/feishu/test_sfdc_command_queue.py'
      - 'automation/feishu/sfdc_price_smoke.py'
      - 'automation/feishu/test_sfdc_price_smoke.py'
      - '.github/workflows/feishu-sfdc-command-queue.yml'
permissions:
  contents: read
concurrency:
  group: feishu-sfdc-queue-bridge
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify approval, duplicate and replay guards
        run: |
          python3 -m unittest discover -s automation/feishu -p test_sfdc_command_queue.py -v
          python3 -m py_compile automation/feishu/sfdc_command_queue.py
          python3 -m py_compile automation/feishu/sfdc_price_smoke.py
          python3 -m unittest discover -s automation/feishu -p test_sfdc_price_smoke.py -v
          python3 -m unittest discover -s masteros/web/scripts -p test_sfdc_quote_price_fields.py -v
          python3 -m unittest discover -s masteros/web/scripts -p test_sfdc_multi_product_price_fields.py -v
          python3 -m unittest discover -s masteros/web/scripts -p test_feishu_sfdc_local_worker.py -v
  live:
    needs: offline
    if: github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || vars.FEISHU_SFDC_BRIDGE_ENABLED == 'true')
    runs-on: ubuntu-24.04
    environment: TaehoonServer
    timeout-minutes: 12
    env:
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_BASE_APP_TOKEN: ${{ vars.FEISHU_SALES_BASE_APP_TOKEN }}
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
      PYTHONDONTWRITEBYTECODE: '1'
      CSS_SFDC_SMOKE_OPPO_ID: ${{ secrets.CSS_SFDC_SMOKE_OPPO_ID }}
      CSS_SFDC_SMOKE_QUOTE_ID: ${{ secrets.CSS_SFDC_SMOKE_QUOTE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Google Sheets auth
        run: python3 -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3'
      - name: Assert user-owned Novogene Sales Workspace target
        run: |
          if [ -z "$FEISHU_BASE_APP_TOKEN" ] || [ "$FEISHU_BASE_APP_TOKEN" = "PENDING" ]; then
            echo 'BLOCK: FEISHU_SALES_BASE_APP_TOKEN is not configured'
            exit 2
          fi
          echo 'TARGET_BASE=USER_SALES_WORKSPACE_2026' >> "$GITHUB_STEP_SUMMARY"
      - name: Ensure dedicated Feishu command table
        run: python3 automation/feishu/sfdc_command_queue.py bootstrap
      - name: Mirror Feishu requests into private inbox
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'pull'
        run: python3 automation/feishu/sfdc_command_queue.py pull
      - name: Publish completed local results to Feishu
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'push'
        run: python3 automation/feishu/sfdc_command_queue.py push
      - name: Create one CHECK-only Feishu price smoke request
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'smoke_seed'
        run: python3 automation/feishu/sfdc_price_smoke.py smoke_seed
      - name: Verify Feishu and private mirror source/product/Cloud pricing
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'smoke_verify'
        run: python3 automation/feishu/sfdc_price_smoke.py smoke_verify
      - name: Delete completed CHECK-only smoke row with strict guard
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'smoke_cleanup'
        run: python3 automation/feishu/sfdc_price_smoke.py smoke_cleanup
      - name: State safe boundary
        if: always()
        run: |
          echo 'FEISHU_QUEUE_ONLY;NO_SALESFORCE_WRITE_FROM_CI;LOCAL_AUTH_REQUIRED;NO_VERCEL' >> "$GITHUB_STEP_SUMMARY"
