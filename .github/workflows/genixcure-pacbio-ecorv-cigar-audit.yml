name: Genixcure PacBio EcoRV CIGAR Audit Self Test
on:
  push:
    paths:
      - 'analysis/genixcure/Genixcure_PacBio_EcoRV_CIGAR_Audit.py'
      - '.github/workflows/genixcure-pacbio-ecorv-cigar-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cigar-parser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile CIGAR audit
        run: python -m py_compile analysis/genixcure/Genixcure_PacBio_EcoRV_CIGAR_Audit.py
      - name: Synthetic CIGAR structural event regression
        run: python analysis/genixcure/Genixcure_PacBio_EcoRV_CIGAR_Audit.py --self-test
