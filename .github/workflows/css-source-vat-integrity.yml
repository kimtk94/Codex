name: CSS Source & VAT Integrity (offline)
on:
  pull_request:
    paths:
      - 'automation/css_mail/mail_checkpoint_health_audit.py'
      - 'automation/css_mail/project_lifecycle_refresh.py'
      - 'automation/css_mail/test_project_lifecycle_chain.py'
      - 'automation/css_mail/bi_service_reconcile.py'
      - 'automation/css_mail/test_source_vat_integrity.py'
      - '.github/workflows/css-source-vat-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'automation/css_mail/mail_checkpoint_health_audit.py'
      - 'automation/css_mail/project_lifecycle_refresh.py'
      - 'automation/css_mail/test_project_lifecycle_chain.py'
      - 'automation/css_mail/bi_service_reconcile.py'
      - 'automation/css_mail/test_source_vat_integrity.py'
      - '.github/workflows/css-source-vat-integrity.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install import dependencies
        run: python -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3'
      - name: Compile fixed modules
        run: python -m py_compile automation/css_mail/mail_checkpoint_health_audit.py automation/css_mail/project_lifecycle_refresh.py automation/css_mail/bi_service_reconcile.py
      - name: Verify source and VAT integrity without external writes
        run: python automation/css_mail/test_source_vat_integrity.py
      - name: Verify exact QQ-only Statement lifecycle and pending parity
        run: python -m unittest discover -s automation/css_mail -p 'test_project_lifecycle_chain.py' -v
