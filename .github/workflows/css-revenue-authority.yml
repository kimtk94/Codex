name: CSS Revenue Source Authority Audit
on:
  pull_request:
    paths:
      - 'automation/css_mail/revenue_source_authority.py'
      - 'automation/css_mail/test_revenue_source_authority.py'
      - '.github/workflows/css-revenue-authority.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ["CSS Verified Net Revenue VAT Audit"]
    types: [completed]
  schedule:
    - cron: '23 1,7,13,19 * * *'
  push:
    branches: [main]
    paths:
      - 'automation/css_mail/revenue_source_authority.py'
      - 'automation/css_mail/test_revenue_source_authority.py'
      - '.github/workflows/css-revenue-authority.yml'
permissions:
  contents: read
concurrency:
  group: css-revenue-authority-readonly-sources
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source-authority classification regressions
        working-directory: automation/css_mail
        run: |
          python -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3'
          python -m unittest -v test_revenue_source_authority test_revenue_net_vat_publish
  publish:
    needs: validate
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')) }}
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 10
    env:
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google read and generated-report writer
        run: python -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3'
      - name: Publish separate canonical versus legacy source warning only
        run: python automation/css_mail/revenue_source_authority.py
      - run: echo "No source invoice/review/payment/forecast tabs were edited."
