name: Investigate US Unified Source

on:
  pull_request:
    paths:
      - ".github/workflows/investigate-us-unified-source.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode immutable unified source
        shell: bash
        run: |
          set -euo pipefail
          cat kalman-toss-gateway/engine/_unified_payload_*.b64 | tr -d '\n\r' | base64 -d | xz -dc > /tmp/unified.py
          python -m py_compile /tmp/unified.py
          echo "===== PROVIDER / US INTRADAY HITS ====="
          grep -nEi 'yfinance|yf\.download|alpaca|stockhistoricaldata|StockBarsRequest|TimeFrame|1h|60m|hour|interval|RUN_MODE|data_as_of|model_as_of' /tmp/unified.py | head -n 240 || true
      - name: Show embedded Alpaca request and bar-completion logic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast, re

          src=Path('/tmp/unified.py').read_text(encoding='utf-8')
          tree=ast.parse(src)
          strings=[]
          for node in ast.walk(tree):
              if isinstance(node, ast.Constant) and isinstance(node.value, str) and len(node.value) > 500:
                  strings.append(node.value)

          pats=re.compile(
              r'(StockHistoricalDataClient|StockBarsRequest|TimeFrame|feed\s*=|IEX|15Min|15m|'
              r'LIVE_SOURCE_MAX|groupby|resample|minute|bucket|regular|market_open|market_close|'
              r'complete|start\s*=|end\s*=|datetime\.now|Timestamp\.now)',
              re.I,
          )
          emitted=0
          for si, blob in enumerate(strings):
              if not re.search(r'Alpaca|StockBarsRequest|IEX', blob, re.I):
                  continue
              lines=blob.splitlines()
              hits=[i for i,l in enumerate(lines) if pats.search(l)]
              seen=[]
              for i in hits:
                  if any(abs(i-j)<10 for j in seen):
                      continue
                  seen.append(i)
                  a=max(0,i-7); b=min(len(lines),i+14)
                  print(f"===== embedded {si} lines {a+1}-{b} =====")
                  for n in range(a,b):
                      print(f"{n+1}: {lines[n]}")
                  emitted += 1
                  if emitted >= 40:
                      raise SystemExit(0)
          PY
