name: Investigate US Unified Source

on:
  pull_request:
    paths:
      - ".github/workflows/investigate-us-unified-source.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode immutable unified source
        shell: bash
        run: |
          set -euo pipefail
          cat kalman-toss-gateway/engine/_unified_payload_*.b64 | tr -d '\n\r' | base64 -d | xz -dc > /tmp/unified.py
          python -m py_compile /tmp/unified.py
          echo "decoded source bytes=$(wc -c < /tmp/unified.py)"
      - name: Show nested Alpaca request and bar-completion logic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast, re

          root=Path('/tmp/unified.py').read_text(encoding='utf-8')
          queue=[("root", root, 0)]
          seen=set()
          candidates=[]

          while queue:
              label, blob, depth = queue.pop(0)
              if depth > 4 or blob in seen:
                  continue
              seen.add(blob)
              try:
                  tree=ast.parse(blob)
              except SyntaxError:
                  continue
              for node in ast.walk(tree):
                  if isinstance(node, ast.Constant) and isinstance(node.value, str) and len(node.value) > 300:
                      child=node.value
                      clabel=f"{label}/str@{getattr(node,'lineno','?')}"
                      if re.search(r'StockBarsRequest|StockHistoricalDataClient|Alpaca|IEX', child, re.I):
                          candidates.append((clabel, child, depth+1))
                      queue.append((clabel, child, depth+1))

          pats=re.compile(
              r'(StockHistoricalDataClient|StockBarsRequest|TimeFrame|feed|IEX|adjustment|'
              r'15Min|15m|LIVE_SOURCE_MAX|market_open|market_close|regular|bucket|'
              r'complete|start\s*=|end\s*=|get_stock_bars|resample|groupby)',
              re.I,
          )

          emitted=0
          for label, blob, depth in candidates:
              lines=blob.splitlines()
              hits=[i for i,l in enumerate(lines) if pats.search(l)]
              for i in hits:
                  a=max(0,i-8); b=min(len(lines),i+16)
                  print(f"===== {label} depth={depth} lines {a+1}-{b} =====")
                  for n in range(a,b):
                      print(f"{n+1}: {lines[n]}")
                  emitted += 1
                  if emitted >= 35:
                      raise SystemExit(0)
          print(f"candidate_strings={len(candidates)} emitted={emitted}")
          PY
