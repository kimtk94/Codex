name: Novogene CSS Production Source Fingerprint RO
on:
  push:
    branches:
      - audit/novogene-css-sif-staging-20261014
    paths:
      - .github/workflows/novogene-css-readonly-source-fingerprint.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-sha-only:
    runs-on: ubuntu-24.04
    environment: TaehoonServer
    timeout-minutes: 5
    steps:
      - name: Check pinned host identity and SSH key format
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SERVER_SSH_HOST }}
          SSH_USER: ${{ secrets.SERVER_SSH_USER }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ] || [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::Missing SSH credentials or pinned host key"
            exit 1
          fi
          install -m 700 -d "$HOME/.ssh"
          python3 - <<'PY'
          import os
          from pathlib import Path
          raw=os.environ["SSH_KEY"].strip().replace("\\n","\n").replace("\r\n","\n").replace("\r","\n")
          if not raw.startswith(("-----BEGIN OPENSSH PRIVATE KEY-----","-----BEGIN RSA PRIVATE KEY-----","-----BEGIN EC PRIVATE KEY-----")):
              raise SystemExit("INVALID_SSH_PRIVATE_KEY_FORMAT")
          (Path.home()/".ssh/server_key").write_text(raw+"\n")
          PY
          chmod 600 "$HOME/.ssh/server_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -P "" -f "$HOME/.ssh/server_key" > /dev/null
      - name: Read only SHA256 — no source content transfer or import
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SERVER_SSH_HOST }}
          SSH_USER: ${{ secrets.SERVER_SSH_USER }}
        run: |
          EXPECTED=a7c395be330bc1128f8164cdac1d75a7c27fd35398e46ff5589271ebf0bae840
          SOURCE=/home/taehoon/services/novogene-css/app/Novogene_Mail_CSS_DashBoard_server.py
          OUTPUT="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ForwardAgent=no -o IdentitiesOnly=yes -o ConnectTimeout=12 -i "$HOME/.ssh/server_key" "$SSH_USER@$SSH_HOST" "sha256sum '$SOURCE'")" || exit 1
          ACTUAL="${OUTPUT%% *}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::CSS_SOURCE_SHA_MISMATCH"
            exit 1
          fi
          echo "CSS_SOURCE_READONLY_SHA_MATCH_PASS"
          echo "CSS_MODULE_NOT_IMPORTED_AND_MAIN_NOT_EXECUTED"
