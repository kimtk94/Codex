name: Kalman QLD QQQ Four-Arm Volume Increment (Research Only)

on:
  push:
    branches: [research/qld-integrated-regime-20261031]
    paths:
      - '.github/workflows/kalman-qld-volume-ablation.yml'
      - 'research/kalman_integrated_regime/volume_four_arm.py'
      - 'research/kalman_integrated_regime/test_volume_four_arm.py'
  pull_request:
    paths:
      - '.github/workflows/kalman-qld-volume-ablation.yml'
      - 'research/kalman_integrated_regime/volume_four_arm.py'
      - 'research/kalman_integrated_regime/test_volume_four_arm.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qld-volume-ablation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated unit dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.4,<2' 'exchange-calendars>=4.7'
      - name: Prove strict volume and paired fixed-policy invariants
        run: |
          python -m unittest \
            research.kalman_integrated_regime.test_volume_features \
            research.kalman_integrated_regime.test_volume_four_arm -v
          python -m py_compile research/kalman_integrated_regime/volume_four_arm.py

  historical-evaluation:
    needs: contracts
    if: github.event_name != 'pull_request'
    environment: TaehoonServer
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated historical research dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.4,<2' 'pyarrow>=17' 'exchange-calendars>=4.7' 'requests>=2.31,<3' google-auth google-api-python-client
      - name: Download 2024-2026 SIP research bars once (private runner only)
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID || secrets.APCA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY || secrets.APCA_API_SECRET_KEY }}
        run: |
          python research/kalman_integrated_regime/sip_backfill.py \
            --start 2024-01-01 --end-exclusive 2026-10-31 \
            --out "$RUNNER_TEMP/volume_ablation"
      - name: Load private market feature bundle
        env:
          CKD_DRIVE_SA_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
          GDRIVE_SA_JSON_B64: ${{ secrets.GDRIVE_SA_JSON_B64 }}
        run: |
          python research/kalman_triple_barrier/drive_input.py \
            --file-id 1aUhvIAsE2x2-LuKv5nSxmDGX0Uo4mqYd \
            --output "$RUNNER_TEMP/volume_ablation/market.zip"
      - name: Paired historical A/B/C/D feature-ablation with unchanged exits
        run: |
          python -m research.kalman_integrated_regime.volume_four_arm \
            --daily "$RUNNER_TEMP/volume_ablation/qld_qqq_daily_sip_all_private.csv" \
            --intraday "$RUNNER_TEMP/volume_ablation/qld_qqq_15m_sip_all_private.parquet" \
            --market-zip "$RUNNER_TEMP/volume_ablation/market.zip" \
            --out "$RUNNER_TEMP/volume_ablation/results"
      - name: Archive aggregate statistics only, NO raw SIP or positions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qld-qqq-volume-four-arm-research
          path: ${{ runner.temp }}/volume_ablation/results/volume_four_arm_results.json
          retention-days: 30
          if-no-files-found: warn
      - name: Erase temporary licensed raw data
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/volume_ablation/qld_qqq_daily_sip_all_private.csv"
          rm -f "$RUNNER_TEMP/volume_ablation/qld_qqq_15m_sip_all_private.parquet"
          rm -f "$RUNNER_TEMP/volume_ablation/market.zip"
