name: Upbit New Listings 15m Research
on:
  push:
    branches: [research/upbit-new-listings-15m-20261024]
    paths:
      - 'research/upbit_new_listings/**'
      - '.github/workflows/upbit-new-listings-15m.yml'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit KRW markets for quick smoke (0 = all)'
        required: false
        default: '0'
  schedule:
    - cron: '15 2 * * 1'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Validate conservative execution and OHLC integrity
        run: python -m unittest discover -s research/upbit_new_listings -p 'test_execution_safety.py' -v
      - name: Collect and evaluate historical listing cohorts
        env:
          LIMIT: ${{ inputs.limit || '0' }}
        run: python research/upbit_new_listings/study.py --out outputs/upbit-new-listings --limit "$LIMIT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upbit-new-listings-results
          path: outputs/upbit-new-listings/
          retention-days: 30
