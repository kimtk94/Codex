name: Kalman audit offline quality gate

on:
  workflow_dispatch:
  push:
    branches:
      - audit/kalman-control-20261014
    paths:
      - 'audits/2026-10-14/quality/**'
      - 'audits/2026-10-15/vercel_link_attestation_snapshot.json'
      - 'audits/2026-10-15/vercel_actual_alias_snapshot.json'
      - 'audits/2026-10-15/vercel_active_file_digests.json'
      - 'audits/2026-10-15/staging_protection_snapshot.json'
      - 'audits/2026-10-18/staging_env_scope_snapshot.json'
      - 'kalman-toss-gateway/scripts/build_investment_hub_v7424_execution_telemetry.py'
      - '.github/workflows/kalman-audit-quality.yml'

permissions:
  contents: read

jobs:
  offline-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: audit
          POSTGRES_DB: kalman_audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U audit -d kalman_audit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: audits/2026-10-14/quality
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only checkout of current main for historical build fingerprint
        uses: actions/checkout@v4
        with:
          # Pin the verified pre-patch main build for reproducible fingerprints.
          ref: 60dcbef3afc342ffa2156a2f650eda968df1f177
          path: baseline_main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned isolated replay dependencies
        run: python3 -m pip install 'psycopg[binary]==3.2.10' 'python-dotenv==1.1.1'
      - name: Unit tests
        run: python3 -m unittest -v test_quality_gate.py test_reconcile_offline.py test_broker_snapshot_contract.py test_broker_cache_preflight.py test_broker_audit_get.py test_broker_status_evidence.py test_trade_status_projection_regression.py test_net_return_coverage.py test_position_link_contract.py test_order_position_link_integration.py test_multileg_cashflow.py test_fee_provenance.py test_toss_order_fee_schema.py test_multileg_randomized.py test_investment_hub_net_display.py test_deployment_source_gate.py test_hub_offline_release_gate.py test_vercel_alias_dependency_gate.py test_active_bundle_fingerprint_audit.py test_staging_api_surface_gate.py
      - name: Synthetic SQLite to disposable PostgreSQL mirror integration
        env:
          KALMAN_AUDIT_E2E: '1'
          KALMAN_AUDIT_PG_DSN: postgresql://audit:audit@127.0.0.1:5432/kalman_audit
        run: python3 -m unittest -v test_shadow_mirror_postgres.py
      - name: Compile audit-branch mirror patch
        run: python3 -m py_compile ../../../kalman-toss-gateway/engine/broker_status_evidence.py ../../../kalman-toss-gateway/engine/order_position_link.py ../../../kalman-toss-gateway/engine/auto_trade.py ../../../kalman-toss-gateway/engine/trade_mirror.py
      - name: Build full Investment Hub v7.4.36 OFFLINE and verify final bundle
        run: python3 hub_offline_release_gate.py --output hub_offline_build_report.json
      - name: Build main-branch historical web manifests OFFLINE
        run: python3 ../../../baseline_main/kalman-toss-gateway/scripts/build_investment_hub_v7436_shadow_freshness.py
      - name: Compare active Vercel file SHA1 to baseline and audit candidate
        run: python3 active_bundle_fingerprint_audit.py --baseline-root ../../../baseline_main --output active_bundle_fingerprint_report.json
      - name: Synthetic loopback HTTP smoke of built API handlers
        run: node staging_local_http_smoke.js > staging_local_http_report.json
      - name: Audit full built API surface and staging protection (no deployment)
        run: python3 staging_api_surface_gate.py --output staging_api_surface_report.json
      - name: Build isolated synthetic-only Staging package (NOT deployed)
        run: python3 build_demo_only_staging.py --report staging_demo_only_report.json
      - name: Synthetic-only Staging sandbox regression
        run: python3 -m unittest -v test_demo_only_staging.py
      - name: Install pinned headless Chromium test runtime
        run: |
          python3 -m pip install 'playwright==1.56.0'
          python3 -m playwright install chromium
      - name: Demo-only Chromium browser E2E (desktop + mobile)
        run: python3 demo_browser_e2e.py > staging_demo_browser_report.json
      - name: Staging approval evidence gate (no deployment)
        run: |
          python3 -m unittest -v test_staging_release_approval_gate.py
          python3 staging_release_approval_gate.py > staging_release_gate_report.json
      - name: Stage env names and scopes gate (no secrets)
        run: |
          python3 -m unittest -v test_staging_env_scope_gate.py
          python3 staging_env_scope_gate.py > staging_env_scope_report.json
      - name: Isolated Preview build-only preflight (no Vercel operations)
        run: |
          python3 -m unittest -v test_isolated_preview_preflight.py
          python3 isolated_preview_preflight.py --output isolated_preview_preflight_report.json
      - name: Reproduce pinned snapshot
        run: python3 quality_gate.py --at 2026-10-14T11:35:00Z --output quality_report.json
      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: kalman-quality-audit-${{ github.run_id }}
          path: |
            audits/2026-10-14/quality/quality_report.json
            audits/2026-10-14/quality/hub_offline_build_report.json
            audits/2026-10-14/quality/active_bundle_fingerprint_report.json
            audits/2026-10-14/quality/staging_api_surface_report.json
            audits/2026-10-14/quality/staging_local_http_report.json
            audits/2026-10-14/quality/staging_demo_only_report.json
            audits/2026-10-14/quality/staging_demo_browser_report.json
            audits/2026-10-14/quality/staging_release_gate_report.json
            audits/2026-10-14/quality/staging_env_scope_report.json
            audits/2026-10-14/quality/isolated_preview_preflight_report.json
          if-no-files-found: error
          retention-days: 30
