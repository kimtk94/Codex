name: Kalman audit offline quality gate

on:
  workflow_dispatch:
  push:
    branches:
      - audit/kalman-control-20261014
    paths:
      - 'audits/2026-10-14/quality/**'
      - '.github/workflows/kalman-audit-quality.yml'

permissions:
  contents: read

jobs:
  offline-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: audits/2026-10-14/quality
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python3 -m unittest -v test_quality_gate.py test_reconcile_offline.py test_broker_snapshot_contract.py test_broker_cache_preflight.py test_broker_audit_get.py test_broker_status_evidence.py test_trade_status_projection_regression.py test_net_return_coverage.py test_position_link_contract.py test_order_position_link_integration.py test_multileg_cashflow.py test_fee_provenance.py
      - name: Compile audit-branch mirror patch
        run: python3 -m py_compile ../../../kalman-toss-gateway/engine/broker_status_evidence.py ../../../kalman-toss-gateway/engine/order_position_link.py ../../../kalman-toss-gateway/engine/auto_trade.py ../../../kalman-toss-gateway/engine/trade_mirror.py
      - name: Reproduce pinned snapshot
        run: python3 quality_gate.py --at 2026-10-14T11:35:00Z --output quality_report.json
      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: kalman-quality-audit-${{ github.run_id }}
          path: audits/2026-10-14/quality/quality_report.json
          if-no-files-found: error
          retention-days: 30
