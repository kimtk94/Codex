name: CKD Drive Readonly Intake
on:
  workflow_dispatch:
  schedule:
    - cron: '43 2 * * *'
  pull_request:
    paths:
      - 'automation_policy/ckd_drive_intake.py'
      - 'automation_policy/ckd_drive_files.lock.json'
      - 'automation_policy/test_ckd_drive_intake.py'
      - '.github/workflows/ckd-drive-intake.yml'
      - 'automation_policy/ckd_report.py'
      - 'automation_policy/test_ckd_report.py'
      - 'automation_policy/ckd_next_action.py'
      - 'automation_policy/test_ckd_next_action.py'
permissions:
  contents: read
jobs:
  intake:
    environment: TaehoonServer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run intake and report regression tests
        run: |
          python3 -m pip install 'matplotlib>=3.8,<4'
          python3 -m unittest automation_policy.test_ckd_drive_intake automation_policy.test_ckd_coloc_qc automation_policy.test_ckd_report automation_policy.test_ckd_next_action -v
      - name: Install bounded Google auth dependencies
        if: github.event_name != 'pull_request'
        run: python3 -m pip install 'google-auth>=2,<3' 'requests>=2,<3'
      - name: Pull private approved Drive results and verify hashes
        if: github.event_name != 'pull_request'
        env:
          CKD_DRIVE_SA_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
        run: python3 -m automation_policy.ckd_drive_intake
      - name: Generate cross-stage QC report and figure
        if: github.event_name != 'pull_request'
        run: |
          python3 -m automation_policy.ckd_report
      - name: Remove private inputs before artifact upload
        if: always()
        run: python3 -c "import shutil;shutil.rmtree('artifacts/ckd-drive/inputs',ignore_errors=True)"
      - name: Upload status only (no original research TSV)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ckd-drive-intake-status
          path: |
            artifacts/ckd-drive/status.json
            artifacts/ckd-drive/reports/ckd-summary.json
            artifacts/ckd-drive/reports/ckd-summary.md
            artifacts/ckd-drive/reports/ckd-abf-susie.png
          if-no-files-found: ignore
          retention-days: 14


  publish-status:
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs: [intake]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-status
          persist-credentials: true
      - name: Download sanitized CKD summary artifact
        if: ${{ needs.intake.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: ckd-drive-intake-status
          path: _ckd_published
      - name: Publish verified CKD summary for research web
        if: ${{ needs.intake.result == 'success' }}
        run: |
          python3 - <<'PY'
          import json,pathlib,shutil
          source=pathlib.Path("_ckd_published/reports")
          expected=("ckd-summary.json","ckd-summary.md","ckd-abf-susie.png")
          for name in expected:
              item=source/name
              if not item.is_file() or item.stat().st_size>2_000_000: raise ValueError("missing_or_oversized_sanitized_artifact:"+name)
          payload=json.loads((source/"ckd-summary.json").read_text())
          if payload.get("status")!="CROSS_STAGE_QC_PASS" or payload.get("scientific_recomputation") is not False or payload.get("genes")!=9:
              raise ValueError("research_summary_not_verified")
          output=pathlib.Path("ckd-public")
          output.mkdir(exist_ok=True)
          for name in expected: shutil.copyfile(source/name,output/name)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ckd-public/ckd-summary.json ckd-public/ckd-summary.md ckd-public/ckd-abf-susie.png
          git diff --staged --quiet || git commit -m "status: publish CKD verified summary for ${{ github.run_id }}"
          git push origin HEAD:research-status
      - name: Record verified next action
        if: ${{ needs.intake.result == 'success' }}
        run: |
          python3 - <<'PY'
          import json,pathlib
          path=pathlib.Path("_ckd_published/reports/ckd-summary.json")
          s=json.loads(path.read_text())
          if s.get("status")!="CROSS_STAGE_QC_PASS": raise ValueError("report_not_verified")
          result={"state":"BLOCKED_EXTERNAL","next_stage":"real_mr_coloc_susie_or_web_integration","reason":"NUMERIC_INPUTS_AND_WEB_SOURCE_NOT_CONNECTED","auto_execute":False}
          pathlib.Path("ckd-next-action.json").write_text(json.dumps(result,indent=2)+"\\n")
          PY
          git add ckd-next-action.json
          git diff --staged --quiet || git commit -m "status: CKD next action ${RUN_ID}"
          git push origin HEAD:research-status
      - name: Save sanitized latest run index
        env:
          INTAKE_RESULT: ${{ needs.intake.result }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.sha }}
          RUN_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json,os,datetime,pathlib
          allowed={"success","failure","cancelled","skipped"}
          result=os.environ["INTAKE_RESULT"]
          if result not in allowed: raise ValueError("unexpected_status")
          payload={
            "workflow":"CKD Drive Readonly Intake",
            "run_id":int(os.environ["RUN_ID"]),
            "run_attempt":int(os.environ["RUN_ATTEMPT"]),
            "run_url":"https://github.com/"+os.environ["RUN_REPO"]+"/actions/runs/"+os.environ["RUN_ID"],
            "event":os.environ["RUN_EVENT"],
            "intake_conclusion":result,
            "verified_output":"CKD_STAGE_2B_TO_3B_QC_REPORT" if result=="success" else "NOT_VERIFIED",
            "scientific_recomputation":False,
            "source_commit":os.environ["RUN_SHA"],
            "recorded_utc":datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          out=pathlib.Path("ckd-latest-run.json")
          out.write_text(json.dumps(payload,indent=2)+"\n")
          print(json.dumps(payload))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ckd-latest-run.json
          git diff --staged --quiet || git commit -m "status: CKD Drive run ${RUN_ID} attempt ${RUN_ATTEMPT}"
          git push origin HEAD:research-status
