            --market output/daily20/market \
            --features output/daily20/features \
            --baseline-trades output/daily20/research/oos_trades.csv \
            --portfolio-summary output/daily20/research/portfolio_summary.json \
            --out output/daily20/research/regime_challenger
      - name: Mandatory paired Monte Carlo risk stress (IID, 5d and 20d blocks)
        run: |
          python research/kalman_daily20/monte_carlo.py \
            --config research/kalman_daily20/universe.json \
            --market output/daily20/market \
            --portfolio output/daily20/research/portfolio_daily_equity.csv \
            --regime output/daily20/research/regime_challenger/regime_daily_equity.csv \
            --out output/daily20/research/monte_carlo
      - name: Forward shadow PR check — never synthesize prospective evidence from PR replay
        if: github.event_name == 'pull_request'
        run: |
          python research/kalman_daily20/forward_shadow.py \
            --out output/daily20/research/forward_shadow \
            --pr-contract
      - name: Audit first prospective NYSE seal readiness against authenticated Drive archive
        if: github.event_name != 'pull_request'
        env:
          RECOVERY_SESSION: ${{ inputs.recovery_session }}
          RECOVERY_UTC_DAY: ${{ inputs.recovery_utc_day }}
        run: |
          python research/kalman_daily20/next_session_two_pass_contract.py \
            --phase pre \
            --schedule-slot "${{ github.event.schedule }}" \
            --event-name "${{ github.event_name }}" \
            --prior-zip output/daily20/cache/previous-results.zip \
            --qc output/daily20/qc.json \
            --pre output/daily20/research/two_pass/preflight.json
          python - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path("output/daily20/research/two_pass/preflight.json").read_text())
          assert r["version"]=="daily20-first-seal-two-pass-contract-v1"
          assert r["research_only"] and not r["production_writes"]
          assert not r["live_execution"] and not r["strategy_promoted"]
          assert not r["price_certified"] and r["no_historical_reseal"]
          assert (r["expected_new_bull"],r["expected_new_bear"]) in ((0,0),(20,40))
          assert r["github_event_origin"]=="${{ github.event_name }}"
          import os, sys
          if os.environ.get("RECOVERY_SESSION") or os.environ.get("RECOVERY_UTC_DAY"):
              from datetime import datetime, timezone
              sys.path.insert(0, "automation/kalman_schedule")
              from recovery_dispatch import verify_recovery_clock
              verify_recovery_clock(os.environ["RECOVERY_SESSION"], os.environ["RECOVERY_UTC_DAY"],
                                    datetime.now(timezone.utc), min_minutes=0)
              assert r["github_event_origin"]=="workflow_dispatch" and not r["scheduled_slot"]
              assert r["session"]==os.environ["RECOVERY_SESSION"]
              assert r["mode"]=="FIRST_GENUINE_SEAL_EXPECTED"
              assert (r["expected_new_bull"],r["expected_new_bear"])==(20,40)
              print("EXPLICIT_RECOVERY_ACTUAL_TIME_FIRST_ONLY_NOT_SCHEDULED",r["session"])
          if r["github_event_origin"]=="push":
              assert r["expected_new_bull"]==r["expected_new_bear"]==0
          if r["scheduled_slot"]=="40 4 * * 2-6":
              assert r["scheduled_replay_first_seal_verified"]
              assert r["mode"]=="SAME_SESSION_REPLAY_EXPECTED"
              assert (r["expected_new_bull"],r["expected_new_bear"])==(0,0)
          print("DAILY20_TWO_PASS_PHASE_READY",r["session"],r["mode"],
                "slot",r["scheduled_slot"] or "NON_SCHEDULED")
          PY
      - name: Append future-only signals and delayed 4-NYSE-session outcomes
        if: github.event_name != 'pull_request'
        run: |
          python research/kalman_daily20/forward_shadow.py \
            --config research/kalman_daily20/universe.json \
            --prior-zip output/daily20/cache/previous-results.zip \
            --market output/daily20/market \
            --scores output/daily20/research/latest_research_scores.csv \
            --qc output/daily20/qc.json \
            --out output/daily20/research/forward_shadow
      - name: PR-only real-data bear scorer smoke (does not count as forward OOS)
        if: github.event_name == 'pull_request'
        run: |
          python research/kalman_daily20/bear_forward.py \
            --config research/kalman_daily20/universe.json \
            --market output/daily20/market \
            --features output/daily20/features \
            --qc output/daily20/qc.json \
            --out output/daily20/research/bear_forward \
            --pr-asof-smoke
      - name: Seal prospective BEAR_LOGISTIC and BEAR_RULE evidence (no retrospective backfill)
        if: github.event_name != 'pull_request'
        run: |
          python research/kalman_daily20/bear_forward.py \
            --config research/kalman_daily20/universe.json \
            --prior-zip output/daily20/cache/previous-results.zip \
            --market output/daily20/market \
            --features output/daily20/features \
            --qc output/daily20/qc.json \
            --baseline-journal output/daily20/research/forward_shadow/journal.jsonl \
            --out output/daily20/research/bear_forward
      - name: Freeze prospective 21-feature and fitted-model provenance; grade replay HOLD
        if: github.event_name != 'pull_request'
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python research/kalman_daily20/stability_gate.py \
            --prior-zip output/daily20/cache/previous-results.zip \
            --market output/daily20/market \
            --features output/daily20/features \
            --scores output/daily20/research/latest_research_scores.csv \
            --bull-journal output/daily20/research/forward_shadow/journal.jsonl \
            --bear-journal output/daily20/research/bear_forward/journal.jsonl \
            --bull-report output/daily20/research/forward_shadow/report.json \
            --bear-report output/daily20/research/bear_forward/report.json \
            --source-finality output/daily20/research/source_finality/report.json \
            --out output/daily20/research/stability
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("output/daily20/research/stability/report.json").read_text())
          assert report["research_only"] is True
          assert report["strategy_promoted"] is False
          assert report["promotional_attribution_allowed"] is False
          assert report["source_finality_research_hold"] is True
          assert report["source_finality_verified_assets"] == 0
          if report["research_hold"]:
              print("SOURCE_OR_REPLAY_RESEARCH_HOLD: provisional source-finality evidence is preserved; attribution and promotion blocked")
          else:
              print("STABILITY_RESEARCH_ONLY", report["status"])
          PY
      - name: Attest first-seal 26/420/40/60 or preserve prior replay journal byte prefix
        if: github.event_name != 'pull_request'
        run: |
          python research/kalman_daily20/next_session_two_pass_contract.py \
            --phase post \
            --schedule-slot "${{ github.event.schedule }}" \
            --event-name "${{ github.event_name }}" \
            --prior-zip output/daily20/cache/previous-results.zip \
            --qc output/daily20/qc.json \
            --pre output/daily20/research/two_pass/preflight.json \
            --bull-dir output/daily20/research/forward_shadow \
            --bear-dir output/daily20/research/bear_forward \
            --stability-dir output/daily20/research/stability \
            --out output/daily20/research/two_pass/report.json
          python - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path("output/daily20/research/two_pass/report.json").read_text())
          assert r["research_only"] and not r["strategy_promoted"]
          assert not r["live_execution"] and not r["production_writes"]
          assert r["journal_prefix_byte_identical"]
          assert r["all_prior_snapshots_byte_identical"]
          assert not r["original_signal_events_rewritten"]
          assert r["research_hold"] and not r["full_raw_market_close_certified"]
          if r["mode"]=="FIRST_GENUINE_SEAL_EXPECTED":
              assert (r["bull_new"],r["bear_new"])==(20,40)
