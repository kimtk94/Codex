          else:
              assert (r["bull_new"],r["bear_new"])==(0,0)
          print("DAILY20_TWO_PASS_INTEGRITY_HOLD",r["session"],
                "mode",r["mode"],"status",r["status"],
                "changed",r["replay_inputs_changed"],
                "new",r["bull_new"]+r["bear_new"])
          PY
      - name: Reconcile immutable Bull/Bear replay drift with stability incidents (never re-seal)
        if: github.event_name != 'pull_request'
        run: |
          python research/kalman_daily20/replay_drift_reconciliation.py \
            --bull output/daily20/research/forward_shadow/report.json \
            --bear output/daily20/research/bear_forward/report.json \
            --stability output/daily20/research/stability/report.json \
            --finality output/daily20/research/source_finality/report.json \
            --out-dir output/daily20/research/replay_drift_reconciliation
          python - <<'PY'
          from pathlib import Path
          import csv, json
          root=Path("output/daily20/research/replay_drift_reconciliation")
          r=json.loads((root/"report.json").read_text())
          with (root/"replay_differences.csv").open(newline="") as f:
              records=list(csv.DictReader(f))
          assert r["version"] == "daily20-replay-reconciliation-v1"
          assert r["research_only"] and not r["production_writes"]
          assert not r["live_execution"] and not r["strategy_promoted"]
          assert not r["original_journals_modified"]
          assert not r["causal_upstream_mechanism_certified"]
          assert r["independent_source_finality_verified"] == 0
          assert len(records) == r["bull_drift_count"] + r["bear_drift_count"]
          assert all(x["cause_certified"] == "False" for x in records)
          if r["legacy_without_original_21_feature_snapshot"]:
              assert r["legacy_bull_holds_reconciled"]
              assert r["original_21_feature_snapshot_available"] is False
          print("DAILY20_REPLAY_TRIAGE_HOLD",r["session"],
                "bull",r["bull_drift_count"],
                "material",r["bull_material_count"],
                "bear",r["bear_drift_count"],
                "stability",r["stability_incident_count"],
                "legacy",r["legacy_without_original_21_feature_snapshot"])
          PY
      - name: Restore this run's independent contract-job environment report
        uses: actions/download-artifact@v4
        with:
          name: kalman-daily20-contract-runtime
          path: output/daily20/contract_runtime
      - name: Record installed model binary hashes and compare run environments (HOLD)
        env:
          ARROW_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python research/kalman_daily20/model_runtime_lineage.py \
              --phase research \
              --qc output/daily20/qc.json \
              --contracts output/daily20/contract_runtime/report.json \
              --out output/daily20/research/model_runtime_lineage/report.json
          else
            python research/kalman_daily20/model_runtime_lineage.py \
              --phase research \
              --qc output/daily20/qc.json \
              --contracts output/daily20/contract_runtime/report.json \
              --prior-zip output/daily20/cache/previous-results.zip \
              --replay output/daily20/research/replay_drift_reconciliation/report.json \
              --stability output/daily20/research/stability/report.json \
              --out output/daily20/research/model_runtime_lineage/report.json
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("output/daily20/research/model_runtime_lineage/report.json").read_text())
          assert r["version"]=="daily20-model-runtime-lineage-v1"
          assert r["phase"]=="research" and r["research_only"]
          assert not r["live_execution"] and not r["production_writes"]
          assert not r["strategy_promoted"] and not r["frozen_signals_modified"]
          assert not r["numerical_drift_cause_certified"]
          assert not r["independent_price_certified"]
          assert len(r["contracts_comparison"]["compared_required_packages"])==5
          assert len(r["environment"]["model_source_sha256"])==7
          print("DAILY20_MODEL_RUNTIME_REPLAY_HOLD",r["session"],
                "contract_equal",r["contracts_comparison"]["model_environment_identical"],
                "prior",r["prior_runtime_status"],
                "bull_material",
                (r["replay_observations"] or {}).get("bull_material_count"))
          PY
      - name: Audit fourth-NYSE-session settlements, price revisions, and frozen signal economics (HOLD)
        if: github.event_name != 'pull_request'
        run: |
          python research/kalman_daily20/forward_settlement_integrity.py \
            --market output/daily20/market \
            --qc output/daily20/qc.json \
            --bull-journal output/daily20/research/forward_shadow/journal.jsonl \
            --bear-journal output/daily20/research/bear_forward/journal.jsonl \
