            --bear-report output/daily20/research/bear_forward/report.json \
            --out output/daily20/research/forward_settlement_integrity
          python - <<'PY'
          from pathlib import Path
          import csv, json
          root=Path("output/daily20/research/forward_settlement_integrity")
          r=json.loads((root/"report.json").read_text())
          with (root/"settlement_queue.csv").open(newline="") as f:
              rows=list(csv.DictReader(f))
          assert r["version"]=="daily20-4xnys-settlement-evidence-v1"
          assert r["research_only"] and not r["production_writes"]
          assert not r["live_execution"] and not r["strategy_promoted"]
          assert r["source_finality_verified_assets"]==0
          assert r["official_regular_close_certified"] is False
          assert r["original_journals_unchanged"]
          assert r["holding_period_subsequent_xnys_sessions"]==4
          assert r["signal_count"]==len(rows)==r["bull_signals"]+r["bear_signals"]
          assert r["pending_unmatured"]+r["settled_events"]==len(rows)
          assert all(row["state"].startswith(("PENDING_", "SETTLED_")) for row in rows)
          print("DAILY20_FORWARD_SETTLEMENT_GATE_HOLD", r["session"],
                "pending",r["pending_unmatured"],
                "settled",r["settled_events"],
                "revised",r["settled_vendor_price_revisions"],
                "first_due",r["first_unsettled_exit_date"])
          PY
      - name: Publish reproducible research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalman-daily20-research
          path: |
            output/daily20/universe-derived.json
            output/daily20/qc.json
            output/daily20/secondary_qc.json
            output/daily20/market/refresh_mode.json
            output/daily20/market/*status.json
            output/daily20/features/*status.json
            output/daily20/research/
          if-no-files-found: warn
          retention-days: 21
      - name: Publish price/feature history as short-lived research artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kalman-daily20-data
          path: |
            output/daily20/market/raw/yfinance/*.parquet
            output/daily20/features/talib/*.parquet
          if-no-files-found: error
          retention-days: 21


  persist-google-drive:
    needs: daily-research
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download validated raw data from this run
        uses: actions/download-artifact@v4
        with:
          name: kalman-daily20-data
          path: drive_stage/data
      - name: Download OOS evidence from this run
        uses: actions/download-artifact@v4
        with:
          name: kalman-daily20-research
          path: drive_stage/results
      - name: Install isolated Google Drive upload dependencies
        run: python -m pip install --disable-pip-version-check google-auth google-api-python-client
      - name: Validate and publish pinned Drive files (no server, no web)
        env:
          CKD_DRIVE_SA_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
          GDRIVE_SA_JSON_B64: ${{ secrets.GDRIVE_SA_JSON_B64 }}
        run: |
          python research/kalman_daily20/publish_drive.py \
            --data-root drive_stage/data \
            --results-root drive_stage/results \
            --output-root drive_stage/uploaded
      - name: Independently re-download pinned Drive results and verify first-seal snapshot hashes
        env:
          CKD_DRIVE_SA_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
          GDRIVE_SA_JSON_B64: ${{ secrets.GDRIVE_SA_JSON_B64 }}
        run: |
          python research/kalman_daily20/stability_drive_readback.py \
            --local-zip drive_stage/uploaded/daily20_results_latest.zip \
            --out drive_stage/readback/daily20_stability_readback.json
      - name: Preserve read-only Drive post-upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalman-daily20-drive-stability-readback
          path: drive_stage/readback/daily20_stability_readback.json
          if-no-files-found: warn
          retention-days: 21
