name: Kalman Daily 20 Research (No Server / No Live)
on:
  workflow_dispatch:
    inputs:
      recovery_session:
        description: 'Optional explicit pre-open FIRST recovery target XNYS date (not a scheduled run)'
        required: false
        type: string
        default: ''
      recovery_utc_day:
        description: 'UTC incident date for explicit recovery; expires that day'
        required: false
        type: string
        default: ''
  push:
    branches: [main]
    paths:
      - 'research/kalman_daily20/**'
      - '.github/workflows/kalman-daily20.yml'
  schedule:
    # First pass: completed NYSE day, before the next NYSE open.
    - cron: '40 2 * * 2-6'
    # Independent same-session replay of the *already frozen* original inputs.
    # The immutable snapshot and event hashes must NOT be replaced on replay.
    - cron: '40 4 * * 2-6'
  pull_request:
    paths:
      - 'research/kalman_daily20/**'
      - '.github/workflows/kalman-daily20.yml'
      - 'kalman-toss-gateway/engine/market_data/**'
      - 'kalman-toss-gateway/engine/features_v2_002/**'

permissions:
  contents: read

concurrency:
  # GitHub Actions retains at most one running and one pending run per group.
  # Separate PR-only numerical research from the protected main writer queue;
  # preserve serialization of main push/dispatch and BOTH scheduled passes.
  group: kalman-daily20-research-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'protected-main' }}
  cancel-in-progress: false
  # Default single pending slot replaces older pending runs even with
  # cancel-in-progress false. Explicit queue=max retains up to 100 waiting
  # runs so later protected-main pushes cannot evict either scheduled seal.
  queue: max

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal test dependencies
        run: python -m pip install --disable-pip-version-check 'pandas>=2.2,<3' 'numpy>=2,<2.4' 'scikit-learn>=1.6,<2' 'exchange-calendars>=4.7' 'pyarrow>=17,<25'
      - name: Fail closed on expired or mismatched explicit recovery before Drive restore
        if: github.event_name == 'workflow_dispatch' && (inputs.recovery_session != '' || inputs.recovery_utc_day != '')
        env:
          RECOVERY_SESSION: ${{ inputs.recovery_session }}
          RECOVERY_UTC_DAY: ${{ inputs.recovery_utc_day }}
        run: |
          python - <<'PY'
          import os, sys
          from datetime import datetime, timezone
          sys.path.insert(0, 'automation/kalman_schedule')
          from recovery_dispatch import verify_recovery_clock
          verify_recovery_clock(os.environ['RECOVERY_SESSION'], os.environ['RECOVERY_UTC_DAY'],
                                datetime.now(timezone.utc), min_minutes=0)
          print("EXPLICIT_RECOVERY_CLOCK_ADMITTED_BEFORE_DRIVE_RESTORE")
          PY
      - name: Offline tests and compilation
        env:
          PYTHONFAULTHANDLER: '1'
          ARROW_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m unittest discover -s research/kalman_daily20 -p 'test_*.py' -v
          python -m compileall -q research/kalman_daily20
      - name: Validate 20-core universe against canonical data schema
        run: |
          python research/kalman_daily20/daily20.py universe --config research/kalman_daily20/universe.json --out output/daily20/universe-derived.json


      - name: Attest installed contract job model wheels and native parser binaries
        env:
          ARROW_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python research/kalman_daily20/model_runtime_lineage.py \
            --phase contracts --out output/daily20/contract_environment/report.json
      - name: Publish independent contract runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: kalman-daily20-contract-runtime
          path: output/daily20/contract_environment/report.json
          if-no-files-found: error
          retention-days: 14


  restore-drive-cache:
    needs: contracts
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install private archive reader (no trading dependencies)
        run: python -m pip install --disable-pip-version-check google-auth google-api-python-client 'pandas>=2.2,<3' 'pyarrow>=17' 'exchange-calendars>=4.7'
      - name: Generate immutable universe
        run: python research/kalman_daily20/daily20.py universe --out output/daily20/universe-derived.json
      - name: Restore pinned Google Drive archive and validate every SHA256
        env:
          CKD_DRIVE_SA_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
          GDRIVE_SA_JSON_B64: ${{ secrets.GDRIVE_SA_JSON_B64 }}
        run: |
          python research/kalman_daily20/refresh_incremental.py \
            --universe output/daily20/universe-derived.json \
            --output-dir output/daily20/market \
            --end-date "$(python -c 'from datetime import timedelta; from research.kalman_daily20.daily20 import last_completed_nyse; print(last_completed_nyse() + timedelta(days=1))')" \
            --restore-only \
            --archive-output output/daily20/previous-data.zip \
            --results-archive-output output/daily20/previous-results.zip
      - name: Fetch Cboe VIX and optional Alpaca SIP via existing protected Colab-synced environment
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: |
          SESSION=$(python -c 'from research.kalman_daily20.daily20 import last_completed_nyse; print(last_completed_nyse())')
          python research/kalman_daily20/collect_independent_close.py \
            --session "$SESSION" \
            --out-report output/daily20/independent_feed.json \
            --out-reference output/daily20/quote_reference.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('output/daily20/independent_feed.json').read_text())
          assert report['research_only'] is True
          assert report['production_writes'] is False
          assert report['verified_regular_finality'] == 0
          assert report['attempted'] == 26
          # No credential values in stdout or persisted evidence.
          print("DAILY20_PROTECTED_ALPACA_SIP_STATUS", report['alpaca']['status'])
          PY
      - name: Match SIP market-center official M prints to provider's current listing master (read only)
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: |
          python research/kalman_daily20/resolve_primary_listing.py \
            --independent output/daily20/independent_feed.json \
            --reference output/daily20/quote_reference.json \
            --out-report output/daily20/venue_identity.json \
            --out-reference output/daily20/selected_reference.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("output/daily20/venue_identity.json").read_text())
          assert report["tested_assets"] == 25
          assert report["finality_verified"] == 0
          assert report["raw_and_yahoo_adjusted_directly_comparable"] is False
          print("DAILY20_PRIMARY_M_RESEARCH_SELECTION",report["primary_M_quote_research_selection_count"],
                "out of 25; price factor NOT attested")
          PY
      - name: Collect Alpaca corporate actions by process date (candidate evidence only)
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: |
          SESSION=$(python -c 'import json; print(json.load(open("output/daily20/independent_feed.json"))["session"])')
          python research/kalman_daily20/corporate_actions_reference.py \
            --session "$SESSION" \
            --out output/daily20/corporate_actions_reference.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("output/daily20/corporate_actions_reference.json").read_text())
          assert r["research_only"] is True
          assert r["production_writes"] is False
          assert r["finality_verified"] == 0
          assert r["factor_independently_certified"] == 0
          assert len(r["queried_symbols"]) == 25
          print("DAILY20_PROTECTED_CA_REFERENCE",r["status"],
                "pages",r["page_count"],"events",len(r["events"]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: daily20-private-cache-from-drive
          path: |
            output/daily20/previous-data.zip
            output/daily20/previous-results.zip
            output/daily20/independent_feed.json
            output/daily20/quote_reference.json
            output/daily20/venue_identity.json
            output/daily20/selected_reference.json
            output/daily20/corporate_actions_reference.json
          if-no-files-found: error
          retention-days: 1

  daily-research:
    needs: [contracts, restore-drive-cache]
    if: always() && needs.contracts.result == 'success' && (needs.restore-drive-cache.result == 'success' || needs.restore-drive-cache.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing market and TA-Lib dependencies
        run: |
          python -m pip install --disable-pip-version-check -r kalman-toss-gateway/engine/market_data/requirements.txt
          python -m pip install --disable-pip-version-check 'scikit-learn>=1.6,<2' 'exchange-calendars>=4.7'
      - name: Generate immutable research universe
        run: |
          python research/kalman_daily20/daily20.py universe --out output/daily20/universe-derived.json
      - name: Resolve fully closed NYSE end date (never ingest an unfinished candle)
        run: |
          echo "DAILY20_END_DATE=$(python -c 'from datetime import timedelta; from research.kalman_daily20.daily20 import last_completed_nyse; print(last_completed_nyse() + timedelta(days=1))')" >> "$GITHUB_ENV"
      - name: Download pinned historical archive from isolated restore job
        if: github.event_name != 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: daily20-private-cache-from-drive
          path: output/daily20/cache
      - name: Incremental overlap refresh (full on PR or weekly Saturday)
        working-directory: kalman-toss-gateway
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python ../research/kalman_daily20/refresh_incremental.py \
              --universe ../output/daily20/universe-derived.json \
              --output-dir ../output/daily20/market \
              --end-date "$DAILY20_END_DATE" --no-drive
          else
            python ../research/kalman_daily20/refresh_incremental.py \
              --universe ../output/daily20/universe-derived.json \
              --output-dir ../output/daily20/market \
              --end-date "$DAILY20_END_DATE" \
              --cache-file ../output/daily20/cache/previous-data.zip
          fi
      - name: Compute TA-Lib feature snapshots
        working-directory: kalman-toss-gateway
        run: |
          python -m engine.features_v2_002.cli --input-dir ../output/daily20/market/raw/yfinance --output-dir ../output/daily20/features
      - name: Fail closed on missing / stale price and feature data
        run: |
          python research/kalman_daily20/daily20.py audit --manifest output/daily20/universe-derived.json --market output/daily20/market --features output/daily20/features --out output/daily20/qc.json
      - name: Adopt protected environment's source evidence (PR fetches public Cboe only)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python research/kalman_daily20/collect_independent_close.py \
              --qc output/daily20/qc.json \
              --out-report output/daily20/research/source_finality/independent_feed.json \
              --out-reference output/daily20/research/source_finality/quote_reference.json
            python research/kalman_daily20/resolve_primary_listing.py \
              --independent output/daily20/research/source_finality/independent_feed.json \
              --reference output/daily20/research/source_finality/quote_reference.json \
              --out-report output/daily20/research/source_finality/venue_identity.json \
              --out-reference output/daily20/research/source_finality/selected_reference.json
          else
            mkdir -p output/daily20/research/source_finality
            cp output/daily20/cache/independent_feed.json output/daily20/research/source_finality/independent_feed.json
            cp output/daily20/cache/quote_reference.json output/daily20/research/source_finality/quote_reference.json
            cp output/daily20/cache/venue_identity.json output/daily20/research/source_finality/venue_identity.json
            cp output/daily20/cache/selected_reference.json output/daily20/research/source_finality/selected_reference.json
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("output/daily20")
          doc=json.loads((root/"research/source_finality/independent_feed.json").read_text())
          reference=json.loads((root/"research/source_finality/quote_reference.json").read_text())
          selected=json.loads((root/"research/source_finality/selected_reference.json").read_text())
          venue=json.loads((root/"research/source_finality/venue_identity.json").read_text())
          qc=json.loads((root/"qc.json").read_text())
          assert doc["session"] == reference["session"] == selected["session"] == venue["session"] == qc["expected_session"]
          assert doc["research_only"] is True
          assert doc["production_writes"] is False
          assert doc["strategy_promoted"] is False
          assert doc["verified_regular_finality"] == 0
          assert doc["attempted"] == 26
          assert reference["schema"] == selected["schema"] == "daily20-quote-reference-v1"
          assert venue["tested_assets"] == 25 and venue["finality_verified"] == 0
          assert venue["raw_and_yahoo_adjusted_directly_comparable"] is False
          assert venue["primary_session_asof_independently_certified"] is False
          assert len(selected["quotes"]) == venue["selected_reference_count_including_cboe"]
          print("DAILY20_INDEPENDENT_FEED_RESEARCH_ONLY",doc["cboe"]["status"],doc["alpaca"]["status"],
                "research M selection",venue["primary_M_quote_research_selection_count"])
          PY
      - name: Capture prospective 26-asset close finality and same-session replay (fail closed)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python research/kalman_daily20/source_finality.py \
              --market output/daily20/market \
              --qc output/daily20/qc.json \
              --reference output/daily20/research/source_finality/selected_reference.json \
              --out output/daily20/research/source_finality/report.json
          else
            python research/kalman_daily20/source_finality.py \
              --market output/daily20/market \
              --qc output/daily20/qc.json \
              --reference output/daily20/research/source_finality/selected_reference.json \
              --prior-zip output/daily20/cache/previous-data.zip \
              --out output/daily20/research/source_finality/report.json
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("output/daily20/research/source_finality/report.json").read_text())
          assert report["research_only"] is True
          assert report["research_hold"] is True
          assert report["verified"] == 0 and report["examined"] == 26
          assert report["status"] in ("SOURCE_FINALITY_HOLD", "REPLAY_DRIFT_RESEARCH_HOLD")
          print("DAILY20_FINALITY_RESEARCH_PROVISIONAL",report["status"])
          PY
      - name: Record Yahoo dividend/split factor lineage (research-only; NOT independent certification)
        run: |
          python research/kalman_daily20/factor_lineage.py \
            --market output/daily20/market \
            --qc output/daily20/qc.json \
            --out-dir output/daily20/research/factor_lineage
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("output/daily20/research/factor_lineage/report.json").read_text())
          assert r["research_only"] is True and r["production_writes"] is False
          assert r["strategy_promoted"] is False
          assert r["required"] == 25 and len(r["rows"]) == 25
          assert r["independent_corporate_actions_certified"] == 0
          assert r["finality_verified"] == 0
          assert r["overall_status"] == "CORPORATE_ACTION_FACTORS_RESEARCH_HOLD"
          print("DAILY20_YAHOO_CA_UNCERTIFIED",r["vendor_history_observed"],"/25")
          PY
      - name: Link raw venue M, Yahoo split-adjusted, and Daily20 adjusted prices (research HOLD)
        run: |
          python research/kalman_daily20/price_basis_bridge.py \
            --source-finality output/daily20/research/source_finality/report.json \
            --primary-venue output/daily20/research/source_finality/venue_identity.json \
            --yahoo-factor-dir output/daily20/research/factor_lineage \
            --out output/daily20/research/price_basis_bridge/report.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("output/daily20/research/price_basis_bridge/report.json").read_text())
          assert r["version"] == "daily20-price-basis-bridge-v1"
          assert r["research_only"] and not r["production_writes"]
          assert not r["strategy_promoted"] and not r["live_execution"]
          assert r["required_assets"] == 26 and len(r["rows"]) == 26
          assert r["research_price_certified"] == 0
          assert r["independent_adjustment_factors_certified"] == 0
          assert r["status"] == "PRICE_BASIS_RECONCILIATION_RESEARCH_HOLD"
          assert all(x["research_hold"] and not x["independent_price_certified"]
                     and not x["independent_adjustment_factor_certified"]
                     for x in r["rows"])
          print("DAILY20_PRICE_BASIS_HOLD", r["raw_primary_M_auction_reference_count"],
                "/25 primary raw M, vendor trace", r["vendor_unrepaired_trace_count"],
                "/25, model/vendor differences",
                r["same_session_model_vendor_adj_close_mismatches_gt_half_cent"],
                "CERTIFIED 0/26")
          PY
      - name: Rank raw M-vs-Yahoo split-adjusted variance by asset (HOLD queue only)
        run: |
          python research/kalman_daily20/price_variance_triage.py \
            --bridge output/daily20/research/price_basis_bridge/report.json \
            --out-dir output/daily20/research/price_variance_triage
          python - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path("output/daily20/research/price_variance_triage")
          r=json.loads((p/"report.json").read_text())
          with (p/"review_queue.csv").open(newline="") as f:
              rows=list(csv.DictReader(f))
          assert r["version"] == "daily20-price-variance-triage-v1"
          assert r["research_only"] and not r["production_writes"]
          assert not r["strategy_promoted"] and not r["live_execution"]
          assert r["status"] == "RAW_VS_SPLIT_ADJUSTED_DIAGNOSTIC_HOLD"
          assert r["required"] == 26 and r["equity_etf_cases"] == len(rows) == 25
          assert r["vix_index_separate"] == 1
          assert sum(r["bucket_counts"].values()) == 25
          assert r["independent_final_close_certified"] == 0
          assert r["independent_factor_certified"] == 0
          assert all(x["finality_verified"] == "False"
                     and x["likely_cause_certified"] == "False" for x in rows)
          print("DAILY20_PRICE_VARIANCE_QUEUE",r["session"],
                "venue_M",r["primary_M_research_references"],"/25",
                "vendor",r["yahoo_unrepaired_traces"],"/25",
                "review_counts",r["bucket_counts"],"CERTIFIED 0/26 HOLD")
          PY
      - name: Compare ex-dated Yahoo dividends/splits to Alpaca (uncertified and fail-closed)
        run: |
          mkdir -p output/daily20/research/corporate_actions
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SESSION=$(python -c 'import json; print(json.load(open("output/daily20/qc.json"))["expected_session"])')
            python research/kalman_daily20/corporate_actions_reference.py \
              --session "$SESSION" \
              --offline \
              --out output/daily20/research/corporate_actions/reference.json
          else
            cp output/daily20/cache/corporate_actions_reference.json \
              output/daily20/research/corporate_actions/reference.json
          fi
          python research/kalman_daily20/corporate_actions_compare.py \
            --factor-dir output/daily20/research/factor_lineage \
            --reference output/daily20/research/corporate_actions/reference.json \
            --out-dir output/daily20/research/corporate_actions
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("output/daily20/research/corporate_actions/report.json").read_text())
          assert r["required"] == 25
          assert r["research_only"] is True and r["production_writes"] is False
          assert r["finality_verified"] == 0 and r["independent_factor_certification"] == 0
          assert r["status"] == "CORPORATE_ACTION_CROSSCHECK_RESEARCH_HOLD"
          print("DAILY20_CA_MATCH_RESEARCH_ONLY",r["reference_status"],
                "matched",r["matched_ex_date_events"],"CERTIFIED 0/25")
          PY
      - name: Diagnose CA exceptions and schema-specific issuer identity (no source auto-certification)
        run: |
          python research/kalman_daily20/corporate_action_forensics.py \
            --factor-dir output/daily20/research/factor_lineage \
            --reference output/daily20/research/corporate_actions/reference.json \
            --comparison-dir output/daily20/research/corporate_actions \
            --out-dir output/daily20/research/corporate_action_forensics
          python - <<'PY'
          import csv,json
          from pathlib import Path
          root=Path("output/daily20/research/corporate_action_forensics")
          r=json.loads((root/"report.json").read_text())
          with (root/"review_queue.csv").open(newline="") as f:
            rows=list(csv.DictReader(f))
          assert r["required_symbols"] == 25
          assert r["research_only"] is True and r["production_writes"] is False
          assert r["strategy_promoted"] is False and r["finality_verified"] == 0
          assert r["independent_factor_certification"] == 0
          assert r["issue_resolutions_issuer_verified"] == 0
          assert len(rows) == r["review_exception_count"]
          assert r["identity_source_report_complete"]
          assert all(x["resolved_by_issuer_evidence"] == "False" for x in rows)
          print("DAILY20_CA_FORENSICS_HOLD",r["review_exception_count"],"exceptions",
                "Yahoo repaired-event suppression",r["yahoo_repair_suppression_observed"],
                "role-based identity",r["identity_role_schema_events"],"certified 0/26")
          PY
      - name: Archive issuer and ETF sponsor evidence for CA exceptions (never certify prices)
        run: |
          # Reader is isolated from market data and trading dependencies.
          # PDF text extraction failure remains HOLD, never issuer certification.
          python -m pip install --disable-pip-version-check 'pypdf>=5,<7'
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python research/kalman_daily20/issuer_ca_primary_evidence.py \
              --review output/daily20/research/corporate_action_forensics/review_queue.csv \
              --out-dir output/daily20/research/issuer_ca_primary \
              --offline
          else
            python research/kalman_daily20/issuer_ca_primary_evidence.py \
              --review output/daily20/research/corporate_action_forensics/review_queue.csv \
              --out-dir output/daily20/research/issuer_ca_primary
          fi
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root=Path("output/daily20/research/issuer_ca_primary")
          report=json.loads((root/"report.json").read_text())
          with (root/"unresolved_review.csv").open(newline="") as stream:
            cases=list(csv.DictReader(stream))
          assert report["version"] == "daily20-issuer-ca-primary-evidence-v1"
          assert report["research_only"] is True
          assert report["production_writes"] is False
          assert report["strategy_promoted"] is False
          assert report["source_finality_verified"] == 0
          assert report["factor_certified"] == 0
          assert report["issuer_action_payments_certified"] == 0
          assert report["issuer_identities_certified"] == 0
          assert report["remaining_review_case_count"] == len(cases)
          assert len(cases) == report["unresolved_cases_analyzed"]
          assert report["curated_official_leads"] == 15
          assert 0 <= report["issuer_fund_historical_document_leads"] <= 1
          assert 0 <= report["sec_filed_third_party_quote_leads"] <= 3
