          assert r["strategy_promoted"] is False and r["finality_verified"] == 0
          assert r["historical_listing_asof_certified"] == 0
          assert r["status"] == "HISTORICAL_LISTING_ASOF_RESEARCH_HOLD"
          assert [(x["session"],x["sip_code"]) for x in r["pltr_transfer_regression"]] == [
            ("2024-11-25","N"),("2024-11-26","Q")]
          print("DAILY20_LISTING_ASOF",r["asof_research_interval_covered"],
                "/25 research coverage; historical documented symbols",
                r["documented_historical_symbols"],"certified 0/25 HOLD")
          PY
      - name: Capture official Nasdaq Trader listing directory and journal source hashes (research only)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python research/kalman_daily20/official_listing_directory.py \
              --preview \
              --out-dir output/daily20/research/official_directory
          else
            python research/kalman_daily20/official_listing_directory.py \
              --prior-zip output/daily20/cache/previous-results.zip \
              --current-venue output/daily20/research/source_finality/venue_identity.json \
              --out-dir output/daily20/research/official_directory
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("output/daily20/research/official_directory/report.json").read_text())
          assert r["required"] == 25
          assert r["research_only"] is True and r["production_writes"] is False
          assert r["strategy_promoted"] is False and r["finality_verified"] == 0
          assert r["source_snapshot_is_historical_asof_evidence"] is False
          assert r["status"] in (
              "OFFICIAL_DIRECTORY_SNAPSHOT_RESEARCH_HOLD",
              "OFFICIAL_DIRECTORY_SOURCE_UNAVAILABLE_HOLD",
              "OFFICIAL_DIRECTORY_SOURCE_HISTORY_INCOMPLETE_HOLD")
          assert r["journal"]["current_snapshot_not_retrojected"] is True
          h = r["source_history"]
          assert h["regular_close_or_point_in_time_listing_certified"] is False
          if "${{ github.event_name }}" == "pull_request":
              assert h["status"] == "PR_PREVIEW_UNSEALED"
          else:
              # We cannot call a Drive backup durable if any previously
              # sealed Nasdaq Trader raw body was lost or silently replaced.
              assert h["status"] == "FULL_SOURCE_BYTES_VERIFIED"
              assert h["all_journal_digests_attested_by_raw_bytes"] is True
              assert h["raw_source_blob_count"] >= 2
              assert r["journal"]["earlier_full_source_bytes_preserved"] is True
          print("DAILY20_OFFICIAL_SNAPSHOT",r["status"],
                "observed",r.get("research_listing_observed",0),"/25",
                "journal",r["journal"]["status"],
                "full_blob_history",h["status"],
                "source_blob_count",h.get("raw_source_blob_count",0),
                "certified 0/25")
          PY
      - name: Secondary provider return comparison (advisory; independence unverified)
        run: |
          python research/kalman_daily20/secondary_qc.py \
            --market output/daily20/market \
            --out output/daily20/secondary_qc.json \
            --end-date "$DAILY20_END_DATE"
      - name: Out-of-sample annual baseline (no broker, no production writes)
        run: |
          python research/kalman_daily20/daily20.py train --config research/kalman_daily20/universe.json --market output/daily20/market --features output/daily20/features --out output/daily20/research
      - name: PR-only real-input first-seal contract rehearsal (SYNTHETIC events, NEVER uploaded)
        if: github.event_name == 'pull_request'
        run: |
          python research/kalman_daily20/first_seal_real_input_rehearsal.py \
            --data-root output/daily20 \
            --scores output/daily20/research/latest_research_scores.csv \
            --qc output/daily20/qc.json \
            --out "$RUNNER_TEMP/daily20-first-seal-real-input-rehearsal.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"]) / "daily20-first-seal-real-input-rehearsal.json").read_text())
          assert d["status"] == "REAL_INPUT_SYNTHETIC_EVENT_CONTRACT_PASS"
          assert d["research_only"] and not d["live_execution"]
          assert d["synthetic_event_hashes_only"]
          assert d["synthetic_events_written_to_drive"] is False
          assert d["prospective_first_seal_claimed"] is False
          assert d["official_close_certified"] is False
          assert d["price_assets_verified"] == 26
          assert d["feature_values_verified"] == 420
          assert d["real_model_fit_provenance_verified"] == 40
          assert d["synthetic_event_anchor_count"] == 60
          assert d["models_and_features_stable_on_two_recomputations"] is True
          print("DAILY20_REAL_INPUT_REHEARSAL_CI_PASS 26/26 prices 420/420 features 40/40 models 60/60 synthetic-events HOLD")
          PY
      - name: Aggregate cash-constrained OOS portfolio and Regime diagnostics
        run: |
          python research/kalman_daily20/portfolio.py \
            --config research/kalman_daily20/universe.json \
            --market output/daily20/market \
            --trades output/daily20/research/oos_trades.csv \
            --out output/daily20/research
      - name: Bear-regime challengers and 2025-26 decay diagnostics (research only)
        run: |
          python research/kalman_daily20/regime_challenger.py \
