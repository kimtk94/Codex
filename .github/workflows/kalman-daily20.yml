name: Kalman Daily 20 Research (No Server / No Live)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/kalman_daily20/**'
      - '.github/workflows/kalman-daily20.yml'
  schedule:
    - cron: '40 2 * * 2-6'
  pull_request:
    paths:
      - 'research/kalman_daily20/**'
      - '.github/workflows/kalman-daily20.yml'
      - 'kalman-toss-gateway/engine/market_data/**'
      - 'kalman-toss-gateway/engine/features_v2_002/**'

permissions:
  contents: read

concurrency:
  group: kalman-daily20-research
  cancel-in-progress: false

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal test dependencies
        run: python -m pip install --disable-pip-version-check 'pandas>=2.2,<3' 'numpy>=2,<3' 'scikit-learn>=1.6,<2' 'exchange-calendars>=4.7' 'pyarrow>=17'
      - name: Offline tests and compilation
        run: |
          python -m unittest discover -s research/kalman_daily20 -p 'test_*.py' -v
          python -m compileall -q research/kalman_daily20
      - name: Validate 20-core universe against canonical data schema
        run: |
          python research/kalman_daily20/daily20.py universe --config research/kalman_daily20/universe.json --out output/daily20/universe-derived.json


  restore-drive-cache:
    needs: contracts
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install private archive reader (no trading dependencies)
        run: python -m pip install --disable-pip-version-check google-auth google-api-python-client 'pandas>=2.2,<3' 'pyarrow>=17' 'exchange-calendars>=4.7'
      - name: Generate immutable universe
        run: python research/kalman_daily20/daily20.py universe --out output/daily20/universe-derived.json
      - name: Restore pinned Google Drive archive and validate every SHA256
        env:
          CKD_DRIVE_SA_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
          GDRIVE_SA_JSON_B64: ${{ secrets.GDRIVE_SA_JSON_B64 }}
        run: |
          python research/kalman_daily20/refresh_incremental.py \
            --universe output/daily20/universe-derived.json \
            --output-dir output/daily20/market \
            --end-date "$(python -c 'from datetime import timedelta; from research.kalman_daily20.daily20 import last_completed_nyse; print(last_completed_nyse() + timedelta(days=1))')" \
            --restore-only \
            --archive-output output/daily20/previous-data.zip \
            --results-archive-output output/daily20/previous-results.zip
      - uses: actions/upload-artifact@v4
        with:
          name: daily20-private-cache-from-drive
          path: |
            output/daily20/previous-data.zip
            output/daily20/previous-results.zip
          if-no-files-found: error
          retention-days: 1

  daily-research:
    needs: [contracts, restore-drive-cache]
    if: always() && needs.contracts.result == 'success' && (needs.restore-drive-cache.result == 'success' || needs.restore-drive-cache.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing market and TA-Lib dependencies
        run: |
          python -m pip install --disable-pip-version-check -r kalman-toss-gateway/engine/market_data/requirements.txt
          python -m pip install --disable-pip-version-check 'scikit-learn>=1.6,<2' 'exchange-calendars>=4.7'
      - name: Generate immutable research universe
        run: |
          python research/kalman_daily20/daily20.py universe --out output/daily20/universe-derived.json
      - name: Resolve fully closed NYSE end date (never ingest an unfinished candle)
        run: |
          echo "DAILY20_END_DATE=$(python -c 'from datetime import timedelta; from research.kalman_daily20.daily20 import last_completed_nyse; print(last_completed_nyse() + timedelta(days=1))')" >> "$GITHUB_ENV"
      - name: Download pinned historical archive from isolated restore job
        if: github.event_name != 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: daily20-private-cache-from-drive
          path: output/daily20/cache
      - name: Incremental overlap refresh (full on PR or weekly Saturday)
        working-directory: kalman-toss-gateway
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python ../research/kalman_daily20/refresh_incremental.py \
              --universe ../output/daily20/universe-derived.json \
              --output-dir ../output/daily20/market \
              --end-date "$DAILY20_END_DATE" --no-drive
          else
            python ../research/kalman_daily20/refresh_incremental.py \
              --universe ../output/daily20/universe-derived.json \
              --output-dir ../output/daily20/market \
              --end-date "$DAILY20_END_DATE" \
              --cache-file ../output/daily20/cache/previous-data.zip
          fi
      - name: Compute TA-Lib feature snapshots
        working-directory: kalman-toss-gateway
        run: |
          python -m engine.features_v2_002.cli --input-dir ../output/daily20/market/raw/yfinance --output-dir ../output/daily20/features
      - name: Fail closed on missing / stale price and feature data
        run: |
          python research/kalman_daily20/daily20.py audit --manifest output/daily20/universe-derived.json --market output/daily20/market --features output/daily20/features --out output/daily20/qc.json
      - name: Secondary provider return comparison (advisory; independence unverified)
        run: |
          python research/kalman_daily20/secondary_qc.py \
            --market output/daily20/market \
            --out output/daily20/secondary_qc.json \
            --end-date "$DAILY20_END_DATE"
      - name: Out-of-sample annual baseline (no broker, no production writes)
        run: |
          python research/kalman_daily20/daily20.py train --config research/kalman_daily20/universe.json --market output/daily20/market --features output/daily20/features --out output/daily20/research
      - name: Aggregate cash-constrained OOS portfolio and Regime diagnostics
        run: |
          python research/kalman_daily20/portfolio.py \
            --config research/kalman_daily20/universe.json \
            --market output/daily20/market \
            --trades output/daily20/research/oos_trades.csv \
            --out output/daily20/research
      - name: Bear-regime challengers and 2025-26 decay diagnostics (research only)
        run: |
          python research/kalman_daily20/regime_challenger.py \
            --config research/kalman_daily20/universe.json \
            --market output/daily20/market \
            --features output/daily20/features \
            --baseline-trades output/daily20/research/oos_trades.csv \
            --portfolio-summary output/daily20/research/portfolio_summary.json \
            --out output/daily20/research/regime_challenger
      - name: Forward shadow PR check — never synthesize prospective evidence from PR replay
        if: github.event_name == 'pull_request'
        run: |
          python research/kalman_daily20/forward_shadow.py \
            --out output/daily20/research/forward_shadow \
            --pr-contract
      - name: Append future-only signals and delayed 4-NYSE-session outcomes
        if: github.event_name != 'pull_request'
        run: |
          python research/kalman_daily20/forward_shadow.py \
            --config research/kalman_daily20/universe.json \
            --prior-zip output/daily20/cache/previous-results.zip \
            --market output/daily20/market \
            --scores output/daily20/research/latest_research_scores.csv \
            --qc output/daily20/qc.json \
            --out output/daily20/research/forward_shadow
      - name: Seal prospective BEAR_LOGISTIC and BEAR_RULE evidence (no retrospective backfill)
        if: github.event_name != 'pull_request'
        run: |
          python research/kalman_daily20/bear_forward.py \
            --config research/kalman_daily20/universe.json \
            --prior-zip output/daily20/cache/previous-results.zip \
            --market output/daily20/market \
            --features output/daily20/features \
            --qc output/daily20/qc.json \
            --baseline-journal output/daily20/research/forward_shadow/journal.jsonl \
            --out output/daily20/research/bear_forward
      - name: Publish reproducible research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalman-daily20-research
          path: |
            output/daily20/universe-derived.json
            output/daily20/qc.json
            output/daily20/secondary_qc.json
            output/daily20/market/refresh_mode.json
            output/daily20/market/*status.json
            output/daily20/features/*status.json
            output/daily20/research/
          if-no-files-found: warn
          retention-days: 21
      - name: Publish price/feature history as short-lived research artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kalman-daily20-data
          path: |
            output/daily20/market/raw/yfinance/*.parquet
            output/daily20/features/talib/*.parquet
          if-no-files-found: error
          retention-days: 21


  persist-google-drive:
    needs: daily-research
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download validated raw data from this run
        uses: actions/download-artifact@v4
        with:
          name: kalman-daily20-data
          path: drive_stage/data
      - name: Download OOS evidence from this run
        uses: actions/download-artifact@v4
        with:
          name: kalman-daily20-research
          path: drive_stage/results
      - name: Install isolated Google Drive upload dependencies
        run: python -m pip install --disable-pip-version-check google-auth google-api-python-client
      - name: Validate and publish pinned Drive files (no server, no web)
        env:
          CKD_DRIVE_SA_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
          GDRIVE_SA_JSON_B64: ${{ secrets.GDRIVE_SA_JSON_B64 }}
        run: |
          python research/kalman_daily20/publish_drive.py \
            --data-root drive_stage/data \
            --results-root drive_stage/results \
            --output-root drive_stage/uploaded
