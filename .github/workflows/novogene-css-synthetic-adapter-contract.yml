name: Novogene CSS Synthetic Adapter Contract
on:
  push:
    branches:
      - audit/novogene-css-sif-staging-20261014
    paths:
      - .github/workflows/novogene-css-synthetic-adapter-contract.yml
      - css-upgrade/staging-20261014/synthetic_adapter_contract.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run synthetic adapter contract with denied egress
        shell: bash
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 \
            --tmpfs /tmp:rw,nosuid,noexec,size=32m \
            --mount type=bind,src="$PWD/css-upgrade/staging-20261014/synthetic_adapter_contract.py",dst=/app/contract.py,readonly \
            -e PYTHONDONTWRITEBYTECODE=1 \
            python:3.12-slim python /app/contract.py
