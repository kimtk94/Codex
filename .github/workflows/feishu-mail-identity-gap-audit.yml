name: Feishu QQ Mail Identity Gap Audit
on:
  push:
    branches: [main, feat/feishu-identity-gap-audit-20261105]
    paths:
      - 'automation/feishu/mail_identity_gap_audit.py'
      - 'automation/feishu/test_mail_identity_gap_audit.py'
      - '.github/workflows/feishu-mail-identity-gap-audit.yml'
  pull_request:
    paths:
      - 'automation/feishu/mail_identity_gap_audit.py'
      - 'automation/feishu/test_mail_identity_gap_audit.py'
      - '.github/workflows/feishu-mail-identity-gap-audit.yml'
  workflow_dispatch:
  schedule:
    - cron: '21 1,13 * * *'
permissions:
  contents: read
concurrency:
  group: qq-feishu-gap-audit
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reference client
        run: python3 -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3'
      - name: Unit test safe identity root-cause analysis
        run: python3 -m unittest discover -s automation/feishu -p 'test_mail_identity_gap_audit.py' -v
  diagnose:
    needs: tests
    if: ${{ github.event_name != 'pull_request' && needs.tests.result == 'success' }}
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 15
    env:
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_BASE_APP_TOKEN: ${{ vars.FEISHU_SALES_BASE_APP_TOKEN }}
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only references
        run: python3 -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3'
      - name: Print anonymous aggregate reason counts
        run: python3 automation/feishu/mail_identity_gap_audit.py
