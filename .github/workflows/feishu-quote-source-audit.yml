name: Feishu Quote Source Reconciliation Audit (read-only)
on:
  pull_request:
    paths:
      - 'automation/feishu/quote_weekly_source_audit.py'
      - 'automation/feishu/test_quote_weekly_source_audit.py'
      - '.github/workflows/feishu-quote-source-audit.yml'
  push:
    branches: [main]
    paths:
      - 'automation/feishu/quote_weekly_source_audit.py'
      - 'automation/feishu/test_quote_weekly_source_audit.py'
      - '.github/workflows/feishu-quote-source-audit.yml'
  workflow_dispatch:
  schedule:
    - cron: '35 2,9 * * *'  # 11:35 and 18:35 KST, after normal source refresh
permissions:
  contents: read
concurrency:
  group: feishu-quote-source-readonly-audit
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synthetic freshness, ID and amount-evidence audit
        run: |
          python3 -m unittest discover -s automation/feishu -p 'test_quote_weekly_source_audit.py' -v
          python3 -m py_compile automation/feishu/quote_weekly_source_audit.py
  live-readonly:
    needs: offline
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: TaehoonServer
    timeout-minutes: 8
    env:
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Google Sheets read-only client
        run: python3 -m pip install 'google-auth>=2.20,<3' 'requests>=2.31,<3'
      - name: Compare four completed weeks and audit Quote Report freshness
        run: python3 automation/feishu/quote_weekly_source_audit.py
