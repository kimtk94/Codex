name: Macro Event V1 CI

on:
  push:
    branches:
      - feature/macro-event-v1-20260916
  workflow_dispatch:

jobs:
  macro-event-v1:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kalman-toss-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy pyarrow scikit-learn requests pytest
      - name: Compile Macro Event V1
        run: |
          python -m py_compile             research/macro_event/__init__.py             research/macro_event/collect_tradingeconomics_pit.py             research/macro_event/build_macro_event_features.py             research/macro_event/merge_macro_v4.py             research/macro_event/compare_v3_v4.py             scripts/colab_macro_event_v4.py
      - name: Run Macro Event tests
        run: python -m pytest -q tests/test_macro_event_v1.py
