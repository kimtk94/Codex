name: Lead Sent Audit Validation
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
concurrency:
  group: lead-sent-audit-validation
  cancel-in-progress: false
jobs:
  dry-run:
    environment: TaehoonServer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.CKD_DRIVE_SA_JSON }}
      SFDC_SHEET_ID: 1Fo0Tc6PQ3Ek0-33lmegScM_z8ST-ShUYQ0K3kD4PqnI
      CSS_SHEET_ID: 1753nq7_zX-6ae7srmJryHrFECEG5L9Mjf7JvjrbFxVY
      DRY_RUN: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install google-api-python-client google-auth
      - name: Check script syntax
        run: python -m py_compile automation/css/lead_sent_audit_refresh.py
      - name: Test Lead audit safety guards
        run: python -m unittest discover -s automation/css -p 'test_lead_sent_audit_safety.py' -v
      - name: Verify Google Sheets access
        run: python automation/css/sfdc_sheets_preflight.py
      - name: Audit outgoing Lead mail evidence without writes
        run: python automation/css/lead_sent_audit_refresh.py
      - name: Publish result
        if: always()
        shell: bash
        env:
          JOB_RESULT: ${{ job.status }}
        run: |
          {
            echo '## Lead Sent Audit Dry Run'
            echo "- Result: ${JOB_RESULT}"
            echo "- Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo '- This workflow is read-only: DRY_RUN=true; no Lead decisions changed.'
          } >> "$GITHUB_STEP_SUMMARY"
