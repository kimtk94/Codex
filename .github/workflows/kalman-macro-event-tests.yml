name: Kalman Macro Event Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "kalman-toss-gateway/config/macro-event-features-v1.json"
      - "kalman-toss-gateway/config/macro-event-features-v1.cron.d"
      - "kalman-toss-gateway/engine/macro_consensus_provider_v1.py"
      - "kalman-toss-gateway/engine/macro_event_features_v1.py"
      - "kalman-toss-gateway/scripts/run_macro_event_features_v1.sh"
      - "kalman-toss-gateway/scripts/install_macro_event_cron_v1.sh"
      - "kalman-toss-gateway/scripts/configure_macro_consensus_env.sh"
      - "kalman-toss-gateway/scripts/deploy_macro_event_v17.sh"
      - "kalman-toss-gateway/scripts/deploy_macro_event_v18.sh"
      - "kalman-toss-gateway/docs/macro-us-kr-impact-v1.md"
      - "kalman-toss-gateway/tests/test_macro_event_features_v1.py"
      - ".github/workflows/kalman-macro-event-tests.yml"
  push:
    branches: [main]
    paths:
      - "kalman-toss-gateway/config/macro-event-features-v1.json"
      - "kalman-toss-gateway/config/macro-event-features-v1.cron.d"
      - "kalman-toss-gateway/engine/macro_consensus_provider_v1.py"
      - "kalman-toss-gateway/engine/macro_event_features_v1.py"
      - "kalman-toss-gateway/scripts/run_macro_event_features_v1.sh"
      - "kalman-toss-gateway/scripts/install_macro_event_cron_v1.sh"
      - "kalman-toss-gateway/scripts/deploy_macro_event_v17.sh"
      - "kalman-toss-gateway/scripts/deploy_macro_event_v18.sh"
      - "kalman-toss-gateway/scripts/configure_macro_consensus_env.sh"
      - "kalman-toss-gateway/docs/macro-us-kr-impact-v1.md"
      - "kalman-toss-gateway/tests/test_macro_event_features_v1.py"
      - ".github/workflows/kalman-macro-event-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macro-event:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: kalman-toss-gateway

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx "psycopg[binary]" python-dotenv

      - name: Compile macro modules
        run: |
          python -m py_compile engine/macro_consensus_provider_v1.py
          python -m py_compile engine/macro_event_features_v1.py

      - name: Validate shell syntax
        run: |
          bash -n scripts/run_macro_event_features_v1.sh
          bash -n scripts/install_macro_event_cron_v1.sh
          bash -n scripts/configure_macro_consensus_env.sh
          bash -n scripts/deploy_macro_event_v17.sh
          bash -n scripts/deploy_macro_event_v18.sh

      - name: Validate cron contract
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("config/macro-event-features-v1.cron.d").read_text()
          active = [
              line for line in text.splitlines()
              if line.strip()
              and not line.lstrip().startswith("#")
              and "run_macro_event_features_v1.sh build" in line
          ]
          assert len(active) == 1, active
          assert active[0].startswith("*/15 * * * * root ")
          assert "run_macro_event_features_v1.sh build" in active[0]
          assert "CRON_TZ=Asia/Seoul" in text
          print("[PASS] dedicated 15-minute macro cron")
          PY

      - name: Run macro event regression tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_macro_event_features_v1.py
