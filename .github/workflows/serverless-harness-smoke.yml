name: Serverless Harness Policy Smoke
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'  # UTC; every 30 minutes, only after merging to default branch
  pull_request:
    paths:
      - 'automation_policy/**'
      - '.github/workflows/serverless-harness-smoke.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: serverless-harness-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    if: github.event_name != 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Checkout public IS V3 source read-only
        uses: actions/checkout@v4
        with:
          repository: kimtk94/IS_Analysis_V3
          path: research_source
          persist-credentials: false
      - name: Test policy, queue and sanitized research evidence contracts
        run: python3 -m unittest discover -s automation_policy -p 'test_*.py' -t . -v
      - name: Run isolated harness smoke
        run: python3 -m automation_policy.smoke
      - name: Export planned DAG (no business execution)
        run: python3 -m automation_policy.export_plan
      - name: Execute real isolated plan QC and gated report
        run: python3 -m automation_policy.execute_ci
      - name: Check actual IS V3 source contract
        run: python3 -m automation_policy.research_contract
      - name: Produce machine-readable next actions
        run: python3 -m automation_policy.next_actions
      - name: Run bounded unattended local executor
        run: python3 -m automation_policy.runner
      - name: Inspect previous successful artifact metadata (best effort)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          mkdir -p previous_artifact
          gh run list --repo "$GH_REPO" --workflow serverless-harness-smoke.yml --branch main --status success --limit 10 --json databaseId,headSha,event,conclusion > previous_artifact/candidates.json
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          runs=json.loads(Path('previous_artifact/candidates.json').read_text())
          sha=os.environ['GITHUB_SHA']
          candidates=[r for r in runs if r.get('headSha')==sha and r.get('event') in ('schedule','workflow_dispatch') and r.get('conclusion')=='success' and str(r['databaseId'])!=os.environ['GITHUB_RUN_ID']]
          if candidates:
              run_id=str(candidates[0]['databaseId'])
              result=subprocess.run(['gh','api',f'repos/{os.environ["GH_REPO"]}/actions/runs/{run_id}'],capture_output=True,text=True)
              if result.returncode==0:
                  Path('previous_artifact/run.json').write_text(result.stdout)
              # Download only to a quarantined directory. Contents never authorize completion.
              subprocess.run(['gh','run','download',run_id,'--repo',os.environ['GH_REPO'],'-n','serverless-policy-evidence','-D','previous_artifact/quarantine'],capture_output=True,text=True)
          PY
      - name: Audit prior-run provenance (never attest completion)
        run: python3 -m automation_policy.prior_run
      - name: Emit safe next-run checkpoint metadata
        run: python3 -m automation_policy.checkpoint_cli
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serverless-policy-evidence
          path: |
            artifacts/automation-policy-smoke.json
            artifacts/harness-plan.json
            artifacts/qc-evidence.json
            artifacts/qc-report.md
            artifacts/executor-result.json
            artifacts/research-code-contract.json
            artifacts/harness-next-actions.json
            artifacts/runner-evidence.json
            artifacts/checkpoint.json
            artifacts/previous-artifact-audit.json
          if-no-files-found: warn
          retention-days: 14
