<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sales Command — Design Preview</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#16243a;background:#f6f8fb;font-synthesis:none}*{box-sizing:border-box}body{margin:0}.shell{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}aside{background:#14213d;color:#b9c8db;padding:29px 16px}aside h2{color:white;font-size:18px;margin:0 12px 10px}aside small{display:block;margin:0 12px 37px;font-size:10px;letter-spacing:.09em}.nav{padding:14px 16px;border-radius:9px;cursor:pointer;font-size:14px;display:block;color:inherit;background:transparent;border:0;width:100%;text-align:left}.nav[aria-selected=true]{background:#245276;color:white;font-weight:700}main{padding:36px 40px;max-width:1650px;width:100%}h1{font-size:30px;margin:0 0 10px;letter-spacing:-.03em}p.sub{font-size:13px;color:#758399;margin:0 0 35px}.top{display:flex;justify-content:space-between;gap:12px;align-items:start}.tag{padding:10px 14px;background:#e9f6f2;color:#167867;border-radius:9px;font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-bottom:24px}.card,.panel{background:white;border-radius:14px;padding:22px;box-shadow:0 1px 2px #1a355006;border:1px solid #edf1f5}.card .label{font-size:13px;color:#6a7a90}.value{font-weight:700;font-size:27px;margin:18px 0 13px}.hint{font-size:11px;color:#8290a2}.grid{display:grid;grid-template-columns:1.7fr 1fr;gap:20px;margin-bottom:20px}.panel{min-height:260px}.panel h3{font-size:18px;margin:0 0 8px}.muted{font-size:12px;color:#79889b}.empty{height:175px;background:#f5f8fb;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#8492a5;text-align:center;margin-top:20px}.filters{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}.filters label{background:white;border:1px solid #e8edf3;border-radius:9px;padding:12px 14px;color:#506079;font-size:12px}.rows{margin-top:18px}.row{padding:16px 0;border-bottom:1px solid #e8edf3;display:flex;justify-content:space-between;gap:12px;font-size:13px}.chip{font-size:11px;color:#9e6827;background:#fff6e7;padding:4px 9px;border-radius:6px}#view{display:block}table{width:100%;border-collapse:collapse;margin-top:20px;font-size:12px;text-align:left}th{background:#eaf0f6;padding:15px;color:#35485d}td{border-bottom:1px solid #e8edf3;padding:20px;color:#76869a}@media(max-width:1040px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:650px){.shell{grid-template-columns:1fr}aside{padding:14px}aside small{margin-bottom:12px}nav{display:flex;overflow:auto;gap:5px}.nav{white-space:nowrap;width:auto}main{padding:22px 16px}.top{display:block}.tag{display:inline-block;margin-bottom:20px}.cards{gap:9px}.card{padding:14px}.value{font-size:23px}.filters{flex-direction:column}}
</style></head><body><div class="shell"><aside><h2>SALES COMMAND</h2><small>NOVOGENE / OPERATIONS</small><nav id="nav"></nav></aside><main><header class="top"><div><h1 id="title"></h1><p class="sub" id="subtitle"></p></div><span class="tag">DESIGN PREVIEW · NO LIVE DATA</span></header><div id="view"></div></main></div><script>
const menus=['Overview','Revenue Analysis','Opportunities','Quotes & Invoices','Action Center','Data Quality'];
const metadata={'Overview':['Sales Overview','Revenue, pipeline and customer follow-up in one place'],'Revenue Analysis':['Revenue Analysis','Invoice-based recognized revenue · 2025 onward'],'Action Center':['Action Center','Customer replies, quotation reviews and unresolved tasks']};
let active='Overview';const nav=document.getElementById('nav'),view=document.getElementById('view');
function card(label,hint){return '<article class="card"><div class="label">'+label+'</div><div class="value">—</div><div class="hint">'+hint+'</div></article>'}
function panel(title,desc,body='<div class="empty">Awaiting verified source data</div>'){return '<section class="panel"><h3>'+title+'</h3><span class="muted">'+desc+'</span>'+body+'</section>'}
function render(){nav.innerHTML=menus.map(m=>'<button class="nav" aria-selected="'+(active===m)+'" data-view="'+m+'">'+m+'</button>').join('');nav.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{active=b.dataset.view;render()}));let [title,subtitle]=metadata[active]||[active,'Module reserved for future verified data'];document.getElementById('title').textContent=title;document.getElementById('subtitle').textContent=subtitle;
if(active==='Revenue Analysis'){view.innerHTML='<div class="filters"><label>Period: Monthly</label><label>Institution: All</label><label>Service: All</label><label>Currency: KRW / K USD</label></div><div class="cards">'+card('Total Revenue','Tax invoice basis')+card('YoY Growth','Comparable months required')+card('Invoiced Orders','Verified source required')+card('Top Service','Awaiting classification')+'</div><div class="grid">'+panel('Monthly Revenue','KRW · service stacked bars')+panel('Service Revenue Share','mRNA · WGS/WES · ncRNA · Long-read · Metagenomics · LC-MS · Olink')+'</div>'+panel('Institution Revenue Ranking','Institution · Service · KRW · K USD · Invoice Month','<table><tr><th>Institution</th><th>Service</th><th>KRW</th><th>K USD</th><th>Invoice month</th></tr><tr><td colspan="5">No reconciled invoice records loaded</td></tr></table>')}
else if(active==='Action Center'){const items=[['Unanswered QQ Emails','QQ Mail · 60-day lookback'],['Quotation Approval Follow-up','Approved quotation ledger'],['Invoice / Quotation Matching','Tax invoice reconciliation'],['SFDC Opportunity Next Action','Account / Opportunity / Activity']];view.innerHTML='<div class="cards">'+card('Overdue','Verified message times required')+card('Due Today','Action dates required')+card('Pending Approvals','Quotation queue')+card('Invoice Exceptions','Unmatched records')+'</div><div class="grid">'+panel('Priority Queue','Institution · Contact · Service · Next Action','<div class="rows">'+items.map(x=>'<div class="row"><span><strong>'+x[0]+'</strong><br><span class="muted">'+x[1]+'</span></span><span class="chip">Review</span></div>').join('')+'</div>')+panel('Data Provenance & Rules','No automatic outbound messages','<div class="rows">'+['Exclude system notices','Respect delegated replies','60-day mailbox history','GitHub Actions → Sheets','Last successful sync: —'].map(x=>'<div class="row">'+x+'</div>').join('')+'</div>')+'</div>'}
else{view.innerHTML='<div class="cards">'+card('Recognized Revenue','KRW and K USD')+card('Active Opportunities','SFDC linked records')+card('Approved Quotes','Approval received')+card('Follow-ups Due','QQ mail action queue')+'</div><div class="grid">'+panel('Monthly Revenue','Tax invoice basis')+panel('Revenue by Service','Service category proportions')+'</div>'+panel('Top Priorities','Requires source synchronization')}
}render();
</script></body></html>
